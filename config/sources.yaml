# Pipeline source registry: one entry per source, read by pipeline/run.py.
#
# activities  What the Pipeline workflow may run for the source. This list is the
#             owner's authorization; code that exists but is not listed here is
#             refused. Activity code: pipeline/sources/<source>/__init__.py.
# schedule    null = manual dispatch only. A schedule needs owner approval.
# landing / bronze / control   where the source's data and state live (documentation
#             and lineage; R2 paths are storage nouns and are not renamed).
#
# Activity contract (same for every source):
#   landing.inspect   provider catalogue vs Landing (missing / stale / current); no Landing writes
#   landing.extract   download new or changed items as native bytes + receipt; never overwrites
#   landing.verify    Landing integrity and remaining gaps after an extract
#   bronze.load       incremental Landing → Iceberg Bronze, raw_sha256 checkpoint, rejections recorded
#   bronze.verify     lineage: every Landing file is in Bronze or has a recorded rejection
#   landing.archive   copy Landing files proven by Bronze to 05_archive (copy only)

sources:
  eurostat:
    description: Eurostat bulk TSV data distributions (Comext excluded)
    landing: 01_landing/eurostat/bulk/
    bronze: [bronze.eurostat_full_observations]
    control: [06_control/eurostat_bulk_landing/, 06_control/eurostat_bulk_bronze/]
    activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive]
    schedule: null

  gus_bdl:
    description: GUS BDL — Web UI bulk archives (web_bulk) and API responses
    landing: 01_landing/gus_bdl/
    bronze: [bronze.bdl_observations, bronze.bdl_variables, bronze.bdl_subjects, bronze.bdl_units,
             bronze.bdl_years, bronze.bdl_dictionary_entries]
    control: [01_landing/gus_bdl/web_bulk/_control/, 06_control/source_campaigns/gus_bdl/]
    activities: []          # paused; Web bulk → Bronze is the next build
    schedule: null

  gus_dbw:
    description: GUS DBW indicators
    landing: 01_landing/gus_dbw/
    bronze: [bronze.dbw_observations, bronze.dbw_dictionaries, bronze.dbw_indicators, bronze.dbw_metadata]
    control: [06_control/source_campaigns/gus_dbw_bronze/]
    activities: []          # paused
    schedule: null

  world_bank_wdi:
    description: World Bank WDI bulk CSV archive and API responses
    landing: 01_landing/world_bank_wdi/
    bronze: [bronze.wdi_data, bronze.wdi_country, bronze.wdi_series, bronze.wdi_country_series,
             bronze.wdi_footnote, bronze.wdi_series_time]
    control: [06_control/source_campaigns/world_bank_wdi/]
    activities: [bronze.verify]   # read-only; ingestion paused
    schedule: null

  opendata_org:
    description: OpenData organizations, people and locations bulk ZIP
    landing: 01_landing/opendata_org/
    bronze: [bronze.opendata_org_organizations, bronze.opendata_org_people, bronze.opendata_org_locations]
    control: [06_control/source_campaigns/opendata_org_bronze/]
    activities: []          # paused
    schedule: null

# Cross-source activities (Pipeline source "platform").
#   silver_gold.promote     Bronze → Silver → Gold (today a pass-through copy / zero-copy
#                           reference, not a dimensional model)
#   serving.refresh_index   rebuild the portal file index from live R2
platform:
  activities: [silver_gold.promote, serving.refresh_index]
  schedule: null
