version: 2

seeds:
  - name: release_calendar
    config: {column_types: {release_at: varchar}}
    columns:
      - name: release_at
        tests: [not_null]
      - name: source_key
        tests: [not_null, {relationships: {arguments: {to: ref('source'), field: source_key}}}]
      - name: kpi_key
        tests: [{relationships: {arguments: {to: ref('kpi'), field: kpi_key}}}]
  - name: dimension_alias
    columns:
      - name: dimension_key
        tests: [not_null, {relationships: {arguments: {to: ref('dimension'), field: dimension_key}}}]
  - name: news_outlet
    description: >-
      News outlets whose feeds the topics layer reads (O32, docs/topics.md): one row per outlet with its
      register entry (family J), display name and language; feeds per outlet in ingestion/sources/news_feeds.yaml.
    columns:
      - name: outlet_key
        tests: [not_null, unique]
      - name: register_id
        tests: [not_null, unique]
      - name: lang
        tests: [not_null, {accepted_values: {arguments: {values: [pl, en]}}}]
      - name: status
        tests: [not_null, {accepted_values: {arguments: {values: [active, parked]}}}]
  - name: topic
    description: >-
      Topics the platform ranks by attention (O32, docs/topics.md): key, names and descriptions (pl/en), parent
      topic, sort order and status (draft topics are matched but not ranked).
    columns:
      - name: topic_key
        tests: [not_null, unique]
      - name: parent_key
        tests: [{relationships: {arguments: {to: ref('topic'), field: topic_key}}}]
      - name: status
        tests: [not_null, {accepted_values: {arguments: {values: [draft, active]}}}]
  - name: topic_kpi
    description: >-
      KPIs (published contract v2 keys, seed kpi_v2_map) that measure each topic: role main (the KPI that
      answers the topic) or related. tests/topic_seeds.sql checks one row per topic and KPI.
    columns:
      - name: topic_key
        tests: [not_null, {relationships: {arguments: {to: ref('topic'), field: topic_key}}}]
      - name: kpi_key
        tests: [not_null, {relationships: {arguments: {to: ref('kpi_v2_map'), field: v2_key}}}]
      - name: role
        tests: [not_null, {accepted_values: {arguments: {values: [main, related]}}}]
  - name: topic_keyword
    description: >-
      Headline dictionary per topic and language (docs/topics.md, Matching): pattern is an RE2 regular
      expression on the lower-case title, anchored at a word start (stems such as inflacj, st[oó]p\pL*
      procentow); weight 0–1; exclude cancels the row's match when it occurs (same anchoring); note explains the
      choice. tests/topic_seeds.sql compiles every pattern.
    config: {column_types: {weight: double}}
    columns:
      - name: topic_key
        tests: [not_null, {relationships: {arguments: {to: ref('topic'), field: topic_key}}}]
      - name: lang
        tests: [not_null, {accepted_values: {arguments: {values: [pl, en]}}}]
      - name: pattern
        tests: [not_null]
      - name: weight
        tests: [not_null]
  - name: topic_signal
    description: >-
      Attention signals per topic: gdelt_query (a GDELT DOC 2.0 API query, read by ingestion/to_landing/gdelt)
      and wiki_article (<lang>:<Wikipedia title>, read by ingestion/to_landing/wikimedia_pageviews).
      tests/topic_seeds.sql fails when an active topic has no signal.
    columns:
      - name: topic_key
        tests: [not_null, {relationships: {arguments: {to: ref('topic'), field: topic_key}}}]
      - name: signal
        tests: [not_null, {accepted_values: {arguments: {values: [gdelt_query, wiki_article]}}}]
      - name: value
        tests: [not_null]
  - name: release_kpi
    description: >-
      Links announced releases (silver.releases) to v2 KPIs by title: publisher, RE2 pattern on the lower-case
      title, KPI key. Eurostat releases are also linked through their dataset codes (kpi_v2_map.dataset).
    columns:
      - name: publisher
        tests: [not_null, {accepted_values: {arguments: {values: [gus, eurostat, ecb]}}}]
      - name: pattern
        tests: [not_null]
      - name: kpi_key
        tests: [not_null, {relationships: {arguments: {to: ref('kpi_v2_map'), field: v2_key}}}]
  - name: geography_v2
    description: >-
      Geographies of published contract v2 (docs/published.md): v2 key (ISO 3166-1 alpha-2 with Greece EL, EU27,
      ISO 3166-2 PL-02 … PL-32), the Gold geography keys it stands for (';' separated), names, level, EU membership
      and order. Gold rows of any other area stay out of v2.
    columns:
      - name: geography_key
        tests: [not_null, unique]
      - name: gold_keys
        tests: [not_null, unique]
      - name: level
        tests: [not_null, {accepted_values: {arguments: {values: [country, voivodeship, aggregate]}}}]
  - name: kpi_member
    description: >-
      Curated breakdown members per v2 KPI (published contract v2): when a v2 key lists members of a dimension,
      only those members reach v2, with these names and order (e.g. eurpln = currency EUR of fx_rate).
    config: {column_types: {member_key: varchar, parent_key: varchar}}
    columns:
      - name: v2_key
        tests: [not_null, {relationships: {arguments: {to: ref('kpi_v2_map'), field: v2_key}}}]
      - name: dimension_key
        tests: [not_null]
      - name: member_key
        tests: [not_null]
