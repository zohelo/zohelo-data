version: 2

seeds:
  - name: licence
    columns:
      - name: licence_key
        tests: [not_null, unique]
  - name: source
    columns:
      - name: source_key
        tests: [not_null, unique]
      - name: register_id
        tests: [not_null, unique]
      - name: licence_key
        tests: [{relationships: {arguments: {to: ref('licence'), field: licence_key}}}]
  - name: dimension_alias
    columns:
      - name: dimension_key
        tests: [not_null, {relationships: {arguments: {to: ref('dimension'), field: dimension_key}}}]
