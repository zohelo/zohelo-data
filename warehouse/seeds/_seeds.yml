version: 2

seeds:
  - name: licence
    columns:
      - name: licence_key
        tests: [not_null, unique]
  - name: source
    columns:
      - name: source_key
        tests: [not_null, unique]
      - name: register_id
        tests: [not_null, unique]
      - name: licence_key
        tests: [{relationships: {arguments: {to: ref('licence'), field: licence_key}}}]
  - name: release_calendar
    config: {column_types: {release_at: varchar}}
    columns:
      - name: release_at
        tests: [not_null]
      - name: source_key
        tests: [not_null, {relationships: {arguments: {to: ref('source'), field: source_key}}}]
      - name: kpi_key
        tests: [{relationships: {arguments: {to: ref('kpi'), field: kpi_key}}}]
  - name: dimension_alias
    columns:
      - name: dimension_key
        tests: [not_null, {relationships: {arguments: {to: ref('dimension'), field: dimension_key}}}]
  - name: kpi_v2_map
    description: >-
      zohelo-bi first slice (published contract v2): one row per v2 KPI key and source that publishes it (O31),
      with the concept that feeds it (empty when none yet), the source measures, what the source offers,
      aggregation, polarity and status. tests/kpi_v2_map_keys.sql checks one row per key and source and one
      concept per v2 key (and the reverse).
    columns:
      - name: v2_key
        tests: [not_null]
      - name: source_key
        tests:
          - not_null
          - accepted_values: {arguments: {values: [eurostat, gus_bdl, gus_dbw, world_bank_wdi, nbp, nbp_interest_rates, oecd]}}
      - name: concept_key
        tests: [{relationships: {arguments: {to: ref('kpi'), field: kpi_key}}}]
      - name: aggregation
        tests: [not_null, {accepted_values: {arguments: {values: [sum, mean, rate, index, none]}}}]
      - name: polarity
        tests: [not_null, {accepted_values: {arguments: {values: [up, down, neutral]}}}]
      - name: status
        tests: [not_null, {accepted_values: {arguments: {values: [ready, needs-block, needs-source]}}}]
  - name: news_outlet
    description: >-
      News outlets whose feeds the topics layer reads (O32, docs/topics.md): one row per outlet with its
      register entry (family J), display name and language; feeds per outlet in ingestion/sources/news_feeds.yaml.
    columns:
      - name: outlet_key
        tests: [not_null, unique]
      - name: register_id
        tests: [not_null, unique]
      - name: lang
        tests: [not_null, {accepted_values: {arguments: {values: [pl, en]}}}]
      - name: status
        tests: [not_null, {accepted_values: {arguments: {values: [active, parked]}}}]
