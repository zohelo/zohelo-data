version: 2

seeds:
  - name: licence
    columns:
      - name: licence_key
        tests: [not_null, unique]
  - name: source
    columns:
      - name: source_key
        tests: [not_null, unique]
      - name: register_id
        tests: [not_null, unique]
      - name: licence_key
        tests: [{relationships: {arguments: {to: ref('licence'), field: licence_key}}}]
  - name: release_calendar
    config: {column_types: {release_at: varchar}}
    columns:
      - name: release_at
        tests: [not_null]
      - name: source_key
        tests: [not_null, {relationships: {arguments: {to: ref('source'), field: source_key}}}]
      - name: kpi_key
        tests: [{relationships: {arguments: {to: ref('kpi'), field: kpi_key}}}]
  - name: dimension_alias
    columns:
      - name: dimension_key
        tests: [not_null, {relationships: {arguments: {to: ref('dimension'), field: dimension_key}}}]
  - name: kpi_v2_map
    description: >-
      zohelo-bi first slice (published contract v2): one row per v2 KPI key with the concept that feeds it
      (empty when none yet), the source measure, what the source offers, aggregation, polarity and status.
    columns:
      - name: v2_key
        tests: [not_null, unique]
      - name: concept_key
        tests: [unique, {relationships: {arguments: {to: ref('kpi'), field: kpi_key}}}]
      - name: aggregation
        tests: [not_null, {accepted_values: {arguments: {values: [sum, mean, rate, index, none]}}}]
      - name: polarity
        tests: [not_null, {accepted_values: {arguments: {values: [up, down, neutral]}}}]
      - name: status
        tests: [not_null, {accepted_values: {arguments: {values: [ready, needs-block, needs-source]}}}]
