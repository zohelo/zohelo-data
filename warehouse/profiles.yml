# Connection: DuckDB in memory, R2 Data Catalog attached as "r2". Credentials come
# from environment variables (GitHub secrets/variables); nothing secret is stored here.
zohelo:
  target: prod
  outputs:
    prod: &r2
      type: duckdb
      path: ":memory:"
      threads: 4
      schema: main
      # Large inserts (Eurostat Silver batches) need not keep source order; without it
      # DuckDB streams instead of buffering to its temp directory.
      settings:
        preserve_insertion_order: false
        # Hosted runners have 16 GB; DuckDB's default (80 %) leaves little for dbt and
        # Iceberg writes, and builds were killed (exit 143). Spill goes to the big /mnt disk.
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '10GB') }}"
        temp_directory: "{{ env_var('DUCKDB_TEMP_DIRECTORY', '.duckdb_tmp') }}"
      # Iceberg tables cannot be renamed inside the transaction that created them,
      # and dbt's table materialization builds under a temporary name, then renames.
      disable_transactions: true
      extensions: [httpfs, iceberg]
      secrets:
        - type: iceberg
          name: r2_catalog
          token: "{{ env_var('R2_DATA_CATALOG_TOKEN') }}"
        # Data files are s3:// paths in the R2 bucket; DuckDB's S3 reader must use R2.
        - type: s3
          name: r2_files
          key_id: "{{ env_var('CLOUDFLARE_R2_ACCESS_KEY_ID') }}"
          secret: "{{ env_var('CLOUDFLARE_R2_SECRET_ACCESS_KEY') }}"
          endpoint: "{{ env_var('R2_S3_ENDPOINT') | replace('https://', '') | trim('/') }}"
          region: auto
          url_style: path
      attach:
        - path: "{{ env_var('R2_WAREHOUSE') }}"
          alias: r2
          type: iceberg
          secret: r2_catalog
          options:
            endpoint: "{{ env_var('R2_CATALOG_URI') }}"
    trial:
      <<: *r2
      schema: zz_dbt_trial
    # Gold PoC trial: the poc models go to the scratch namespace zz_dev_poc, their inputs are read
    # from the real silver/gold namespaces (macros/generate_schema_name.sql). Only ever run with
    # --select poc (dev/poc_trial.py): any other model selected would be written to its real namespace.
    poc_trial:
      <<: *r2
      schema: zz_dev_poc
