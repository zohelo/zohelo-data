version: 2
models:
  - name: gus_exam_results_eighth_grade
    description: >-
      GUS republication of the CKE/OKE results (register PLS-025, #449): mean eighth-grade exam result in % of the
      maximum number of points, Poland ('Ogółem') and the 16 voivodeships (names as printed), 8 subjects (Polish,
      mathematics, English, German, French, Spanish, Russian, Italian), sex (ogółem, dziewczęta, chłopcy), annual
      2019-2025, from the newest copy of the GUS CSV. Grain: area_name x subject x sex x period_year. value as published
      (whole per cent); a row with a GUS sign keeps value null and the sign in flag ('(.)' missing, '(–)' nil), never 0.
      History and trial run: see ingestion/sources/gus_exam_results.yaml and the PR.
    tests:
      - unique:
          column_name: "concat_ws('|', area_name, subject, sex, period_year)"
    columns:
      - name: entity
        tests: [not_null, {accepted_values: {arguments: {values: [eighth_grade_means]}}}]
      - name: variable_name
        tests: [not_null, {accepted_values: {arguments: {values: ['Średnie wyniki uczniów na egzaminie ósmoklasisty']}}}]
      - name: country_name
        tests: [not_null, {accepted_values: {arguments: {values: [Polska]}}}]
      - name: area_name
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Ogółem, Dolnośląskie, Kujawsko-pomorskie, Lubelskie, Lubuskie, Łódzkie, Małopolskie,
                         Mazowieckie, Opolskie, Podkarpackie, Podlaskie, Pomorskie, Śląskie, Świętokrzyskie,
                         Warmińsko-mazurskie, Wielkopolskie, Zachodniopomorskie]
      - name: subject
        tests: [not_null]
      - name: subject_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [polish, mathematics, english, german, french, spanish, russian, italian]
      - name: sex
        tests: [not_null]
      - name: sex_code
        tests: [not_null, {accepted_values: {arguments: {values: [T, F, M]}}}]
      - name: unit_code
        tests: [not_null, {accepted_values: {arguments: {values: [pct_max_points]}}}]
      - name: period_year
        tests: [not_null]
      - name: observation_status
        tests: [not_null, {accepted_values: {arguments: {values: [ok, missing, nil]}}}]
      - name: raw_sha256
        tests: [not_null]
