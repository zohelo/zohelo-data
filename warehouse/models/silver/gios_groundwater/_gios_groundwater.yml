version: 2
models:
  - name: gios_groundwater_quality_classes
    description: >-
      Final groundwater quality class (I-V) of each monitoring point per year from GIOŚ "Klasy jakości wód
      podziemnych" workbooks (register PL-ENV-012), newest version per workbook (bronze.gios_groundwater_cells, entity
      classes_<year>). Grain: entity x row_number (one point in one year). History and counts: Dev trial (#2870).
    tests:
      - unique:
          column_name: "entity || '|' || cast(row_number as varchar)"
    columns:
      - name: entity
        tests: [not_null]
      - name: year
        tests: [not_null]
      - name: row_number
        tests: [not_null]
      - name: monitoring_network
        description: Network of the year (diagnostic or operational monitoring; not_stated 2004-2006).
        tests: [not_null, {accepted_values: {arguments: {values: [diagnostic, operational, not_stated]}}}]
      - name: final_class
        description: Final quality class as published ("Klasa jakości <year> końcowa").
        tests: [not_null, {accepted_values: {arguments: {values: [I, II, III, IV, V]}}}]
      - name: raw_sha256
        tests: [not_null]
  - name: gios_groundwater_samples
    description: >-
      One row per sample row of the GIOŚ groundwater result workbooks (inorganic, organic, nitrate study and its
      per-indicator classes; register PL-ENV-012), newest version per workbook, with point identifiers, location names
      (no TERYT code), sampling date and monitoring network. Grain: entity x row_number.
    tests:
      - unique:
          column_name: "entity || '|' || cast(row_number as varchar)"
    columns:
      - name: entity
        tests: [not_null]
      - name: workbook
        tests: [not_null, {accepted_values: {arguments: {values: [inorganic, organic, nitrate_inorganic, nitrate_classes]}}}]
      - name: year
        tests: [not_null]
      - name: row_number
        tests: [not_null]
      - name: monitoring_network
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [diagnostic, operational, diagnostic_operational, nitrate_study, not_stated]}
      - name: raw_sha256
        tests: [not_null]
  - name: gios_groundwater_results_inorganic_1991_2007
    description: >-
      Inorganic indicator results 1991-2007 (GIOŚ groundwater monitoring, register PL-ENV-012), newest version per
      workbook. Grain: entity x row_number x column_number (sample x indicator). value only for numbers; markers kept
      in value_text and value_flag (below_limit with limit_value, not_determined), never 0.
    tests:
      - unique:
          column_name: "entity || '|' || cast(row_number as varchar) || '|' || cast(column_number as varchar)"
    columns: &result_columns
      - name: entity
        tests: [not_null]
      - name: year
        tests: [not_null]
      - name: row_number
        tests: [not_null]
      - name: column_number
        tests: [not_null]
      - name: parameter
        description: The indicator's header as published (name and unit).
        tests: [not_null]
      - name: value_flag
        tests: [not_null, {accepted_values: {arguments: {values: [number, number_text, below_limit, not_determined, unreadable]}}}]
      - name: raw_sha256
        tests: [not_null]
  - name: gios_groundwater_results_inorganic
    description: >-
      Inorganic indicator results from 2008 and the nitrate study (GIOŚ groundwater monitoring, register PL-ENV-012),
      newest version per workbook. Grain: entity x row_number x column_number (sample x indicator). value only for
      numbers; markers kept in value_text and value_flag, never 0.
    tests:
      - unique:
          column_name: "entity || '|' || cast(row_number as varchar) || '|' || cast(column_number as varchar)"
    columns: *result_columns
  - name: gios_groundwater_results_organic
    description: >-
      Organic indicator results from 2009 (GIOŚ groundwater monitoring, register PL-ENV-012), newest version per
      workbook. Grain: entity x row_number x column_number (sample x indicator). value only for numbers; markers kept
      in value_text and value_flag, never 0.
    tests:
      - unique:
          column_name: "entity || '|' || cast(row_number as varchar) || '|' || cast(column_number as varchar)"
    columns: *result_columns
  - name: gios_groundwater_indicator_classes
    description: >-
      Quality class per indicator of the GIOŚ nitrate study (register PL-ENV-012), newest version per workbook. Grain:
      entity x row_number x column_number (sample x indicator).
    tests:
      - unique:
          column_name: "entity || '|' || cast(row_number as varchar) || '|' || cast(column_number as varchar)"
    columns:
      - name: entity
        tests: [not_null]
      - name: row_number
        tests: [not_null]
      - name: column_number
        tests: [not_null]
      - name: parameter
        tests: [not_null]
      - name: quality_class
        tests: [not_null, {accepted_values: {arguments: {values: [I, II, III, IV, V]}}}]
      - name: raw_sha256
        tests: [not_null]
