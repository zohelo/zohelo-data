version: 2
models:
  - name: gus_health_tables
    description: >-
      GUS Zdrowie i ochrona zdrowia (register PLS-004, health family; #2451): curated tables of each edition 2012-
      (doctors and nurses on 31 December, from "Pracownicy medyczni według województw"; general hospitals, their
      beds, beds per 10,000 population and inpatients in the year, from "Szpitale ogólne według województw"), Poland
      and the 16 voivodeships, reference year = edition year. Grain: table_code x measure_code x area_name x
      group_code x period_year. Doctors and nurses of reference years to 2020 are doctors_pre2021 and
      nurses_pre2021 (GUS: the 2021 edition's data are not comparable with earlier editions). Tables found by title
      and column header (warehouse/macros/gus_tables.sql); value as published, cell_status from the GUS symbols
      ('-' is nil without a value; rows without a value are kept with their status); table_title and table_notes
      keep the sheet's title and footnotes as printed. History and trial run: see ingestion/sources/gus_health.yaml.
    tests:
      - unique:
          column_name: "concat_ws('|', table_code, measure_code, area_name, group_code, period_year)"
    columns:
      - name: table_code
        tests: [not_null, {accepted_values: {arguments: {values: [medical_personnel, general_hospitals]}}}]
      - name: measure_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [doctors, doctors_pre2021, nurses, nurses_pre2021, hospitals, beds, beds_per_10k, inpatients]
      - name: unit_code
        tests: [not_null, {accepted_values: {arguments: {values: [persons, facilities, beds, per_10k_population]}}}]
      - name: area_name
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [polska, dolnośląskie, kujawsko-pomorskie, lubelskie, lubuskie, łódzkie, małopolskie,
                         mazowieckie, opolskie, podkarpackie, podlaskie, pomorskie, śląskie, świętokrzyskie,
                         warmińsko-mazurskie, wielkopolskie, zachodniopomorskie]
      - name: group_code
        tests: [not_null]
      - name: period_year
        tests: [not_null]
      - name: cell_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ok, below_half_unit, low_reliability, missing, confidential, not_applicable, nil]
      - name: raw_sha256
        tests: [not_null]
