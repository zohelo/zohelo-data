version: 2
models:
  - name: ilostat_observations
    description: >-
      ILOSTAT labour statistics from bronze.ilostat_observations (bulk indicator files, CC BY 4.0): newest
      version of each indicator file (entity) — une_deap_sex_age_rt_a / _q (unemployment rate by sex and
      age), emp_dwap_sex_age_rt_a (employment-to-population ratio), eap_dwap_sex_age_rt_a (labour force
      participation rate), eip_neet_sex_rt_a (youth NEET rate); national (reported) series of every country
      and ILO region the ILO publishes. Grain: entity × series_key × time_period (series_key = ref_area,
      source, indicator, sex, classif1). Values in per cent.
    tests:
      - unique:
          column_name: "entity || '|' || series_key || '|' || time_period"
    columns:
      - name: entity
        tests: [not_null]
      - name: indicator
        tests: [not_null]
      - name: freq
        tests: [not_null, {accepted_values: {arguments: {values: ['A', 'Q', 'M']}}}]
      - name: ref_area
        tests: [not_null]
      - name: sex
        tests: [not_null]
      - name: time_period
        tests: [not_null]
      - name: raw_sha256
        description: Landing SHA-256 of the source file (lineage to Landing/Archive).
        tests: [not_null]
