version: 2
models:
  - name: unctad_fdi_flows_stock
    description: >-
      UNCTAD Data Hub table US_FdiFlowsStock from bronze.unctad_rows (newest copy): FDI inflows and outflows, inward and outward stocks (US$ million, % of world, GDP, GFCF), annual from 1990, 36,950 rows (Dev probes
      43084525257, 43084992517). Generic shape of macros/unctad.sql: period, economy (UNCTAD M49-based code
      and label), other dimensions and the measures (value, footnote, missing-value reason) as JSON maps by name.
    tests:
      - unique:
          column_name: "period || '|' || coalesce(economy, '') || '|' || dimensions"
    columns:
      - name: period
        tests: [not_null]
      - name: measure_values
        tests: [not_null]
      - name: raw_sha256
        tests: [not_null]
