version: 2
models:
  - name: pig_midas_deposits
    description: >-
      PIG-PIB MIDAS mineral deposits from the public WFS (bronze.pig_midas_features): one row per deposit polygon of
      the newest download of the documented-deposits layer (layer documented) and of the selected archival layer of
      deposits removed from the balance (layer removed). Grain: layer × object_id. A deposit (deposit_number, the
      MIDAS deposit number) can have several polygons, so deposits are counted as distinct deposit numbers. Current
      state only (the WFS has no history); snapshot_date = download day. Dev trial: see the source's PR.
    tests:
      - unique:
          column_name: "layer || '|' || cast(object_id as varchar)"
    columns:
      - name: layer
        tests: [not_null, {accepted_values: {arguments: {values: ['documented', 'removed']}}}]
      - name: object_id
        tests: [not_null]
      - name: deposit_number
        description: MIDAS deposit number (official identifier of the deposit in MIDAS).
        tests: [not_null]
      - name: mineral_code
        description: >-
          MIDAS code of the main mineral (Kod), e.g. KN sand and gravel, IB ceramic clays; the 60 codes of the
          documented layer on 12 Nov 2026 (the removed layer uses a subset; Dev trial 43289532679).
        tests:
          - accepted_values:
              arguments:
                values: [
                  'AG', 'BA', 'BU', 'DI', 'DO', 'FO', 'GA', 'GB', 'GC', 'GL', 'GO', 'GZ', 'IB', 'IC', 'IK',
                  'KA', 'KC', 'KD', 'KM', 'KN', 'KR', 'KW', 'KZ', 'LF', 'LK', 'LS', 'MC', 'MG', 'MS', 'MW',
                  'NR', 'PB', 'PC', 'PF', 'PP', 'PS', 'RA', 'RC', 'RF', 'RM', 'RN', 'RP', 'RS', 'RZ', 'SB',
                  'SF', 'SK', 'SO', 'SP', 'SR', 'SS', 'TO', 'WB', 'WC', 'WK', 'WL', 'WT', 'WW', 'ZF', 'ZK'
                ]
      - name: raw_sha256
        description: Landing SHA-256 of the layer download (lineage to Landing/Archive).
        tests: [not_null]
  - name: pig_midas_mining_contours
    description: >-
      PIG-PIB MIDAS mining areas (obszary górnicze) and mining terrains (tereny górnicze) from the public WFS
      (bronze.pig_midas_features): one row per contour of the newest download of four layers, current (status
      aktualny) and selected archival ones (status zniesiony). Grain: layer × contour_id. A mining area or terrain
      (register_number, its number in the register of mining areas) can have several contours. Current state only;
      snapshot_date = download day. Dev trial: see the source's PR.
    tests:
      - unique:
          column_name: "layer || '|' || cast(contour_id as varchar)"
    columns:
      - name: layer
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['mining_areas', 'mining_terrains', 'archival_mining_areas', 'archival_mining_terrains']
      - name: kind
        tests: [not_null, {accepted_values: {arguments: {values: ['mining_area', 'mining_terrain']}}}]
      - name: status
        tests: [not_null, {accepted_values: {arguments: {values: ['aktualny', 'zniesiony']}}}]
      - name: contour_id
        tests: [not_null]
      - name: register_number
        description: Number of the mining area or terrain in the register of mining areas.
        tests: [not_null]
      - name: coordinate_system_epsg
        description: EPSG code of the coordinates in the source documents (PUWG 1965, PUWG 2000, PUWG 1992, WGS 84 …).
        tests:
          - accepted_values:
              arguments:
                values: [2172, 2173, 2174, 2175, 2176, 2177, 2178, 2179, 2180, 3120, 4179, 4326]
      - name: valid_indefinitely
        description: True when the decision sets no end of validity (source date 31/12/9999); valid_until is then null.
      - name: raw_sha256
        description: Landing SHA-256 of the layer download (lineage to Landing/Archive).
        tests: [not_null]
