version: 2
models:
  - name: ecb_observations
    description: >-
      ECB Data Portal observations (SDMX csvdata) from bronze.ecb_observations: newest version of every
      selection of ingestion/sources/ecb.yaml. EXR euro reference rates (daily from 1999-01-04, 44 currencies, and
      the ECB's monthly averages), FM key ECB rates (change dates from 1999-01-01), EST euro short-term rate (from
      2019-10-01), HICP annual rates (COICOP 2018, 1986-01 to 2026-10; PL from 1997-01) and the discontinued ICP
      (to 2025-12), IRS long-term interest rates for convergence purposes (1983-05 to 2026-10; PL from 2001-01),
      BSI euro area monetary aggregates (1980-01 to 2026-09). 322,020 rows (Dev trial 43099368908; exr_monthly
      12,373 rows, 1999-01 to 2026-10). Grain: dataflow × series_key × time_period. ref_area: ISO 3166 two-letter codes for countries
      (GR, not EL) and ECB aggregates (U2 euro area changing composition, I8/I9/I10 fixed euro area compositions,
      B6 EU27 fixed, B0/D0 EU changing composition); null for EXR and EST. currency: EXR quoted currency (units per
      1 EUR). obs_value: null where the source gives none ('' or NaN).
    tests:
      - unique:
          column_name: "row(dataflow, series_key, time_period)"
    columns:
      - name: entity
        tests: [not_null]
      - name: dataflow
        tests: [not_null]
      - name: series_key
        tests: [not_null]
      - name: freq
        tests: [not_null, {accepted_values: {arguments: {values: ['D', 'B', 'M', 'Q', 'A']}}}]
      - name: time_period
        tests: [not_null]
      - name: period_start
        tests: [not_null]
      - name: raw_sha256
        description: Landing SHA-256 of the source file (lineage to Landing/Archive).
        tests: [not_null]
