version: 2
models:
  - name: uokik_decisions
    description: >-
      Decisions of the President of UOKiK in the decisions database (register PLG-020; concentration decisions of
      PLG-021 flagged), from bronze.uokik_decisions_index (newest landed copy of each subject-area category of the view
      WWW-wszystkie). Grain: unid (the view entry's @unid), one row per decision. Decision number, department
      signature (letters that start the number) and the cell's department label, decision date, year, category, link
      to the decision's page. No party names (a party can be a natural person), no PDFs. Completeness:
      tests/uokik_decisions_complete.sql.
    columns:
      - name: unid
        tests: [not_null, unique]
      - name: decision_number
        tests: [not_null]
      - name: department_code
        tests: [not_null]
      - name: decision_year
        tests: [not_null]
      - name: category
        tests: [not_null]
      - name: category_key
        tests: [not_null]
      - name: raw_sha256
        description: Landing SHA-256 of the category document (lineage to Landing/Archive).
        tests: [not_null]
