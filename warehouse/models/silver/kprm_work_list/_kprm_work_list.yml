version: 2
models:
  - name: kprm_work_list_drafts
    description: >-
      Work list of the Council of Ministers (register PLG-034, #491; CSV of https://www.gov.pl/web/premier/wplip-rm,
      CC BY-SA 4.0): one row per government draft of the newest landed list. Grain: draft_number (Numer projektu).
      Text as published; status_key from Status realizacji (empty = in_progress); published_at from Data
      publikacji; planned_adoption_text is a plan in free text, kept as published. History and trial run:
      ingestion/sources/kprm_work_list.yaml.
    columns:
      - name: draft_number
        tests: [not_null, unique]
      - name: title
        tests: [not_null]
      - name: document_kind
        tests: [not_null, {accepted_values: {arguments: {values: ['Projekty ustaw', 'Projekty rozporządzeń', 'Projekty innych dokumentów rządowych']}}}]
      - name: status_key
        tests: [not_null, {accepted_values: {arguments: {values: ['in_progress', 'realised', 'withdrawn']}}}]
      - name: published_at
        tests: [not_null]
      - name: published_on
        tests: [not_null]
      - name: raw_sha256
        tests: [not_null]
