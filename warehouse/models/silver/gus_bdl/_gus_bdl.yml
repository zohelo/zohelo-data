version: 2
models:
  - name: bdl_variables
    description: >-
      BDL variables from the API metadata, newest version per subgroup: variable id, labels
      n1–n5, dimension_key (the labels as a JSON array, as in the website exports), level,
      measure unit.
    columns:
      - name: variable_id
        tests: [not_null, unique]
  - name: bdl_units
    description: >-
      BDL territorial units from the API metadata: 12-character unit id (KTS-based), name,
      parent id, level 0–6 (0 Poland … 6 gmina part), kind.
    columns:
      - name: unit_id
        tests: [not_null, unique]
  - name: bdl_observations
    description: >-
      BDL observations of the newest complete version of each subgroup: unit, year, typed
      value (decimal comma → point), measure unit, attribute, and the API variable id
      resolved from subgroup + dimension labels. Incremental per Bronze file (#822): rows
      are keyed by their recipe (subgroup_id, raw_sha256, variables_key); the test
      bdl_observations_current checks Silver holds exactly the current recipes.
    columns:
      - name: raw_sha256
        description: SHA-256 of the Landing file the row came from (Bronze file identity).
      - name: variables_key
        description: >-
          MD5 of the subgroup's variable mapping in bdl_variables (dimension labels → variable
          id) used to resolve variable_id; a changed mapping rebuilds only that subgroup.
      - name: subgroup_id
        tests: [not_null]
      - name: year
        description: Year as an integer; null where the export's year cell is not a year (17,748 rows in P3018, trial 14 Oct).
        tests:
          - not_null:
              config:
                severity: warn
      - name: unit_code_scheme
        tests:
          - accepted_values:
              arguments:
                values: ['BDL', 'TERC']
