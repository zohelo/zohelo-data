version: 2
models:
  - name: gus_culture_participation_tables
    description: >-
      GUS Uczestnictwo ludności w kulturze (register PLS-028): survey estimates in % of persons aged 15 or more
      (visiting museums in Poland, using a library, attending theatre), Poland, total and by sex, reference year
      = survey edition. Grain: table_code x measure_code x area_name x group_code x period_year. Tables found by
      title and column header (warehouse/macros/gus_tables.sql); value as published, cell_status from the GUS
      symbols (rows without a value are kept with their status). History and trial run: see
      ingestion/sources/gus_culture_participation.yaml.
    tests:
      - unique:
          column_name: "concat_ws('|', table_code, measure_code, area_name, group_code, period_year)"
    columns:
      - name: table_code
        tests: [not_null]
      - name: measure_code
        tests: [not_null]
      - name: unit_code
        tests: [not_null]
      - name: area_name
        tests: [not_null]
      - name: group_code
        tests: [not_null]
      - name: period_year
        tests: [not_null]
      - name: cell_status
        tests: [not_null, {accepted_values: {arguments: {values: [ok, low_reliability, confidential, not_applicable]}}}]
      - name: raw_sha256
        tests: [not_null]
