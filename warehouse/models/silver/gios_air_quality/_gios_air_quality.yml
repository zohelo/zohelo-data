version: 2
models:
  - name: gios_air_stations
    description: >-
      GIOŚ air quality monitoring stations (register PL-ENV-010) from the station lists of the daily API v1 passes. Grain: station_id (newest pass that listed it).
      Names of commune (Gmina), district (Powiat) and voivodeship (Województwo, upper case) as published; the API
      gives no TERYT codes. Hourly values: silver.gios_air_hourly (entity table). Trial run: see
      docs/sources/gios_air_quality.md.
    columns:
      - name: station_id
        tests: [not_null, unique]
      - name: station_code
        tests: [not_null]
      - name: voivodeship
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [DOLNOŚLĄSKIE, KUJAWSKO-POMORSKIE, LUBELSKIE, LUBUSKIE, MAZOWIECKIE, MAŁOPOLSKIE, OPOLSKIE,
                         PODKARPACKIE, PODLASKIE, POMORSKIE, WARMIŃSKO-MAZURSKIE, WIELKOPOLSKIE, ZACHODNIOPOMORSKIE,
                         ŁÓDZKIE, ŚLĄSKIE, ŚWIĘTOKRZYSKIE]
      - name: raw_sha256
        tests: [not_null]
  - name: gios_air_sensors
    description: >-
      GIOŚ air quality sensors (register PL-ENV-010) from the sensor lists of the daily API v1 passes.
      Grain: sensor_id (newest pass that listed it). Parameter code (Wskaźnik - kod), formula and name as published;
      the closed list of codes is the 71 codes of the 1,875 sensors listed on 13 Nov 2026 (Dev probe 43343164588).
    columns:
      - name: sensor_id
        tests: [not_null, unique]
      - name: station_id
        tests: [not_null]
      - name: parameter_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PM10', 'PM2.5', 'BaP(PM10)', 'NO2', 'NO', 'NOx', 'O3', 'SO2', 'C6H6', 'As(PM10)', 'Cd(PM10)',
                         'Ni(PM10)', 'Pb(PM10)', 'CO', 'BaA(PM10)', 'BbF(PM10)', 'BjF(PM10)', 'BkF(PM10)',
                         'DBahA(PM10)', 'IP(PM10)', 'etylobenzen', 'mpksylen', 'toluen', 'Ca2+(PM2.5)', 'Cl_(PM2.5)',
                         'EC(PM2.5)', 'Hg(TGM)', 'K+(PM2.5)', 'Mg2+(PM2.5)', 'Na+(PM2.5)', 'NH4+(PM2.5)',
                         'NO3_(PM2.5)', 'OC(PM2.5)', 'SO42_(PM2.5)', 'BaP(cdepoz)', 'formaldehyd', 'As(cdepoz)',
                         'BaA(cdepoz)', 'BbF(cdepoz)', 'BjF(cdepoz)', 'BkF(cdepoz)', 'Cd(cdepoz)', 'DBahA(cdepoz)',
                         'Hg(cdepoz)', 'IP(cdepoz)', 'Ni(cdepoz)', 'oksylen', '123trimetylobenzen',
                         '124trimetylobenzen', '135trimetylobenzen', '13butadien', '1buten', '1penten', '2penten',
                         'acetylen', 'cis2buten', 'etan', 'etylen', 'ibutan', 'iheksan', 'ioktan', 'ipentan', 'izopren',
                         'nbutan', 'nheksan', 'nheptan', 'noktan', 'npentan', 'propan', 'propen', 'trans2buten']
      - name: raw_sha256
        tests: [not_null]
  - name: gios_air_archive_stations
    description: >-
      GIOŚ air-quality stations of the yearly archive's metadata workbook (register PL-ENV-010, #3119), sheet STACJE:
      every station since 2000, closed ones too. Grain: station_code (current code); a station on two workbook rows
      that differ only in old codes is one row (workbook_rows 2), other differences fail the build. old_station_codes
      as published (codes used by older year files), opening and closing dates, type, voivodeship (upper case), WGS84.
      The verified values are silver.gios_air_archive_values (entity table). Trial run: docs/sources/gios_air_quality.md.
    columns:
      - name: station_code
        tests: [not_null, unique]
      - name: voivodeship
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [DOLNOŚLĄSKIE, KUJAWSKO-POMORSKIE, LUBELSKIE, LUBUSKIE, MAZOWIECKIE, MAŁOPOLSKIE, OPOLSKIE,
                         PODKARPACKIE, PODLASKIE, POMORSKIE, WARMIŃSKO-MAZURSKIE, WIELKOPOLSKIE, ZACHODNIOPOMORSKIE,
                         ŁÓDZKIE, ŚLĄSKIE, ŚWIĘTOKRZYSKIE]
      - name: raw_sha256
        tests: [not_null]
