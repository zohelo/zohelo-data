version: 2
models:
  - name: eurostat_dataset_versions
    description: >-
      Newest Bronze file (Landing version) of every Eurostat dataset: raw_sha256, ingestion
      time, rows and bytes. Read from the file index that warehouse/eurostat_batch.py derives
      from Iceberg metadata (no Bronze scan).
    columns:
      - name: dataset_id
        tests: [not_null, unique]
      - name: raw_sha256
        description: >-
          Landing file SHA-256. Not unique: Eurostat publishes some byte-identical files
          under two dataset codes.
        tests: [not_null]
  - name: eurostat_observations
    description: >-
      Eurostat observations of the newest version of each dataset, typed: freq, unit, geo as
      published, time_period in SDMX format (period_source as published), value (null for ':'),
      status flags, the remaining series dimensions in breakdown_dimensions/breakdown_codes.
      Incremental per dataset version, batched by row budget; converges over successive builds.
      Tests check the rows of the current batch.
    columns:
      - name: dataset_id
        tests:
          - not_null:
              config:
                where: >-
                  raw_sha256 in ('{{ var("eurostat_batch", []) | map("last") | join("', '") }}')
      - name: time_period
        tests:
          - not_null:
              config:
                where: >-
                  raw_sha256 in ('{{ var("eurostat_batch", []) | map("last") | join("', '") }}')
  - name: eurostat_dataflows
    description: >-
      One row per Eurostat dataflow (dataset) from the newest structure message that defines
      it (bulk ESTAT_ALL_DATAFLOW or per-dataset): English name and description, data
      structure reference, last data/structure update annotations.
    columns:
      - name: dataset_id
        tests: [not_null, unique]
  - name: eurostat_codes
    description: >-
      Eurostat code lists (GEO, UNIT, NACE_R2 …) deduplicated across datasets: one row per
      agency, code list, version and code, with parent code and en/de/fr labels.
    columns:
      - name: code
        tests: [not_null]
  - name: eurostat_dimensions
    description: >-
      Dimensions of each Eurostat dataset (newest structure): position, concept, and the
      code list and version enumerating it (join to eurostat_codes).
    columns:
      - name: dataset_id
        tests: [not_null]
