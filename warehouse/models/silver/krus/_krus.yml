version: 2
models:
  - name: krus_benefits
    description: >-
      KRUS pensions and benefits paid (newest workbook): one row per period × benefit type × measure, quarters (Q)
      and years (A) since 2020. benefit_key: all, old_age, disability, disability_accident, survivors,
      survivors_accident, gbrz (agricultural structural pension), parental_supplementary, civilian_blind_war_victims.
      measure beneficiaries (average monthly number of persons) or avg_benefit_pln (average monthly benefit, zloty).
      footnote keeps the period's footnote mark: from III quarter 2025 (mark 2) survivors' pensions include those paid
      together with old-age and disability pensions, a break in the series.
    tests:
      - unique:
          column_name: "period_type || '|' || year || '|' || coalesce(cast(quarter as varchar), '-') || '|' || benefit_key || '|' || measure"
    columns:
      - name: period_type
        tests: [not_null, {accepted_values: {arguments: {values: ['Q', 'A']}}}]
      - name: period_start
        tests: [not_null]
      - name: benefit_key
        description: Null when KRUS adds a benefit column the model does not know (the test then fails).
        tests:
          - not_null
          - accepted_values: {arguments: {values: ['all', 'old_age', 'disability', 'disability_accident', 'survivors', 'survivors_accident', 'gbrz', 'parental_supplementary', 'civilian_blind_war_victims']}}
      - name: measure
        tests: [not_null, {accepted_values: {arguments: {values: ['beneficiaries', 'avg_benefit_pln']}}}]
      - name: value
        tests: [not_null]
      - name: raw_sha256
        tests: [not_null]
