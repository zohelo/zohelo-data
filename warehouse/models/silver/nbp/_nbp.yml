version: 2
models:
  - name: nbp_fx_rates
    description: >-
      NBP exchange rates (tables A, B, C) from bronze.nbp_observations: newest version of
      every table-quarter, typed. PLN per 1 unit of currency. Table A/B carry mid_rate,
      table C bid_rate/ask_rate and trading_date. Grain: table × effective date × currency
      (a currency the source repeats with identical values is kept once; differing
      published values for one key are counted in published_variants).
    tests:
      - unique:
          column_name: "table_code || '|' || effective_date || '|' || currency_code"
    columns:
      - name: table_code
        tests: [not_null, {accepted_values: {arguments: {values: ['A', 'B', 'C']}}}]
      - name: effective_date
        tests: [not_null]
      - name: currency_code
        tests: [not_null]
      - name: raw_sha256
        description: Landing SHA-256 of the source file (lineage to Landing/Archive).
        tests: [not_null]
      - name: published_variants
        description: >-
          Distinct published value sets (table_no, trading_date, currency_name, mid, bid, ask)
          for this table × date × currency in the newest Landing version; 1 = no conflict.
          Warn while #803's conflicting groups are investigated, then error.
        tests:
          - accepted_values:
              arguments:
                values: [1]
                quote: false
              config:
                severity: warn
  - name: nbp_gold_fixings
    description: NBP gold price, PLN per gram of 1000-fineness gold, one row per effective date.
    columns:
      - name: effective_date
        tests: [not_null, unique]
      - name: price_pln_per_gram
        tests: [not_null]
