version: 2
models:
  - name: eli_pl_acts
    description: >-
      ELI Poland (register PLG-026): one row per act published in Dziennik Ustaw (DU) or Monitor Polski (MP), metadata
      only. Grain: eli_id (journal / year / position). Title, type and status as published, promulgation and
      announcement dates (the API gives no promulgation date for many older acts), text flags; acts_listed = the
      journal's act count on /eli/acts. Position is not unique within a journal year: Monitor Polski 1946 repeats 10
      positions under distinct ELI ids (Dev trial). History and trial run: ingestion/sources/eli_pl.yaml.
    columns:
      - name: eli_id
        tests: [not_null, unique]
      - name: publisher
        tests: [not_null, {accepted_values: {arguments: {values: ['DU', 'MP']}}}]
      - name: year
        tests: [not_null]
      - name: position
        tests: [not_null]
      - name: act_type
        # the 46 types seen in both journals 1918-2026 (Dev trial; /eli/types lists 51); a new one warns
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Rozporządzenie', 'Obwieszczenie', 'Zarządzenie', 'Postanowienie', 'Uchwała', 'Ustawa', 'Oświadczenie rządowe', 'Komunikat', 'Orzeczenie', 'Umowa międzynarodowa', 'Dekret', 'Konwencja', 'Ogłoszenie', 'Okólnik', 'Lista', 'Instrukcja', 'Porozumienie', 'Protokół', 'Układ', 'Decyzja', 'Traktat', 'Pismo okólne', 'Rezolucja', 'Oświadczenie', 'Wykaz', 'Dokument wypowiedzenia', 'Umowa', 'Statut', 'Apel', 'Przepisy', 'Deklaracja', 'Przepisy wykonawcze', 'Regulamin', 'Stanowisko', 'Wytyczne', 'Orędzie', 'Zawiadomienie', 'Sprostowanie', 'Sprawozdanie', 'Reskrypt', 'Umowa zbiorowa', 'Akt', 'Opinia', 'Informacja', 'Wyjaśnienie', 'Wypis']
              config: {severity: warn}
      - name: status
        # the 14 statuses seen (Dev trial; /eli/statuses lists 15); a new one warns
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['bez statusu', 'uchylony', 'uznany za uchylony', 'akt indywidualny', 'obowiązujący', 'akt jednorazowy', 'nieobowiązujący - uchylona podstawa prawna', 'wygaśnięcie aktu', 'akt objęty tekstem jednolitym', 'uchylony wykazem', 'akt posiada tekst jednolity', 'brak mocy prawnej', 'wydane z naruszeniem prawa', 'nieobowiązujący - przyczyna nieustalona']
              config: {severity: warn}
      - name: raw_sha256
        tests: [not_null]
