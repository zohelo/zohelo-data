version: 2
models:
  - name: knf_espi_reports
    description: >-
      ESPI issuer reports in KNF's public OAM list (register CD-006), from bronze.knf_espi_reports (newest landed
      copy of each day of receipt), 1 January of the previous year onwards. Grain: report_id (OAM document id), one
      row per report. Issuer name, day received, ESPI form code of the title (report_type), link to the report's
      page, the day's stated report count. No titles (persons), no report texts or attachments, no issuer
      identifiers (the list gives none). Completeness: tests/knf_espi_reports_complete.sql.
    columns:
      - name: report_id
        tests: [not_null, unique]
      - name: issuer_name
        tests: [not_null]
      - name: received_date
        tests: [not_null]
      - name: report_type
        description: >-
          ESPI form code as listed ('_U' when the title starts with none). The codes seen in the Dev trial; KNF
          publishes no closed list of them, so a new code warns (add it here after a look) instead of failing.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['RB', 'RB-W', 'RB_ASO', 'RB-W_ASO', 'Q', 'QS', 'QSr', 'UNI-EN', '_U']
              config:
                severity: warn
      - name: link
        tests: [not_null]
      - name: raw_sha256
        description: Landing SHA-256 of the day document (lineage to Landing/Archive).
        tests: [not_null]
