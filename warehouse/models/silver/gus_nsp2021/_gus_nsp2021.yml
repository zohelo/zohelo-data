version: 2
models:
  - name: gus_nsp2021_tables
    description: >-
      GUS NSP 2021 census (register PLS-005): curated final-results tables (population 2011 and 2021, urban and
      rural population, urban share, census activity, employment and unemployment rates), Poland and the 16
      voivodeships. Grain: table_code x measure_code x area_name x group_code x period_year. Tables found by
      title and column header (warehouse/macros/gus_tables.sql); value as published, cell_status from the GUS
      symbols (rows without a value are kept with their status). Trial run: see
      ingestion/sources/gus_nsp2021.yaml.
    tests:
      - unique:
          column_name: "concat_ws('|', table_code, measure_code, area_name, group_code, period_year)"
    columns:
      - name: table_code
        tests: [not_null]
      - name: measure_code
        tests: [not_null]
      - name: unit_code
        tests: [not_null]
      - name: area_name
        tests: [not_null]
      - name: group_code
        tests: [not_null]
      - name: period_year
        tests: [not_null]
      - name: cell_status
        tests: [not_null, {accepted_values: {arguments: {values: [ok, below_half_unit, low_reliability, missing, confidential, not_applicable]}}}]
      - name: raw_sha256
        tests: [not_null]
