version: 2
models:
  - name: legal_acts
    description: >-
      Entity table (documents): one row per act published in Dziennik Ustaw (DU) or Monitor Polski (MP), keyed by
      its ELI identifier (register PLG-026); date_key = the promulgation date; title, type and status as published.
      Metadata only: no act texts.
    columns:
      - name: eli_id
        tests: [not_null, unique]
      - name: publisher
        tests: [not_null]
  - name: poc_build_eli_pl
    description: >-
      Build stage - ELI Poland, Poland: acts published per month (M) by promulgation date, breakdowns journal (DU,
      MP, _T) x act type (as published, _T); the series journal _T x type _T is the total. Only months with an act
      of the series have a row (no zero filling); the month of the newest download is provisional.
    columns:
      - name: measure_key
        tests: [not_null, {accepted_values: {arguments: {values: ['eli_pl:acts:acts:monthly']}}}]
      - name: frequency
        tests: [not_null, {accepted_values: {arguments: {values: ['M']}}}]
      - name: date_key
        tests: [not_null]
      - name: geography_key
        tests: [not_null, {accepted_values: {arguments: {values: ['PL']}}}]
      - name: value
        tests: [not_null]
  - name: poc_metrics_legal_acts_published
    description: Draft KPI legal_acts_published - acts published in Dziennik Ustaw and Monitor Polski per month, Poland.
