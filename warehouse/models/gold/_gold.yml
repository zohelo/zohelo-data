version: 2
# Gold v1 (docs/model.md), formerly the proof of concept. Namespace gold.
# Natural string keys; facts split by frequency; dim_series carries the breakdowns.
models:
  - name: poc_dim_calendar
    time_spine:   # the MetricFlow time spine (decision D19: dim_date's SQL lives here)
      standard_granularity_column: calendar_date
    description: >-
      Conformed calendar at day grain, 1900–2100: ISO weeks, Polish statutory holidays and working
      days from 1990, period labels and period-start flags; date_key is the date.
    columns:
      - name: date_key
        tests: [not_null, unique]
      - name: calendar_date
        granularity: day
  - name: poc_dim_geography
    description: >-
      Geography keyed by area: one row per area with the codes each source uses as attributes
      (iso2, nuts_code, terc_code, bdl_unit_id, wb_code); Polish hierarchy country → makroregion →
      województwo → region → podregion → powiat → gmina; special members _T, _Z, _X.
    columns:
      - name: geography_key
        tests: [not_null, unique]
      - name: level_name
        tests: [not_null]
  - name: poc_map_geography
    description: Every source geography code → geography_key (unmatched → _X, matched = false).
    columns:
      - name: source_code
        tests: [not_null]
      - name: geography_key
        tests: [not_null, {relationships: {arguments: {to: ref('poc_dim_geography'), field: geography_key}}}]
  - name: poc_dim_unit
    description: Units of measure as the sources name them, with a conformed unit where known.
    columns:
      - name: unit_key
        tests: [not_null, unique]
  - name: poc_dim_frequency
    columns:
      - name: frequency
        tests: [not_null, unique]
  - name: poc_dim_source
    columns:
      - name: source_system
        tests: [not_null, unique]
      - name: register_id
        tests: [not_null, unique]
  - name: poc_dim_observation_status
    columns:
      - name: observation_status_key
        tests: [not_null, unique]
  - name: poc_dim_measure
    description: >-
      The measure catalogue: activated measures (from the build stages) and every other block the
      sources publish or hold (from gold.coverage) with its status.
    columns:
      - name: measure_key
        tests: [not_null, unique]
      - name: dataset_key
        tests: [not_null]
      - name: status
        tests: [not_null]
  - name: poc_measure_dimensions
    description: Which dimensions each activated measure offers (geography levels, time, breakdowns with members).
    columns:
      - name: measure_key
        tests: [not_null, {relationships: {arguments: {to: ref('poc_dim_measure'), field: measure_key}}}]
  - name: poc_dim_series
    description: One row per time series (measure × geography × breakdown); the conformed breakdown keys as columns.
    columns:
      - name: series_key
        tests: [not_null, unique]
      - name: measure_key
        tests: [not_null, {relationships: {arguments: {to: ref('poc_dim_measure'), field: measure_key}}}]
      - name: geography_key
        tests: [not_null, {relationships: {arguments: {to: ref('poc_dim_geography'), field: geography_key}}}]
      - name: sex_key
        tests: [not_null, {relationships: {arguments: {to: ref('sex'), field: sex_key}}}]
  - name: poc_fact_annual
    description: One row per series × year; date_key = 1 January.
    columns:
      - name: series_key
        tests: [not_null, {relationships: {arguments: {to: ref('poc_dim_series'), field: series_key}}}]
      - name: date_key
        tests: [not_null, {relationships: {arguments: {to: ref('poc_dim_calendar'), field: date_key}}}]
      - name: value
        tests: [not_null]
      - name: observation_status_key
        tests: [{relationships: {arguments: {to: ref('poc_dim_observation_status'), field: observation_status_key}}}]
  - name: poc_fact_monthly
    description: One row per series × month; date_key = first day of the month.
    columns:
      - name: series_key
        tests: [not_null, {relationships: {arguments: {to: ref('poc_dim_series'), field: series_key}}}]
      - name: date_key
        tests: [not_null, {relationships: {arguments: {to: ref('poc_dim_calendar'), field: date_key}}}]
      - name: value
        tests: [not_null]
  - name: poc_fact_quarterly
    description: One row per series × quarter; date_key = first day of the quarter.
    columns:
      - name: series_key
        tests: [not_null, {relationships: {arguments: {to: ref('poc_dim_series'), field: series_key}}}]
      - name: date_key
        tests: [not_null, {relationships: {arguments: {to: ref('poc_dim_calendar'), field: date_key}}}]
      - name: value
        tests: [not_null]
  - name: poc_fact_daily
    description: One row per series × day.
    columns:
      - name: series_key
        tests: [not_null, {relationships: {arguments: {to: ref('poc_dim_series'), field: series_key}}}]
      - name: date_key
        tests: [not_null, {relationships: {arguments: {to: ref('poc_dim_calendar'), field: date_key}}}]
      - name: value
        tests: [not_null]
  - name: poc_dim_concept
    columns:
      - name: concept_key
        tests: [not_null, unique]
  - name: poc_concept_measures
    columns:
      - name: measure_key
        tests: [not_null, {relationships: {arguments: {to: ref('poc_dim_measure'), field: measure_key}}}]
  - name: poc_src_eurostat
    description: Extraction stage (Python model) — the activated Eurostat datasets' Silver rows, read from their files only.
  - name: poc_src_dbw
    description: Extraction stage (Python model) — the activated DBW blocks' Silver rows, read from their files only.
  - name: poc_src_dbw_dictionary
    description: Extraction stage (Python model) — the label dictionaries of the activated DBW blocks' files.
  - name: poc_build_oecd
    description: >-
      Build stage — OECD business confidence (BCICP), consumer confidence (CCICP) and the composite leading
      indicator (LI), amplitude adjusted, long-term average = 100, monthly, from silver.oecd_cli; areas through
      map_geography (ISO 3166 alpha-3 countries, EU27_2020 as the Eurostat aggregate, other OECD aggregates).
    columns:
      - name: measure_key
        tests: [not_null]
      - name: date_key
        tests: [not_null]
  - name: poc_build_gleif
    description: >-
      Build stage — GLEIF LEI counts of the newest golden copy (entity snapshot, daily): by registration status
      (measure), entity status, legal form (ELF) and entity category (breakdowns, one at a time), per country of
      legal jurisdiction and, for Poland, voivodeship of the legal address. Latest snapshot only (Silver is latest-only).
    columns:
      - name: measure_key
        tests: [not_null]
      - name: date_key
        tests: [not_null]
  - name: poc_build_mf_biala_lista
    description: >-
      Build stage — MF VAT white list flat file entries (taxpayer × account hashes) by taxpayer status and
      virtual-account masks, Poland, newest file only. Licence unresolved: internal.
    columns:
      - name: measure_key
        tests: [not_null]
      - name: date_key
        tests: [not_null]
  - name: poc_build_prg
    description: Build stage — area (km²) of every Polish administrative unit with a PRG boundary, daily at the PRG edition held.
  - name: poc_build_pig_midas
    description: >-
      Build stage — PIG-PIB MIDAS counts of the newest WFS download (entity snapshot, daily at the download day):
      documented mineral deposits (distinct deposit numbers) by MIDAS mineral code, current mining areas and mining
      terrains (distinct register numbers); Poland only (the layers carry no region code). Latest snapshot only.
    columns:
      - name: measure_key
        tests: [not_null]
      - name: date_key
        tests: [not_null]
  - name: geo_unit
    description: >-
      One row per Polish administrative unit with a PRG boundary (country, voivodeships, powiats, gminas): PRG
      area, centroid (lon/lat, computed in EPSG:2180), number of neighbours, PRG validity and edition. The country
      row's area includes internal and territorial sea waters (area_includes_sea).
    columns:
      - name: geography_key
        tests: [not_null, unique, {relationships: {arguments: {to: ref('poc_dim_geography'), field: geography_key}}}]
  - name: geo_neighbour
    description: >-
      Contiguity of Polish voivodeships, powiats and gminas from the full-resolution PRG boundaries: one row per
      unit × neighbour of the same level, both directions; shared border in km (EPSG:2180); rook = shared line,
      queen = point contact only (a textbook queen matrix takes every row). tests/geo_neighbour_symmetry.sql.
    tests:
      - unique:
          column_name: "geography_key || '|' || neighbour_key"
    columns:
      - name: geography_key
        tests: [not_null, {relationships: {arguments: {to: ref('poc_dim_geography'), field: geography_key}}}]
      - name: neighbour_key
        tests: [not_null, {relationships: {arguments: {to: ref('poc_dim_geography'), field: geography_key}}}]
      - name: contiguity
        tests: [{accepted_values: {arguments: {values: ['rook', 'queen']}}}]
  - name: poc_build_ids
    description: >-
      Build stage — World Bank IDS external debt stocks (US$, % of GNI) and debt service (US$, % of GNI, % of
      exports), debtor economy × counterpart WLD, annual, actual years only (no projections); about 120 low- and
      middle-income economies and their World Bank groups, no Poland or EU member state.
    columns:
      - name: measure_key
        tests: [not_null]
      - name: date_key
        tests: [not_null]
  - name: poc_build_check
    description: Per activated block — rows, series, unmatched geography, dates, flags; read after every build.
