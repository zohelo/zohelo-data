version: 2
models:
  - name: dim_date
    time_spine:
      standard_granularity_column: calendar_date
    description: >-
      Conformed calendar (warehouse/dimensions/calendar.yaml), one row per day 1900–2100
      plus special members 0 (not applicable) and -1 (unknown). date_key = yyyymmdd.
      Polish holiday and working-day flags from 1990 (rule-based, empty before).
    columns:
      - name: date_key
        tests: [not_null, unique]
      - name: calendar_date
        granularity: day
      - name: member_type
        tests: [{accepted_values: {arguments: {values: ['day', 'not_applicable', 'unknown']}}}]
  - name: dim_currency
    description: >-
      Conformed currency, v1 from NBP quotations (code, latest Polish name, NBP tables,
      first/last quote) plus PLN and special members _Z (not monetary) and _X (other).
    columns:
      - name: currency_code
        tests: [not_null, unique]
  - name: fact_fx_rate
    description: >-
      Exchange rates: PLN per 1 unit of currency_code, by date, rate type (mid/bid/ask)
      and source table (NBP A/B/C). Keys: date_key → dim_date, currency_code → dim_currency.
    columns:
      - name: date_key
        tests: [not_null, {relationships: {arguments: {to: ref('dim_date'), field: date_key}}}]
      - name: currency_code
        tests: [not_null, {relationships: {arguments: {to: ref('dim_currency'), field: currency_code}}}]
      - name: rate
        tests: [not_null]
  - name: dim_period
    description: >-
      Conformed reference period (warehouse/dimensions/period.yaml): SDMX TIME_PERIOD
      values 1900–2100 for A, S, Q, M, W (ISO) and D with start/end day; special members
      _Z (not applicable) and _T (all periods). period_key = time_period.
    columns:
      - name: period_key
        tests: [not_null, unique]
      - name: frequency_code
        tests: [{accepted_values: {arguments: {values: ['A', 'S', 'Q', 'M', 'W', 'D', '_Z', '_T']}}}]
  - name: dim_geography
    description: >-
      Conformed geography, v1 with the TERYT schemes: TERC (Polska → województwo → powiat →
      gmina) and SIMC localities, vintage = TERYT catalogue state date; flattened
      ancestors l0–l3; area_ha / area_km2 for TERC units from PRG; special members _T, _Z,
      _X. geography_key = scheme:code:vintage.
    columns:
      - name: geography_key
        tests: [not_null, unique]
  - name: fact_gold_price
    description: NBP gold price, PLN per gram of 1000-fineness gold, one row per date (date_key → dim_date).
    columns:
      - name: date_key
        tests: [not_null, unique, {relationships: {arguments: {to: ref('dim_date'), field: date_key}}}]
