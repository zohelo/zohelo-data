version: 2
models:
  - name: dim_dataset
    description: Catalogue datasets, one row per source block (key source:block), from gold.coverage.
    columns:
      - name: dataset_key
        tests: [not_null, unique]
      - name: source_key
        tests: [not_null]
      - name: name
        description: "Dataset name as the source publishes it; Eurostat: the dataflow name_en. Landing file names and empty names become <source name_en> · <code>."
        tests: [not_null]
      - name: status
        tests: [not_null]
