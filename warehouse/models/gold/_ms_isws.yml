version: 2
models:
  - name: poc_build_ms_isws
    description: >-
      Build stage — Ministry of Justice ISWS multi-year workbooks (register PLG-031), Poland, annual: common
      courts' cases received, resolved and pending (total and six case types), average duration of court
      proceedings in months (total, regional and district courts), adoption cases and notarial acts. Values and
      units as published (cases, months, notarial acts).
    columns:
      - name: measure_key
        tests: [not_null]
      - name: date_key
        tests: [not_null]
      - name: geography_key
        tests: [not_null, {accepted_values: {arguments: {values: ['PL']}}}]
      - name: value
        tests: [not_null]
  - name: poc_metrics_court_cases_received
    description: Gold PoC metrics view of the KPI court_cases_received (draft), total series only.
  - name: poc_metrics_court_cases_resolved
    description: Gold PoC metrics view of the KPI court_cases_resolved (draft), total series only.
  - name: poc_metrics_court_case_duration
    description: Gold PoC metrics view of the KPI court_case_duration (draft), total series only.
