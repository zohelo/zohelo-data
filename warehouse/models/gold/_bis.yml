version: 2
models:
  - name: poc_build_bis
    description: >-
      Build stage — BIS Data Portal: central bank policy rates and effective exchange rates (monthly), residential
      property prices, total credit as a percentage of GDP, credit-to-GDP gaps and debt service ratios
      (quarterly); the series of macro poc_bis_measures, each its own measure, for every country the BIS
      publishes and the euro area. Values and BIS unit codes as published.
    columns:
      - name: measure_key
        tests: [not_null]
      - name: date_key
        tests: [not_null]
      - name: geography_key
        tests: [not_null]
