version: 2
models:
  - name: poc_build_cie_sio
    description: >-
      Build stage — SIO archival education statistics of cie.gov.pl (register PLS-022): teachers (persons and
      full-time posts by grade, Poland 2006-2018, voivodeships 2018), schools and pupils 2018 by school type,
      category, publicness and governing body, graduates 2010-2018 by school type, category and sex. Annual,
      reference date 30 September; values and units as published.
    columns:
      - name: measure_key
        tests: [not_null]
      - name: geography_key
        tests: [not_null]
      - name: date_key
        tests: [not_null]
      - name: value
        tests: [not_null]
  - name: poc_metrics_teachers
    description: KPI teachers (draft) from every source that publishes it; today SIO (cie_sio) persons, all grades.
