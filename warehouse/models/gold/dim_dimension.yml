version: 2
models:
  - name: dim_dimension
    description: Catalogue axes, one row per dimension a measure can be cut by; conformed axes named by the dimension seed.
    columns:
      - name: dimension_key
        tests: [not_null, unique]
      - name: name_en
        tests: [not_null]
      - name: name_pl
        tests: [not_null]
      - name: kind
        tests: [not_null, {accepted_values: {arguments: {values: [conformed, entity, source_specific]}}}]
