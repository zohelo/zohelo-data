version: 2

models:
  - name: poc_build_crossref
    description: >-
      Gold build stage of Crossref (CD-029): annual works with a Polish author affiliation, total and by type,
      publisher and funder (block works_pl, unit works as published). Grain: measure_key × breakdown × date_key.
    tests:
      - unique:
          column_name: "measure_key || '|' || breakdown_json || '|' || cast(date_key as varchar)"
