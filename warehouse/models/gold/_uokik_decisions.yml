version: 2
models:
  - name: uokik_decision
    description: >-
      Entity table (documents): one row per decision of the President of UOKiK in the decisions database (register
      PLG-020; concentration decisions of PLG-021 flagged by is_concentration), keyed by the view entry's @unid;
      date_key = the decision date. Number, department signature and year as the index gives them, and every
      subject-area category that lists the decision (categories, joined with " | "); two numbers, dates or years for
      one unid fail the unique test; no party names (a party can be a natural person) and no enterprise identifiers (the index has none).
      Terms unresolved: internal only.
    columns:
      - name: unid
        tests: [not_null, unique]
      - name: decision_number
        tests: [not_null]
      - name: categories
        tests: [not_null]
  - name: poc_build_uokik_decisions
    description: >-
      Build stage - decisions of the President of UOKiK per year of the decision date, Poland: in total and by
      subject-area category (block decisions), and the concentration decisions, number signature DKK (block
      concentration). One measure_key per breakdown, frequency A; years without a decision have no row; the year of
      the newest download is provisional.
    tests:
      - unique:
          column_name: "measure_key || '|' || breakdown_json || '|' || date_key"
    columns:
      - name: measure_key
        tests: [not_null]
      - name: frequency
        tests: [not_null, {accepted_values: {arguments: {values: ['A']}}}]
      - name: date_key
        tests: [not_null]
      - name: geography_key
        tests: [not_null, {accepted_values: {arguments: {values: ['PL']}}}]
      - name: value
        tests: [not_null]
