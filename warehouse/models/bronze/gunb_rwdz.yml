version: 2
sources:
- name: gunb_rwdz
  description: >-
    GUNB Rejestr Wniosków, Decyzji i Zgłoszeń (register PL-ENV-033): the producer's 16 voivodeship files of
    building-permit applications with their decisions (https://wyszukiwarka.gunb.gov.pl/pobranie.html). Bronze and
    Silver are written per file by the loader, not by dbt (design #875, ingestion/to_bronze/gunb_rwdz/entities.py);
    columns naming natural persons, addresses and plots are left out before Bronze.
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/gunb_rwdz/
    loaded_by: ingestion/to_bronze/gunb_rwdz/
    config: ingestion/sources/gunb_rwdz.yaml
  tables:
  - name: gunb_rwdz_records
    description: >-
      One row per line of the newest copy of each voivodeship file (entity = voivodeship): register number
      (numer_gunb), office case number, authority, application and decision dates, decision number, voivodeship,
      TERYT code, kind of investment, object category and cubature as published text, plus provenance. A record is
      repeated on one line per plot (the plot columns are not read).
  - name: gunb_rwdz_rejected_files
    description: GUNB RWDZ files the Bronze decoder or the Silver model rejected, with the reason.
- name: gunb_rwdz_silver
  description: >-
    Silver table of gunb_rwdz written per voivodeship file by the loader (design #875), from
    warehouse/entity/gunb_rwdz_records.sql; it holds exactly the newest version of every file.
  database: r2
  schema: silver
  tables:
  - name: gunb_rwdz_records
    description: >-
      Entity table of the register: one row per register record (record_id = numer_gunb) of each voivodeship file,
      typed dates (application, decision), the voivodeship's TERC code, the TERYT code, kind of investment and object
      category as published, the number of source lines, and the columns on which the lines of a record disagree
      (null there). Grain, not-null keys and the closed lists (voivodeship, kind, category, 7-digit TERYT, readable
      dates) are checked by the loader on every file (entity.apply), which rejects the file otherwise.
