# Bronze tables, declared as dbt sources. They are built by ingestion/to_bronze (or by
# retired code), not by dbt; declaring them makes dbt lineage start at Bronze and
# link each table to its loader and Landing location (meta).
# Generated from ingestion/sources/*.yaml; add columns and descriptions as tables are modelled.
version: 2
sources:
- name: eurostat
  description: Eurostat data distributions from the bulk download (Files API); Comext excluded
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/eurostat/
    loaded_by: ingestion/to_bronze/eurostat/
    config: ingestion/sources/eurostat.yaml
  tables:
  - name: eurostat_observations
    description: >-
      One row per series × period as published (Eurostat .tsv.gz), newest Landing version
      of every dataset, one file per dataset (design #875); partitioned by dataset_id. value_text is the source lexeme
      (numbers, ':' for not available, '' for empty), status_code the flag; series_key
      holds the codes in the order of series_dimensions. Cast values in Silver.
  - name: eurostat_rejected_files
    description: Landing files the Bronze decoder rejected, with the reason (cleared by ops/retry_rejected).
  - name: eurostat_structure_items
    description: >-
      SDMX structure metadata per dataset as published (dataflow, data structure and its
      components, concept schemes, code lists and codes), one row per artefact or item;
      names, descriptions and annotations as JSON by language. Code lists repeat across
      datasets; partitioned by dataset_id.
  - name: eurostat_structure_rejected_files
    description: Structure messages the decoder rejected, with the reason.
- name: gleif
  description: GLEIF — LEI records, relationships and reporting exceptions (golden copy files)
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/gleif/
    loaded_by: ingestion/to_bronze/gleif/
    config: ingestion/sources/gleif.yaml
  tables:
  - name: gleif_lei_records
    description: >-
      One row per LEI record of the newest golden copy (LEI-CDF CSV), every CSV column as text,
      named after its header (lower case, dots → underscores), plus provenance.
  - name: gleif_relationship_records
    description: One row per relationship record of the newest golden copy (RR-CDF CSV), columns as text.
  - name: gleif_reporting_exceptions
    description: One row per reporting exception of the newest golden copy, columns as text.
  - name: gleif_rejected_files
    description: Landing files the GLEIF Bronze decoder rejected, with the reason (cleared by ops/retry_rejected).
- name: gugik_prg
  description: GUGiK PRG — national register of boundaries (administrative and cadastral units)
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/gugik_prg/
    loaded_by: ingestion/to_bronze/gugik_prg/ (prg_country … prg_surface_areas by retired code)
    config: ingestion/sources/gugik_prg.yaml
  tables:
  - name: prg_boundaries
    description: >-
      One row per boundary feature of every layer of the newest national package (A00 country,
      A01 voivodeships, A02 powiats, A03 gminas, A05 cadastral units, A06 cadastral precincts);
      attributes as text (jpt_kod_je = TERYT code), geometry as WKB (geographic ETRS89 as published) with the
      layer's .prj text in crs_wkt.
  - name: prg_rejected_files
    description: Landing files the PRG Bronze decoder rejected, with the reason.
  - name: prg_country
  - name: prg_voivodeships
  - name: prg_counties
  - name: prg_municipalities
  - name: prg_surface_areas
- name: gus_bdl
  description: GUS Local Data Bank (BDL) — subgroup website exports and API metadata
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/gus_bdl/
    loaded_by: ingestion/to_bronze/gus_bdl/
    config: ingestion/sources/gus_bdl.yaml
  tables:
  - name: bdl_metadata_variables
    description: >-
      BDL API variables per subgroup (one Landing page per Parquet file): variable id, n1–n5
      dimension labels as on the website exports, level, measure unit; source_version = the
      subgroup's data version. Maps Bronze export rows to variable ids in Silver.
  - name: bdl_metadata_units
    description: "BDL API territorial units (levels 0–6) with 12-character unit id, name, parent id, level, kind."
  - name: bdl_metadata_rejected_files
    description: BDL metadata pages the Bronze loader rejected, with the reason.
  - name: bdl_observations
    description: >-
      One row per CSV row of a subgroup export: every part of the newest complete download of
      each subgroup, one file per subgroup (design #875); partitioned by subgroup_id. dimension_names / dimension_values are JSON arrays of
      the subgroup's dimension labels (= API variable name components n1…n5); value_text is
      the source lexeme (decimal comma); variable_id is filled for API refreshes only.
  - name: bdl_rejected_files
    description: Landing files the BDL Bronze decoder rejected, with the reason (cleared by ops/retry_rejected).
- name: gus_dbw
  description: GUS DBW indicators
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/gus_dbw/
    loaded_by: retired code (ingestion/legacy/)
    config: ingestion/sources/gus_dbw.yaml
  tables:
  - name: dbw_observations
  - name: dbw_dictionaries
  - name: dbw_indicators
  - name: dbw_metadata
- name: gus_teryt
  description: GUS TERYT — territorial register (TERC, SIMC, ULIC, WMRODZ)
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/gus_teryt/
    loaded_by: ingestion/to_bronze/gus_teryt/ (teryt_terc/simc/ulic by retired code)
    config: ingestion/sources/gus_teryt.yaml
  tables:
  - name: teryt_records
    description: >-
      One row per catalogue record as published in the CSV member of each eTERYT full file,
      newest version per catalogue variant (entity: TERC_Urzedowy, TERC_Adresowy,
      SIMC_Urzedowy, SIMC_Adresowy, SIMC_Statystyczny, ULIC_Urzedowy, ULIC_Adresowy,
      WMRODZ); union of the catalogue columns as text; partitioned by entity.
  - name: teryt_rejected_files
    description: Landing files the TERYT Bronze decoder rejected, with the reason.
  - name: teryt_terc
  - name: teryt_simc
  - name: teryt_ulic
- name: mf_biala_lista
  description: Ministry of Finance VAT taxpayer white list (flat file)
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/mf_biala_lista/
    loaded_by: ingestion/to_bronze/mf_biala_lista/
    config: ingestion/sources/mf_biala_lista.yaml
  tables:
  - name: biala_lista_records
    description: >-
      One row per item of the newest flat file's lists (record_kind active / exempt / mask, value
      as published, position in its list), with the header's generation date and transformation count.
  - name: biala_lista_rejected_files
    description: Landing files the white-list Bronze decoder rejected, with the reason (cleared by ops/retry_rejected).
- name: nbp
  description: Narodowy Bank Polski — exchange rate tables A/B/C and gold prices (NBP Web API)
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/nbp/
    loaded_by: ingestion/to_bronze/nbp/ (nbp_exchange_rates_table_* and nbp_gold_prices by retired code)
    config: ingestion/sources/nbp.yaml
  tables:
  - name: nbp_observations
    description: >-
      One row per quote (tables A/B/C) or gold price, newest and superseded versions of
      every table-quarter (entity), values as source text; partitioned by table_code.
      Loaded by ingestion/to_bronze/nbp/ from 01_landing/nbp/snapshot/data/.
  - name: nbp_rejected_files
    description: Landing files the NBP Bronze decoder rejected, with the reason.
  - name: nbp_exchange_rates_table_a
  - name: nbp_exchange_rates_table_b
  - name: nbp_exchange_rates_table_c
  - name: nbp_gold_prices
- name: opendata_org
  description: OpenData organizations, people and locations bulk ZIP
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/opendata_org/
    loaded_by: retired code (ingestion/legacy/)
    config: ingestion/sources/opendata_org.yaml
  tables:
  - name: opendata_org_organizations
  - name: opendata_org_people
  - name: opendata_org_locations
- name: world_bank_wdi
  description: World Bank WDI bulk CSV archive and API responses
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/world_bank_wdi/
    loaded_by: ingestion/to_bronze/world_bank_wdi/ (wdi_data … wdi_series_time by retired code)
    config: ingestion/sources/world_bank_wdi.yaml
  tables:
  - name: wdi_bulk_observations
    description: >-
      WDI observation file of the newest bulk archive, one row per country × indicator × year
      with a value (empty cells are not stored), values as text, partitioned by entity (WDI_CSV).
  - name: wdi_bulk_metadata
    description: >-
      Every other WDI member (country, series, country-series, series-time, footnote) as
      field/value rows: member file, source row number, field, value text.
  - name: wdi_rejected_files
    description: WDI Landing archives the Bronze decoder rejected, with the reason.
  - name: wdi_data
  - name: wdi_country
  - name: wdi_series
  - name: wdi_country_series
  - name: wdi_footnote
  - name: wdi_series_time
- name: silver_entities
  description: >-
    Silver tables written per source entity by the loaders, not by dbt (design #875): each
    holds exactly the newest version of every entity, from warehouse/entity/<table>.sql.
  database: r2
  schema: silver
  tables:
  - name: biala_lista_taxpayer_hashes
    description: >-
      MF VAT white list: SHA-512 hashes (date + NIP + account, hashed `transformations` times) of
      active and exempt VAT taxpayers' accounts in the newest flat file; taxpayer_status active / exempt.
  - name: biala_lista_masks
    description: MF VAT white list virtual-account masks of the newest flat file.
  - name: gleif_legal_entities
    description: >-
      GLEIF legal entities: one row per LEI of the newest golden copy, core LEI-CDF attributes
      typed (names, jurisdiction, legal form, status, addresses, registration); entity = lei2.
  - name: gleif_relationships
    description: GLEIF relationship records, child LEI → parent LEI by relationship type, newest golden copy; entity = rr.
  - name: gleif_reporting_exceptions
    description: GLEIF reporting exceptions, why an LEI reports no direct or ultimate parent; entity = repex.
  - name: eurostat_observations
    description: >-
      Eurostat observations, typed: freq, unit, geo as published, time_period in SDMX format,
      value (null for ':' or empty), status flags, the other series dimensions in
      breakdown_dimensions / breakdown_codes; one file per dataset (raw_sha256 = its Landing file).
  - name: bdl_observations
    description: >-
      GUS BDL observations, typed, one row per unit (code + name: the export gives the Górnośląsko-Zagłębiowska Metropolia the code of ŚLĄSKIE) × dimensions × year of each subgroup's newest
      complete download (overlapping parts: identical rows collapse, an empty value gives way to a
      published one; conflicting values reject the subgroup); variable_id from bdl_variables.
