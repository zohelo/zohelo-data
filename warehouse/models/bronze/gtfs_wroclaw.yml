version: 2
sources:
- name: gtfs_wroclaw
  description: Wrocław public transport static GTFS timetable (register PL-ENV-032), every landed validity window of each feed
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/gtfs_wroclaw/
    loaded_by: ingestion/to_bronze/gtfs_wroclaw/ (ingestion/common/gtfs.py)
    config: ingestion/sources/gtfs_wroclaw.yaml
  tables:
  - name: gtfs_wroclaw_records
    description: >-
      One row per record of agency, routes, stops, trips, calendar, calendar_dates and feed_info (gtfs_file, the kept
      GTFS fields as text) and one row per trip of stop_times.txt with its number of stop_times rows
      (stop_times_rows); one Parquet file per landed window (entity <feed>_<first>_<last>), partitioned by entity.
  - name: gtfs_wroclaw_rejected_files
    description: Landed windows of gtfs_wroclaw the Bronze decoder rejected (unknown GTFS layout, code outside GTFS), with the reason.
