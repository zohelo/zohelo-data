version: 2
sources:
- name: nbp_interest_rates
  description: Narodowy Bank Polski — official NBP interest rates (archive and current XML files)
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/nbp_interest_rates/
    loaded_by: ingestion/to_bronze/nbp_interest_rates/
    config: ingestion/sources/nbp_interest_rates.yaml
  tables:
  - name: nbp_interest_rate_items
    description: >-
      One row per <pozycja> (rate) or <odnosnik> (footnote) of the newest copy of each file (entity rates_archive: rate per MPC change
      since 1998-02-26; rates_current: rates in force with PL/EN names and footnotes), attributes as
      source text (decimal comma); partitioned by entity.
  - name: nbp_interest_rates_rejected_files
    description: NBP interest-rate Landing files the Bronze decoder rejected, with the reason.
