version: 2
sources:
- name: mf_treasury_debt
  description: Ministry of Finance State Treasury debt time-series workbook
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/mf_treasury_debt/
    loaded_by: ingestion/to_bronze/mf_treasury_debt/
    config: ingestion/sources/mf_treasury_debt.yaml
  tables:
  - name: mf_treasury_debt_cells
    description: >-
      One row per non-empty cell of the newest Landing copy of each workbook (entity treasury_debt_series): sheet, row, column,
      source text (value_text), cell type and number format (ingestion/common/xlsx_cells.py); partitioned by entity.
  - name: mf_treasury_debt_rejected_files
    description: mf_treasury_debt Landing files the Bronze decoder rejected (not an XLSX workbook), with the reason.
