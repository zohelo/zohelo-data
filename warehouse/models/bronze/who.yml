version: 2
sources:
- name: who
  description: WHO data.who.int — indicator CSV files (all areas, years and sexes)
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/who/
    loaded_by: ingestion/to_bronze/who/
    config: ingestion/sources/who.yaml
  tables:
  - name: who_observations
    description: >-
      One row per row of the newest copy of each indicator CSV (entity: life_expectancy, hale), every value as
      published text, columns lower-cased (ind_code, dim_time, dim_geo_code_m49, dim_geo_code_type, dim_sex,
      amount_n, amount_nl, amount_nu, ...); partitioned by entity.
  - name: who_rejected_files
    description: WHO data.who.int Landing files the Bronze decoder rejected, with the reason.
