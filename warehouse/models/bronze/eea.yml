version: 2
sources:
- name: eea
  description: EEA Datahub — greenhouse gas inventory (GovReg), newest version's CSV
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/eea/
    loaded_by: ingestion/to_bronze/eea/
    config: ingestion/sources/eea.yaml
  tables:
  - name: eea_ghg_inventory
    description: >-
      One row per row of the newest GovReg CSV (entity govreg_ghg_inventory): country_code, country, format_name,
      pollutant_name, sector_code, sector_name, parent_sector_code, unit, year, emissions, notation,
      publicationdate, datasource, country_code_3, every value as published text; partitioned by entity.
  - name: eea_rejected_files
    description: EEA Landing files the Bronze decoder rejected (not one CSV member, unknown header), with the reason.
