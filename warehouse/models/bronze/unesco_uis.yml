version: 2
sources:
- name: unesco_uis
  description: UNESCO UIS — Data API whole-indicator selections (JSON)
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/unesco_uis/
    loaded_by: ingestion/to_bronze/unesco_uis/
    config: ingestion/sources/unesco_uis.yaml
  tables:
  - name: unesco_uis_observations
    description: >-
      One row per record of the newest copy of each selection (entity: gerd_gdp, tertiary_attainment), as text:
      indicator_id, geo_unit, year, value, magnitude, qualifier; partitioned by entity.
  - name: unesco_uis_rejected_files
    description: UNESCO UIS Landing files the Bronze decoder rejected, with the reason.
