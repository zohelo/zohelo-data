version: 2
sources:
- name: cepik
  description: CEPiK vehicle statistics (register PL-ENV-024), monthly statistics workbooks (.xlsx) on gov.pl
  database: r2
  schema: bronze
  meta:
    landing: 01_landing/cepik/
    loaded_by: ingestion/to_bronze/cepik/
    config: ingestion/sources/cepik.yaml
  tables:
  - name: cepik_cells
    description: >-
      One row per non-empty cell (value as stored, ZIP member, sheet, row, column, number format) of every workbook
      of the newest copy of each landed file; partitioned by entity.
  - name: cepik_rejected_files
    description: Files of cepik the Bronze decoder rejected, with the reason.
