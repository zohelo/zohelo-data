name: zohelo
version: "1.0.0"
profile: zohelo

model-paths: ["models", "semantic_models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

# Every model is an Iceberg table in the R2 Data Catalog (attached as database "r2").
# The folder decides the namespace: models/silver -> silver, models/gold -> gold
# (target "trial" writes everything to its own scratch namespace instead).
models:
  zohelo:
    +database: r2
    +materialized: table
    silver:
      +schema: silver
    gold:   # Gold v1 (docs/model.md); file names keep the poc_ prefix, aliases drop it.
      # A trial sets gold_schema to a zz_dev_ scratch namespace and selects only this folder.
      +schema: "{{ var('gold_schema', 'gold') }}"

# Seeds: owner-readable code lists (warehouse/seeds/*.csv), built into the Gold namespace.
seeds:
  zohelo:
    +database: r2
    +schema: "{{ var('gold_schema', 'gold') }}"

# Per-source Gold macros are found by name while a model is parsed (macros/source_registration.sql, D34);
# partial parsing does not follow that, so every command parses the whole project (about 5 seconds).
flags:
  partial_parse: false
