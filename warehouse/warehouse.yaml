  teryt_terc: {rows: 20000}  # 4,360
  wdi_countries: {rows: 1000}  # 265
  wdi_indicators: {rows: 10000}  # 1,498
  wdi_observations: {rows: 12000000, exception: "#870"}  # 9,045,734; rebuilt weekly with WDI
  # Gold v1 (warehouse/models/gold; model names keep the poc_ prefix): rebuilt in full
