# Warehouse activities the Pipeline may run (source "platform"); owner authorization.
#   silver_gold.build     dbt build of the SQL project (models/), optional --select from the run filter
#   gold.publish          writes 06_published/v1/ from Gold (warehouse/publish.py)
activities: [silver_gold.build, gold.publish]

# Published contract v2 for zohelo-bi (docs/published.md, "Published layer contract v2"): gold.publish writes
# 06_published/v2/ (warehouse/publish_v2.py) after the v1 files; v1 is unchanged and zohelo.com reads v1 only.
# Only KPIs with status published in seeds/kpi.csv reach v2. false: v2 is not written.
published_v2: true
# Release briefs (docs/published.md, "briefs.json"): written with v2. A KPI × geography gets a brief when its
# latest.json period is newer than in the previously published latest.json (same source and frequency); the brief
# stays for window_days after it was first detected. extreme: highest/lowest for at least extreme_min_periods observed values back.
briefs: {window_days: 45, extreme_min_periods: 12, geographies: [PL, EU27]}
# Declared schedules (UTC), dispatched by run.py schedule: models daily after the source
# loads. Eurostat and BDL observations are not dbt models: their loaders write Silver (#875).
schedule:
  - {cron: "30 7 * * *", run: "silver/gold: build models"}

# Transient catalog errors: a build whose only failures are HTTP 429 from the R2 Data Catalog or
# Iceberg commit failures (#2574) is resumed with `dbt retry` (its failed and skipped nodes) after
# each of these waits, in seconds.
rate_limit_retry_waits: [60, 180, 420]
rate_limit_retry_threads: 2     # fewer parallel catalog calls than the build's 4
commit_retry_threads: 1         # after an Iceberg commit failure: no concurrent commits

# Topics layer (owner decision O32, docs/topics.md): heat score weights, windows and thresholds, passed to every
# build as the dbt var `topics` (warehouse/macros/topics.sql). `publish: false` keeps topics.json unwritten
# until the owner switches the portals on after the internal review period (>= two weeks).
topics:
  publish: false
  weights: {news: 0.5, volume: 0.3, attention: 0.2}   # a missing signal drops out; the others are rescaled
  release: {day: 1.0, day_before: 0.5}                 # added on the release day of a main KPI and the day before
  baseline_days: 90       # robust z-scores against the topic's own trailing 90 days (median, MAD)
  min_baseline_days: 7    # fewer observed days in the baseline: no z-score for that signal
  mad_floor: 1
  volume_per: 100000      # GDELT volume as matching articles per 100,000 monitored
  history_days: 455       # topic_daily: the year window plus its 90-day baseline
  periods: {day: 1, week: 7, month: 30, quarter: 91, year: 365}
  min_headlines: {day: 2, other: 3}   # matched headlines in the window to enter a period's list
  year_hot_threshold: 1   # year score = mean heat x share of days with heat above this
  trend_flat: 0.25        # |score - previous window's score| at or below: flat
  max_topics: 10          # topics.json: per period
  max_headlines: 5        # topics.json: per topic, newest first
  freshness_hours: {warn: 48, fail: 168}   # gold.topic_quality: newest headline per outlet
  matched_share: {min: 0.10, max: 0.90}    # gold.topic_quality: share of last 7 days' headlines matched (warn outside)

# Shared Gold built by the dbt project (conformed dimensions and facts across sources).
gold: [gold.frequency,  # seed warehouse/seeds/frequency.csv
       gold.domain,  # seed warehouse/seeds/domain.csv
       gold.kpi_dimension,  # catalogue: dimensions per KPI and measure
       gold.kpi, gold.kpi_measure, gold.unit,  # seeds warehouse/seeds/kpi.csv, kpi_measure.csv, unit.csv
       gold.sex,  # seed warehouse/seeds/sex.csv (SDMX CL_SEX)
       gold.licence, gold.source,  # seeds warehouse/seeds/licence.csv, source.csv
       gold.release_calendar,  # seed release_calendar.csv
       gold.kpi_v2_map,  # seed kpi_v2_map.csv: zohelo-bi first slice, v2 key → concept and source (#2584)
       gold.geography_v2, gold.unit_decimals, gold.kpi_member,  # seeds of published contract v2 (docs/published.md)
       gold.news_outlet,  # seed news_outlet.csv: outlets of the news feeds (topics, O32)
       gold.topic, gold.topic_kpi, gold.topic_keyword, gold.topic_signal, gold.release_kpi,  # topic seeds (O32, docs/topics.md)
       gold.topic_matches, gold.topic_daily, gold.topic_rank, gold.topic_quality,  # topics Gold (O32, docs/topics.md)
       gold.metrics_activity_rate, gold.metrics_adult_learning, gold.metrics_arope_rate, gold.metrics_child_arope, gold.metrics_basic_digital_skills, gold.metrics_bond_yield_10y, gold.metrics_gdp_per_capita_pps, gold.metrics_gerd_gdp, gold.metrics_gg_debt_gdp, gold.metrics_gg_balance_gdp, gold.metrics_ghg_emissions, gold.metrics_neet_rate, gold.metrics_niip_gdp, gold.metrics_old_age_dependency, gold.metrics_recycling_rate, gold.metrics_reer, gold.metrics_tertiary_attainment, gold.metrics_total_fertility_rate, gold.metrics_life_expectancy,  # metrics of the first slice (#2584), draft until checked
       gold.metrics_cpi_annual_rate, gold.metrics_real_wage_growth, gold.metrics_nominal_wage_growth, gold.metrics_registered_unemployed, gold.metrics_gdp_qoq_sa, gold.metrics_gdp_regional_growth, gold.metrics_gfcf_rate, gold.metrics_gfcf_growth, gold.metrics_gdp_contributions, gold.metrics_gva_by_section, gold.metrics_gfcf_by_asset, gold.metrics_business_climate, gold.metrics_capacity_utilisation, gold.metrics_consumer_confidence, gold.metrics_esi, gold.metrics_industrial_production, gold.metrics_construction_output, gold.metrics_retail_sales, gold.metrics_ppi_annual_rate, gold.metrics_current_account_gdp, gold.metrics_current_account_components, gold.metrics_fdi_inflow, gold.metrics_job_vacancy_rate, gold.metrics_labour_productivity, gold.metrics_unit_labour_cost, gold.metrics_long_term_unemployment, gold.metrics_gender_pay_gap, gold.metrics_gini, gold.metrics_social_spending_gdp, gold.metrics_youth_unemployment, gold.metrics_disposable_income_pc, gold.metrics_pensioners, gold.metrics_zus_pension_avg, gold.metrics_investment_outlays, gold.metrics_vacancies_per_unemployed, gold.metrics_average_gross_wage, gold.metrics_employment_rate, gold.metrics_registered_unemployment_rate,  # every source per slice KPI (O31, #2592), draft until checked
       gold.coverage,   # coverage: not dbt, each source's bronze.verify writes its rows (ingestion/common/coverage.py)
       gold.dim_dataset,  # catalogue: one row per source block (from gold.coverage)
       gold.dimension, gold.dimension_alias, gold.dim_dimension,  # catalogue: axes
       gold.build_bdl, gold.src_eurostat, gold.src_dbw, gold.src_dbw_dictionary, gold.build_check, gold.grain_check, gold.build_dbw, gold.build_eurostat, gold.build_nbp, gold.build_wdi, gold.build_unctad, gold.metrics_exports_goods, gold.metrics_exports_services, gold.concept_measures, gold.dim_calendar, gold.dim_concept, gold.dim_frequency, gold.dim_geography, gold.dim_measure, gold.dim_observation_status, gold.dim_series, gold.dim_source, gold.dim_unit, gold.fact_annual, gold.fact_daily, gold.fact_monthly, gold.fact_quarterly, gold.map_geography, gold.measure_dimensions, gold.metrics_fx_rate, gold.metrics_gdp_current_prices, gold.metrics_inflation, gold.metrics_population, gold.metrics_unemployment_rate, gold.metrics_gdp_per_capita, gold.metrics_gdp_volume_growth]   # Gold v1 (warehouse/models/gold, docs/model.md)
demo_namespaces: [demo_bronze, demo_silver, demo_gold]  # phase 2 demo warehouse (program plan §3.3); never in the public catalogue

