# Warehouse activities the Pipeline may run (source "platform"); owner authorization.
#   silver_gold.promote   Bronze → Silver → Gold pass-through (passthrough/), until the SQL project
#   silver_gold.build     dbt build of the SQL project (models/), optional --select from the run filter
activities: [silver_gold.promote, silver_gold.build]
# Declared schedules (UTC), dispatched by run.py schedule: models daily after the source
# loads. Eurostat Silver catch-up is not scheduled (owner policy #822): it runs only as an
# announced one-off backfill, a manual run with filter "eurostat_dataset_versions eurostat_observations".
schedule:
  - {cron: "30 7 * * *", run: "silver/gold: build models"}

# Shared Gold built by the dbt project (conformed dimensions and facts across sources).
gold: [gold.dim_date, gold.dim_period, gold.dim_currency, gold.dim_geography, gold.dim_indicator,
       gold.fact_observation, gold.fact_fx_rate, gold.fact_gold_price]

# Eurostat Silver batching (warehouse/eurostat_batch.py, warehouse/build.py). dbt stages each
# batch in a temp table (~190 bytes per Bronze row) on a runner with ~75 GB of temp space.
eurostat_silver:
  row_budget: 150000000       # Bronze rows per batch
  max_versions: 500           # dataset versions per batch (dbt --vars is one argument, ≤128 KB)
  oversized_rows: 700000000   # single files above this are deferred until a sliced load exists
  loop_minutes: 140           # a run selecting only the Eurostat models starts no batch after this
  loop_builds: 20             # at most this many builds per run (time is the usual limit: ~8 builds took 64 min)
