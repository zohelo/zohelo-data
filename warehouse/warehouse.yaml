# Warehouse activities the Pipeline may run (source "platform"); owner authorization.
#   silver_gold.build     dbt build of the SQL project (models/), optional --select from the run filter
#   gold.publish          writes 06_published/v1/ from Gold (warehouse/publish.py)
activities: [silver_gold.build, gold.publish]

# Published contract v2 for zohelo-bi (docs/published.md, "Published layer contract v2"): gold.publish writes
# 06_published/v2/ (warehouse/publish_v2.py) after the v1 files; v1 is unchanged and zohelo.com reads v1 only.
# Only KPIs with status published in seeds/kpi.csv reach v2. false: v2 is not written.
published_v2: true
# Release briefs (docs/published.md, "briefs.json"): written with v2. A KPI × geography gets a brief when its
# latest.json period is newer than in the previously published latest.json (same source and frequency); the brief
# stays for window_days after it was first detected. extreme: highest/lowest for at least extreme_min_periods observed values back.
briefs: {window_days: 45, extreme_min_periods: 12, geographies: [PL, EU27]}
# Declared schedules (UTC), dispatched by run.py schedule: models daily after the source
# loads. Eurostat and BDL observations are not dbt models: their loaders write Silver (#875).
schedule:
  - {cron: "30 7 * * *", run: "silver/gold: build models"}

# Transient catalog errors: a build whose failed models all failed on HTTP 429 from the R2 Data
# Catalog or on Iceberg commit failures (#2574) is resumed with `dbt retry` (its failed and skipped
# nodes) after each of these waits, in seconds; a failing data test does not prevent it (#2789).
rate_limit_retry_waits: [60, 180, 420]
rate_limit_retry_threads: 2     # fewer parallel catalog calls than the build's 4
commit_retry_threads: 1         # after an Iceberg commit failure: no concurrent commits

# Topics layer (owner decision O32, docs/topics.md): heat score weights, windows and thresholds, passed to every
# build as the dbt var `topics` (warehouse/macros/topics.sql). `publish: false` keeps topics.json unwritten
# until the owner switches the portals on after the internal review period (>= two weeks).
topics:
  publish: false
  weights: {news: 0.5, volume: 0.3, attention: 0.2}   # a missing signal drops out; the others are rescaled
  release: {day: 1.0, day_before: 0.5}                 # added on the release day of a main KPI and the day before
  baseline_days: 90       # robust z-scores against the topic's own trailing 90 days (median, MAD)
  min_baseline_days: 7    # fewer observed days in the baseline: no z-score for that signal
  mad_floor: 1
  volume_per: 100000      # GDELT volume as matching articles per 100,000 monitored
  history_days: 455       # topic_daily: the year window plus its 90-day baseline
  periods: {day: 1, week: 7, month: 30, quarter: 91, year: 365}
  min_headlines: {day: 2, other: 3}   # matched headlines in the window to enter a period's list
  year_hot_threshold: 1   # year score = mean heat x share of days with heat above this
  trend_flat: 0.25        # |score - previous window's score| at or below: flat
  max_topics: 10          # topics.json: per period
  max_headlines: 5        # topics.json: per topic, newest first
  freshness_hours: {warn: 48, fail: 168}   # gold.topic_quality: newest headline per outlet
  matched_share: {min: 0.10, max: 0.90}    # gold.topic_quality: share of last 7 days' headlines matched (warn outside)

