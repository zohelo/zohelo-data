# Warehouse activities the Pipeline may run (source "platform"); owner authorization.
#   silver_gold.promote   Bronze → Silver → Gold pass-through (passthrough/), until the SQL project
#   silver_gold.build     dbt build of the SQL project (models/), optional --select from the run filter
activities: [silver_gold.build]   # silver_gold.promote retired 16 Oct (#835); code kept until the new solution replaces it
# Declared schedules (UTC), dispatched by run.py schedule: models daily after the source
# loads. Eurostat and BDL observations are not dbt models: their loaders write Silver (#875).
schedule:
  - {cron: "30 7 * * *", run: "silver/gold: build models"}

# Catalog rate limit: a build whose only failures are HTTP 429 from the R2 Data Catalog is
# resumed with `dbt retry` (its failed and skipped nodes) after each of these waits, in seconds.
rate_limit_retry_waits: [60, 180, 420]
rate_limit_retry_threads: 2     # fewer parallel catalog calls than the build's 4

# Shared Gold built by the dbt project (conformed dimensions and facts across sources).
gold: [gold.dim_date, gold.dim_period, gold.dim_currency, gold.dim_geography, gold.dim_indicator,
       gold.fact_observation, gold.fact_fx_rate, gold.fact_gold_price,
       gold.coverage,   # coverage: not dbt, each source's bronze.verify writes its rows (ingestion/common/coverage.py)
       poc.build_bdl, poc.src_eurostat, poc.src_dbw, poc.src_dbw_dictionary, poc.build_check, poc.grain_check, poc.build_dbw, poc.build_eurostat, poc.build_nbp, poc.build_wdi, poc.concept_measures, poc.dim_calendar, poc.dim_concept, poc.dim_frequency, poc.dim_geography, poc.dim_measure, poc.dim_observation_status, poc.dim_series, poc.dim_source, poc.dim_unit, poc.fact_annual, poc.fact_daily, poc.fact_monthly, poc.map_geography, poc.measure_dimensions, poc.metrics_fx_rate, poc.metrics_gdp_current_prices, poc.metrics_inflation, poc.metrics_population, poc.metrics_unemployment_rate]   # Gold PoC (docs/gold-poc.md)

