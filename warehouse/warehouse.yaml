# Warehouse activities the Pipeline may run (source "platform"); owner authorization.
#   silver_gold.build     dbt build of the SQL project (models/), optional --select from the run filter
activities: [silver_gold.build]
# Declared schedules (UTC), dispatched by run.py schedule: models daily after the source
# loads. Eurostat and BDL observations are not dbt models: their loaders write Silver (#875).
schedule:
  - {cron: "30 7 * * *", run: "silver/gold: build models"}

# Catalog rate limit: a build whose only failures are HTTP 429 from the R2 Data Catalog is
# resumed with `dbt retry` (its failed and skipped nodes) after each of these waits, in seconds.
rate_limit_retry_waits: [60, 180, 420]
rate_limit_retry_threads: 2     # fewer parallel catalog calls than the build's 4

# Shared Gold built by the dbt project (conformed dimensions and facts across sources).
gold: [gold.dim_date,
       gold.frequency,  # seed warehouse/seeds/frequency.csv
       gold.coverage,   # coverage: not dbt, each source's bronze.verify writes its rows (ingestion/common/coverage.py)
       gold.build_bdl, gold.src_eurostat, gold.src_dbw, gold.src_dbw_dictionary, gold.build_check, gold.grain_check, gold.build_dbw, gold.build_eurostat, gold.build_nbp, gold.build_wdi, gold.concept_measures, gold.dim_calendar, gold.dim_concept, gold.dim_frequency, gold.dim_geography, gold.dim_measure, gold.dim_observation_status, gold.dim_series, gold.dim_source, gold.dim_unit, gold.fact_annual, gold.fact_daily, gold.fact_monthly, gold.map_geography, gold.measure_dimensions, gold.metrics_fx_rate, gold.metrics_gdp_current_prices, gold.metrics_inflation, gold.metrics_population, gold.metrics_unemployment_rate, gold.md]   # Gold v1 (warehouse/models/gold, docs/model.md)

# Full-rebuild models (not incremental) and their row ceilings (owner policy #822: only tables
# below ~1M rows are rebuilt in full; #868). repo_check fails on a model missing here or a ceiling
# above 1M without an exception issue; a prod build warns above the ceiling and fails above twice it.
