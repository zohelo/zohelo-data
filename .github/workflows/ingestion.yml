name: Ingestion (R2 manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: What to run
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - campaign
          - bulk
          - eurostat_landing
      source:
        description: Source for campaign/bulk operations
        required: true
        type: choice
        default: world_bank_wdi
        options:
          - world_bank_wdi
          - eurostat
          - gus_bdl
          - gus_dbw
      cycles:
        description: Standard campaign batches (1-6)
        required: false
        default: "1"
      session_seconds:
        description: Runtime budget in seconds
        required: false
        default: "600"
      max_requests:
        description: Bulk requests per run
        required: false
        default: "12"
      landing_mode:
        description: "eurostat_landing: plan (classify only) or ingest (download)"
        required: false
        type: choice
        default: plan
        options:
          - plan
          - ingest
      limit:
        description: "eurostat_landing: max datasets per shard (0 = all)"
        required: false
        default: "0"
      workers:
        description: "eurostat_landing: parallel downloads per shard (1-8)"
        required: false
        default: "4"
      shards:
        description: "eurostat_landing ingest: parallel jobs (1-8); plan always uses 1"
        required: false
        default: "1"
      datasets:
        description: "eurostat_landing: optional dataset codes/globs, comma separated"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: zohelo-r2-ingestion-${{ inputs.operation == 'eurostat_landing' && 'eurostat' || inputs.source || 'smoke' }}
  cancel-in-progress: false

jobs:
  run:
    if: inputs.operation != 'eurostat_landing'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
      R2_LANDING_BUCKET: ${{ vars.R2_LANDING_BUCKET }}
      R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
      GUS_BDL_API_KEY: ${{ secrets.GUS_BDL_API_KEY }}
      GUS_DBW_API_KEY: ${{ secrets.GUS_DBW_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install ingestion dependencies
        run: python -m pip install boto3 pyyaml requests
      - name: Verify R2 ingestion backends
        if: inputs.operation == 'smoke'
        run: |
          set -euo pipefail
          python scripts/r2-campaign-store-smoke.py
          python scripts/r2-bulk-store-smoke.py
      - name: Run standard source campaign into R2
        if: inputs.operation == 'campaign'
        env:
          SOURCE: ${{ inputs.source }}
          CYCLES: ${{ inputs.cycles }}
          SESSION_SECONDS: ${{ inputs.session_seconds }}
        run: |
          set -euo pipefail
          case "$CYCLES" in
            1|2|3|4|5|6) ;;
            *) echo "cycles must be 1-6" >&2; exit 2 ;;
          esac
          case "$SESSION_SECONDS" in
            ''|*[!0-9]*) echo "session_seconds must be numeric" >&2; exit 2 ;;
          esac
          if [ "$SESSION_SECONDS" -lt 60 ] || [ "$SESSION_SECONDS" -gt 1800 ]; then
            echo "session_seconds must be 60-1800" >&2
            exit 2
          fi
          python src/source_campaign.py             --backend r2             --source "$SOURCE"             --allow-production-write             --cycles "$CYCLES"             --session-seconds "$SESSION_SECONDS"
      - name: Run full-distribution source campaign into R2
        if: inputs.operation == 'bulk'
        env:
          SOURCE: ${{ inputs.source }}
          SESSION_SECONDS: ${{ inputs.session_seconds }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: |
          set -euo pipefail
          case "$SOURCE" in
            world_bank_wdi|eurostat) ;;
            *) echo "bulk operation currently supports world_bank_wdi or eurostat" >&2; exit 2 ;;
          esac
          case "$SESSION_SECONDS" in
            ''|*[!0-9]*) echo "session_seconds must be numeric" >&2; exit 2 ;;
          esac
          case "$MAX_REQUESTS" in
            ''|*[!0-9]*) echo "max_requests must be numeric" >&2; exit 2 ;;
          esac
          if [ "$SESSION_SECONDS" -lt 60 ] || [ "$SESSION_SECONDS" -gt 2400 ]; then
            echo "session_seconds must be 60-2400" >&2
            exit 2
          fi
          if [ "$MAX_REQUESTS" -lt 1 ] || [ "$MAX_REQUESTS" -gt 100 ]; then
            echo "max_requests must be 1-100" >&2
            exit 2
          fi
          python src/full_source_campaign.py             --source "$SOURCE"             --allow-production-write             --session-seconds "$SESSION_SECONDS"             --max-requests "$MAX_REQUESTS"

  eurostat_landing_setup:
    if: inputs.operation == 'eurostat_landing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.validate.outputs.shards }}
      matrix: ${{ steps.validate.outputs.matrix }}
    steps:
      - name: Validate inputs
        id: validate
        env:
          MODE: ${{ inputs.landing_mode }}
          LIMIT: ${{ inputs.limit }}
          WORKERS: ${{ inputs.workers }}
          SHARDS: ${{ inputs.shards }}
          DATASETS: ${{ inputs.datasets }}
        run: |
          set -euo pipefail
          case "$MODE" in plan|ingest) ;; *) echo "landing_mode must be plan or ingest" >&2; exit 2 ;; esac
          case "$LIMIT" in ''|*[!0-9]*) echo "limit must be a non-negative integer" >&2; exit 2 ;; esac
          case "$WORKERS" in 1|2|3|4|5|6|7|8) ;; *) echo "workers must be 1-8" >&2; exit 2 ;; esac
          case "$SHARDS" in 1|2|3|4|5|6|7|8) ;; *) echo "shards must be 1-8" >&2; exit 2 ;; esac
          if [ -n "$DATASETS" ] && ! printf '%s' "$DATASETS" | grep -Eq '^[A-Za-z0-9_.$*?, -]*$'; then
            echo "datasets may contain only dataset codes, globs, commas and spaces" >&2; exit 2
          fi
          if [ "$MODE" = plan ]; then SHARDS=1; fi
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$SHARDS")" >> "$GITHUB_OUTPUT"

  eurostat_landing:
    needs: eurostat_landing_setup
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.eurostat_landing_setup.outputs.matrix) }}
    name: eurostat_landing ${{ inputs.landing_mode }} shard ${{ matrix.shard }}
    env:
      PYTHONPATH: src
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
      R2_LANDING_BUCKET: ${{ vars.R2_LANDING_BUCKET }}
      R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: python -m pip install boto3 requests
      - name: Eurostat bulk to Landing
        env:
          MODE: ${{ inputs.landing_mode }}
          LIMIT: ${{ inputs.limit }}
          WORKERS: ${{ inputs.workers }}
          SHARDS: ${{ needs.eurostat_landing_setup.outputs.shards }}
          SHARD: ${{ matrix.shard }}
          DATASETS: ${{ inputs.datasets }}
        run: |
          set -euo pipefail
          args=(--mode "$MODE" --limit "$LIMIT" --workers "$WORKERS"
                --shard "$SHARD" --shards "$SHARDS" --datasets "$DATASETS"
                --budget-minutes 330 --grace-minutes 20)
          if [ "$MODE" = ingest ]; then args+=(--allow-production-write); fi
          python src/eurostat_bulk_landing.py "${args[@]}"
