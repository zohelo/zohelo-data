name: 1 · Ingest → Landing

# Naming: operations are "<source>: <action>"; "platform:" when not tied to one source.
# Only currently authorized operations are listed. The paused API-incremental and
# full-file extracts (ingestion/run_api_campaign.py, ingestion/run_full_file_campaign.py) stay in
# the repo and get an operation here again when the owner resumes them.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation
        required: true
        type: choice
        default: "eurostat: coverage check (dry run)"
        options:
          - "platform: R2 connectivity check"
          - "eurostat: coverage check (dry run)"
          - "eurostat: load new versions to Landing"
      max_datasets:
        description: "eurostat load: max datasets per parallel job (0 = all)"
        required: false
        default: "0"
      parallel_downloads:
        description: "eurostat: concurrent downloads per job (1-8)"
        required: false
        default: "4"
      parallel_jobs:
        description: "eurostat load: parallel jobs, each a fixed hash slice of datasets (1-8)"
        required: false
        default: "1"
      dataset_filter:
        description: "eurostat: optional dataset codes or globs, comma separated (e.g. nama_10_*)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: zohelo-ingest-${{ startsWith(inputs.operation, 'eurostat:') && 'eurostat' || 'platform' }}
  cancel-in-progress: false

jobs:
  platform-r2-check:
    if: "inputs.operation == 'platform: R2 connectivity check'"
    name: "platform: R2 connectivity check"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
      R2_LANDING_BUCKET: ${{ vars.R2_LANDING_BUCKET }}
      R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: python -m pip install boto3 pyyaml requests
      - name: Write, read back and remove test objects in R2
        run: |
          set -euo pipefail
          python checks/r2_campaign_store_check.py
          python checks/r2_bulk_store_check.py

  eurostat-setup:
    if: startsWith(inputs.operation, 'eurostat:')
    name: "eurostat: validate inputs"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.validate.outputs.mode }}
      jobs: ${{ steps.validate.outputs.jobs }}
      matrix: ${{ steps.validate.outputs.matrix }}
    steps:
      - name: Validate inputs
        id: validate
        env:
          OPERATION: ${{ inputs.operation }}
          MAX_DATASETS: ${{ inputs.max_datasets }}
          PARALLEL_DOWNLOADS: ${{ inputs.parallel_downloads }}
          PARALLEL_JOBS: ${{ inputs.parallel_jobs }}
          DATASET_FILTER: ${{ inputs.dataset_filter }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            "eurostat: coverage check (dry run)") MODE=coverage-check; PARALLEL_JOBS=1 ;;
            "eurostat: load new versions to Landing") MODE=load ;;
            *) echo "unknown operation: $OPERATION" >&2; exit 2 ;;
          esac
          case "$MAX_DATASETS" in ''|*[!0-9]*) echo "max_datasets must be a non-negative integer" >&2; exit 2 ;; esac
          case "$PARALLEL_DOWNLOADS" in 1|2|3|4|5|6|7|8) ;; *) echo "parallel_downloads must be 1-8" >&2; exit 2 ;; esac
          case "$PARALLEL_JOBS" in 1|2|3|4|5|6|7|8) ;; *) echo "parallel_jobs must be 1-8" >&2; exit 2 ;; esac
          if [ -n "$DATASET_FILTER" ] && ! printf '%s' "$DATASET_FILTER" | grep -Eq '^[A-Za-z0-9_.$*?, -]*$'; then
            echo "dataset_filter may contain only dataset codes, globs, commas and spaces" >&2; exit 2
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "jobs=$PARALLEL_JOBS" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$PARALLEL_JOBS")" >> "$GITHUB_OUTPUT"

  eurostat:
    needs: eurostat-setup
    name: "${{ inputs.operation }} · job ${{ matrix.job }}"
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.eurostat-setup.outputs.matrix) }}
    env:
      PYTHONPATH: .
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
      R2_LANDING_BUCKET: ${{ vars.R2_LANDING_BUCKET }}
      R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: python -m pip install boto3 requests
      - name: ${{ inputs.operation }}
        env:
          MODE: ${{ needs.eurostat-setup.outputs.mode }}
          JOBS: ${{ needs.eurostat-setup.outputs.jobs }}
          JOB: ${{ matrix.job }}
          MAX_DATASETS: ${{ inputs.max_datasets }}
          PARALLEL_DOWNLOADS: ${{ inputs.parallel_downloads }}
          DATASET_FILTER: ${{ inputs.dataset_filter }}
        run: |
          set -euo pipefail
          args=(--mode "$MODE" --max-datasets "$MAX_DATASETS"
                --parallel-downloads "$PARALLEL_DOWNLOADS"
                --job-index "$JOB" --parallel-jobs "$JOBS"
                --dataset-filter "$DATASET_FILTER"
                --budget-minutes 330 --grace-minutes 20)
          if [ "$MODE" = load ]; then args+=(--allow-production-write); fi
          python ingestion/eurostat/bulk_landing.py "${args[@]}"
