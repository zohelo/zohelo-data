name: Pipeline

# The fixed dataflow: one job per activity, in dataflow order. A run is a source plus
# a run type; run.py turns it into the list of activities and refuses any
# activity that is not implemented or not authorized in ingestion/sources/<source>.yaml.
# This file changes only when the dataflow changes. Ad-hoc work goes to ops.yml.
# Scheduled twice an hour (run.py schedule dispatches the declared runs that are due) and by manual dispatch.
# GitHub drops many schedule events (#802), so the scheduler can also be started by a dispatch with
# run "scheduler: dispatch due runs" (any source); both kinds share one catch-up window.
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Pipeline · {0} · {1}', inputs.source, inputs.run) || 'Pipeline' }}"

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Source (ingestion/sources/<source>.yaml); platform for silver/gold and serving
        required: true
        type: choice
        default: eurostat
        options: [eurostat, gus_bdl, gus_dbw, world_bank_wdi, opendata_org, nbp, gleif, mf_biala_lista, gugik_prg, gus_teryt, platform]
      run:
        description: Run
        required: true
        type: choice
        default: "landing: inspect"
        options:
          - "landing: inspect"
          - "landing: extract"
          - "landing: verify"
          - "bronze: load"
          - "bronze: verify"
          - "archive: move Bronze-loaded Landing"
          - "archive: apply retention"
          - "full dataflow: landing → bronze → silver → gold → portal"
          - "silver/gold: build models"
          - "gold: publish"
          - "serving: refresh portal index"
          - "scheduler: dispatch due runs"
      filter:
        description: "Optional item filter: dataset codes or globs, comma separated (e.g. nama_10_*)"
        required: false
        default: ""
      max_items:
        description: "landing extract: max items per parallel job (0 = all)"
        required: false
        default: "0"
      parallel_jobs:
        description: "landing extract: parallel jobs, each a fixed hash slice of items (1-8)"
        required: false
        default: "1"
      parallel_downloads:
        description: "landing extract: concurrent downloads per job (1-8)"
        required: false
        default: "4"

permissions:
  contents: read

concurrency:
  # One writer per source; read-only runs get their own group and never wait behind it.
  group: "zohelo-pipeline-${{ (github.event_name == 'schedule' || inputs.run == 'scheduler: dispatch due runs') && 'scheduler' || inputs.source }}${{ (inputs.run == 'landing: inspect' || inputs.run == 'landing: verify' || inputs.run == 'bronze: verify') && '-read' || '' }}"
  cancel-in-progress: false

env:
  # zohelo organisation credentials, under the same names in the code.
  PLATFORM_ACCOUNT_ID: ${{ vars.PLATFORM_ACCOUNT_ID }}
  STORAGE_LAKEHOUSE_CATALOG_WRITE_TOKEN: ${{ secrets.STORAGE_LAKEHOUSE_CATALOG_WRITE_TOKEN }}
  STORAGE_LAKEHOUSE_CATALOG_URL: ${{ vars.STORAGE_LAKEHOUSE_CATALOG_URL }}
  STORAGE_LAKEHOUSE_CATALOG_NAME: ${{ vars.STORAGE_LAKEHOUSE_CATALOG_NAME }}
  STORAGE_WRITE_ACCESS_KEY: ${{ secrets.STORAGE_WRITE_ACCESS_KEY }}
  STORAGE_WRITE_SECRET_KEY: ${{ secrets.STORAGE_WRITE_SECRET_KEY }}
  STORAGE_ENDPOINT_URL: ${{ vars.STORAGE_ENDPOINT_URL }}
  STORAGE_LANDING_BUCKET_NAME: ${{ vars.STORAGE_LANDING_BUCKET_NAME }}
  STORAGE_LAKEHOUSE_BUCKET_NAME: ${{ vars.STORAGE_LAKEHOUSE_BUCKET_NAME }}
  SOURCE_GUS_BDL_API_KEY: ${{ secrets.SOURCE_GUS_BDL_API_KEY }}
  SOURCE_GUS_BDL_WEB_LOGIN: ${{ secrets.SOURCE_GUS_BDL_WEB_LOGIN }}
  SOURCE_GUS_BDL_WEB_PASSWORD: ${{ secrets.SOURCE_GUS_BDL_WEB_PASSWORD }}

jobs:
  scheduler:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run == 'scheduler: dispatch due runs')
    name: scheduler
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
      - name: Dispatch due runs
        env:
          PYTHONPATH: .
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --quiet --require-hashes -r requirements.txt
          python run.py schedule
  plan:
    # Production data runs only from main; experiments use Dev · branch runs.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.run != 'scheduler: dispatch due runs'
    name: "plan · ${{ inputs.source }} · ${{ inputs.run }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      activities: ${{ steps.plan.outputs.activities }}
      extract_matrix: ${{ steps.plan.outputs.extract_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
      - name: Plan activities
        id: plan
        env:
          PYTHONPATH: .
          SOURCE: ${{ inputs.source }}
          RUN: ${{ inputs.run }}
          FILTER: ${{ inputs.filter }}
          MAX_ITEMS: ${{ inputs.max_items }}
          PARALLEL_JOBS: ${{ inputs.parallel_jobs }}
          PARALLEL_DOWNLOADS: ${{ inputs.parallel_downloads }}
        run: |
          set -euo pipefail
          case "$MAX_ITEMS" in ''|*[!0-9]*) echo "max_items must be a non-negative integer" >&2; exit 2 ;; esac
          case "$PARALLEL_DOWNLOADS" in 1|2|3|4|5|6|7|8) ;; *) echo "parallel_downloads must be 1-8" >&2; exit 2 ;; esac
          case "$PARALLEL_JOBS" in 1|2|3|4|5|6|7|8) ;; *) echo "parallel_jobs must be 1-8" >&2; exit 2 ;; esac
          if [ -n "$FILTER" ] && ! printf '%s' "$FILTER" | grep -Eq '^[A-Za-z0-9_.$*?, -]*$'; then
            echo "filter may contain only codes, globs, commas and spaces" >&2; exit 2
          fi
          python -m pip install --quiet --require-hashes -r requirements.txt
          plan="$(python run.py plan --source "$SOURCE" --run "$RUN" --parallel-jobs "$PARALLEL_JOBS")"
          echo "$plan"
          echo "activities=$(jq -c .activities <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "extract_matrix=$(jq -c .extract_matrix <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "::notice title=pipeline plan::$(jq -c '{source: env.SOURCE, run: env.RUN, activities}' <<<"$plan")"

  landing-inspect:
    needs: [plan]
    if: "${{ !cancelled() && !failure() && contains(fromJSON(needs.plan.outputs.activities), 'landing.inspect') }}"
    name: landing.inspect
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/activity
        with:
          source: ${{ inputs.source }}
          activity: landing.inspect
          filter: ${{ inputs.filter }}

  landing-extract:
    needs: [plan, landing-inspect]
    if: "${{ !cancelled() && !failure() && contains(fromJSON(needs.plan.outputs.activities), 'landing.extract') }}"
    name: "landing.extract · job ${{ matrix.job }}"
    # A failed extract job must not keep the files that did land (and are verified) out of
    # Bronze: one crashed shard of a parallel BDL run skipped every load (run 40005861636).
    # The failure still alerts: notify checks the run's job conclusions.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.extract_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/activity
        with:
          source: ${{ inputs.source }}
          activity: landing.extract
          filter: ${{ inputs.filter }}
          max-items: ${{ inputs.max_items }}
          parallel-jobs: ${{ inputs.parallel_jobs }}
          job-index: ${{ matrix.job }}
          parallel-downloads: ${{ inputs.parallel_downloads }}
          budget-minutes: "330"

  landing-verify:
    needs: [plan, landing-extract]
    if: "${{ !cancelled() && !failure() && contains(fromJSON(needs.plan.outputs.activities), 'landing.verify') }}"
    name: landing.verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/activity
        with:
          source: ${{ inputs.source }}
          activity: landing.verify
          filter: ${{ inputs.filter }}

  bronze-load:
    needs: [plan, landing-verify]
    if: "${{ !cancelled() && !failure() && contains(fromJSON(needs.plan.outputs.activities), 'bronze.load') }}"
    name: bronze.load
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/activity
        with:
          source: ${{ inputs.source }}
          activity: bronze.load
          budget-minutes: "300"

  bronze-verify:
    needs: [plan, bronze-load]
    if: "${{ !cancelled() && !failure() && contains(fromJSON(needs.plan.outputs.activities), 'bronze.verify') }}"
    name: bronze.verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/activity
        with:
          source: ${{ inputs.source }}
          activity: bronze.verify

  landing-archive:
    needs: [plan, bronze-verify]
    if: "${{ !cancelled() && !failure() && contains(fromJSON(needs.plan.outputs.activities), 'landing.archive') }}"
    name: landing.archive
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/activity
        with:
          source: ${{ inputs.source }}
          activity: landing.archive

  archive-prune:
    needs: [plan, landing-archive]
    if: "${{ !cancelled() && !failure() && contains(fromJSON(needs.plan.outputs.activities), 'archive.prune') }}"
    name: archive.prune
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/activity
        with:
          source: ${{ inputs.source }}
          activity: archive.prune

  silver-gold-build:
    needs: [plan, archive-prune]
    if: "${{ !cancelled() && !failure() && contains(fromJSON(needs.plan.outputs.activities), 'silver_gold.build') }}"
    name: silver_gold.build
    # One model build at a time across all sources (each source's full dataflow ends with one, #878).
    # A newer queued build replaces an older queued one; the changed-only build still sees every change.
    concurrency:
      group: zohelo-pipeline-build
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/activity
        with:
          source: ${{ inputs.source }}
          activity: silver_gold.build
          filter: ${{ inputs.filter }}

  gold-publish:
    needs: [plan, silver-gold-build]
    if: "${{ !cancelled() && !failure() && contains(fromJSON(needs.plan.outputs.activities), 'gold.publish') }}"
    name: gold.publish
    # warehouse/publish.py is the only writer of 06_published/v1/ (docs/published.md): one at a time; a newer
    # queued publish replaces an older queued one (cancelled by design, not an alert).
    concurrency:
      group: zohelo-pipeline-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The newest main, not the run's start commit (#2201, PR #2202).
          ref: main
      - uses: ./.github/actions/activity
        with:
          source: ${{ inputs.source }}
          activity: gold.publish

  serving-refresh-index:
    needs: [plan, gold-publish]
    if: "${{ !cancelled() && !failure() && contains(fromJSON(needs.plan.outputs.activities), 'serving.refresh_index') }}"
    name: serving.refresh_index
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/activity
        with:
          source: ${{ inputs.source }}
          activity: serving.refresh_index

  notify:
    # A failed or cancelled run opens (or comments on) an `alert` issue, so the owner gets an
    # e-mail. Cancelled counts: a job killed from outside (exit 143) ends as cancelled.
    needs: [scheduler, plan, landing-inspect, landing-extract, landing-verify, bronze-load, bronze-verify,
            landing-archive, archive-prune, silver-gold-build, gold-publish, serving-refresh-index]
    # A model build replaced in its queue by a newer one (concurrency zohelo-pipeline-build) ends as
    # cancelled by design and is not an alert; a failed build is (#878 review).
    if: >-
      always() && (
      failure() ||
      needs.silver-gold-build.result == 'failure' ||
      (needs.plan.result == 'success' && contains(needs.plan.outputs.activities, 'landing.extract')) ||
      needs.scheduler.result == 'cancelled' ||
      needs.plan.result == 'cancelled' ||
      needs.landing-inspect.result == 'cancelled' ||
      needs.landing-extract.result == 'cancelled' ||
      needs.landing-verify.result == 'cancelled' ||
      needs.bronze-load.result == 'cancelled' ||
      needs.bronze-verify.result == 'cancelled' ||
      needs.landing-archive.result == 'cancelled' ||
      needs.archive-prune.result == 'cancelled' ||
      needs.serving-refresh-index.result == 'cancelled')
    name: notify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    # Least privilege: this job only needs github.token, so it blanks the workflow-level secrets.
    env:
      STORAGE_LAKEHOUSE_CATALOG_WRITE_TOKEN: ""
      STORAGE_WRITE_ACCESS_KEY: ""
      STORAGE_WRITE_SECRET_KEY: ""
      SOURCE_GUS_BDL_API_KEY: ""
      SOURCE_GUS_BDL_WEB_LOGIN: ""
      SOURCE_GUS_BDL_WEB_PASSWORD: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
      - name: Open or update the alert issue
        env:
          PYTHONPATH: .
          GITHUB_TOKEN: ${{ github.token }}
          RUN_SOURCE: ${{ inputs.source }}
          RUN_NAME: ${{ inputs.run }}
        run: |
          python -m pip install --quiet --require-hashes -r requirements.txt
          python -m ops.notify_failure --check-jobs
