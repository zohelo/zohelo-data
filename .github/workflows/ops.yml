name: Ops · ad-hoc

# Standing operational tasks from ops/: defined scripts the owner may run again from
# time to time (inventories, checks). Not part of the dataflow, not for experiments
# (those use Dev · branch runs). Runs only from main. Manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script name in ops/ without .py (e.g. platform_inventory)"
        required: true
      args:
        description: "Optional arguments, space separated (no shell expansion)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: zohelo-ops-${{ inputs.script }}
  cancel-in-progress: false

jobs:
  ops:
    if: github.ref == 'refs/heads/main'
    name: "ops · ${{ inputs.script }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONPATH: .
      OPS_OUTPUT_DIR: /tmp/ops-output
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
      R2_CATALOG_URI: ${{ vars.R2_CATALOG_URI }}
      R2_WAREHOUSE: ${{ vars.R2_WAREHOUSE }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
      R2_LANDING_BUCKET: ${{ vars.R2_LANDING_BUCKET }}
      R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # Token of the zohelo-automation GitHub App for the Projects board (ops/project.py).
      - name: Project token
        id: project
        if: inputs.script == 'project'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - name: "ops/${{ inputs.script }}.py"
        env:
          GH_PROJECT_TOKEN: ${{ steps.project.outputs.token }}
          SCRIPT: ${{ inputs.script }}
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SCRIPT" | grep -Eq '^[a-z0-9_]+$' || [ ! -f "ops/$SCRIPT.py" ]; then
            echo "no such ops script: $SCRIPT (available: $(cd ops && ls *.py | grep -v '^_' | sed 's/\.py$//' | tr '\n' ' '))" >&2
            exit 2
          fi
          mkdir -p "$OPS_OUTPUT_DIR"
          read -ra argv <<< "$ARGS"
          python -m "ops.$SCRIPT" "${argv[@]}"
      - name: Keep script output files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ops-${{ inputs.script }}-${{ github.run_id }}
          path: /tmp/ops-output
          if-no-files-found: ignore
          retention-days: 7
