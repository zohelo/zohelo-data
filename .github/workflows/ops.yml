name: Ops · ad-hoc

# Standing operational tasks from ops/: defined scripts the owner may run again from
# time to time (inventories, checks). Not part of the dataflow, not for experiments
# (those use Dev · branch runs). Runs only from main. Manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script name in ops/ without .py (e.g. platform_inventory)"
        required: true
      args:
        description: "Optional arguments, space separated (no shell expansion)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: zohelo-ops-${{ inputs.script }}
  cancel-in-progress: false

jobs:
  ops:
    if: github.ref == 'refs/heads/main' && inputs.script != 'branch_cleanup'
    name: "ops · ${{ inputs.script }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONPATH: .
      OPS_OUTPUT_DIR: /tmp/ops-output
      # zohelo organisation credentials, under the same names in the code.
      PLATFORM_ACCOUNT_ID: ${{ vars.PLATFORM_ACCOUNT_ID }}
      STORAGE_LAKEHOUSE_CATALOG_WRITE_TOKEN: ${{ secrets.STORAGE_LAKEHOUSE_CATALOG_WRITE_TOKEN }}
      STORAGE_LAKEHOUSE_CATALOG_URL: ${{ vars.STORAGE_LAKEHOUSE_CATALOG_URL }}
      STORAGE_LAKEHOUSE_CATALOG_NAME: ${{ vars.STORAGE_LAKEHOUSE_CATALOG_NAME }}
      STORAGE_WRITE_ACCESS_KEY: ${{ secrets.STORAGE_WRITE_ACCESS_KEY }}
      STORAGE_WRITE_SECRET_KEY: ${{ secrets.STORAGE_WRITE_SECRET_KEY }}
      STORAGE_ENDPOINT_URL: ${{ vars.STORAGE_ENDPOINT_URL }}
      STORAGE_LANDING_BUCKET_NAME: ${{ vars.STORAGE_LANDING_BUCKET_NAME }}
      STORAGE_LAKEHOUSE_BUCKET_NAME: ${{ vars.STORAGE_LAKEHOUSE_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: inputs.script == 'scheduler_trigger'
        with:
          node-version-file: .node-version
      # Token of the zohelo-automation GitHub App for the Projects board (ops/project.py).
      - name: Project token
        id: project
        if: inputs.script == 'project' || inputs.script == 'tracker' || inputs.script == 'backlog_sync'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.ORG_BOT_CLIENT_ID }}  # the app's Client ID (organisation variable)
          private-key: ${{ secrets.ORG_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # this repository only; backlog_sync plans and syncs the issues of all three repositories
          repositories: ${{ inputs.script == 'backlog_sync' && 'zohelo-data,zohelo-bi,zohelo' || github.event.repository.name }}
          # write only for the modes that change the board
          permission-organization-projects: ${{ (startsWith(inputs.args, 'status') || (inputs.script == 'backlog_sync' && startsWith(inputs.args, 'apply'))) && 'write' || 'read' }}
          # project: reads the Work log comment; tracker: replaces the tracker issue's body;
          # backlog_sync: reads the issues for plan, writes them for apply
          permission-issues: ${{ (inputs.script == 'tracker' || (inputs.script == 'backlog_sync' && startsWith(inputs.args, 'apply'))) && 'write' || 'read' }}
          permission-contents: read  # backlog_sync: checkout of zohelo-bi and zohelo
          permission-actions: read  # tracker: the latest Silver/Gold build
      # backlog_sync reads .github/backlog of the other two repositories (ops/backlog_sync.py, _repos/*).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: inputs.script == 'backlog_sync'
        with:
          repository: zohelo/zohelo-bi
          ref: main
          path: _repos/zohelo-bi
          token: ${{ steps.project.outputs.token }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: inputs.script == 'backlog_sync'
        with:
          repository: zohelo/zohelo
          ref: main
          path: _repos/zohelo
          token: ${{ steps.project.outputs.token }}
          persist-credentials: false
      - name: "ops/${{ inputs.script }}.py"
        env:
          GH_PROJECT_TOKEN: ${{ steps.project.outputs.token }}
          # The Workers deploy token, for scheduler_trigger and check_credentials only (blank for other scripts).
          PLATFORM_DEPLOY_TOKEN: ${{ (inputs.script == 'scheduler_trigger' || inputs.script == 'check_credentials') && secrets.PLATFORM_DEPLOY_TOKEN || '' }}
          # Credentials that check_credentials probes (blank for other scripts).
          STORAGE_LAKEHOUSE_READ_ACCESS_KEY: ${{ inputs.script == 'check_credentials' && secrets.STORAGE_LAKEHOUSE_READ_ACCESS_KEY || '' }}
          STORAGE_LAKEHOUSE_READ_SECRET_KEY: ${{ inputs.script == 'check_credentials' && secrets.STORAGE_LAKEHOUSE_READ_SECRET_KEY || '' }}
          STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN: ${{ inputs.script == 'check_credentials' && secrets.STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN || '' }}
          SOURCE_GUS_BDL_API_KEY: ${{ inputs.script == 'check_credentials' && secrets.SOURCE_GUS_BDL_API_KEY || '' }}
          # The org bot app credentials the scheduler Worker dispatches with (scheduler_trigger deploy only).
          ORG_BOT_CLIENT_ID: ${{ inputs.script == 'scheduler_trigger' && vars.ORG_BOT_CLIENT_ID || '' }}
          ORG_BOT_PRIVATE_KEY: ${{ inputs.script == 'scheduler_trigger' && secrets.ORG_BOT_PRIVATE_KEY || '' }}
          SCRIPT: ${{ inputs.script }}
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SCRIPT" | grep -Eq '^[a-z0-9_]+$' || [ ! -f "ops/$SCRIPT.py" ]; then
            echo "no such ops script: $SCRIPT (available: $(cd ops && ls *.py | grep -v '^_' | sed 's/\.py$//' | tr '\n' ' '))" >&2
            exit 2
          fi
          mkdir -p "$OPS_OUTPUT_DIR"
          # Phones turn "--" into a long dash: accept — and – as "--" so a run typed on a phone works.
          ARGS="${ARGS//—/--}"
          ARGS="${ARGS//–/--}"
          safe=${ARGS//'%'/%25}; safe=${safe//$'\r'/}; safe=${safe//$'\n'/ }  # no workflow commands via args
          echo "::notice title=ops arguments::${SCRIPT} ${safe}"
          read -ra argv <<< "$ARGS"
          status=0
          python -m "ops.$SCRIPT" "${argv[@]}" || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::error title=ops arguments not accepted::${SCRIPT} ${safe} (see the script's options)"
          fi
          exit "$status"
      - name: Keep script output files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ops-${{ inputs.script }}-${{ github.run_id }}
          path: /tmp/ops-output
          if-no-files-found: ignore
          retention-days: 7

  # The only Ops task that writes to the repository: it deletes leftover work branches
  # (ops/branch_cleanup.py; owner approval 24 Oct 2026), so it alone gets contents: write.
  branch-cleanup:
    if: github.ref == 'refs/heads/main' && inputs.script == 'branch_cleanup'
    name: "ops · branch_cleanup"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
      - name: ops/branch_cleanup.py
        env:
          PYTHONPATH: .
          GITHUB_TOKEN: ${{ github.token }}
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --require-hashes -r requirements.txt
          ARGS="${ARGS//—/--}"
          ARGS="${ARGS//–/--}"
          read -ra argv <<< "$ARGS"
          python -m ops.branch_cleanup "${argv[@]}"
