name: Ops · ad-hoc

# Ad-hoc, check, inspection and one-off scripts from ops/. Runs exactly one script
# with the R2 credentials. Nothing here is part of the dataflow; the Pipeline
# workflow never changes for ad-hoc work. Delete a script from ops/ when it is no
# longer needed. Manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script name in ops/ without .py (e.g. inspect_retained_inputs)"
        required: true
      args:
        description: "Optional arguments, space separated (no shell expansion)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: zohelo-ops-${{ inputs.script }}
  cancel-in-progress: false

jobs:
  ops:
    name: "ops · ${{ inputs.script }}"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: .
      OPS_OUTPUT_DIR: /tmp/ops-output
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
      R2_CATALOG_URI: ${{ vars.R2_CATALOG_URI }}
      R2_WAREHOUSE: ${{ vars.R2_WAREHOUSE }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
      R2_LANDING_BUCKET: ${{ vars.R2_LANDING_BUCKET }}
      R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: "ops/${{ inputs.script }}.py"
        env:
          SCRIPT: ${{ inputs.script }}
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SCRIPT" | grep -Eq '^[a-z0-9_]+$' || [ ! -f "ops/$SCRIPT.py" ]; then
            echo "no such ops script: $SCRIPT (available: $(cd ops && ls *.py | grep -v '^_' | sed 's/\.py$//' | tr '\n' ' '))" >&2
            exit 2
          fi
          mkdir -p "$OPS_OUTPUT_DIR"
          read -ra argv <<< "$ARGS"
          python -m "ops.$SCRIPT" "${argv[@]}"
      - name: Keep script output files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ops-${{ inputs.script }}-${{ github.run_id }}
          path: /tmp/ops-output
          if-no-files-found: ignore
          retention-days: 7
