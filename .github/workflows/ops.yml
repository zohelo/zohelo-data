name: Ops · ad-hoc

# Standing operational tasks from ops/: defined scripts the owner may run again from
# time to time (inventories, checks). Not part of the dataflow, not for experiments
# (those use Dev · branch runs). Runs only from main. Manual dispatch, plus the schedule table
# in the resolve job (ops/README.md).

on:
  schedule:
    - cron: '20 5 * * 1'
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      script:
        description: "Script name in ops/ without .py (e.g. platform_inventory)"
        required: true
      args:
        description: "Optional arguments, space separated (no shell expansion)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: zohelo-ops-${{ inputs.script || github.event.schedule }}
  cancel-in-progress: false

jobs:
  # Which script and arguments this run executes: the dispatch inputs, or the row of the
  # schedule table for the cron that fired.
  resolve:
    name: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      script: ${{ steps.pick.outputs.script }}
      args: ${{ steps.pick.outputs.args }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INPUT_SCRIPT: ${{ inputs.script }}
          INPUT_ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            script=$INPUT_SCRIPT
            args=$INPUT_ARGS
          else
            # Schedule table: one row per cron; add a cron under on.schedule and a row here.
            case "$CRON" in
              '20 5 * * 1') script=orphan_files; args='--delete --min-age-hours 48' ;;
              '0 5 * * 1') script=backlog_sync; args='apply' ;;
              *) echo "::error title=ops schedule::no schedule table row for cron '$CRON'" >&2; exit 1 ;;
            esac
          fi
          args=${args//$'\r'/}
          args=${args//$'\n'/ }
          echo "script=$script" >> "$GITHUB_OUTPUT"
          echo "args=$args" >> "$GITHUB_OUTPUT"

  ops:
    needs: resolve
    if: github.ref == 'refs/heads/main' && needs.resolve.outputs.script != 'branch_cleanup'
    name: "ops · ${{ needs.resolve.outputs.script }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONPATH: .
      OPS_OUTPUT_DIR: /tmp/ops-output
      # zohelo organisation credentials, under the same names in the code.
      PLATFORM_ACCOUNT_ID: ${{ vars.PLATFORM_ACCOUNT_ID }}
      STORAGE_LAKEHOUSE_CATALOG_WRITE_TOKEN: ${{ secrets.STORAGE_LAKEHOUSE_CATALOG_WRITE_TOKEN }}
      STORAGE_LAKEHOUSE_CATALOG_URL: ${{ vars.STORAGE_LAKEHOUSE_CATALOG_URL }}
      STORAGE_LAKEHOUSE_CATALOG_NAME: ${{ vars.STORAGE_LAKEHOUSE_CATALOG_NAME }}
      STORAGE_WRITE_ACCESS_KEY: ${{ secrets.STORAGE_WRITE_ACCESS_KEY }}
      STORAGE_WRITE_SECRET_KEY: ${{ secrets.STORAGE_WRITE_SECRET_KEY }}
      STORAGE_ENDPOINT_URL: ${{ vars.STORAGE_ENDPOINT_URL }}
      STORAGE_LANDING_BUCKET_NAME: ${{ vars.STORAGE_LANDING_BUCKET_NAME }}
      STORAGE_LAKEHOUSE_BUCKET_NAME: ${{ vars.STORAGE_LAKEHOUSE_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: needs.resolve.outputs.script == 'scheduler_trigger' || needs.resolve.outputs.script == 'check_credentials'
        with:
          node-version-file: .node-version
      # check_credentials: proves the app can mint an installation token (row 'org app').
      - name: App token
        id: app
        if: needs.resolve.outputs.script == 'check_credentials'
        continue-on-error: true  # a failed mint becomes a failed row, the other rows still run
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.ORG_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ORG_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: zohelo-data
          permission-metadata: read
      # Token of the zohelo-automation GitHub App for the Projects board (ops/project.py).
      # project setup creates organisation issue types and project fields. The action has no input for
      # the organisation "Issue types" permission and any permission-* input narrows the token, so this
      # step asks for none: the token carries the app installation's own permissions, for setup only.
      - name: Setup token
        id: setup
        if: needs.resolve.outputs.script == 'project' && startsWith(needs.resolve.outputs.args, 'setup')
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.ORG_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ORG_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Project token
        id: project
        if: (needs.resolve.outputs.script == 'project' && !startsWith(needs.resolve.outputs.args, 'setup')) || needs.resolve.outputs.script == 'tracker' || needs.resolve.outputs.script == 'backlog_sync'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.ORG_BOT_CLIENT_ID }}  # the app's Client ID (organisation variable)
          private-key: ${{ secrets.ORG_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # this repository only; backlog_sync plans and syncs the issues of all three repositories
          repositories: ${{ needs.resolve.outputs.script == 'backlog_sync' && 'zohelo-data,zohelo-bi,zohelo' || github.event.repository.name }}
          # write only for the modes that change the board
          permission-organization-projects: ${{ (startsWith(needs.resolve.outputs.args, 'status') || (needs.resolve.outputs.script == 'backlog_sync' && (startsWith(needs.resolve.outputs.args, 'apply') || contains(needs.resolve.outputs.args, '--apply')))) && 'write' || 'read' }}
          # project: reads the Work log comment; tracker: replaces the tracker issue's body;
          # backlog_sync: reads the issues for plan, writes them for apply
          permission-issues: ${{ (needs.resolve.outputs.script == 'tracker' || (needs.resolve.outputs.script == 'backlog_sync' && (startsWith(needs.resolve.outputs.args, 'apply') || contains(needs.resolve.outputs.args, '--apply')))) && 'write' || 'read' }}
          permission-contents: read  # backlog_sync: checkout of zohelo-bi and zohelo
          permission-actions: read  # tracker: the latest Silver/Gold build
      # backlog_sync reads .github/backlog of the other two repositories (ops/backlog_sync.py, _repos/*).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.resolve.outputs.script == 'backlog_sync'
        with:
          repository: zohelo/zohelo-bi
          ref: main
          path: _repos/zohelo-bi
          token: ${{ steps.project.outputs.token }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.resolve.outputs.script == 'backlog_sync'
        with:
          repository: zohelo/zohelo
          ref: main
          path: _repos/zohelo
          token: ${{ steps.project.outputs.token }}
          persist-credentials: false
      - name: "ops/${{ needs.resolve.outputs.script }}.py"
        env:
          GH_PROJECT_TOKEN: ${{ steps.setup.outputs.token || steps.project.outputs.token }}
          # check_credentials: the app installation token it probes (blank for other scripts).
          APP_TOKEN: ${{ steps.app.outputs.token }}
          # The Workers deploy token, for scheduler_trigger and check_credentials only (blank for other scripts).
          PLATFORM_DEPLOY_TOKEN: ${{ (needs.resolve.outputs.script == 'scheduler_trigger' || needs.resolve.outputs.script == 'check_credentials') && secrets.PLATFORM_DEPLOY_TOKEN || '' }}
          # Credentials that check_credentials probes (blank for other scripts).
          STORAGE_LAKEHOUSE_READ_ACCESS_KEY: ${{ needs.resolve.outputs.script == 'check_credentials' && secrets.STORAGE_LAKEHOUSE_READ_ACCESS_KEY || '' }}
          STORAGE_LAKEHOUSE_READ_SECRET_KEY: ${{ needs.resolve.outputs.script == 'check_credentials' && secrets.STORAGE_LAKEHOUSE_READ_SECRET_KEY || '' }}
          STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN: ${{ needs.resolve.outputs.script == 'check_credentials' && secrets.STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN || '' }}
          SOURCE_GUS_BDL_API_KEY: ${{ needs.resolve.outputs.script == 'check_credentials' && secrets.SOURCE_GUS_BDL_API_KEY || '' }}
          # The org bot app credentials the scheduler Worker dispatches with (scheduler_trigger deploy,
          # and check_credentials, which runs the Worker's token code).
          ORG_BOT_CLIENT_ID: ${{ (needs.resolve.outputs.script == 'scheduler_trigger' || needs.resolve.outputs.script == 'check_credentials') && vars.ORG_BOT_CLIENT_ID || '' }}
          ORG_BOT_PRIVATE_KEY: ${{ (needs.resolve.outputs.script == 'scheduler_trigger' || needs.resolve.outputs.script == 'check_credentials') && secrets.ORG_BOT_PRIVATE_KEY || '' }}
          SCRIPT: ${{ needs.resolve.outputs.script }}
          ARGS: ${{ needs.resolve.outputs.args }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SCRIPT" | grep -Eq '^[a-z0-9_]+$' || [ ! -f "ops/$SCRIPT.py" ]; then
            echo "no such ops script: $SCRIPT (available: $(cd ops && ls *.py | grep -v '^_' | sed 's/\.py$//' | tr '\n' ' '))" >&2
            exit 2
          fi
          mkdir -p "$OPS_OUTPUT_DIR"
          # Phones turn "--" into a long dash: accept — and – as "--" so a run typed on a phone works.
          ARGS="${ARGS//—/--}"
          ARGS="${ARGS//–/--}"
          safe=${ARGS//'%'/%25}; safe=${safe//$'\r'/}; safe=${safe//$'\n'/ }  # no workflow commands via args
          echo "::notice title=ops arguments::${SCRIPT} ${safe}"
          read -ra argv <<< "$ARGS"
          status=0
          python -m "ops.$SCRIPT" "${argv[@]}" || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::error title=ops arguments not accepted::${SCRIPT} ${safe} (see the script's options)"
          fi
          exit "$status"
      - name: Keep script output files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ops-${{ needs.resolve.outputs.script }}-${{ github.run_id }}
          path: /tmp/ops-output
          if-no-files-found: ignore
          retention-days: 7

  # The only Ops task that writes to the repository: it deletes leftover work branches
  # (ops/branch_cleanup.py; owner approval 24 Oct 2026), so it alone gets contents: write.
  branch-cleanup:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.script == 'branch_cleanup'
    name: "ops · branch_cleanup"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
      - name: ops/branch_cleanup.py
        env:
          PYTHONPATH: .
          GITHUB_TOKEN: ${{ github.token }}
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --require-hashes -r requirements.txt
          ARGS="${ARGS//—/--}"
          ARGS="${ARGS//–/--}"
          read -ra argv <<< "$ARGS"
          python -m ops.branch_cleanup "${argv[@]}"
