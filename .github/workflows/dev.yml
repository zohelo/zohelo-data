name: Dev · branch runs

# One-off development runs: trials, tests and checks that need the R2 credentials,
# while working on a feature branch. The script lives in dev/ on that branch and is
# deleted before the branch is merged, so dev/ never exists on main. Never runs on main.
# Writes are allowed only to scratch locations (namespace or prefix starting with
# zz_dev_), removed by the same script, unless the owner approved a one-off change.
#
# Merge gate (docs/flow.md, owner direction 12 Nov 2026: no Actions run on every push). The `check` job
# runs once per pull request, when the orchestrator adds the label `merge:check` to a reviewed, final
# pull request. "Re-run jobs" repeats it on the same commit only (a flaky failure); after a push, remove
# and re-add the label so it runs on the new head. It runs without
# credentials: linked task, compile, lint, configuration consistency, repository rules, dbt parse and a
# secret scan, and it is the only required status check (ruleset "main", context `check`). Agents run
# `python -m ops.repo_check` locally while iterating. A push after the label leaves the new head without
# `check`, so the merge waits until the label is added again.
# Its name depends on the label on purpose: GitHub counts a skipped job as passed, and a job skipped by
# its `if` (another label, a Dev dispatch) must not report the name `check`. A constant name, even
# `${{ 'check' }}`, is reported as `check` when skipped (PR #2841); this expression yields `check` only
# for `merge:check` and is otherwise `gate-skipped` (or left unevaluated), never `check`.
# `check-portal` runs after `check` only when the pull request changes portal/app: install, lint,
# type-check, build and the axe-core accessibility check on the build (portal/app/a11y, the runner
# shared with zohelo and zohelo-bi).

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      script:
        description: "Script name in dev/ on this branch, without .py"
        required: true
      args:
        description: "Optional arguments, space separated (no shell expansion)"
        required: false
        default: ""

permissions:
  contents: read

# Dev trials: one run per branch and script, never cancelled. Merge gate: one run per pull request; a
# newer `merge:check` run cancels the older one, and other labels get a group of their own so they never
# cancel it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('zohelo-gate-pr{0}-{1}', github.event.pull_request.number, github.event.label.name == 'merge:check' && 'check' || github.run_id) || format('zohelo-dev-{0}-{1}-{2}', github.ref_name, inputs.script, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name == 'pull_request' && github.event.label.name == 'merge:check'
    name: ${{ github.event.label.name == 'merge:check' && 'check' || 'gate-skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      portal: ${{ steps.changes.outputs.portal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
      - name: Changes in portal/app
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet "origin/$BASE_REF...HEAD" -- portal/app; then
            echo "portal=false" >> "$GITHUB_OUTPUT"
          else
            echo "portal=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        run: |
          for attempt in 1 2 3; do python -m pip install --require-hashes -r requirements.txt && break; [ "$attempt" = 3 ] && exit 1; sleep $((attempt * 20)); done
          python -m pip install ruff==0.16.8 yamllint==1.38.0
      - name: Linked task
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m ops.backlog_sync pr-check
      - name: Quality rules (docs/quality.md)
        env:
          PYTHONPATH: .
        run: python -m ops.repo_check
      - name: dbt parse
        env:
          STORAGE_LAKEHOUSE_CATALOG_WRITE_TOKEN: check
          STORAGE_WRITE_ACCESS_KEY: check
          STORAGE_WRITE_SECRET_KEY: check
          STORAGE_ENDPOINT_URL: https://check.invalid
          STORAGE_LAKEHOUSE_CATALOG_NAME: check
          STORAGE_LAKEHOUSE_CATALOG_URL: https://check.invalid
        run: cd warehouse && dbt parse --profiles-dir . --target prod --no-partial-parse
      - name: Secret scan (commits of this pull request)
        env:
          GITLEAKS_VERSION: 8.26.0
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          url=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION
          file=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfL -o "$file" "$url/$file"
          curl -sSfL -o checksums.txt "$url/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
          ./gitleaks git --no-banner --redact --log-opts="origin/$BASE_REF..HEAD" .

  check-portal:
    needs: check
    if: needs.check.outputs.portal == 'true'
    name: check-portal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portal/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: portal/app/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        env:
          DUCK_UI_BASEPATH: /
          DUCK_UI_R2_API_BASE: /api
          DUCK_UI_DUCKDB_WASM_CDN_ONLY: "true"
        run: npm run build
      - name: Browser for the accessibility check
        # Playwright's Chromium at the version in package-lock.json (#2499).
        run: npx playwright install --with-deps chromium
      - name: Accessibility (axe-core, 1440 and 390 px)
        # Fails on serious or critical elements not in a11y/a11y-baseline.json and on a page that
        # did not load; counts by rule and page go to the job summary.
        run: node a11y/a11y.mjs --report a11y-report.json
      - name: Accessibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: a11y-report
          path: portal/app/a11y-report.json
          if-no-files-found: ignore

  dev:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    name: "dev · ${{ github.ref_name }} · ${{ inputs.script }}"
    # Trial only (test/refresh-queue, never merged): does a job-level group with `queue: max` keep every waiting job?
    concurrency:
      group: zz-dev-queue-trial
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONPATH: .
      DEV_OUTPUT_DIR: /tmp/dev-output
      # zohelo organisation credentials, under the same names in the code.
      PLATFORM_ACCOUNT_ID: ${{ vars.PLATFORM_ACCOUNT_ID }}
      STORAGE_LAKEHOUSE_CATALOG_WRITE_TOKEN: ${{ secrets.STORAGE_LAKEHOUSE_CATALOG_WRITE_TOKEN }}
      STORAGE_LAKEHOUSE_CATALOG_URL: ${{ vars.STORAGE_LAKEHOUSE_CATALOG_URL }}
      STORAGE_LAKEHOUSE_CATALOG_NAME: ${{ vars.STORAGE_LAKEHOUSE_CATALOG_NAME }}
      STORAGE_WRITE_ACCESS_KEY: ${{ secrets.STORAGE_WRITE_ACCESS_KEY }}
      STORAGE_WRITE_SECRET_KEY: ${{ secrets.STORAGE_WRITE_SECRET_KEY }}
      STORAGE_ENDPOINT_URL: ${{ vars.STORAGE_ENDPOINT_URL }}
      STORAGE_LANDING_BUCKET_NAME: ${{ vars.STORAGE_LANDING_BUCKET_NAME }}
      STORAGE_LAKEHOUSE_BUCKET_NAME: ${{ vars.STORAGE_LAKEHOUSE_BUCKET_NAME }}
      SOURCE_GUS_BDL_API_KEY: ${{ secrets.SOURCE_GUS_BDL_API_KEY }}
      SOURCE_GUS_BDL_WEB_LOGIN: ${{ secrets.SOURCE_GUS_BDL_WEB_LOGIN }}
      SOURCE_GUS_BDL_WEB_PASSWORD: ${{ secrets.SOURCE_GUS_BDL_WEB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: "dev/${{ inputs.script }}.py"
        env:
          SCRIPT: ${{ inputs.script }}
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SCRIPT" | grep -Eq '^[a-z0-9_]+$' || [ ! -f "dev/$SCRIPT.py" ]; then
            echo "no such dev script on this branch: dev/$SCRIPT.py" >&2
            exit 2
          fi
          mkdir -p "$DEV_OUTPUT_DIR"
          read -ra argv <<< "$ARGS"
          python -m "dev.$SCRIPT" "${argv[@]}"
      - name: Keep script output files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dev-${{ inputs.script }}-${{ github.run_id }}
          path: /tmp/dev-output
          if-no-files-found: ignore
          retention-days: 7
