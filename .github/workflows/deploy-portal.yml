name: Deploy portal

on:
  push:
    branches: [main]
    # Only the deployed application: the portal app and the R2 read Worker.
    # Data jobs (portal index) run in Pipeline (source platform · serving: refresh portal index);
    # changes to this workflow file are checked with a manual run.
    paths:
      - 'portal/app/**'
      - 'portal/worker/**'
      - '.node-version'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zohelo-portal
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: portal/app/package-lock.json
      - name: Deploy the private R2 read API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PORTAL_ALLOWED_GOOGLE_EMAIL: ${{ secrets.PORTAL_ALLOWED_GOOGLE_EMAIL }}
        run: |
          set -euo pipefail
          output="$(npx --yes wrangler@latest deploy --config portal/worker/wrangler.toml 2>&1)"
          printf '%s\n' "$output"
          api_url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1)"
          test -n "$api_url"
          echo "DUCK_UI_R2_API_BASE=${api_url%/}" >> "$GITHUB_ENV"
          printf '%s' "$PORTAL_ALLOWED_GOOGLE_EMAIL" | npx --yes wrangler@latest secret put ALLOWED_GOOGLE_EMAIL --config portal/worker/wrangler.toml
          openssl rand -hex 32 | npx --yes wrangler@latest secret put DOWNLOAD_SIGNING_KEY --config portal/worker/wrangler.toml
      - name: Install portal dependencies
        working-directory: portal/app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the portal
        working-directory: portal/app
        env:
          DUCK_UI_BASEPATH: ${{ steps.pages.outputs.base_path }}/
          DUCK_UI_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          DUCK_UI_R2_API_BASE: ${{ env.DUCK_UI_R2_API_BASE }}
        run: npm run build
      - name: Write the build identity
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          Path('portal/app/dist/portal-build.json').write_text(json.dumps({
              'git_commit': os.environ['GITHUB_SHA'],
              'data_source': 'cloudflare-r2',
          }) + '\n')
          PYCODE
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: portal/app/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm the deployed build identity
        env:
          PORTAL_ORIGIN: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_GIT_COMMIT: ${{ github.sha }}
        run: |
          python portal/verify_build.py \
            --origin "$PORTAL_ORIGIN" \
            --expected-git-commit "$EXPECTED_GIT_COMMIT"
