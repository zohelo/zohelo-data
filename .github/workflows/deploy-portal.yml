name: Deploy portal

# The data portal (data.zohelo.com) on Cloudflare Pages: the app (portal/app) and its R2 read API
# (portal/worker, served as a Pages Function under /api), behind Cloudflare Access.
# Push to main deploys production and keeps data.zohelo.com pointed at it; a manual run on a
# branch deploys a preview <branch>.zohelo-data.pages.dev. Data jobs (portal index) run in
# Pipeline (source platform · serving: refresh portal index).
on:
  push:
    branches: [main]
    paths:
      - 'portal/app/**'
      - 'portal/worker/**'
      - 'portal/cloudflare_setup.py'
      - '.node-version'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zohelo-portal-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # zohelo organisation credentials, mapped to the names the tools read.
      CLOUDFLARE_API_TOKEN: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.PLATFORM_ACCOUNT_ID }}
      PORTAL_SIGNIN_ALLOWED_EMAILS: ${{ secrets.PORTAL_SIGNIN_ALLOWED_EMAILS }}
      STORAGE_LANDING_BUCKET_NAME: ${{ vars.STORAGE_LANDING_BUCKET_NAME }}
      STORAGE_LAKEHOUSE_BUCKET_NAME: ${{ vars.STORAGE_LAKEHOUSE_BUCKET_NAME }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: portal/app/package-lock.json
      - name: Install portal dependencies
        working-directory: portal/app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the portal
        working-directory: portal/app
        env:
          DUCK_UI_BASEPATH: /
          DUCK_UI_R2_API_BASE: /api
          # The DuckDB engines (36-41 MB) exceed the 25 MB Pages file limit: load them from jsDelivr.
          DUCK_UI_DUCKDB_WASM_CDN_ONLY: "true"
        run: npm run build
      - name: Write the build identity
        run: |
          printf '{"git_commit": "%s", "data_source": "cloudflare-r2"}\n' "$GITHUB_SHA" > portal/app/dist/portal-build.json
      - name: Cloudflare setup (Pages project, Access, domain on main)
        run: |
          python -m pip install --quiet requests
          if [ "$BRANCH" = main ]; then python portal/cloudflare_setup.py --switch-dns; else python portal/cloudflare_setup.py; fi
      - name: Deploy
        working-directory: portal/app
        run: |
          set -euo pipefail
          npx --yes wrangler@4.43.0 pages deploy dist --project-name zohelo-data --branch "$BRANCH" --commit-dirty=true | tee /tmp/deploy.log
          url=$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' /tmp/deploy.log | tail -1)
          echo "::notice title=deployed::$url"
      - name: Sign-in is enforced
        run: |
          set -euo pipefail
          sleep 20
          preview="$(echo "$BRANCH" | tr '/_.' '---' | tr 'A-Z' 'a-z').zohelo-data.pages.dev"
          for host in zohelo-data.pages.dev "$preview"; do
            out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://$host/api/health")
            case "$out" in
              30?\ *cloudflareaccess.com*) echo "::notice title=access $host::redirects to sign-in" ;;
              *) echo "::error title=access $host::not protected: $out"; exit 1 ;;
            esac
          done
          if [ "$BRANCH" = main ]; then
            out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://data.zohelo.com/ || true)
            case "$out" in
              30?\ *cloudflareaccess.com*) echo "::notice title=access data.zohelo.com::redirects to sign-in" ;;
              *) echo "::warning title=access data.zohelo.com::not yet answering through Pages ($out); the certificate can take a few minutes" ;;
            esac
          fi
