name: Run pipeline activity
description: Install the pipeline's Python dependencies and run one activity with run.py.
inputs:
  source:
    description: Source id from ingestion/sources/<source>.yaml, or platform
    required: true
  activity:
    description: Activity name, e.g. landing.extract
    required: true
  filter:
    description: Item filter (dataset codes or globs)
    default: ""
  max-items:
    description: Max items per parallel job (0 = all)
    default: "0"
  parallel-jobs:
    description: Number of parallel extract jobs
    default: "1"
  job-index:
    description: Index of this extract job
    default: "0"
  parallel-downloads:
    description: Concurrent downloads per job
    default: "4"
  budget-minutes:
    description: Stop starting new work after this many minutes
    default: "300"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install dependencies
      shell: bash
      run: python -m pip install --require-hashes -r requirements.txt
    - name: ${{ inputs.source }} · ${{ inputs.activity }}
      shell: bash
      env:
        PYTHONPATH: .
        SOURCE: ${{ inputs.source }}
        ACTIVITY: ${{ inputs.activity }}
        FILTER: ${{ inputs.filter }}
        MAX_ITEMS: ${{ inputs.max-items }}
        PARALLEL_JOBS: ${{ inputs.parallel-jobs }}
        JOB_INDEX: ${{ inputs.job-index }}
        PARALLEL_DOWNLOADS: ${{ inputs.parallel-downloads }}
        BUDGET_MINUTES: ${{ inputs.budget-minutes }}
        DUCKDB_TEMP_DIRECTORY: /mnt/duckdb_tmp
      run: |
        sudo mkdir -p "$DUCKDB_TEMP_DIRECTORY" && sudo chown "$(id -u)" "$DUCKDB_TEMP_DIRECTORY"
        # The sampler's stdout carries its live annotations (a killed runner skips the report below).
        python -m ops.runner_resources sample "$RUNNER_TEMP/runner_resources.log" \
          2> "$RUNNER_TEMP/runner_resources.err" &
        python run.py activity --source "$SOURCE" --activity "$ACTIVITY" \
          --filter "$FILTER" --max-items "$MAX_ITEMS" --parallel-jobs "$PARALLEL_JOBS" \
          --job-index "$JOB_INDEX" --parallel-downloads "$PARALLEL_DOWNLOADS" \
          --budget-minutes "$BUDGET_MINUTES"
    # A job killed from outside (exit 143, e.g. runner out of memory) ends as cancelled, not failed.
    - name: Runner resources (only when the activity failed or was cancelled)
      if: failure() || cancelled()
      shell: bash
      env:
        PYTHONPATH: .
      run: python -m ops.runner_resources report "$RUNNER_TEMP/runner_resources.log"
