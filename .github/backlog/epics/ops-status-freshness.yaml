key: data/ops/status-freshness
area: data/ops
title: Status page and freshness
phase: 1
priority: P2
target: 2027-01-22
why: >-
  Visitors and the owner must see whether data is current. Every public number needs a date, and a
  failing source should show as late, not silently stale.
outcome: >-
  A /status view lists each source's last successful load, next expected update and lag; freshness
  is published and used by both portals.
in_scope:
  - freshness rows in the published catalogue; status JSON for zohelo.com /status
  - 14-day green gate measurement for the phase 1 exit
out_of_scope:
  - paging or external uptime monitoring
done_when:
  - 06_published/v1/status.json lists every onboarded source with last_loaded_at, next_expected_at, lag_days
  - an Ops run reports "green days in a row" per source for the phase exit
depends_on: [data/metadata/catalogue-v1, data/published/published-v1]
deliverables:
  - key: data/ops/status-freshness/status-json
    title: Status file published
    done_when:
      - gold.publish writes status.json from gold.freshness
    tasks:
      - key: data/ops/status-freshness/status-json/next-expected
        type: Task
        title: Compute each source's next scheduled run from its crons
        effort: S
        state: open
        context: >-
          status.json needs next_expected_at per source. The schedules are declared in
          ingestion/sources/<source>.yaml under extraction.schedule (UTC crons, e.g. nbp
          "30 11 * * 1-5"). ingestion/common/scheduler.py already parses crons (parse, matches) and
          finds the latest slot backwards (last_slot, CATCH_UP_DAYS = 32); nothing finds the next slot.
          run.py `schedule --check` validates schedules and prints JSON.
        files:
          - edit: ingestion/common/scheduler.py
          - edit: run.py
          - edit: docs/operating.md
        steps:
          - "scheduler.py: add next_slot(cron: str, start: datetime) -> datetime | None, the earliest cron minute strictly after start within CATCH_UP_DAYS, written as the mirror of last_slot (days forward, hours and minutes ascending, seconds and microseconds zeroed)."
          - "scheduler.py: add next_runs(config: dict, now: datetime) -> dict[str, str]: for every source in config['sources'] with at least one extraction.schedule entry, the minimum next_slot over its entries as ISO 8601 UTC with 'Z' (format '%Y-%m-%dT%H:%MZ'); sources without a schedule are left out; source 'platform' is left out; keys sorted."
          - "run.py: `schedule` gets the flag --next (help 'print each source's next scheduled run'); with it print json.dumps({'now': <now ISO, same format>, 'next': next_runs(config, now)}) and return 0, before the --check branch; now = datetime.now(UTC)."
          - "docs/operating.md: one sentence where `run.py schedule --check` is described: '`python run.py schedule --next` prints each scheduled source's next run (UTC), the basis of next_expected_at in status.json.'"
        acceptance:
          - "every source with a schedule appears once; each value is later than now and at most 32 days ahead"
          - "for nbp the value is a weekday at 11:30Z"
          - "ruff and repo_check pass"
        verify:
          - run: PYTHONPATH=. python run.py schedule --next
            expect: "JSON with 'now' and 'next'; next.nbp ends with 'T11:30Z' and falls on Monday–Friday"
          - run: python -m ops.repo_check
            expect: all checks ok
        out_of_scope:
          - lag rules and status.json itself (next Task, after the published layer)
          - changing any schedule
      - key: data/ops/status-freshness/status-json/contract
        type: Task
        title: Add status.json to the published contract (doc, schema, fixture)
        effort: S
        state: open
        contract: true
        context: >-
          This Epic's done_when needs 06_published/v1/status.json (each source's last_loaded_at, next_expected_at,
          lag_days); docs/published.md has no such file and D5 puts the contract first. repo_check checks each
          fixture against the schema PUBLISHED_SCHEMAS names.
        files:
          - create: warehouse/published/schemas/status.schema.json
          - create: warehouse/published/fixtures/status.json
          - edit: ops/repo_check.py
          - edit: docs/published.md
        steps:
          - "status.schema.json, laid out like feed_changes.schema.json: object, required [version, generated_at, sources]; version integer; generated_at string with the timestamp pattern of feed_changes; sources array of objects, required [source_key, name_pl, name_en, last_loaded_at, next_expected_at, lag_days]: source_key string pattern ^[a-z0-9_]+$; name_pl, name_en string; last_loaded_at and next_expected_at type [string, null] with the timestamp pattern; lag_days type [integer, null]."
          - "fixtures/status.json: version 1, generated_at 2026-01-01T00:00:00Z, three sources: eurostat (Eurostat/Eurostat, 2025-12-31T22:45:00Z, 2026-01-01T10:30Z, 0), nbp (NBP kursy walut i cena złota / NBP exchange rates and gold price, 2025-12-31T11:40:00Z, 2026-01-02T11:30Z, 0), gleif (GLEIF / GLEIF LEI golden copy, null, null, null)."
          - "repo_check.py PUBLISHED_SCHEMAS: add \"status.json\": \"status\" after the manifest entry."
          - "docs/published.md: section `## status.json` before `## Size limits` with a field table; meanings: sources = one per row of warehouse/seeds/source.csv; last_loaded_at = newest gold.coverage checked_at of the source (as catalog.json loaded_at), null when none; next_expected_at = next run from `python run.py schedule --next`, null without a schedule; lag_days = whole days from last_loaded_at to generated_at, null without it. Size limits row `status.json | ≤ 50 kB`."
        acceptance:
          - "repo_check passes; the second verify prints 2"
        verify:
          - run: python -m ops.repo_check
            expect: all checks ok
          - run: "python -c \"import json;from ops.repo_check import _schema_problems as p;s=json.load(open('warehouse/published/schemas/status.schema.json'));f=json.load(open('warehouse/published/fixtures/status.json'));f['sources'][0]['lag_days']='1';f['sources'][0]['next_expected_at']='2026-01-02 11:30';print(len(p(f,s,'$')))\""
            expect: "2"
        out_of_scope: [warehouse/publish.py (Task status-json/writer), a late flag]
      - key: data/ops/status-freshness/status-json/writer
        type: Task
        title: Write status.json in gold.publish
        effort: M
        state: open
        contract: true
        depends_on: [data/ops/status-freshness/status-json/contract]
        context: >-
          docs/published.md section status.json (Task contract) defines the file; nothing writes it. publish.py has
          checked(coverage) (checked_at per source, '%Y-%m-%dT%H:%M:%SZ'), seed(), schema_checked() and put();
          scheduler.next_runs(run.load_config(), now) gives the next runs.
        files:
          - edit: warehouse/publish.py
        steps:
          - "publish.py: STATUS_LIMIT = 50_000 next to LATEST_LIMIT; add ``status.json`` to the module docstring."
          - "status_json(sources: list[dict[str, str]], checked_at: dict[str, str], next_at: dict[str, str], generated_at: str) -> dict (pure, one-line docstring): one entry per sources row, in order, with source_key, name_pl, name_en, last_loaded_at = checked_at.get(key), next_expected_at = next_at.get(key), lag_days = (generated - loaded).days with both parsed by '%Y-%m-%dT%H:%M:%SZ', None when not loaded; returns {'version': 1, 'generated_at': generated_at, 'sources': entries}."
          - "main(), after the catalog_json lines: import scheduler (from ingestion.common) and run inside main; next_at = scheduler.next_runs(run.load_config(), datetime.now(UTC)); obj = schema_checked(status_json(seed('source'), checked_at, next_at, generated_at), 'status'); body = json.dumps(obj, ensure_ascii=False, separators=(',', ':')).encode(); raise ValueError when len(body) > STATUS_LIMIT; result['status'] = {'sources': len(obj['sources']), 'bytes': put(client, prefix + 'status.json', body)}."
          - "dev/publish_status_trial.py: build the object as main() does, put it to zz_dev_published/v1/status.json, annotate notice 'status.json' with get() of it; in finally delete it and annotate 'deleted 1'. Run in Dev; delete dev/ before the PR."
        acceptance:
          - "trial: 10 sources, nbp with next_expected_at; ruff and repo_check pass"
        verify:
          - run: "python -c \"from warehouse.publish import status_json as s;r=s([{'source_key':'nbp','name_pl':'N','name_en':'N'},{'source_key':'gleif','name_pl':'G','name_en':'G'}],{'nbp':'2026-11-01T11:40:00Z'},{'nbp':'2026-11-03T11:30Z'},'2026-11-03T08:00:00Z');print([(v['source_key'],v['lag_days'],v['next_expected_at']) for v in r['sources']])\""
            expect: "[('nbp', 1, '2026-11-03T11:30Z'), ('gleif', None, None)]"
          - workflow: Dev · branch runs, script publish_status_trial, on the branch
            expect: "notice 'status.json' with 10 sources; then 'deleted 1'"
          - run: python -m ops.repo_check
            expect: all checks ok
        out_of_scope: [the contract, a late flag, schedules, the /status page]
    todo:
      - "Late flag in status.json: a lag rule per release frequency needs a definition (the old rule 'now > next_expected_at + one period' never fires, since next_expected_at is the next scheduled run)"
  - key: data/ops/status-freshness/green-gate
    title: 14-day green gate report
    done_when:
      - tracker (or a new mode) annotates consecutive green scheduled days per source
    tasks:
      - key: data/ops/status-freshness/green-gate/green-days
        type: Task
        title: Report green scheduled days in a row per source (tracker --green-days)
        effort: M
        state: open
        context: >-
          Phase 1 exit: every onboarded source green on 14 scheduled days in a row. Scheduled source runs
          are Pipeline runs with triggering_actor.login "github-actions[bot]" and display_title
          "Pipeline · <source> · <run>". ops/tracker.py needs R2 for its page; the Ops job already passes
          GH_PROJECT_TOKEN (actions: read) to tracker.
        files:
          - edit: ops/tracker.py
          - edit: ops/README.md
        steps:
          - "tracker.py: scheduled_runs(token, repo, days=30): Pipeline runs (workflows/pipeline.yml/runs, status=completed, created='>=<date 30 days ago>', per_page=100, paged until a short page) whose triggering_actor.login is 'github-actions[bot]'."
          - "tracker.py: green_days(found, ids) -> dict: per id, runs whose display_title starts with f'Pipeline · {id} · ', grouped by created_at[:10]; a day is red if any run concluded failure or timed_out, else green; count green days newest first until the first red day. Value {'green_days': n, 'last_red': date or None, 'days_with_runs': n}."
          - "main(): flag --green-days runs before any R2 or catalog call: ids = sources() keys with a non-empty extraction.schedule; print a Markdown table (source, green days, last red day, days with runs) and step_summary it; annotate notice 'tracker: green days' {id: green_days}; return 0. No GH_PROJECT_TOKEN: raise RuntimeError."
          - "ops/README.md tracker row: add '`--green-days`: only the scheduled-run streak per source (no R2), for the phase 1 exit (14 days)'."
        acceptance:
          - "--green-days needs no R2 credentials and writes no issue"
          - "a source with no scheduled run in 30 days shows 0 green days and 0 days with runs"
          - "ruff and repo_check pass"
        verify:
          - run: "python -c \"from ops.tracker import green_days as g;r=[{'display_title':'Pipeline · nbp · x','created_at':d,'conclusion':c} for d,c in [('2026-10-28T11:30Z','success'),('2026-10-27T11:30Z','success'),('2026-10-26T11:30Z','failure')]];print(g(r,['nbp','eurostat']))\""
            expect: "nbp green_days 2, last_red 2026-10-26; eurostat green_days 0"
          - workflow: Ops (ops.yml), script tracker, args --green-days
            expect: "green; notice 'tracker: green days' with one entry per scheduled source"
        out_of_scope:
          - the tracker page and issue (unchanged)
          - scheduling --green-days (decided when the phase exit is near)
