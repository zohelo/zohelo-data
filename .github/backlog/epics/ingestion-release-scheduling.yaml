key: data/ingestion/release-scheduling
area: data/ingestion
title: Release-aware scheduling
phase: 1
priority: P2
target: 2027-01-15
why: >-
  Sources publish on known calendars; polling them on fixed crons wastes runs and delays news. The
  public site's "what changed" feed and the release calendar need runs aligned to publications.
outcome: >-
  Each KPI source runs shortly after its publisher's release times, steady-state schedules replace
  initial-load schedules, and the release calendar seed feeds the catalogue.
in_scope:
  - release-time schedules per source; steady-state schedules after initial loads
  - release_calendar seed for the five KPI sources
out_of_scope:
  - BDL steady state and WDI archive decisions (source Epics data/src-pls-001, data/src-gl-005)
done_when:
  - every KPI source declaration has a schedule tied to its release pattern with the reason in a comment
  - warehouse/seeds/release_calendar.csv lists the next 3 months of releases for the five KPI sources
depends_on: [data/src-pls-001]
deliverables:
  - key: data/ingestion/release-scheduling/schedules
    title: Schedules follow publications
    done_when:
      - schedule comments name the release pattern; no source polls more than twice its release frequency
    tasks:
      - key: data/ingestion/release-scheduling/schedules/release-comments
        type: Task
        title: Name each KPI source's release pattern in its schedule comment
        effort: S
        state: open
        context: >-
          The five KPI sources' schedules live in ingestion/sources/<source>.yaml under extraction.schedule
          (UTC crons). Eurostat, GUS BDL and GUS DBW have no comment on the `schedule:` line; NBP and WDI
          say when they run but not when the publisher releases. This Task writes the release pattern next
          to each schedule; no cron changes.
        files:
          - edit: ingestion/sources/eurostat.yaml
          - edit: ingestion/sources/nbp.yaml
          - edit: ingestion/sources/gus_dbw.yaml
          - edit: ingestion/sources/gus_bdl.yaml
          - edit: ingestion/sources/world_bank_wdi.yaml
        steps:
          - "In each file set the comment of the `  schedule:` line (one space before #, replacing any comment there) to exactly:"
          - "eurostat: `# UTC; release: database updated twice a day, 11:00 and 23:00 CET; runs 30 min after (90 min in summer time)`"
          - "nbp: `# UTC; release: table A business days 11:45–12:15 Warsaw, table C 07:45–08:15; runs 13:30 Warsaw (summer), 12:30 (winter)`"
          - "gus_dbw: `# UTC; release: no fixed calendar, indicators change on GUS publication dates; daily check 05:40 Warsaw (winter), 06:40 (summer)`"
          - "gus_bdl: `# UTC; initial load every 6 hours (owner #889); release: GUS updates subgroups through the year, no fixed calendar; steady state in Epic data/src-pls-001`"
          - "world_bank_wdi: `# UTC; release: WDI is updated a few times a year on no fixed date; weekly check (Tuesday 03:20), unchanged bytes are skipped`"
          - "Change nothing else; the `- {cron: ...}` lines stay byte for byte."
        acceptance:
          - "each of the five files has exactly one `release:` comment on its `schedule:` line"
          - no cron, run, filter or parallel_jobs value changed
        verify:
          - run: 'grep -c "^  schedule: .*# UTC;.*release:" ingestion/sources/eurostat.yaml ingestion/sources/nbp.yaml ingestion/sources/gus_dbw.yaml ingestion/sources/gus_bdl.yaml ingestion/sources/world_bank_wdi.yaml'
            expect: "1 for each file"
          - run: 'git diff -U0 origin/main -- ingestion/sources | grep -c "cron:"'
            expect: "0"
          - run: PYTHONPATH=. python run.py schedule --check
            expect: exit 0
          - run: python -m ops.repo_check
            expect: all checks ok
        out_of_scope: [cron changes, other sources, the release calendar seed]
    todo:
      - "Per source: tighten crons to the release patterns of release-comments where they allow fewer runs (GUS sources after the release calendar)"
      - "Scheduler: support date-specific runs from the release calendar (design first)"
  - key: data/ingestion/release-scheduling/calendar
    title: Release calendar seed
    done_when:
      - release_calendar.csv built into gold.release_calendar
    todo:
      - "Collect release calendars (GUS harmonogram, Eurostat release calendar, NBP) into release_calendar.csv"
