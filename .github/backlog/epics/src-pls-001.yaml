    tables
  depends_on:
  - data/warehouse/gold-v1
  todo:
  - Gold v1 builder Tasks (block list, geography mapping, build-check row) are written when Epic data/warehouse/gold-v1
    is done
- key: data/src-pls-001/semantic
  title: GUS BDL · Semantic
  done_when:
  - KPIs in warehouse/seeds/kpi.csv (PL/EN, unit, frequency, licence, domain); metrics in the generated manifest;
    lineage in the catalogue
  depends_on:
  - data/metadata/catalogue-v1
  todo:
  - kpi.csv rows, domain mapping and manifest check are written when Epic data/metadata/catalogue-v1 is done
- key: data/src-pls-001/portal-release
  title: GUS BDL · Data portal release
  done_when:
  - 'data.zohelo.com source page: register summary, tables per layer with rows and last write, freshness, last scheduled
    run'
  depends_on:
  - data/portal/catalogue-pages
  todo:
  - Check the source page on data.zohelo.com and fix missing metadata, once Epic data/portal/catalogue-pages is
    done
- key: data/src-pls-001/bi-release
  title: GUS BDL · zohelo-bi release
  repo: zohelo-bi
  done_when:
  - KPIs in the bi catalogue and explorer; at least one dashboard tile uses one; bi smoke covers it
  todo:
  - Catalogue rows, explorer dimensions and a dashboard tile, written when zohelo-bi v1 reads the published layer
- key: data/src-pls-001/com-release
  title: GUS BDL · zohelo.com release
  repo: zohelo
  done_when:
  - KPIs on zohelo.com indicator pages and section with real values, attribution and a link to bi
  todo:
  - Indicator pages and section content, written when zohelo.com v1 reads the published layer
