key: data/src-plg-008
area: data/src-d
title: MF Treasury debt [PLG-008]
phase: 2
priority: P2
target: '2026-12-18'
why: The Ministry of Finance's State Treasury debt time series is the monthly reference for Poland's central-government debt
  by instrument and market. It feeds the public-finance domain and complements Eurostat's quarterly government debt.
outcome: The Treasury-debt time-series workbook is declared as a bulk_file source and trialled into scratch from GitHub Actions.
in_scope:
- Stages 1–2 of the source template (stages.yaml); later stages are written when stage 2 is done
out_of_scope:
- Other sources of the same provider
- Bronze, Silver and KPIs (later stages)
done_when:
- Every Deliverable of this Epic is closed; register entry PLG-008 is landed
depends_on: []
decisions:
- 'owner 28 Oct #2230: an approved source gets its full stage Epic'
deliverables:
- key: data/src-plg-008/review
  title: MF Treasury debt · Source review
  done_when:
  - Register entry PLG-008 has licence.notes with the terms URL and attribution; status approved
  state: done
  notes:
  - 'Evidence: licence #1752, register decision #1753 (ingestion/register.yaml status approved)'
- key: data/src-plg-008/development
  title: MF Treasury debt · Development
  done_when:
  - ingestion/sources/mf_treasury_debt.yaml exists with extraction (bulk_file), landing, archive_policy, refresh and activities
  - A Dev branch run landed a full load into a zz_dev_ scratch prefix and removed it
  tasks:
  - key: data/src-plg-008/development/page-links
    type: Task
    title: Let bulk_file find a file's URL on a web page by pattern
    effort: M
    state: open
    contract: true
    owner_action: null
    verify_only: false
    context: 'Today the bulk_file pattern (ingestion/to_landing/patterns/bulk_file.py) needs a fixed URL per file (url, optionally
      with {date}). The Ministry of Finance and gov.pl publish each new workbook as https://www.gov.pl/attachment/<uuid>,
      a new URL on every release, linked from a stable page. Target: a file may declare url_from {page: <stable page URL>,
      pattern: <regex>} instead of url; at run time the pattern finds the file''s link on the page. Used first by PLG-008,
      PLG-009, PLG-007 and PLS-029.'
    files:
    - edit: ingestion/to_landing/patterns/bulk_file.py
    - edit: run.py
    - edit: docs/landing.md
    steps:
    - 'bulk_file.py: add resolve_url(spec) used everywhere url_of(spec) is used today (inspect, load): when spec has url_from,
      GET url_from.page with the module''s USER_AGENT, a 30 s timeout and the existing retry rules; pass the HTML to a new
      function links_matching(html, page_url, pattern) -> list[str] that takes every href of an <a> tag (html.parser from
      the standard library, no new dependency) and keeps, in page order, those whose absolute URL (urllib.parse.urljoin with
      the page URL) matches re.search(url_from.pattern); with url_from.pick: first (default) or last, return that one; no
      match → raise PermanentError naming the page and pattern. Otherwise return url_of(spec).'
    - Write the resolved URL into the receipt's url field (as today) and into the inspect annotation per entity.
    - 'run.py (check at the bulk_file files loop): accept a file with entity and either url or url_from with page and pattern;
      the error message names both options.'
    - Document url_from {page, pattern, pick} in the module docstring and docs/landing.md (Common ingestion framework).
    acceptance:
    - A declared file with url_from passes run.py schedule --check; one with neither url nor url_from fails it
    - Files declared with url behave exactly as before (WDI, mf_biala_lista unchanged)
    - ruff and python -m ops.repo_check pass; no new dependency in requirements
    verify:
    - run: PYTHONPATH=. python run.py schedule --check
      expect: exit code 0
    - run: PYTHONPATH=. python -c "from ingestion.to_landing.patterns import bulk_file as b; print(b.links_matching('<a href=/attachment/abc>x</a>',
        'https://www.gov.pl/web/finanse/x', '/attachment/'))"
      expect: '[''https://www.gov.pl/attachment/abc'']'
    - &id001
      run: python -m ops.repo_check
      expect: exit code 0
    out_of_scope:
    - JavaScript-rendered pages (no browser in the pipeline)
    - Changing any declared source
  - key: data/src-plg-008/development/declaration
    type: Task
    title: Declare MF Treasury debt in ingestion/sources
    effort: M
    state: open
    contract: true
    owner_action: null
    verify_only: false
    context: 'Register entry PLG-008 is approved. It becomes a source through one declaration using the shared bulk_file pattern,
      so no extractor is written. The register review referenced https://www.gov.pl/attachment/cdea605f-3278-4a55-af7b-0162d548ea0f
      as the current workbook; its URL changes on each release, hence url_from. URLs come from the register review; the Dev
      trial Task proves them from Actions. Schedule (stage 4) comes later: the series is updated monthly.'
    files:
    - create: ingestion/sources/mf_treasury_debt.yaml
    - edit: ingestion/register.yaml
    - edit: .github/workflows/pipeline.yml
    - edit: docs/sources.md
    steps:
    - 'Create ingestion/sources/mf_treasury_debt.yaml in the shape of ingestion/sources/world_bank_wdi.yaml: description "Ministry
      of Finance State Treasury debt time series (XLSX)", extraction.kind bulk_file with the file below, initial bulk, production
      snapshot, incremental_policy changed_since_last, schedule [], landing 01_landing/mf_treasury_debt/, archive_policy as
      WDI with prune: report, bronze/silver/gold [], refresh {mode: full}, activities [landing.inspect, landing.extract, landing.verify].'
    - 'Files under extraction.bulk_file.files: one file: entity treasury_debt_series, url_from {page: "https://www.gov.pl/web/finanse/szeregiczasowe",
      pattern: "/attachment/"}, format raw, version last_modified. If the page links several attachments, set url_from.pick
      from the Dev trial''s link list (the trial annotates every match).'
    - 'Add `source_system: mf_treasury_debt` to register entry PLG-008 in ingestion/register.yaml.'
    - Add mf_treasury_debt to the `source` options list of the workflow_dispatch inputs in .github/workflows/pipeline.yml
      (alphabetical place).
    - 'docs/sources.md: a `mf_treasury_debt` section like world_bank_wdi''s (route, entity, version, restart unit).'
    - 'Run `PYTHONPATH=. python run.py schedule --check` and `PYTHONPATH=. python run.py plan --source mf_treasury_debt --run
      "landing: inspect"`.'
    acceptance:
    - run.py schedule --check passes
    - register entry PLG-008 has source_system mf_treasury_debt
    verify:
    - run: 'PYTHONPATH=. python run.py plan --source mf_treasury_debt --run "landing: inspect"'
      expect: JSON with landing.inspect
    - *id001
    out_of_scope:
    - bronze.load and Bronze tables (stage 5)
    - a schedule entry (stage 4)
    - Other register entries
    depends_on:
    - data/src-plg-008/development/page-links
  - key: data/src-plg-008/development/dev-trial
    type: Task
    title: Dev-trial a full MF Treasury debt load into scratch
    effort: M
    state: open
    contract: false
    owner_action: null
    verify_only: true
    context: Proves the declaration against the real source from GitHub Actions without touching production (the session cannot
      reach the provider or Cloudflare). The trial script lives in dev/ on the declaration's branch only and is never merged
      (repo_check rejects dev/). This Task closes with a comment linking the green Dev run; the declaration PR merges only
      after that.
    files: []
    steps:
    - 'On the declaration''s branch write dev/mf_treasury_debt_trial.py that calls ingestion.to_landing.patterns.bulk_file.main(''mf_treasury_debt'',
      ''inspect'', landing_root=''zz_dev_mf_treasury_debt''), then main(''mf_treasury_debt'', ''load'', landing_root=''zz_dev_mf_treasury_debt''),
      then main(''mf_treasury_debt'', ''verify'', landing_root=''zz_dev_mf_treasury_debt''), and finally deletes every object
      under zz_dev_mf_treasury_debt/ (copy the clean-up loop of an existing Dev trial in git history: `git log --all --oneline
      -- ''dev/*_trial.py'' | head`).'
    - Dispatch Actions → Dev · branch runs on that branch with script mf_treasury_debt_trial.
    - Read the run's annotations (`gh api repos/zohelo/zohelo-data/check-runs/<job id>/annotations`); when a URL or the link
      pattern fails, fix the declaration on the same branch and dispatch again.
    - Comment the green run URL, the landed file names, sizes and versions on this issue and close it; delete dev/ from the
      branch so the declaration PR can merge.
    acceptance:
    - The Dev run is green; its annotation lists every declared entity with bytes and a version
    - No object is left under zz_dev_mf_treasury_debt/ (the run's last annotation says so)
    verify:
    - workflow: Dev · branch runs (dev.yml), script mf_treasury_debt_trial, on the declaration branch
      expect: green run; annotation with entity count and bytes
    out_of_scope:
    - Production Landing writes
    - Merging anything (the declaration PR carries the change)
    depends_on:
    - data/src-plg-008/development/declaration
