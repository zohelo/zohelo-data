key: data/ops/visibility
area: data/ops
title: Security alerts and release notes
phase: 0
priority: P1
target: 2026-11-14
why: >-
  GitHub's security findings (Dependabot alerts, code scanning) sit outside the backlog, so no lane works on them, and
  the owner has no single place that says what reached production and when.
outcome: >-
  Every open security alert is a Bug issue that lane 1 works on, and every production deploy publishes a GitHub
  Release whose notes list the merged pull requests since the previous one.
in_scope:
  - weekly Ops script that mirrors Dependabot and code-scanning alerts of the three repos into Bug issues
  - a GitHub Release after each production deploy of zohelo.com, bi.zohelo.com and data.zohelo.com, and a weekly
    release of the zohelo-data engine
out_of_scope:
  - fixing the alerts themselves (each Bug is its own work)
  - a public changelog page on zohelo.com (later, from the releases)
done_when:
  - every open Dependabot or code-scanning alert of the three repos has exactly one open Bug labelled security-alert
  - each repo shows a Release for its latest production deploy, with generated notes
decisions:
  - "owner 28 Oct: security findings must be part of the workflow; the owner wants to see what reached production"
  - "architect: alerts are read by the org app in an Ops script (sessions cannot read alert APIs); alert Bugs carry no key marker, label security-alert, and lane 1 owns them"
  - "architect: a release is created by the deploy job itself with github.token (contents: write), tag deploy-<UTC yyyymmdd-HHMM>, notes generated by GitHub"
deliverables:
  - key: data/ops/visibility/alerts
    title: Security alerts become Bug issues
    done_when:
      - Ops security_alerts apply opens or updates one Bug per open alert and closes Bugs of fixed or dismissed alerts
      - it runs every Monday from the ops.yml schedule table
    tasks:
      - key: data/ops/visibility/alerts/script
        type: Task
        title: Mirror Dependabot and code-scanning alerts into Bug issues
        effort: M
        state: open
        contract: true
        context: >-
          The org GitHub App (zohelo-automation) has Dependabot alerts and security events read access; Claude
          sessions get 403 on the alert APIs, so an Ops script with the app token must do this. ops.yml already mints
          the app token for some scripts (step "Project token"); `backlog_sync` shows the pattern of a script that
          reads all three repos.
        files:
          - create: ops/security_alerts.py
          - edit: .github/workflows/ops.yml
          - edit: ops/README.md
        steps:
          - "ops/security_alerts.py, modes `plan` (default) and `apply`: for each repo in zohelo-data, zohelo-bi, zohelo list open alerts with `GET /repos/zohelo/<repo>/dependabot/alerts?state=open&per_page=100` and `GET /repos/zohelo/<repo>/code-scanning/alerts?state=open&per_page=100` (loop pages)."
          - "One Bug per alert in the repo of the alert: title `Security alert: <package or rule id> (<severity>)`, labels `security-alert` and `alert-<dependabot|code-scanning>-<alert number>`, type Bug, body: severity, advisory or rule summary, manifest or file path, alert URL, and the line `Fix: upgrade or patch so that the alert closes; Closes this Bug.` No key marker."
          - "Find existing Bugs by the label `alert-<kind>-<number>`; create when missing; close (state_reason completed, comment with the alert state) when the alert is no longer open."
          - "Annotate per repo `{open alerts, bugs created, bugs closed}`; at most 200 writes per run, 1 s apart."
          - "ops.yml: mint the app token for `security_alerts` with repositories zohelo-data,zohelo-bi,zohelo, issues write for `apply` (read otherwise), `permission-vulnerability-alerts: read` and `permission-security-events: read`; add schedule row `'40 5 * * 1') script=security_alerts; args='apply'` and its cron under on.schedule."
          - Document the script and the schedule row in ops/README.md.
        acceptance:
          - plan run lists the open alerts of all three repos with counts per severity
          - apply run creates one Bug per alert; a second apply creates nothing
        verify:
          - workflow: Ops security_alerts (plan) on main after merge
            expect: annotation per repo with open alert counts
          - workflow: Ops security_alerts apply, run twice
            expect: second run reports 0 bugs created
        out_of_scope:
          - fixing alerts
          - secret-scanning alerts (none open; push protection blocks new ones)
        notes:
          - If the app token is refused (403) on an alert API, report the exact permission named in the error in the PR; the owner grants it.
      - key: data/ops/visibility/alerts/lane-rule
        type: Task
        title: Lane 1 owns security-alert Bugs in all three repos
        effort: S
        state: open
        contract: true
        depends_on: [data/ops/visibility/alerts/script]
        context: >-
          Lanes pick issues by key prefix; alert Bugs have no key, so the playbook must name them.
        files:
          - edit: docs/lanes.md
        steps:
          - "In the lanes table, lane 1 also owns open issues labelled `security-alert` in zohelo-data, zohelo-bi and zohelo; in Implementer step 1, these are picked first (critical and high before others)."
        acceptance:
          - docs/lanes.md names security-alert Bugs as lane 1 work, picked first
        verify:
          - run: grep -n "security-alert" docs/lanes.md
            expect: the table row and the pick rule
        out_of_scope:
          - changes to other lanes
  - key: data/ops/visibility/release-data
    title: data.zohelo.com and engine releases
    done_when:
      - a successful production portal deploy creates a Release; every Monday the engine gets a Release of the week's merges
    tasks:
      - key: data/ops/visibility/release-data/portal
        type: Task
        title: Create a GitHub Release after each production portal deploy
        effort: S
        state: open
        contract: true
        context: >-
          deploy-portal.yml deploys data.zohelo.com on push to main. The owner wants a Release per production deploy
          listing the merged PRs since the previous Release.
        files:
          - edit: .github/workflows/deploy-portal.yml
        steps:
          - "Give the deploy job `contents: write` (workflow default stays read)."
          - "Last step, only when github.ref is refs/heads/main and every earlier step succeeded: `gh release create \"portal-$(date -u +%Y%m%d-%H%M)\" --target \"$GITHUB_SHA\" --title \"data.zohelo.com $(date -u +%Y-%m-%d)\" --generate-notes` with `GH_TOKEN: ${{ github.token }}`."
        acceptance:
          - a production deploy creates a Release with generated notes; branch deploys create none
        verify:
          - workflow: next Deploy portal on main
            expect: a new Release under github.com/zohelo/zohelo-data/releases
        out_of_scope:
          - preview deploys
      - key: data/ops/visibility/release-data/engine
        type: Task
        title: Weekly Release of the zohelo-data engine
        effort: S
        state: open
        contract: true
        depends_on: [data/ops/visibility/release-data/portal]
        context: >-
          Engine changes (ingestion, warehouse, ops) are live once merged; a weekly Release gives the owner one list
          per week.
        files:
          - create: ops/release_notes.py
          - edit: .github/workflows/ops.yml
          - edit: ops/README.md
        steps:
          - "ops/release_notes.py: create Release `engine-<ISO year>-W<week>` targeting main with `POST /repos/zohelo/zohelo-data/releases` (generate_release_notes true); skip when no PR was merged since the previous engine-* Release (annotate 'no changes')."
          - "ops.yml: schedule row `'50 5 * * 1') script=release_notes; args=''` with its cron; the token is github.token with contents: write for this script only."
          - Document in ops/README.md.
        acceptance:
          - a Monday run creates one Release with the week's merged PRs, or annotates no changes
        verify:
          - workflow: Ops release_notes (manual run on main after merge)
            expect: Release engine-<year>-W<week> or "no changes"
        out_of_scope:
          - portal releases (previous Task)
  - key: data/ops/visibility/release-bi
    title: bi.zohelo.com releases
    repo: zohelo-bi
    done_when:
      - a successful production deploy of bi.zohelo.com creates a Release
    tasks:
      - key: data/ops/visibility/release-bi/deploy
        type: Task
        title: Create a GitHub Release after each production bi deploy
        effort: S
        state: open
        contract: true
        context: >-
          zohelo-bi deploy.yml deploys bi.zohelo.com on push to main. The owner wants a Release per production deploy.
        files:
          - edit: .github/workflows/deploy.yml
        steps:
          - "Give the deploy job `contents: write`."
          - "Last step, only on refs/heads/main after a passing smoke test: `gh release create \"bi-$(date -u +%Y%m%d-%H%M)\" --target \"$GITHUB_SHA\" --title \"bi.zohelo.com $(date -u +%Y-%m-%d)\" --generate-notes` with `GH_TOKEN: ${{ github.token }}`."
        acceptance:
          - a production deploy creates a Release with generated notes
        verify:
          - workflow: next deploy on main
            expect: a new Release under github.com/zohelo/zohelo-bi/releases
        out_of_scope:
          - preview deploys
  - key: data/ops/visibility/release-com
    title: zohelo.com releases
    repo: zohelo
    done_when:
      - a successful production deploy of zohelo.com creates a Release
    tasks:
      - key: data/ops/visibility/release-com/deploy
        type: Task
        title: Create a GitHub Release after each production site deploy
        effort: S
        state: open
        contract: true
        context: >-
          zohelo deploy.yml deploys zohelo.com on push to main. The owner wants a Release per production deploy. The
          design-system release workflow (com/design) uses tags `design-v*`; site releases use `site-*`.
        files:
          - edit: .github/workflows/deploy.yml
        steps:
          - "Give the deploy job `contents: write`."
          - "Last step, only on refs/heads/main after the site check passes: `gh release create \"site-$(date -u +%Y%m%d-%H%M)\" --target \"$GITHUB_SHA\" --title \"zohelo.com $(date -u +%Y-%m-%d)\" --generate-notes` with `GH_TOKEN: ${{ github.token }}`."
        acceptance:
          - a production deploy creates a Release with generated notes
        verify:
          - workflow: next deploy on main
            expect: a new Release under github.com/zohelo/zohelo/releases
        out_of_scope:
          - design-system releases
