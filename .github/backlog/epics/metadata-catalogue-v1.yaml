key: data/metadata/catalogue-v1
area: data/metadata
title: Metadata catalogue v1
phase: 1
priority: P1
target: 2026-12-18
why: >-
  bi's catalogue, explorer and dashboards and zohelo.com's indicator pages must read one list of KPIs,
  domains, sources and dimensions. Today the bi catalogue is a list of dataset names, the domain
  taxonomy is a YAML no code reads, and KPI definitions sit inside a dbt macro.
outcome: >-
  Gold holds the catalogue tables of program plan §3.4 built from owner-readable seeds; at least 40
  published KPIs with PL/EN names, one primary subgroup, units, licences and available dimensions.
in_scope:
  - seeds kpi.csv, kpi_measure.csv, unit.csv, domain.csv, domain_source_theme.csv, frequency.csv, licence.csv
  - dbt models dim_source, dim_dataset, dim_kpi, kpi_measure, kpi_dimension, dim_dimension, dim_member, dim_domain, map_domain_source_theme, freshness
  - domain mapping for the five KPI sources
out_of_scope:
  - export to 06_published (Epic data/published/published-v1)
  - release_calendar (phase 2)
done_when:
  - "`dbt build --select catalogue` green in the scheduled build"
  - gold.dim_kpi has ≥ 40 rows with status published, each with name_pl, name_en, subgroup_key, unit_key, licence
  - every published KPI has ≥ 1 kpi_dimension row for geography and time
  - warehouse/dimensions/domain.yaml deleted (replaced by seeds)
depends_on: [data/warehouse/gold-v1]
decisions: ["design 27 Oct §3.3–3.4: entities, 12 domains on CSA 2.1, natural string keys", "D5: unit_key is the unit column name everywhere", "D12: seed values in .github/backlog/assets/catalogue-seeds.md"]
deliverables:
  - key: data/metadata/catalogue-v1/seeds
    title: Catalogue seeds in the repo
    done_when:
      - warehouse/seeds/ holds frequency.csv, domain.csv, unit.csv, kpi.csv, kpi_measure.csv; dbt builds them into gold
    tasks:
      - key: data/metadata/catalogue-v1/seeds/enable-seeds
        type: Task
        title: Enable dbt seeds in the warehouse project
        effort: M
        state: open
        contract: true
        context: >-
          Runs after Gold v1. Today dbt_project.yml has no seed-paths, repo_check forbids every .csv, and
          warehouse/changed.py plans only resource_type "model", so a seed would never be rebuilt.
        files:
          - edit: warehouse/dbt_project.yml
          - edit: ops/repo_check.py
          - edit: warehouse/changed.py
          - create: warehouse/seeds/frequency.csv
          - edit: warehouse/warehouse.yaml
          - edit: warehouse/README.md
        steps:
          - "dbt_project.yml: add `seed-paths: [\"seeds\"]` and a `seeds:` block for project zohelo with `+database: r2` and `+schema: \"{{ var('gold_schema', 'gold') }}\"` (the same var the gold folder uses after the Gold v1 fold)."
          - "ops/repo_check.py repository(): skip the FORBIDDEN_SUFFIXES problem for a .csv file whose path starts with warehouse/seeds/ (all other .csv files stay forbidden)."
          - "warehouse/changed.py models(): accept resource_type in (\"model\", \"seed\"); a seed's fingerprint uses its checksum like a model; in `parents` keep ids starting with (\"model.\", \"source.\", \"seed.\"). Effect: editing a seed rebuilds the seed and the models that ref it, nothing else."
          - "Create warehouse/seeds/frequency.csv: header frequency_key,name_en,name_pl,periods_per_year; rows A,annual,roczna,1 · S,half-yearly,półroczna,2 · Q,quarterly,kwartalna,4 · M,monthly,miesięczna,12 · W,weekly,tygodniowa,52 · D,daily,dzienna,365 · B,business daily,dni robocze,250."
          - "warehouse.yaml gold list: add gold.frequency. README: add the line 'seeds/ = owner-readable code lists, built into gold'."
          - "On the branch create dev/seeds_trial.py: run warehouse.build.main(select='frequency', target='prod', variables={'gold_schema': 'zz_dev_seeds'}) and annotate the row count; with --drop it drops zz_dev_seeds. Run it in the Dev workflow, then with --drop; delete dev/ before the PR."
        acceptance:
          - "repo_check passes with warehouse/seeds/frequency.csv and fails a .csv elsewhere (try locally, then remove)"
          - "changed.py plans the seed: a local `python -c` call of changed.models(changed.manifest()) lists seed.zohelo.frequency"
          - Dev trial created 7 rows and dropped the scratch namespace
        verify:
          - run: python -m ops.repo_check
            expect: all checks ok
          - workflow: Dev · branch runs, script seeds_trial, on the branch
            expect: "notice 'seed frequency: 7 rows', then 'dropped zz_dev_seeds'"
        out_of_scope: [other seeds, catalogue models]
      - key: data/metadata/catalogue-v1/seeds/domain
        type: Task
        title: Seed the 12-domain taxonomy (domain.csv)
        effort: S
        state: open
        contract: true
        depends_on: [data/metadata/catalogue-v1/seeds/enable-seeds]
        context: >-
          The catalogue navigates by 12 plain-language domains with groups on top of UN CSA 2.1 (design
          27 Oct §3.4). warehouse/dimensions/domain.yaml holds CSA codes only and no code reads it. The
          architect wrote every row in .github/backlog/assets/catalogue-seeds.md.
        files:
          - create: warehouse/seeds/domain.csv
          - delete: warehouse/dimensions/domain.yaml
          - edit: warehouse/dimensions/README.md
          - edit: warehouse/warehouse.yaml
        steps:
          - "Create warehouse/seeds/domain.csv with header domain_key,level,parent_key,name_en,name_pl,csa_code,sort and exactly the 79 rows of the domain.csv table in .github/backlog/assets/catalogue-seeds.md (empty parent_key for domains); quote fields containing commas."
          - "Delete warehouse/dimensions/domain.yaml; in warehouse/dimensions/README.md replace its line by 'domains: warehouse/seeds/domain.csv'."
          - "warehouse/catalog.py reads warehouse/dimensions/*.yaml by glob; run `python -c \"import warehouse.catalog\"` to confirm it still imports."
          - "warehouse.yaml gold list: add gold.domain."
        acceptance:
          - 12 domain, 61 group and 6 subgroup rows; keys unique; every parent_key exists
        verify:
          - run: python -c "import csv,collections as c;r=list(csv.DictReader(open('warehouse/seeds/domain.csv',encoding='utf-8')));k={x['domain_key'] for x in r};print(dict(c.Counter(x['level'] for x in r)),len(k)==len(r),all(x['parent_key'] in k for x in r if x['parent_key']))"
            expect: "{'domain': 12, 'group': 61, 'subgroup': 6} True True"
          - run: python -m ops.repo_check
            expect: all checks ok
        out_of_scope: [source theme mapping (Deliverable domain-mapping)]
      - key: data/metadata/catalogue-v1/seeds/kpi
        type: Task
        title: Seed KPIs and units from the PoC concepts
        effort: M
        state: open
        contract: true
        depends_on: [data/metadata/catalogue-v1/seeds/domain]
        context: >-
          KPI definitions live in the VALUES list of macro poc_concepts in warehouse/macros/poc_blocks.sql
          (concept_key, name_en, name_pl, unit, source_system, measure_key_pattern, definition). The
          catalogue needs them as seeds; units become unit_key codes. All values to use are in
          .github/backlog/assets/catalogue-seeds.md (unit.csv table, unit text mapping, kpi subgroup table).
        files:
          - create: warehouse/seeds/kpi.csv
          - create: warehouse/seeds/kpi_measure.csv
          - create: warehouse/seeds/unit.csv
          - edit: warehouse/macros/poc_blocks.sql
          - edit: warehouse/warehouse.yaml
        steps:
          - "unit.csv: the 13 rows of the unit.csv table in the assets file."
          - "kpi.csv header kpi_key,name_en,name_pl,unit_key,subgroup_key,frequency_default,status,definition_en: one row per distinct concept_key in poc_concepts (18); unit_key via the mapping in the assets file; subgroup_key and status from the kpi table there; frequency_default A, except inflation M and fx_rate, gold_price D; definition_en empty."
          - "kpi_measure.csv header kpi_key,source_system,measure_key_pattern,definition,priority: one row per VALUES row of poc_concepts (32), same order; priority 1 for the first row of each concept, then 2, 3…"
          - "poc_concepts: replace the VALUES list by a select joining ref('kpi_measure') to ref('kpi') and ref('unit') that returns concept_key, name_en, name_pl, unit (unit.name_en), source_system, measure_key_pattern, definition in that order, ordered by kpi_key, priority."
          - "warehouse.yaml gold list: add gold.kpi, gold.kpi_measure, gold.unit."
          - "On the branch create dev/kpi_seed_trial.py building `--select unit kpi kpi_measure poc_dim_concept` into zz_dev_kpi (gold_schema var) and annotating the dim_concept row count next to the production gold table's count; --drop removes zz_dev_kpi. Run it, then --drop; delete dev/ before the PR."
        acceptance:
          - "kpi.csv 18 rows, kpi_measure.csv 32 rows, unit.csv 13 rows; every unit_key and subgroup_key exists in unit.csv / domain.csv"
          - dim_concept row count in the trial equals production
        verify:
          - workflow: Dev · branch runs, script kpi_seed_trial, on the branch
            expect: "notice 'dim_concept rows: <n> trial = <n> prod'"
          - run: python -m ops.repo_check
            expect: all checks ok
        out_of_scope: [new KPIs (Deliverable kpis-40), definitions text]
  - key: data/metadata/catalogue-v1/models
    title: Catalogue tables built in gold
    depends_on: [data/metadata/catalogue-v1/seeds]
    done_when:
      - the §3.4 entities exist as dbt models with tests (unique keys, not null names)
    tasks:
      - key: data/metadata/catalogue-v1/models/licence-source
        type: Task
        title: Seed licences and sources; add licence and register id to dim_source
        effort: M
        state: open
        contract: true
        depends_on: [data/metadata/catalogue-v1/seeds/kpi]
        context: >-
          warehouse/models/gold/poc_dim_source.sql (gold.dim_source) is a VALUES list of the 10 sources without
          licence or register id; catalog.json needs both and licences[] (docs/published.md). The rows of
          both seeds are in .github/backlog/assets/catalogue-seeds.md (tables licence.csv, source.csv).
        files:
          - create: warehouse/seeds/licence.csv
          - create: warehouse/seeds/source.csv
          - create: warehouse/seeds/_seeds.yml
          - edit: warehouse/models/gold/poc_dim_source.sql
          - edit: warehouse/models/gold/_gold.yml
          - edit: warehouse/warehouse.yaml
          - edit: ops/repo_check.py
        steps:
          - "Create licence.csv (8 rows) and source.csv (10 rows) exactly as the two tables of the assets file."
          - "poc_dim_source.sql: keep the config; replace the VALUES query by `select source_key as source_system, name_pl, name_en, publisher, family, block_kind, register_id, provider_type, licence_key, url from {{ ref('source') }}`."
          - "_seeds.yml (version: 2, seeds:): licence.licence_key tests [not_null, unique]; source.source_key and source.register_id tests [not_null, unique]; source.licence_key a relationships test to ref('licence') field licence_key (syntax as in _gold.yml)."
          - "_gold.yml poc_dim_source: column register_id, tests [not_null, unique]."
          - "warehouse.yaml gold list: new line after the gold.unit line: `gold.licence, gold.source,  # seeds warehouse/seeds/licence.csv, source.csv`."
          - "ops/repo_check.py register(): read both CSVs (csv.DictReader); a problem when a source.csv register_id is not the register entry whose source_system is its source_key, when a register source_system has no row, or a licence_key is not in licence.csv."
          - "Dev trial: dev/catalogue_seeds_trial.py modelled on `git show b62f65e:dev/seeds_trial.py`: namespace zz_dev_licence_source, select 'licence source poc_dim_source', annotate notice 'rows: licence <n>, source <n>, dim_source <n>'; --drop as there. Run, then --drop; delete dev/ before the PR."
        acceptance:
          - "licence.csv 8 rows, source.csv 10 rows, keys as in the assets file"
          - "repo_check fails when a register_id is changed to GL-002 (try, revert)"
          - "trial: 8, 10 and 10 rows; tests pass"
        verify:
          - run: python -m ops.repo_check
            expect: all checks ok
          - workflow: Dev · branch runs, script catalogue_seeds_trial, on the branch
            expect: "notice 'rows: licence 8, source 10, dim_source 10', then 'dropped zz_dev_licence_source'"
        out_of_scope: [ingestion/register.yaml, other catalogue models]
      - key: data/metadata/catalogue-v1/models/dim-dataset
        type: Task
        title: Build gold.dim_dataset from gold.coverage
        effort: S
        state: open
        contract: true
        depends_on: [data/warehouse/gold-v1/fold/cutover]
        context: >-
          The catalogue lists datasets (blocks a source publishes, key like eurostat:UNE_RT_A; program plan
          §3.4). gold.coverage (dbt source gold_coverage.coverage, written by ingestion/common/coverage.py)
          has one row per block and source with status, versions and checked_at; DBW has one row per
          yearly file. The `coverage` CTE of warehouse/models/gold/poc_dim_measure.sql already normalises
          block ids for five sources; dim_dataset uses the same rules for every source.
        files:
          - create: warehouse/models/gold/dim_dataset.sql
          - create: warehouse/models/gold/dim_dataset.yml
          - edit: warehouse/warehouse.yaml
        steps:
          - "dim_dataset.sql (no config): from source('gold_coverage', 'coverage'), normalise block_id and block_name with the two CASE expressions of the poc_dim_measure `coverage` CTE, without its source filter; group by source and the normalised block_id."
          - "Columns: source || ':' || block_id as dataset_key, source as source_key, block_id as code, any_value(block_name) as name, min(status) as status, max(published_version) as published_version, max(landed_version) as landed_version, bool_and(in_bronze) as in_bronze, sum(silver_rows) as silver_rows, count(*) as files, max(checked_at) as checked_at."
          - "dim_dataset.yml: version 2, model dim_dataset with a one-line description; tests dataset_key [not_null, unique], source_key [not_null], status [not_null]."
          - "warehouse.yaml: gold list, new line after the gold.coverage line: `gold.dim_dataset,  # catalogue: one row per source block (from gold.coverage)`; full_rebuild, last entry: `dim_dataset: {rows: 40000}`."
          - "Dev trial: dev/dim_dataset_trial.py modelled on `git show b62f65e:dev/seeds_trial.py`: namespace zz_dev_dim_dataset, select 'dim_dataset', annotate notice 'dim_dataset: <n> rows' with the row count per source_key; --drop. Run, then --drop; delete dev/ before the PR."
        acceptance:
          - "tests pass in the trial; every source of gold.coverage has rows; total ≤ 40,000"
          - "sqlfluff and repo_check pass"
        verify:
          - run: python -m ops.repo_check
            expect: all checks ok
          - workflow: Dev · branch runs, script dim_dataset_trial, on the branch
            expect: "notice 'dim_dataset: <n> rows' with counts for eurostat, gus_bdl, gus_dbw, world_bank_wdi, nbp; then 'dropped zz_dev_dim_dataset'"
        out_of_scope: [poc_dim_measure.sql, names in two languages and native themes (later Task), freshness]
      - key: data/metadata/catalogue-v1/models/kpi-dimension
        type: Task
        title: Build gold.kpi_dimension from the KPIs' measures
        effort: M
        state: open
        contract: true
        depends_on: [data/warehouse/gold-v1/fold/cutover, data/metadata/catalogue-v1/seeds/kpi]
        context: >-
          catalog.json needs each KPI's dimensions (docs/published.md kpis[].dimensions, geo_levels). Gold
          already has which measures belong to a KPI (poc_concept_measures: concept_key = kpi_key,
          measure_key, source_system), which dimensions a measure offers (poc_measure_dimensions: measure_key,
          dimension, members, member_count, has_unmatched; dimension 'geography' lists level names, 'time'
          lists frequencies) and each measure's range (poc_dim_measure.first_date, last_date).
        files:
          - create: warehouse/models/gold/kpi_dimension.sql
          - create: warehouse/models/gold/kpi_dimension.yml
          - edit: warehouse/warehouse.yaml
        steps:
          - "kpi_dimension.sql (no config): from ref('poc_concept_measures') cm inner join ref('poc_measure_dimensions') md on measure_key inner join ref('poc_dim_measure') m on measure_key; select cm.concept_key as kpi_key, md.dimension as dimension_key, cm.measure_key, cm.source_system, md.members, md.member_count, md.has_unmatched, m.first_date, m.last_date."
          - "kpi_dimension.yml: version 2; tests kpi_key [not_null, relationships to ref('kpi') field kpi_key], dimension_key [not_null], measure_key [not_null, relationships to ref('poc_dim_measure') field measure_key]."
          - "warehouse.yaml: gold list, new line after the gold.domain line: `gold.kpi_dimension,  # catalogue: dimensions per KPI and measure`; full_rebuild, after poc_measure_dimensions: `kpi_dimension: {rows: 10000}`."
          - "Dev trial: dev/kpi_dimension_trial.py modelled on `git show b62f65e:dev/seeds_trial.py`: namespace zz_dev_kpi_dimension; select 'gold' plus every seed name (file names in warehouse/seeds/ without .csv); annotate notice 'kpi_dimension: <n> rows' with, per kpi of kpi.csv with status published, the list of its dimension_keys; --drop. Run, then --drop; delete dev/ before the PR."
        acceptance:
          - "each published KPI (population, gdp_current_prices, inflation, unemployment_rate, fx_rate) has rows for geography and time"
          - "all tests pass in the trial; rows ≤ 10,000; repo_check passes"
        verify:
          - run: python -m ops.repo_check
            expect: all checks ok
          - workflow: Dev · branch runs, script kpi_dimension_trial, on the branch
            expect: "notice 'kpi_dimension: <n> rows', every published KPI lists geography and time; then 'dropped zz_dev_kpi_dimension'"
        out_of_scope: [dim_dimension and dim_member, the poc_* models, publish.py]
      - key: data/metadata/catalogue-v1/models/dimension-inventory
        type: Task
        title: Report the dimensions and units of the published KPIs' measures
        effort: S
        state: open
        contract: false
        verify_only: true
        context: >-
          The architect writes dim_dimension, dim_member and the unit checks of the quality Epic from what prod
          Gold holds today: which dimension keys, members and units the published KPIs' measures have. Tables:
          gold.concept_measures (concept_key = kpi_key, measure_key, source_system), gold.measure_dimensions
          (measure_key, dimension, members, member_count, has_unmatched), gold.dim_measure (measure_key, unit_key).
          Verify-only: nothing is merged.
        files: []
        steps:
          - "Branch test/<this issue number>-catalogue-inventory from origin/main; this Task has no PR."
          - "dev/catalogue_inventory.py: read the three tables with ingestion.common.r2 catalog() (load_table(...).scan().to_arrow()); published = kpi_key of the warehouse/seeds/kpi.csv rows with status published, in file order."
          - "For each published KPI: annotate notice f'inventory: {kpi_key}' with {measure_key: {source: source_system, unit: unit_key, dims: {dimension: [member_count, first 6 members]}}} of its measures."
          - "Then annotate notice 'inventory: breakdowns' with {dimension: first 20 sorted distinct members} over those measures for every dimension other than geography and time, and write the full result (all members) as JSON to $DEV_OUTPUT_DIR/catalogue_inventory.json."
          - "Push the branch and run Dev · branch runs with script catalogue_inventory."
          - "Comment on this issue: the run URL and the six annotation messages verbatim (gh api repos/zohelo/zohelo-data/check-runs/<job id>/annotations); then close the issue. Leave the branch (Ops branch_cleanup removes test/ branches)."
        acceptance:
          - "six notices: one per published KPI and 'inventory: breakdowns'; no error"
          - "the closing comment holds all six messages"
        verify:
          - workflow: Dev · branch runs, script catalogue_inventory, on test/<n>-catalogue-inventory
            expect: "notices 'inventory: population', 'inventory: gdp_current_prices', 'inventory: inflation', 'inventory: unemployment_rate', 'inventory: fx_rate', 'inventory: breakdowns'"
        out_of_scope: [any change on main, writing dim_dimension or dim_member, unit tests]
      - key: data/metadata/catalogue-v1/models/measure-dataset-key
        type: Task
        title: Add dataset_key to gold.dim_measure
        effort: S
        state: open
        contract: true
        depends_on: [data/warehouse/gold-v1/fold/cutover]
        context: >-
          The catalogue links each measure to its dataset (program plan §3.4: dim_measure.dataset_key).
          gold.dim_dataset (Task models/dim-dataset) keys a dataset as source || ':' || block_id with the
          block ids normalised like the `coverage` CTE of warehouse/models/gold/poc_dim_measure.sql. That
          model (gold.dim_measure) already has source_system and the normalised block_id in both branches
          of its final union, but no dataset_key.
        files:
          - edit: warehouse/models/gold/poc_dim_measure.sql
          - edit: warehouse/models/gold/_gold.yml
        steps:
          - "poc_dim_measure.sql, first select of the final union: add `b.source_system || ':' || b.block_id as dataset_key,` right after `b.measure_key,`."
          - "Second select (from coverage): add `source_system || ':' || block_id as dataset_key,` right after the measure_key line, so the column is second in both selects."
          - "Header comment: add 'dataset_key = source_system:block_id, the key of gold.dim_dataset.'"
          - "_gold.yml, poc_dim_measure columns: `- name: dataset_key` with tests [not_null]."
          - "Dev trial dev/measure_dataset_key_trial.py modelled on dev/seeds_trial.py of commit b62f65e (`gh api 'repos/zohelo/zohelo-data/contents/dev/seeds_trial.py?ref=b62f65e' --jq .content | base64 -d`): namespace zz_dev_measure_dataset_key; select 'gold' plus every seed name (warehouse/seeds/*.csv without .csv); annotate notice 'dim_measure dataset_key' with rows, rows with null dataset_key, distinct dataset_key per source_system, and the dataset_key of the first measure_key starting 'eurostat:UNE_RT_A'; --drop as there. Run, then --drop; delete dev/ before the PR."
        acceptance:
          - "trial: build exit 0; 0 null dataset_key; the UNE_RT_A sample is 'eurostat:UNE_RT_A'"
          - sqlfluff and repo_check pass
        verify:
          - run: python -m ops.repo_check
            expect: all checks ok
          - workflow: Dev · branch runs, script measure_dataset_key_trial, on the branch
            expect: "notice 'dim_measure dataset_key' with 0 null and sample eurostat:UNE_RT_A; then 'dropped zz_dev_measure_dataset_key'"
        out_of_scope:
          - a relationships test to dim_dataset (after models/dim-dataset merges)
          - names, units and other dim_measure columns; dim_dataset.sql
      - key: data/metadata/catalogue-v1/models/sex-axis-alias
        type: Task
        title: Map the GUS DBW axis Płeć onto the conformed sex dimension
        effort: M
        state: open
        contract: true
        depends_on: [data/metadata/catalogue-v1/models/dim-dimension, data/warehouse/gold-v1/coverage/sex]
        context: >-
          Today gold.dim_dimension lists the DBW axis `Płeć` as source_specific next to the conformed `sex`,
          with Polish labels as members, and DBW totals get sex_key `_Z`. Target: a seed maps a source axis to
          a conformed axis; a `sex` axis lists dim_series.sex_key codes (M, F, _T) as members.
        files:
          - create: warehouse/seeds/dimension_alias.csv
          - edit: warehouse/seeds/_seeds.yml
          - edit: warehouse/models/gold/poc_measure_dimensions.sql
          - edit: warehouse/models/gold/poc_build_dbw.sql
          - edit: warehouse/warehouse.yaml
        steps:
          - "dimension_alias.csv: header `source_system,source_dimension,dimension_key`; row `gus_dbw,Płeć,sex`. _seeds.yml: seed dimension_alias, dimension_key tests [not_null, relationships to ref('dimension') dimension_key] in the form of source.licence_key."
          - "poc_build_dbw.sql: per_row adds `bool_or(lower(l.dim_name) = 'płeć' and lower(l.pos_label) in ('ogółem', 'razem')) as is_sex_total`; shaped adds `when r.is_sex_total then 'T'` after the is_women branch of sex_code."
          - "poc_measure_dimensions.sql, CTE breakdowns: the inner select also takes source_system and sex_key; left join ref('dimension_alias') a on source_system and key = a.source_dimension; dimension = coalesce(a.dimension_key, key); for dimension 'sex' members = list(distinct sex_key order by sex_key), member_count = count(distinct sex_key), else unchanged; group by measure_key and that dimension."
          - "warehouse.yaml gold list: `gold.dimension, gold.dimension_alias, gold.dim_dimension,  # catalogue: axes`."
          - "dev/sex_axis_trial.py modelled on dev/seeds_trial.py of commit b62f65e: namespace zz_dev_sex_axis, select 'gold' plus every seed; notice 'sex axis' with build_exit, source_specific keys of dim_dimension and the distinct members of measure_dimensions rows with dimension 'sex'; --drop. Run, --drop, delete dev/."
        acceptance:
          - "`Płeć` is not a dim_dimension key; sex members ⊆ {M, F, _T}"
          - sqlfluff and repo_check pass
        verify:
          - run: PYTHONPATH=. python -m ops.repo_check
            expect: all checks ok
          - workflow: Dev · branch runs, script sex_axis_trial, on the branch
            expect: "notice 'sex axis': build_exit 0, no Płeć, members only M, F, _T; then 'dropped zz_dev_sex_axis'"
        out_of_scope: [axes Grupy wieku and Charakter miejscowości, BDL n1–n5, dim_member]
      - key: data/metadata/catalogue-v1/models/dim-dimension
        type: Task
        title: Build gold.dim_dimension from measure_dimensions and a seed
        effort: M
        state: open
        contract: true
        depends_on: [data/warehouse/gold-v1/fold/cutover]
        context: >-
          The catalogue lists every axis a KPI can be cut by. gold.measure_dimensions has a row per measure
          and dimension: geography, time and each breakdown_json key (e.g. BDL n1–n5, NBP currency).
          Conformed axes get names from a seed; others are source_specific, named by key.
        files:
          - create: warehouse/seeds/dimension.csv
          - create: warehouse/models/gold/dim_dimension.sql
          - create: warehouse/models/gold/dim_dimension.yml
          - edit: warehouse/warehouse.yaml
        steps:
          - "dimension.csv, header dimension_key,name_en,name_pl,kind,standard; rows, one per line: geography,Geography,Geografia,conformed,TERYT/NUTS · time,Time,Czas,conformed,SDMX CL_FREQ · sex,Sex,Płeć,conformed,SDMX CL_SEX · age,Age,Wiek,conformed,SDMX CL_AGE · currency,Currency,Waluta,conformed,ISO 4217."
          - "dim_dimension.sql (no config): CTE used = dimension as dimension_key, count(distinct measure_key) as measure_count from ref('poc_measure_dimensions') grouped by dimension; ref('dimension') d full outer join used u on dimension_key; select coalesce(d.dimension_key, u.dimension_key) as dimension_key, coalesce(d.name_en, u.dimension_key) as name_en, the same for name_pl, coalesce(d.kind, 'source_specific') as kind, d.standard, coalesce(u.measure_count, 0) as measure_count."
          - "dim_dimension.yml: version 2; tests dimension_key [not_null, unique], name_en [not_null], name_pl [not_null], kind [not_null, {accepted_values: {arguments: {values: [conformed, entity, source_specific]}}}]."
          - "warehouse.yaml: gold list, new line before the gold.build_bdl line: `gold.dimension, gold.dim_dimension,  # catalogue: axes`; full_rebuild, last entry: `dim_dimension: {rows: 1000}`."
          - "Dev trial dev/dim_dimension_trial.py modelled on dev/seeds_trial.py of commit b62f65e (`gh api 'repos/zohelo/zohelo-data/contents/dev/seeds_trial.py?ref=b62f65e' --jq .content | base64 -d`): namespace zz_dev_dim_dimension; select 'gold' plus every seed name; notice 'dim_dimension' with the keys per kind; --drop as there. Run, then --drop; delete dev/ before the PR."
        acceptance:
          - "trial: exit 0; 5 conformed rows; geography, time measure_count > 0"
          - sqlfluff and repo_check pass
        verify:
          - run: python -m ops.repo_check
            expect: all checks ok
          - workflow: Dev · branch runs, script dim_dimension_trial, on the branch
            expect: "notice 'dim_dimension' with 5 conformed keys; then 'dropped zz_dev_dim_dimension'"
        out_of_scope: [dim_member, mapping source keys to conformed axes]
    todo:
      - "dim_dataset: native theme path, frequency_keys and PL/EN names from Silver metadata; dim_measure: relationships test dataset_key → dim_dataset, PL/EN names"
      - "dim_member from dim_geography, dim_frequency, the sex seed and dim_series breakdowns (PL/EN naming rule for source labels needed)"
      - "DBW axes Grupy wieku (→ age, needs a label → CL_AGE code mapping) and Charakter miejscowości (no conformed axis yet; urbanisation needs a Domain expert review) stay source_specific"
      - "freshness from gold.coverage (checked_at, loaded_at, lag_days): needs a decision on where loaded_at comes from (gold.coverage has no load time)"
