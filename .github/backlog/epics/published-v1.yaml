key: data/published/published-v1
area: data/published
title: Published layer v1
phase: 1
priority: P1
target: 2027-01-08
why: >-
  Public pages must not query the lakehouse at runtime. Small derived files (catalogue, per-KPI
  extracts, geometry, change feed) rebuilt after every Gold build give both portals fast, cheap,
  consistent reads.
outcome: >-
  06_published/v1/ holds catalog, manifest, kpi/<key>/latest.json and series.parquet, geo files and
  feed/changes.json + calendar.ics, rebuilt whole by gold.publish; contract tests compare with Gold.
in_scope:
  - the published contract (docs/published.md, JSON Schemas, fixtures), written first so consumers can build against it
  - activity gold.publish after silver_gold.build; warehouse/publish.py is the only writer of every Published file
  - contract tests (values equal Gold, schema stable)
  - retire _portal_catalog/v1
out_of_scope:
  - site and bi code reading the files (their Epics)
done_when:
  - every scheduled Gold build is followed by a green gold.publish
  - contract test passes for every published KPI (latest value equals Gold)
  - _portal_catalog/ prefix deleted
decisions:
  - "D5 (architect 27 Oct): producer writes the contract first; unit_key everywhere; geo levels country, voivodeship, powiat, gmina, nuts1, nuts2; publish.py is the sole writer, catalog.py only builds the manifest object"
  - "Contract files live next to the code that writes them: warehouse/published/ (schemas, fixtures); consumers copy fixtures, never edit them"
deliverables:
  - key: data/published/published-v1/contract
    title: Published contract written
    done_when:
      - docs/published.md defines every path, field, size limit and the versioning rule
      - warehouse/published/schemas/*.schema.json and fixtures exist and repo_check validates fixtures against schemas
    tasks:
      - key: data/published/published-v1/contract/doc
        type: Task
        title: Write the published-layer contract (docs/published.md)
        effort: S
        state: open
        contract: true
        context: >-
          zohelo-bi and zohelo.com will read small files from 06_published/v1/ in the lakehouse bucket
          (program plan §3.5) and build against this contract before the files exist. The architect fixed
          every path, field and limit in .github/backlog/assets/published-contract.md; this Task turns it
          into the repo's contract document without changing any name.
        files:
          - create: docs/published.md
          - edit: docs/architecture.md
        steps:
          - "Create docs/published.md with the sections of the assets file in the same order: Rules, catalog/catalog.json, catalog/<table>.parquet, manifest.json, kpi/<kpi_key>/latest.json, kpi/<kpi_key>/series.parquet, geo/<level>.geojson, feed, Size limits."
          - "Under each path write a Markdown table with columns field, type, required, meaning; one row per field listed in the assets file (nested arrays as 'kpis[].kpi_key' rows); types string, number, integer, boolean, array, object, date."
          - "Copy every key name exactly (unit_key, geography_key, geo levels country, voivodeship, powiat, gmina, nuts1, nuts2)."
          - "docs/architecture.md: add one line linking docs/published.md where the layers are listed."
        acceptance:
          - every field of the assets file appears once in a table with the same name
        verify:
          - run: grep -c "^## " docs/published.md
            expect: "9"
          - run: python -m ops.repo_check
            expect: all checks ok
        out_of_scope: [code that writes the files (Deliverable publish), JSON Schemas (next Task)]
      - key: data/published/published-v1/contract/schemas
        type: Task
        title: Add JSON Schemas and fixtures for the published contract
        effort: M
        state: open
        contract: true
        depends_on: [data/published/published-v1/contract/doc]
        context: >-
          Consumers (zohelo-bi, zohelo.com) copy these fixtures into their tests, so the files must match
          docs/published.md exactly. No JSON Schema library is installed in zohelo-data; repo_check gets a
          small built-in check (required keys and JSON types of each schema's properties), enough to keep
          fixtures and schemas in step.
        files:
          - create: warehouse/published/schemas/catalog.schema.json
          - create: warehouse/published/schemas/manifest.schema.json
          - create: warehouse/published/schemas/kpi_latest.schema.json
          - create: warehouse/published/schemas/feed_changes.schema.json
          - create: warehouse/published/fixtures/catalog/catalog.json
          - create: warehouse/published/fixtures/manifest.json
          - create: warehouse/published/fixtures/kpi/unemployment_rate/latest.json
          - create: warehouse/published/fixtures/feed/changes.json
          - create: warehouse/published/fixtures/geo/voivodeship.geojson
          - create: warehouse/published/README.md
          - edit: ops/repo_check.py
        steps:
          - "Write one JSON Schema (draft 2020-12) per JSON path of docs/published.md with `required` lists and `type` for every property, `additionalProperties: true` (additive changes allowed)."
          - "Fixtures: catalog.json with the 5 published KPIs (population, gdp_current_prices, inflation, unemployment_rate, fx_rate) using keys from warehouse/seeds/*.csv; manifest.json with the same 5 metrics; latest.json for unemployment_rate with 2 values (PL country, TERC:12 voivodeship); changes.json with 2 items; voivodeship.geojson with one simplified square Feature for TERC:12 (Małopolskie). Values are illustrative and say so in generated_at '2026-01-01T00:00:00Z'."
          - "README.md: 'Contract of 06_published/v1 — see docs/published.md. Consumers copy fixtures; change schemas only with a contract-labelled PR.'"
          - "ops/repo_check.py: add check `published contract`: for each fixture JSON file, load the schema with the matching name and check every required key exists and every present property's JSON type matches (recursing into objects and array items). Register it in the checks list like the other checks."
        acceptance:
          - repo_check shows 'ok   published contract'; removing a required key from a fixture makes it fail
        verify:
          - run: python -m ops.repo_check
            expect: "'ok   published contract' and all other checks ok"
        out_of_scope: [series.parquet and catalog parquet fixtures (written by publish.py tests later)]
      - key: data/published/published-v1/contract/geo-schema
        type: Task
        title: Validate the geo fixture against a GeoJSON schema
        effort: S
        state: open
        contract: true
        depends_on: [data/published/published-v1/contract/schemas]
        context: >-
          The Deliverable needs repo_check to validate every fixture against a schema. Today
          ops/repo_check.py published_contract() reads only fixtures/**/*.json, so
          warehouse/published/fixtures/geo/voivodeship.geojson (docs/published.md, geo/<level>.geojson)
          is never checked and has no schema.
        files:
          - create: warehouse/published/schemas/geo.schema.json
          - edit: ops/repo_check.py
          - edit: warehouse/published/README.md
        steps:
          - "geo.schema.json, same header style as kpi_latest.schema.json ($id .../geo.schema.json, title '06_published/v1/geo/<level>.geojson'): object, required [type, features]; type string; features array of objects with required [type, properties, geometry]; type string; properties object with required [geography_key, name_pl, name_en, level], those four and parent_key typed string; geometry object with required [type, coordinates], type string, coordinates array. additionalProperties true on every object."
          - "repo_check.py PUBLISHED_SCHEMAS: add \"geo/*.geojson\": \"geo\"."
          - "published_contract(): loop over sorted([*fixtures.rglob('*.json'), *fixtures.rglob('*.geojson')]); for a .geojson fixture also add f\"{rel}: feature {i} level {level!r} is not {fixture.stem!r}\" for every feature whose properties.level differs from the file stem. Mention GeoJSON in the docstring."
          - "README.md: `schemas/` line reads 'one JSON Schema (draft 2020-12) per JSON or GeoJSON file of the contract'."
        acceptance:
          - "repo_check prints 'ok   published contract'"
          - "removing name_en from the geo fixture, or setting its level to 'powiat', fails the check (try, revert)"
        verify:
          - run: "python -c \"from ops.repo_check import published_contract as c;print(c())\""
            expect: "[]"
          - run: python -m ops.repo_check
            expect: all checks ok
        out_of_scope: [the geo fixture's content, size-limit checks, publish.py]
  - key: data/published/published-v1/publish
    title: gold.publish activity
    depends_on: [data/published/published-v1/contract, data/metadata/catalogue-v1, data/metadata/semantic-manifest/generate]
    done_when:
      - warehouse.yaml lists gold.publish; Pipeline runs it after the build; files present
    tasks:
      - key: data/published/published-v1/publish/kpi-latest
        type: Task
        title: Write kpi/<kpi_key>/latest.json from Gold (warehouse/publish.py)
        effort: L
        state: open
        contract: true
        depends_on: [data/published/published-v1/contract/schemas]
        context: >-
          06_published/v1/kpi/<kpi_key>/latest.json (docs/published.md, schema kpi_latest.schema.json) has
          no writer. warehouse/publish.py becomes the only writer of 06_published/ (D5); the architect wrote
          its shared parts and the latest.json rules in .github/backlog/assets/publish-writers.md.
        files:
          - create: warehouse/publish.py
          - edit: docs/published.md
        steps:
          - "Create warehouse/publish.py with a module docstring (gold.publish, sole writer, docs/published.md) and every item of the assets file's section 'Shared parts', as written."
          - "Add kpi_latest, checked and main exactly as the section 'kpi/<kpi_key>/latest.json' of the assets file says."
          - "docs/published.md, under the latest.json table: one paragraph with rules 1–4 of the assets file in plain words and the fx_rate skip."
          - "dev/publish_latest_trial.py: call main(prefix='zz_dev_published/v1/') (reads prod Gold), then delete every object under zz_dev_published/ and annotate notice 'deleted <n>'. Run it in Dev; delete dev/ before the PR."
        acceptance:
          - "the local verify prints 2 values, previous_period 2024 and no schema problem"
          - "trial: 4 files written (population, gdp_current_prices, inflation, unemployment_rate), each with PL, then removed"
        verify:
          - run: "python -c \"import json,datetime as d,pyarrow as pa;from warehouse.publish import kpi_latest;from ops.repo_check import _schema_problems as p;t=pa.table({'source_system':['eurostat']*3,'measure_key':['m']*3,'geography_key':['PL','PL','TERC:12'],'geography_level':['country','country','wojewodztwo'],'date_key':[d.date(2025,1,1),d.date(2024,1,1),d.date(2025,1,1)],'frequency':['A']*3,'value':[3.2,2.9,2.6],'observation_status_key':['ok','ok','provisional']});r=kpi_latest(t,[],{},'unemployment_rate','pct_labour_force','2026-01-01T00:00:00Z');print(len(r['values']),r['values'][0]['previous_period'],p(r,json.load(open('warehouse/published/schemas/kpi_latest.schema.json')),'$'))\""
            expect: "2 2024 []"
          - workflow: Dev · branch runs, script publish_latest_trial, on the branch
            expect: "notice 'gold.publish: latest' with 4 KPIs written, skipped fx_rate, missing []; then the deleted count"
          - run: python -m ops.repo_check
            expect: all checks ok
        out_of_scope: [series.parquet, catalog, manifest, geo, feed, warehouse.yaml activity, pipeline.yml]
    todo:
      - "warehouse/publish.py (sole writer): catalog.json + parquet, manifest.json (object built by warehouse/catalog.py), kpi series.parquet, geo (simplified from PRG), feed"
      - "Add activity to warehouse.yaml and pipeline.yml job order (after silver-gold-build)"
      - "Delete _portal_catalog/v1 writer and objects after both portals switch"
  - key: data/published/published-v1/tests
    title: Contract tests
    depends_on: [data/published/published-v1/publish]
    done_when:
      - gold.publish fails when a published value differs from Gold or a schema field is missing
    tasks:
      - key: data/published/published-v1/tests/key-patterns
        type: Task
        title: Add key and timestamp patterns to the published schemas
        effort: S
        state: open
        contract: true
        depends_on: [data/published/published-v1/contract/schemas]
        context: >-
          Decision D24: the schemas in warehouse/published/schemas/ own the format of keys and timestamps;
          consumers validate only what they declare. Today they declare types only, and
          ops/repo_check.py _schema_problems ignores `pattern`. Domain keys contain dots
          (economy.prices), so hierarchy keys get their own pattern.
        files:
          - edit: ops/repo_check.py
          - edit: warehouse/published/schemas/catalog.schema.json
          - edit: warehouse/published/schemas/manifest.schema.json
          - edit: warehouse/published/schemas/kpi_latest.schema.json
          - edit: warehouse/published/schemas/feed_changes.schema.json
          - edit: docs/published.md
        steps:
          - "repo_check.py _schema_problems: after the type check, when value is a str and the schema has `pattern` and re.search(pattern, value) is None, add the problem f\"{where}: {value!r} does not match {pattern}\"."
          - "Schemas: add `\"pattern\": \"^[a-z0-9_]+$\"` to every kpi_key, unit_key, source_key, licence_key and dimension_key property, and to the items of kpis[].source_keys and items[].kpi_keys."
          - "Add pattern `^[a-z0-9_]+(\\.[a-z0-9_]+)*$` to kpis[].subgroup_key, the items of kpis[].domain_path, domains[].domain_key and domains[].parent_key (null stays allowed by its type)."
          - "Add pattern `^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2}(\\.[0-9]+)?)?Z$` to every generated_at, kpis[].loaded_at, values[].checked_at and items[].at."
          - "No pattern on geography_key, dataset_key, periods or names."
          - "docs/published.md, Rules: new bullet 'Formats: keys match `^[a-z0-9_]+$`, domain keys dot-separated segments of that form, timestamps `YYYY-MM-DDTHH:MM[:SS[.f]]Z`; the schemas declare them as `pattern` (D24).'"
        acceptance:
          - repo_check passes with the fixtures unchanged
          - "a fixture kpi_key 'Unemployment-Rate' or generated_at '2026-01-01 00:00' fails 'published contract' (try, revert)"
        verify:
          - run: "python -c \"import json;from ops.repo_check import _schema_problems as p;s=json.load(open('warehouse/published/schemas/kpi_latest.schema.json'));f=json.load(open('warehouse/published/fixtures/kpi/unemployment_rate/latest.json'));f['kpi_key']='Unemployment-Rate';f['generated_at']='2026-01-01 00:00';print(len(p(f,s,'$')))\""
            expect: "2"
          - run: python -m ops.repo_check
            expect: all checks ok
        out_of_scope:
          - fixtures (they already match)
          - zohelo-bi validators (lane 3)
          - "dataset_key format: Gold uses eurostat:UNE_RT_A, the feed fixture une_rt_a (architect question)"
    todo:
      - "Post-publish check comparing latest.json values with Gold for every KPI"
      - "zohelo-bi validators mirror the schema patterns of key-patterns (decision D24; bi lane)"
