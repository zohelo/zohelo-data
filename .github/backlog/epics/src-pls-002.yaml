  - 'GUS monthly labour series (labour proposals, #2074): find in DBW Bronze the monthly average gross wage and employment in the enterprise sector (more than 9 employees) and the monthly registered unemployment rate (Poland and voivodeships), record their measure keys and coverage; they feed `real_wage_growth` and the page "Two unemployment rates" (LFS vs registered, marker at the 1 June 2025 labour-market act)'
  - kpi.csv rows, domain mapping and manifest check are written when Epic data/metadata/catalogue-v1 is done
