key: data/metadata/semantic-manifest
area: data/metadata
title: Generated semantic manifest
phase: 1
priority: P1
target: 2026-12-18
why: >-
  zohelo-bi carries a hand-written manifest of 5 metrics that drifts from the warehouse. The
  metric definitions already exist as dbt semantic models; generating the manifest from them keeps
  one definition per metric.
outcome: >-
  warehouse/catalog.py builds the manifest object (metric → table, unit, dimensions, defaults) from
  the semantic models; warehouse/publish.py writes it as 06_published/v1/manifest.json after every
  build (decision D5: publish.py is the sole writer); zohelo-bi loads it instead of its own copy.
in_scope:
  - manifest generation in warehouse/catalog.py (A-24)
  - semantic models for every published KPI
out_of_scope:
  - bi loader code (zohelo-bi Epic)
done_when:
  - 06_published/v1/manifest.json lists every published KPI with table, unit and dimensions
  - zohelo-bi packages/semantic has no hand-written metric list
depends_on: [data/metadata/catalogue-v1, data/warehouse/gold-v1, data/published/published-v1/contract]
decisions: ["D5: publish.py is the sole writer of manifest.json; catalog.py builds the object"]
deliverables:
  - key: data/metadata/semantic-manifest/generate
    title: Manifest generated from semantic models
    done_when:
      - catalog.py returns the manifest object matching warehouse/published/schemas/manifest.schema.json; publish.py writes it
    tasks:
      - key: data/metadata/semantic-manifest/generate/manifest-object
        type: Task
        title: Build the published manifest object in warehouse/catalog.py
        effort: M
        state: open
        contract: true
        depends_on: [data/published/published-v1/contract/schemas, data/metadata/catalogue-v1/seeds/kpi]
        context: >-
          manifest.json (docs/published.md, schema warehouse/published/schemas/manifest.schema.json) lists one
          metric per published KPI; catalog.py builds the object from the dbt semantic models and kpi.csv,
          publish.py writes it later (D5). The rules are in .github/backlog/assets/publish-writers.md,
          section 'manifest object'.
        files:
          - edit: warehouse/catalog.py
          - edit: docs/published.md
        steps:
          - "catalog.py: add manifest_object and manifest exactly as the assets section says (import csv)."
          - "docs/published.md under the manifest.json table: one sentence saying warehouse/catalog.py manifest() builds it from the semantic models and that KPIs without one are left out."
          - "dev/manifest_trial.py: subprocess `dbt parse --target prod --project-dir warehouse --profiles-dir warehouse`, then annotate notice 'manifest' with {kpi_key: dimensions} of manifest(). Run in Dev; delete dev/ before the PR."
        acceptance:
          - "the local verify prints 1 metric, time column date_key, column geography_key, no schema problem"
          - "trial lists population, gdp_current_prices, inflation, unemployment_rate, fx_rate (fx_rate with dimensions [])"
        verify:
          - run: "python -c \"import json;from warehouse.catalog import manifest_object as m;from ops.repo_check import _schema_problems as p;s={'semantic_models':[{'node_relation':{'alias':'metrics_population'},'defaults':{'agg_time_dimension':'period_start'},'dimensions':[{'name':'period_start','expr':'date_key'}],'entities':[{'name':'poc_geography','expr':'geography_key'}]}]};k=[{'kpi_key':'population','unit_key':'persons','frequency_default':'A','status':'published'}];r=m(s,k,'2026-01-01T00:00:00Z');x=r['metrics'][0];print(len(r['metrics']),x['time_column'],x['dimensions'][0]['column'],p(r,json.load(open('warehouse/published/schemas/manifest.schema.json')),'$'))\""
            expect: "1 date_key geography_key []"
          - workflow: Dev · branch runs, script manifest_trial, on the branch
            expect: "notice 'manifest' with the 5 published KPIs"
          - run: python -m ops.repo_check
            expect: all checks ok
        out_of_scope: [writing manifest.json (publish.py), semantic_models/gold.yml, catalog.build and publish]
      - key: data/metadata/semantic-manifest/generate/manifest-json
        type: Task
        title: Write manifest.json in gold.publish (warehouse/publish.py)
        effort: S
        state: open
        contract: true
        depends_on: [data/published/published-v1/publish/kpi-latest]
        context: >-
          warehouse/catalog.py manifest() builds the manifest object from target/semantic_manifest.json and
          kpi.csv, but nothing writes 06_published/v1/manifest.json. The gold.publish job starts from a fresh
          checkout without target/; warehouse/changed.py manifest('prod') runs `dbt parse --no-partial-parse`,
          which writes target/ including semantic_manifest.json. Shared rules: .github/backlog/assets/
          publish-writers.md, section 'Writers added after latest.json' (key "manifest").
        files:
          - edit: warehouse/publish.py
          - edit: docs/published.md
        steps:
          - "publish.py: manifest_json(client, prefix) -> int: from warehouse import catalog, changed; changed.manifest('prod'); obj = catalog.manifest(); body = json.dumps(obj, ensure_ascii=False, separators=(',', ':')).encode(); put(client, prefix + 'manifest.json', body); return len(obj['metrics'])."
          - "main(): add the 'manifest' key to the annotated dict with manifest_json(client, prefix)."
          - "docs/published.md: extend the sentence under the manifest.json table: gold.publish writes it after a fresh dbt parse."
          - "dev/publish_manifest_trial.py: n = manifest_json(s3(), 'zz_dev_published/v1/'); read the object back and annotate notice 'manifest.json' with {metrics: n, kpis: [kpi_key …], bytes}; delete every object under zz_dev_published/ and annotate notice 'deleted <n>'. Run in Dev; delete dev/ before the PR."
        acceptance:
          - "trial: 5 metrics (population, gdp_current_prices, inflation, unemployment_rate, fx_rate), then deleted"
          - "ruff and repo_check pass"
        verify:
          - run: "python -c \"import inspect;from warehouse.publish import manifest_json as m;print(list(inspect.signature(m).parameters))\""
            expect: "['client', 'prefix']"
          - workflow: Dev · branch runs, script publish_manifest_trial, on the branch
            expect: "notice 'manifest.json' with 5 metrics; then 'deleted 1'"
          - run: python -m ops.repo_check
            expect: all checks ok
        out_of_scope: [catalog.manifest_object rules, semantic_models/gold.yml, catalog.publish (_portal_catalog)]
        notes: ["Another writer Task may have added its line to main() first: keep both lines."]
      - key: data/metadata/semantic-manifest/generate/model-check
        type: Task
        title: Fail repo_check when a published KPI has no semantic model
        effort: S
        state: open
        contract: false
        context: >-
          manifest() leaves out a published KPI whose metrics table has no semantic model, so zohelo-bi would
          silently lose it. Today all five published KPIs of warehouse/seeds/kpi.csv have a model in
          warehouse/semantic_models/gold.yml (model: ref('poc_metrics_<kpi_key>')); nothing checks it when the
          next KPIs are published.
        files:
          - edit: ops/repo_check.py
          - edit: docs/quality.md
        steps:
          - "repo_check.py: semantic_models() -> list[str] with a one-line docstring: models = the <k> of every semantic_models entry of warehouse/semantic_models/gold.yml whose model, stripped, fullmatches r\"ref\\('(?:poc_)?metrics_(\\w+)'\\)\"; for every kpi.csv row (csv.DictReader, utf-8) with status published: problem 'semantic models: published KPI <k> has no semantic model on metrics_<k>' when <k> is not in models, and 'semantic models: published KPI <k> has no warehouse/models/gold/poc_metrics_<k>.sql' when that file is missing."
          - "main(): checks entry \"semantic models\": semantic_models after \"published contract\"."
          - "docs/quality.md section 4, after the 'Metrics declared in semantic_models/' row: | Every KPI with status `published` in `warehouse/seeds/kpi.csv` has a metrics model and a semantic model on it | [auto] repo_check `semantic models` |"
        acceptance:
          - "passes today; setting gdp_per_capita to published in kpi.csv gives both problems (try, revert)"
          - "ruff and repo_check pass"
        verify:
          - run: "python -c \"from ops.repo_check import semantic_models as s;print(s())\""
            expect: "[]"
          - run: python -m ops.repo_check
            expect: "'ok   semantic models' and all other checks ok"
        out_of_scope: [semantic_models/gold.yml, kpi.csv, warehouse/catalog.py]
  - key: data/metadata/semantic-manifest/bi-adoption
    title: zohelo-bi reads the generated manifest
    repo: zohelo-bi
    depends_on: [data/metadata/semantic-manifest/generate]
    done_when:
      - packages/semantic exports types + loader only
    todo:
      - "Tracked in zohelo-bi Epic bi/platform/published-loader"
