key: data/warehouse/demo
area: data/warehouse
title: Demo warehouse (sample enterprise data)
phase: 2
priority: P2
target: 2027-03-12
why: >-
  The owner's analyst portfolio needs realistic enterprise data (sales, finance, HR, supply chain,
  CRM) on the same engine, without mixing it into the public KPI catalogue.
outcome: >-
  The owner's career data desk: family K datasets (register DM-001 to DM-009: AdventureWorks DW and OLTP,
  Contoso V2, Wide World Importers, SAP Datasphere samples, Power BI department samples, Oracle sample
  schemas, Northwind, a synthetic Xero-shaped SME ledger) land in demo_* namespaces with Gold stars for every
  standard department (sales, finance and controlling, HR, procurement, supply chain, production,
  marketing and CRM, customer service, IT) and are served to Power BI.
in_scope:
  - demo ingestion through the normal Landing → Bronze → Silver flow into demo_* namespaces
  - demo Gold models and manifest_demo.json
  - a read endpoint for Power BI on the demo Gold tables (owner request 17 Nov 2026)
  - synthetic generators with Polish identifiers (NIP, TERYT, PKD)
out_of_scope:
  - re-publishing non-MIT vendor data as files (dashboards only)
done_when:
  - demo_bronze, demo_silver, demo_gold namespaces built by scheduled runs
  - manifest_demo.json published; public catalogue contains no demo KPI
depends_on: [data/warehouse/gold-v1, data/published/published-v1]
decisions: ["program plan §3.3: demo data in demo_* namespaces; assumption 10: never in the public catalogue"]
deliverables:
  - key: data/warehouse/demo/namespaces
    title: Demo namespaces and conventions
    done_when:
      - inventory, tracker and retire rules know demo_*; docs/architecture.md describes them
    tasks:
      - key: data/warehouse/demo/namespaces/declare
        type: Task
        title: Declare the demo namespaces for inventory, tracker and retire
        effort: S
        state: open
        contract: false
        context: >-
          Demo data will live in catalog namespaces demo_bronze, demo_silver, demo_gold (program plan §3.3).
          Today ops/platform_inventory.py namespace_check() calls a namespace undeclared unless it is
          bronze/silver/gold or holds a declared table, and ops/tracker.py classify() calls every table outside
          those three 'other' (ops/retire_tables.py candidates() uses classify). The namespaces must be declared
          once, in warehouse/warehouse.yaml, and read by these scripts.
        files:
          - edit: warehouse/warehouse.yaml
          - edit: ops/platform_inventory.py
          - edit: ops/tracker.py
          - edit: ops/retire_tables.py
          - edit: docs/architecture.md
        steps:
          - "warehouse.yaml, after the gold list: `demo_namespaces: [demo_bronze, demo_silver, demo_gold]  # phase 2 demo warehouse (program plan §3.3); never in the public catalogue`."
          - "platform_inventory.namespace_check(): new keyword parameter declared_namespaces: Iterable[str] = (), added to `known`; main() passes platform.get('demo_namespaces') or [] (platform is already loaded there)."
          - "tracker.classify(): new keyword parameter demo_namespaces: Iterable[str] = (); a table whose namespace is in it returns ('current', 'demo') before the LAYERS check. main(): pass platform.get('demo_namespaces') or [] to namespace_check (declared_namespaces=) and to classify."
          - "retire_tables.candidates(): pass platform.get('demo_namespaces') or [] to classify, so demo tables are never candidates."
          - "docs/architecture.md, after the Published bullet: '- **Demo** (phase 2) — sample enterprise data in namespaces demo_bronze, demo_silver, demo_gold (warehouse.yaml demo_namespaces); never in the public catalogue.'"
        acceptance:
          - "namespace_check reports a declared demo namespace neither undeclared nor scratch"
          - "classify('demo_gold.x', {}, [], demo_namespaces=['demo_gold']) is ('current', 'demo')"
          - "ruff and repo_check pass"
        verify:
          - run: "python -c \"from ops.platform_inventory import namespace_check as n;from ops.tracker import classify as c;r=n(['demo_gold','zz_dev_a'],[],[],[],declared_namespaces=['demo_gold']);print(r['undeclared_namespaces'],c('demo_gold.x',{},[],demo_namespaces=['demo_gold']))\""
            expect: "['zz_dev_a'] ('current', 'demo')"
          - run: python -m ops.repo_check
            expect: all checks ok
        out_of_scope: [creating the namespaces, demo sources and models, ops/orphan_files.py]
  - key: data/warehouse/demo/ingestion
    title: Demo sources ingested
    depends_on: [data/warehouse/demo/namespaces]
    done_when:
      - each family K source has a declaration and lands into 01_landing/demo_<name>/
    tasks:
      - key: data/warehouse/demo/ingestion/register
        type: Task
        title: Register the career-desk demo sources (family K, DM-001 … DM-009)
        effort: M
        state: open
        contract: false
        context: >-
          Owner request (chat, 17 Nov 2026): a career data desk next to the platform work, with sample
          enterprise data for every standard department of a big company, modelled into demo_silver and
          demo_gold and served to Power BI. Family K had no register entries, so the sync generated no
          source Epics for it.
        files:
          - create: ingestion/register/demo.yaml
          - create: ingestion/common/register.py
          - edit: ops/repo_check.py
          - edit: ops/backlog_sync.py
          - edit: ops/tracker.py
          - edit: ops/notify_failure.py
          - edit: .github/backlog/assets/register-fields.md
          - edit: docs/architecture.md
        steps:
          - "ingestion/register.yaml (680 KB) is too large for the agent's file API, so take the first step of Epic
            data/ingestion/register-restructure: ingestion/common/register.py loads register.yaml plus
            ingestion/register/*.yaml, and the four readers use it (backlog_sync passes each entry's file as {register_file})."
          - "Write entries DM-001 … DM-009 (family K, kpi false, status approved, licence terms after `Terms:`) to
            ingestion/register/demo.yaml; add their rows to register-fields.md."
        acceptance:
          - "python -m ops.repo_check passes"
          - "backlog_sync plan generates nine Epics data/src-dm-001 … data/src-dm-009 under data/src-k"
        verify:
          - run: python -m ops.repo_check
            expect: all checks ok
        out_of_scope: [declarations, loaders and models of the sources (their generated stage Tasks)]
  - key: data/warehouse/demo/models
    title: Demo Gold models and manifest
    depends_on: [data/warehouse/demo/ingestion]
    done_when:
      - demo_gold stars for sales, finance and controlling, HR, procurement, supply chain, production, marketing and CRM,
        customer service, IT and SME accounting; manifest_demo.json
    todo:
      - "Model per subject area; generate manifest_demo.json in catalog.py"
      - "Department x source map: sales DM-001/003/007/008; finance DM-001 (FactFinance), DM-005 (FI), DM-009; HR DM-001/002/005/006/007;
        procurement DM-002/004/006; supply chain and inventory DM-001/002/004; production DM-002; marketing and CRM DM-001/006;
        customer service DM-001 (call centre); IT DM-006; AR/AP DM-004, DM-009"
  - key: data/warehouse/demo/serving
    title: Power BI endpoint for the demo Gold tables
    depends_on: [data/warehouse/demo/models]
    done_when:
      - every demo_gold table is readable from Power BI Desktop and refreshable in the Power BI service without a gateway
      - the endpoint serves demo data only (never public catalogue tables) and no writer credential reaches it
    todo:
      - "demo.publish activity (warehouse.yaml): after each demo Gold build write one Parquet file per demo_gold table and
        manifest.json (tables, columns, row counts, licence and attribution per source) to 06_published/demo/v1/"
      - "Read-only HTTPS route for 06_published/demo/v1/ outside Cloudflare Access (Power BI cannot sign in through Access);
        hostname is an owner decision; Power Query: Parquet.Document(Web.Contents(base, [RelativePath = ...]))"
      - "Optional Fabric route: OneLake shortcut (S3-compatible) to the demo_gold Iceberg tables, needs a Fabric capacity (owner decision)"
