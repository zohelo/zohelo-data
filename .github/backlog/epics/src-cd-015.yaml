key: data/src-cd-015
area: data/src-e
title: GLEIF [CD-015]
phase: 1
priority: P3
target: '2027-01-29'
why: GLEIF lists every legal entity with an LEI and its parent relationships. It is the entity backbone for linking
  Polish and foreign companies in later company-data work.
outcome: GLEIF is loaded daily, modelled in Silver and browsable on data.zohelo.com; Gold entity models follow in
  Phase 3.
in_scope:
- Stages 1–6 and 9 of the source template (stages.yaml)
out_of_scope:
- Other sources of the same provider
- Paid access tiers
- 'KPIs, zohelo-bi and zohelo.com releases (reference/entity source, kpi: false)'
done_when:
- Every Deliverable of this Epic is closed (7/7)
- 14 consecutive days of green scheduled runs
depends_on: []
decisions: []
deliverables:
- key: data/src-cd-015/review
  title: GLEIF · Source review
  done_when:
  - Register entry has every field filled; licence.notes gives the terms URL and the attribution sentence; obsolete
    blockers removed
  tasks:
  - key: data/src-cd-015/review/register
    type: Task
    title: Complete the register review of GLEIF
    effort: S
    state: open
    contract: false
    owner_action: null
    context: 'The register entry CD-015 in ingestion/register.yaml is the source of truth for licence and public
      display. zohelo.com and bi.zohelo.com will show this source''s data, so licence.notes must give the terms
      URL and the exact attribution sentence, and research.blockers must list only open problems. Terms pages to
      read: https://www.gleif.org/en/lei-data/access-and-use-lei-data.'
    files:
    - edit: ingestion/register.yaml
    steps:
    - Open https://www.gleif.org/en/lei-data/access-and-use-lei-data and the LEI data terms (CC0 1.0); record them.
    - 'Write licence.notes: ''Terms: CC0 1.0, <URL>. Attribution (requested, not required): "Source: GLEIF".'' and
      keep status open-conditional.'
    - Remove blockers 'Review LEI Data Terms' and 'Select Golden Copy formats' (decided in ingestion/sources/gleif.yaml);
      keep 'Handle relationship exceptions' only if silver.gleif_reporting_exceptions does not cover it.
    - Set status silver.
    acceptance:
    - licence.notes of CD-015 contains a terms URL and a sentence starting 'Attribution:'
    - research.blockers of CD-015 lists only open problems (or is empty)
    - python -m ops.repo_check passes
    verify:
    - run: python -m ops.repo_check
      expect: exit code 0
    - run: python3 -c "import yaml;print([s['licence'] for s in yaml.safe_load(open('ingestion/register.yaml'))['sources']
        if s['id']=='CD-015'])"
      expect: notes include the terms URL and 'Attribution:'
    out_of_scope:
    - Other register entries
    - Code or source declaration changes
    - The kpi field (set only by data/ingestion/register-restructure/fields/family-kpi)
- key: data/src-cd-015/development
  title: GLEIF · Development
  done_when:
  - Source declaration and Landing code exist on main; a full load was trialled before production
  state: done
  notes:
  - 'Evidence: ingestion/sources/gleif.yaml, ingestion/to_bronze/gleif/entities.py'
- key: data/src-cd-015/ingestion
  title: GLEIF · Ingestion (Landing)
  done_when:
  - 'First production load complete (landing.inspect: missing 0); landing.verify and landing.archive green'
  state: done
  notes:
  - 'Evidence: activities landing.extract/verify/archive; green full dataflow https://github.com/zohelo/zohelo-data/actions/runs/40495044194'
- key: data/src-cd-015/schedule
  title: GLEIF · Schedule
  done_when:
  - Full dataflow scheduled; last 3 runs green, newest dispatched by the scheduler; no open alert issue
  state: done
  notes:
  - 'Evidence: daily 10:50 UTC; full dataflow green 24–27 Oct; green full dataflow https://github.com/zohelo/zohelo-data/actions/runs/40495044194'
- key: data/src-cd-015/bronze
  title: GLEIF · Bronze
  done_when:
  - Declared Bronze tables exist; bronze.verify green; latest version only
  state: done
  notes:
  - 'Evidence: bronze.gleif_lei_records, relationship and exception tables; green full dataflow https://github.com/zohelo/zohelo-data/actions/runs/40495044194'
- key: data/src-cd-015/silver
  title: GLEIF · Silver
  done_when:
  - Declared Silver tables written by today's code (dbt model or warehouse/entity/*.sql) with tests/checks and descriptions
  state: done
  notes:
  - 'Evidence: warehouse/entity/gleif_legal_entities.sql, gleif_relationships.sql, gleif_reporting_exceptions.sql'
- key: data/src-cd-015/portal-release
  title: GLEIF · Data portal release
  done_when:
  - 'data.zohelo.com source page: register summary, tables per layer with rows and last write, freshness, last scheduled
    run'
  depends_on:
  - data/portal/catalogue-pages
  todo:
  - Check the source page on data.zohelo.com and fix missing metadata, once Epic data/portal/catalogue-pages is
    done
