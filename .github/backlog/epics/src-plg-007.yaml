key: data/src-plg-007
area: data/src-d
title: MF state budget [PLG-007]
phase: 2
priority: P2
target: '2026-12-18'
why: Monthly state-budget execution (revenue, expenditure, deficit) is the most-watched fiscal release in Poland. zohelo has
  no budget data today.
outcome: The monthly state-budget execution file is declared as a bulk_file source and trialled into scratch from GitHub Actions.
in_scope:
- Stages 1–2 of the source template (stages.yaml); later stages are written when stage 2 is done
out_of_scope:
- Other sources of the same provider
- Bronze, Silver and KPIs (later stages)
done_when:
- Every Deliverable of this Epic is closed; register entry PLG-007 is landed
depends_on: []
decisions:
- 'owner 28 Oct #2230: an approved source gets its full stage Epic'
deliverables:
- key: data/src-plg-007/review
  title: MF state budget · Source review
  done_when:
  - Register entry PLG-007 has licence.notes with the terms URL and attribution; status approved
  state: done
  notes:
  - 'Evidence: licence #1750, register decision #1751 (ingestion/register.yaml status approved)'
- key: data/src-plg-007/development
  title: MF state budget · Development
  done_when:
  - ingestion/sources/mf_state_budget.yaml exists with extraction (bulk_file), landing, archive_policy, refresh and activities
  - A Dev branch run landed a full load into a zz_dev_ scratch prefix and removed it
  tasks:
  - key: data/src-plg-007/development/declaration
    type: Task
    title: Declare MF state budget in ingestion/sources
    effort: M
    state: open
    contract: true
    owner_action: null
    verify_only: false
    context: 'Register entry PLG-007 is approved. It becomes a source through one declaration using the shared bulk_file pattern,
      so no extractor is written. Scope of this first declaration: only the newest monthly operative execution report; annual
      budget acts and earlier years are a later stage. URLs come from the register review; the Dev trial Task proves them
      from Actions. Schedule (stage 4) comes later: monthly operative reports.'
    files:
    - create: ingestion/sources/mf_state_budget.yaml
    - edit: ingestion/register.yaml
    - edit: .github/workflows/pipeline.yml
    - edit: docs/sources.md
    steps:
    - 'Create ingestion/sources/mf_state_budget.yaml in the shape of ingestion/sources/world_bank_wdi.yaml: description "Ministry
      of Finance monthly state budget execution (XLSX)", extraction.kind bulk_file with the file below, initial bulk, production
      snapshot, incremental_policy changed_since_last, schedule [], landing 01_landing/mf_state_budget/, archive_policy as
      WDI with prune: report, bronze/silver/gold [], refresh {mode: full}, activities [landing.inspect, landing.extract, landing.verify].'
    - 'Files under extraction.bulk_file.files: one file: entity budget_execution_monthly, url_from {page: "https://www.gov.pl/web/finanse/sprawozdania-operatywne-miesieczne",
      pattern: "/attachment/"}, format raw, version last_modified. pick: first (the newest month is listed first; confirm
      from the Dev trial''s link list).'
    - 'Add `source_system: mf_state_budget` to register entry PLG-007 in ingestion/register.yaml.'
    - Add mf_state_budget to the `source` options list of the workflow_dispatch inputs in .github/workflows/pipeline.yml (alphabetical
      place).
    - 'docs/sources.md: a `mf_state_budget` section like world_bank_wdi''s (route, entity, version, restart unit).'
    - 'Run `PYTHONPATH=. python run.py schedule --check` and `PYTHONPATH=. python run.py plan --source mf_state_budget --run
      "landing: inspect"`.'
    acceptance:
    - run.py schedule --check passes
    - register entry PLG-007 has source_system mf_state_budget
    verify:
    - run: 'PYTHONPATH=. python run.py plan --source mf_state_budget --run "landing: inspect"'
      expect: JSON with landing.inspect
    - run: python -m ops.repo_check
      expect: exit code 0
    out_of_scope:
    - bronze.load and Bronze tables (stage 5)
    - a schedule entry (stage 4)
    - Other register entries
    depends_on:
    - data/src-plg-008/development/page-links
  - key: data/src-plg-007/development/dev-trial
    type: Task
    title: Dev-trial a full MF state budget load into scratch
    effort: M
    state: open
    contract: false
    owner_action: null
    verify_only: true
    context: Proves the declaration against the real source from GitHub Actions without touching production (the session cannot
      reach the provider or Cloudflare). The trial script lives in dev/ on the declaration's branch only and is never merged
      (repo_check rejects dev/). This Task closes with a comment linking the green Dev run; the declaration PR merges only
      after that.
    files: []
    steps:
    - 'On the declaration''s branch write dev/mf_state_budget_trial.py that calls ingestion.to_landing.patterns.bulk_file.main(''mf_state_budget'',
      ''inspect'', landing_root=''zz_dev_mf_state_budget''), then main(''mf_state_budget'', ''load'', landing_root=''zz_dev_mf_state_budget''),
      then main(''mf_state_budget'', ''verify'', landing_root=''zz_dev_mf_state_budget''), and finally deletes every object
      under zz_dev_mf_state_budget/ (copy the clean-up loop of an existing Dev trial in git history: `git log --all --oneline
      -- ''dev/*_trial.py'' | head`).'
    - Dispatch Actions → Dev · branch runs on that branch with script mf_state_budget_trial.
    - Read the run's annotations (`gh api repos/zohelo/zohelo-data/check-runs/<job id>/annotations`); when a URL or the link
      pattern fails, fix the declaration on the same branch and dispatch again.
    - Comment the green run URL, the landed file names, sizes and versions on this issue and close it; delete dev/ from the
      branch so the declaration PR can merge.
    acceptance:
    - The Dev run is green; its annotation lists every declared entity with bytes and a version
    - No object is left under zz_dev_mf_state_budget/ (the run's last annotation says so)
    verify:
    - workflow: Dev · branch runs (dev.yml), script mf_state_budget_trial, on the declaration branch
      expect: green run; annotation with entity count and bytes
    out_of_scope:
    - Production Landing writes
    - Merging anything (the declaration PR carries the change)
    depends_on:
    - data/src-plg-007/development/declaration
