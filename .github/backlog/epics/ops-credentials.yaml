key: data/ops/credentials
area: data/ops
title: Credentials check and probes
phase: 0
priority: P2
target: 2026-11-21
why: >-
  The credentials check lives in zohelo-bi, which means bi's workflows see write keys they never need,
  and the check only proves that keys work, not that read-only keys really are read-only.
outcome: >-
  The credentials check runs from zohelo-data's Ops workflow and proves both what each key can and
  cannot do; zohelo-bi no longer holds it.
in_scope:
  - Ops script check_credentials with positive and negative probes (A-11)
out_of_scope:
  - rotating any credential
  - removing zohelo-bi's check-credentials.yml (zohelo-bi Task bi/platform/hardening/credentials/remove-check-credentials)
  - scoping write secrets to zohelo-data (A-10; only when the owner asks, decision O7)
done_when:
  - Ops check_credentials green with every row "as expected", including the negative probes
decisions:
  - "owner 27 Oct (O7): keep all organisation secrets visible to all public repositories; A-10 runs only when the owner asks (architect D15)"
  - "AGENTS.md: no new workflow file for checks; standing checks are Ops scripts"
deliverables:
  - key: data/ops/credentials/check
    title: Credentials check in zohelo-data Ops
    done_when:
      - "Ops check_credentials reports every row of zohelo-bi's Check credentials workflow plus the negative probes as expected"
    tasks:
      - key: data/ops/credentials/check/script
        type: Task
        title: Add Ops script check_credentials (storage, catalog, deploy token, BDL)
        effort: M
        state: open
        contract: true
        context: >-
          zohelo-bi/.github/workflows/check-credentials.yml probes the deploy token, storage keys, catalog
          tokens, the org app, the BDL key and the scheduler Worker token code with bash. AGENTS.md allows
          no new workflow file, so the check becomes an Ops script. Variables may be printed; secrets
          only as lengths and HTTP codes. This Task ports the storage, catalog, deploy-token and BDL rows.
        files:
          - create: ops/check_credentials.py
          - edit: .github/workflows/ops.yml
          - edit: ops/README.md
        steps:
          - "Structure: rows of (section, name, expected, actual); helper row(); one annotation per section (≤ 10 per step) and a step-summary table; exit 1 when any actual differs from expected."
          - "Port the rows of zohelo-bi check-credentials.yml for: organisation variables present; deploy token verify (GET /user/tokens/verify) and Pages project list; storage write keys put/delete zz_dev_credcheck/probe.txt in the landing bucket; lakehouse read keys list 02_bronze/; catalog read token GET /v1/config and /namespaces; catalog write token GET /v1/config; BDL key GET one variable."
          - "Use requests for HTTP and boto3 clients per key pair (endpoint STORAGE_ENDPOINT_URL); error rows quote the last error line (≤ 120 chars, no secret value)."
          - "ops.yml: when the script is check_credentials, add PLATFORM_DEPLOY_TOKEN, STORAGE_WRITE_*, STORAGE_LAKEHOUSE_READ_*, both catalog tokens and SOURCE_GUS_BDL_API_KEY to the script step env."
          - Add the script row to the ops/README.md table.
        acceptance:
          - each ported row appears in the step summary; no secret value is printed
        verify:
          - run: python -m ops.repo_check
            expect: all checks ok
          - workflow: Ops check_credentials (after merge)
            expect: green, step summary rows "as expected"
        out_of_scope: [app and Worker rows (next Task); negative probes; Finnhub (removed)]
      - key: data/ops/credentials/check/app-worker
        type: Task
        title: check_credentials probes the org app and the scheduler Worker code
        effort: M
        state: open
        contract: true
        depends_on: [data/ops/credentials/check/script]
        context: >-
          The bi workflow also mints an app installation token and runs the scheduler Worker's token code
          in Node to prove the Worker can dispatch. Both rows move into the Ops script.
        files:
          - edit: ops/check_credentials.py
          - edit: .github/workflows/ops.yml
        steps:
          - "ops.yml: when the script is check_credentials, add actions/setup-node (SHA-pinned, .node-version) and an app token step (actions/create-github-app-token, client-id vars.ORG_BOT_CLIENT_ID, private-key secrets.ORG_BOT_PRIVATE_KEY, repositories zohelo-data, permission-metadata read) exposed as APP_TOKEN; pass ORG_BOT_CLIENT_ID and ORG_BOT_PRIVATE_KEY to the script step."
          - "Row 'org app': GET /repos/zohelo/zohelo-data with APP_TOKEN → 200."
          - "Row 'scheduler Worker token': write a Node snippet to $RUNNER_TEMP that imports a copy of ops/scheduler_worker/src/index.js rewritten as zohelo-bi's step does (`export default` → `export const worker =`, plus `export { installationToken }`), calls installationToken with env APP_CLIENT_ID/APP_PRIVATE_KEY/GITHUB_REPOSITORY, and prints ok; run it with subprocess; expected ok."
        acceptance:
          - both rows "as expected" in the step summary
        verify:
          - workflow: Ops check_credentials (after merge)
            expect: rows "org app" and "scheduler Worker token" as expected
        out_of_scope: [new files under ops/scheduler_worker]
      - key: data/ops/credentials/check/negative-probes
        type: Task
        title: check_credentials proves read-only keys cannot write
        effort: S
        state: open
        contract: true
        depends_on: [data/ops/credentials/check/script]
        context: >-
          A read key that can write is a silent risk; the check must show denials, not only successes.
          The deploy token was created from the "Edit Cloudflare Workers" template, which also grants R2
          write, so its R2 row is informational until the token is narrowed.
        files:
          - edit: ops/check_credentials.py
        steps:
          - "Expected denied: lakehouse read keys PUT zz_dev_credcheck/probe.txt in the lakehouse bucket; lakehouse read keys list the landing bucket; catalog READ token POST /v1/<warehouse>/namespaces {namespace: [zz_dev_credcheck]} → 403."
          - "If a denial probe unexpectedly succeeds, delete what it created (object or namespace) before reporting the row as failed."
          - "Informational row (never fails the run): deploy token GET /accounts/<id>/r2/buckets — report 'allowed' or 'denied'."
        acceptance:
          - three negative rows "as expected (denied)"; the informational row is shown
        verify:
          - workflow: Ops check_credentials (after merge)
            expect: green; rows "denied" for the three read-only probes
        out_of_scope: [narrowing the deploy token (owner, only on request)]
