key: data/src-pls-029
area: data/src-b
title: MRPiPS registered unemployment [PLS-029]
phase: 2
priority: P2
target: '2026-12-18'
why: Monthly registered unemployment by powiat from the Public Employment Services is the most granular labour-market series
  in Poland (CC BY 3.0 PL) and feeds the regional pages.
outcome: The monthly registered-unemployment workbook is declared as a bulk_file source and trialled into scratch from GitHub
  Actions.
in_scope:
- Stages 1–2 of the source template (stages.yaml); later stages are written when stage 2 is done
out_of_scope:
- Other sources of the same provider
- Bronze, Silver and KPIs (later stages)
done_when:
- Every Deliverable of this Epic is closed; register entry PLS-029 is landed
depends_on: []
decisions:
- 'owner 28 Oct #2230: an approved source gets its full stage Epic'
deliverables:
- key: data/src-pls-029/review
  title: MRPiPS registered unemployment · Source review
  done_when:
  - Register entry PLS-029 has licence.notes with the terms URL and attribution; status approved
  state: done
  notes:
  - 'Evidence: licence #1726, register decision #1727 (ingestion/register.yaml status approved)'
- key: data/src-pls-029/development
  title: MRPiPS registered unemployment · Development
  done_when:
  - ingestion/sources/mrpips_unemployment.yaml exists with extraction (bulk_file), landing, archive_policy, refresh and activities
  - A Dev branch run landed a full load into a zz_dev_ scratch prefix and removed it
  tasks:
  - key: data/src-pls-029/development/declaration
    type: Task
    title: Declare MRPiPS registered unemployment in ingestion/sources
    effort: M
    state: open
    contract: true
    owner_action: null
    verify_only: false
    context: 'Register entry PLS-029 is approved. It becomes a source through one declaration using the shared bulk_file pattern,
      so no extractor is written. Licence: CC BY 3.0 PL (register). URLs come from the register review; the Dev trial Task
      proves them from Actions. Schedule (stage 4) comes later: monthly releases.'
    files:
    - create: ingestion/sources/mrpips_unemployment.yaml
    - edit: ingestion/register.yaml
    - edit: .github/workflows/pipeline.yml
    - edit: docs/sources.md
    steps:
    - 'Create ingestion/sources/mrpips_unemployment.yaml in the shape of ingestion/sources/world_bank_wdi.yaml: description
      "Public Employment Services monthly registered unemployment (XLSX)", extraction.kind bulk_file with the file below,
      initial bulk, production snapshot, incremental_policy changed_since_last, schedule [], landing 01_landing/mrpips_unemployment/,
      archive_policy as WDI with prune: report, bronze/silver/gold [], refresh {mode: full}, activities [landing.inspect,
      landing.extract, landing.verify].'
    - 'Files under extraction.bulk_file.files: one file: entity unemployment_monthly, url_from {page: "https://psz.praca.gov.pl/web/urzad-pracy/rynek-pracy/statystyki-i-analizy/bezrobocie-rejestrowane",
      pattern: "\\.xlsx?$"}, format raw, version last_modified. If that page returns 404 or no match, the Dev trial annotates
      the links of https://psz.praca.gov.pl/ instead; take the statistics page from that list and record it.'
    - 'Add `source_system: mrpips_unemployment` to register entry PLS-029 in ingestion/register.yaml.'
    - Add mrpips_unemployment to the `source` options list of the workflow_dispatch inputs in .github/workflows/pipeline.yml
      (alphabetical place).
    - 'docs/sources.md: a `mrpips_unemployment` section like world_bank_wdi''s (route, entity, version, restart unit).'
    - 'Run `PYTHONPATH=. python run.py schedule --check` and `PYTHONPATH=. python run.py plan --source mrpips_unemployment
      --run "landing: inspect"`.'
    acceptance:
    - run.py schedule --check passes
    - register entry PLS-029 has source_system mrpips_unemployment
    verify:
    - run: 'PYTHONPATH=. python run.py plan --source mrpips_unemployment --run "landing: inspect"'
      expect: JSON with landing.inspect
    - run: python -m ops.repo_check
      expect: exit code 0
    out_of_scope:
    - bronze.load and Bronze tables (stage 5)
    - a schedule entry (stage 4)
    - Other register entries
    depends_on:
    - data/src-plg-008/development/page-links
  - key: data/src-pls-029/development/dev-trial
    type: Task
    title: Dev-trial a full MRPiPS registered unemployment load into scratch
    effort: M
    state: open
    contract: false
    owner_action: null
    verify_only: true
    context: Proves the declaration against the real source from GitHub Actions without touching production (the session cannot
      reach the provider or Cloudflare). The trial script lives in dev/ on the declaration's branch only and is never merged
      (repo_check rejects dev/). This Task closes with a comment linking the green Dev run; the declaration PR merges only
      after that.
    files: []
    steps:
    - 'On the declaration''s branch write dev/mrpips_unemployment_trial.py that calls ingestion.to_landing.patterns.bulk_file.main(''mrpips_unemployment'',
      ''inspect'', landing_root=''zz_dev_mrpips_unemployment''), then main(''mrpips_unemployment'', ''load'', landing_root=''zz_dev_mrpips_unemployment''),
      then main(''mrpips_unemployment'', ''verify'', landing_root=''zz_dev_mrpips_unemployment''), and finally deletes every
      object under zz_dev_mrpips_unemployment/ (copy the clean-up loop of an existing Dev trial in git history: `git log --all
      --oneline -- ''dev/*_trial.py'' | head`).'
    - Dispatch Actions → Dev · branch runs on that branch with script mrpips_unemployment_trial.
    - Read the run's annotations (`gh api repos/zohelo/zohelo-data/check-runs/<job id>/annotations`); when a URL or the link
      pattern fails, fix the declaration on the same branch and dispatch again.
    - Comment the green run URL, the landed file names, sizes and versions on this issue and close it; delete dev/ from the
      branch so the declaration PR can merge.
    acceptance:
    - The Dev run is green; its annotation lists every declared entity with bytes and a version
    - No object is left under zz_dev_mrpips_unemployment/ (the run's last annotation says so)
    verify:
    - workflow: Dev · branch runs (dev.yml), script mrpips_unemployment_trial, on the declaration branch
      expect: green run; annotation with entity count and bytes
    out_of_scope:
    - Production Landing writes
    - Merging anything (the declaration PR carries the change)
    depends_on:
    - data/src-pls-029/development/declaration
