id: TP-012
name: 'NBP calendars: MPC meetings and statistics publications'
short_name: NBP calendars
provider: Narodowy Bank Polski (NBP)
source_system: sdds_calendar
current: true
status: built
family: J
kpi: false
geography: Poland
provider_type: national-public
domains: [release-calendar, official-statistics]
entities: [release]
granularity: 'Statistics publication dates: one expected release date per NBP data category and month, with the
  reference period in brackets (SDDS advance release calendar). MPC meeting dates are not in this route (see
  research.blockers).'
coverage: 'The current calendar year, January to December (the 2026 file read 27 Nov 2026); one file per year.'
access:
  endpoint: 'https://stat.gov.pl/banki-i-bazy-danych/sdds/kalendarz-upowszechniania-danych'
  kind: bulk_file
  interfaces: [XLSX, HTML]
  auth: none
  cost: free
  limits: 'None stated; robots.txt of stat.gov.pl is "User-agent: * Allow: /*" (read by the runner 27 Nov 2026). One
    page GET to find the link and one XLSX GET (about 27 KB) per run. The file name carries the update date
    (sdds_kalendarz_upowszechniania_danych_w_2026_r_25_11_2026.xlsx), so the link is read from the page at run time
    (url_from, as mf_state_budget).'
licence:
  status: open-conditional
  notes: 'Terms: https://stat.gov.pl/copyright (read 27 Nov 2026; the calendar file is published by GUS, the SDDS
    national coordinator, on stat.gov.pl, so the GUS terms apply as for TP-011, D23). The page reads: "nie ma
    zastrzeżeń co do kopiowania plików i stron oraz dokonywania wydruków" and "w tym do własnych opracowań, pod
    warunkiem, że będzie podane ich źródło"; no named licence. Attribution: "Źródło: GUS, SDDS Kalendarz
    Upowszechniania Danych" (source to be given, no exact wording prescribed). Commercial reuse: not stated.
    Modification: own analyses allowed with the source given. The NBP terms (PLG-006) do not apply: nothing is read
    from nbp.pl.'
updates: 'The file is replaced when dates change ("Ostatnia aktualizacja: 25.11.2026 r." on the Polish page; the
  English page showed 10/23/2026 in a desk reading the same day, so the two language copies are not updated
  together). Every cell is an expected date: "Wszystkie daty są oczekiwanymi datami publikacji i mogą ulec zmianie."'
ingestion:
  history: 'None at source beyond the current year''s file; past release dates of the year stay in it, so the Bronze
    copies of each version are the history.'
  incremental: 'Snapshot, weekly with release_calendars (O46); version = download time (the XLSX has no
    Last-Modified); a new Landing file only when the SHA-256 changed; Bronze latest-only.'
  identifiers: 'Table (sector) + data category label + month column; publisher derived from the category (NBP:
    monetary financial institutions balance, NBP balance sheet, official reserves, foreign-currency liquidity,
    balance of payments, international investment position, external debt).'
modelling:
  notes: 'Use the Polish file (cleaner dates). Cells are text "DD.MM.YYYY\n(MM YYYY)" or "(Q1 2026)" / "(4 kw.
    2025)"; one cell can hold two releases ("02.03.2026 (12 2025) 20.03.2026\n(01 2026)"); "-" = no release;
    "dziennie" = daily (interest rates, exchange rates, WIG: no dated rows); the "Ostatnia aktualizacja" column is an
    Excel date serial (46332 = 2026-11-06). The file has visible slips that must be rejected or flagged, never
    guessed: official reserves for 05 2026 dated 07.04.2026 (the English copy says 07/05/26), international
    investment position and external debt March cells dated 31.03.2025 for 4 kw. 2024. Silver: one row per
    category × reference period × expected date, publisher NBP, GUS or MF by category (one parser serves TP-012 and
    TP-013). Release dates of a topic''s main KPIs add to its heat (release bonus) and give topics.json next_release.'
  overlap: 'GUS rows (real sector, population) are already in the GUS kalendarium (TP-011): keep only the NBP and MF
    tables, or keep all and mark GUS rows as the second channel. MPC dates stay in the manual seed
    warehouse/seeds/release_calendar.csv.'
research:
  priority: review-next
  evidence: tested
  connection: tested
  blockers:
  - 'MPC meeting dates (not blocking the approval): they are not in the SDDS calendar, the Monetary Policy Council does
    not publish its schedule in Monitor Polski (MP 2026/943 and MP 2025/1013 are the policy assumptions, no dates),
    and every nbp.pl page still answers the runner with the bot-protection page "Pardon Our Interruption" (5,996
    bytes; never worked around). The 12 dates a year stay in the manual seed release_calendar.csv, read by a person
    from https://nbp.pl/en/monetary-policy/schedule-of-mpc-meetings, which lists the 2026 dates and says "Narodowy
    Bank Polski will advise on any changes".'
  - 'Re-review 27 Nov 2026 (parked re-review, batch 6): the parking reason (bot protection) was technical, which the
    owner rule of 12 Nov does not accept; an official republisher carries the NBP statistics release dates. Dev
    probe run 45955251368 (job 140360139693, branch test/src-calendars-probe, script dev/src_calendars_probe.py, 27
    Nov 2026): https://stat.gov.pl/banki-i-bazy-danych/sdds/kalendarz-upowszechniania-danych HTTP 200 (redirected to
    /banki-i-bazy-danych/sdds/), linking the XLSX above, HTTP 200, 26,882 bytes, 6 sheets, 56 non-empty rows; the
    financial and external sector tables list 9 NBP categories with monthly or quarterly dates for January to
    December 2026 (e.g. "Wybrane dane z bilansu NBP | 07.01.2026 (12 2025) | 06.02.2026 (01 2026) | …"). English copy
    at https://stat.gov.pl/en/databases/sdds, same layout, 25,540 bytes. nbp.pl: /en/monetary-policy/schedule-of-mpc-meetings,
    /polityka-pieniezna/decyzje-rpp/ and /en/statistic-and-financial-reporting/calendar all HTTP 200 with the
    bot-protection page. Effort S (one entity in release_calendars, shared with TP-013).'
  - 'Earlier parking reason (10 Nov 2026): no reachable route without circumventing bot protection or a blocked host.'
  references:
  - https://stat.gov.pl/banki-i-bazy-danych/sdds/kalendarz-upowszechniania-danych
  - https://stat.gov.pl/en/databases/sdds
  - https://stat.gov.pl/copyright
  - https://nbp.pl/en/monetary-policy/schedule-of-mpc-meetings
  - https://nbp.pl/polityka-pieniezna/decyzje-rpp/
