id: TP-002
name: Money.pl news feed (RSS)
short_name: Money.pl
provider: Wirtualna Polska Media S.A.
source_system: news_feeds
current: true
status: silver
family: J
kpi: false
geography: Poland
provider_type: commercial
domains: [news, media-monitoring]
entities: [headline]
granularity: 'One feed item: title, link, publication time (pl). RSS 2.0, 15 items covering about 20 hours; fields title, link, guid, description, pubDate (RFC 822). /rss/main.xml redirects to the same feed.'
coverage: Rolling window of the newest items; history accumulates from the first landing (10 Nov 2026).
access:
  endpoint: https://www.money.pl/rss/rss.xml
  kind: bulk_file
  interfaces: [RSS, HTML]
  auth: public
  cost: free
  limits: One request per feed every 3 hours (ingestion/sources/news_feeds.yaml).
licence:
  status: restricted
  notes: 'robots.txt allows the feed for any user agent (AI crawlers have their own groups). No feed-specific licence found; Wirtualna Polska terms reserve rights to the content. Use: headline and link with the outlet name only. Press publishers'' right (EU directive 2019/790 art. 15, Polish copyright act as amended 2024): a headline with a link and the outlet name; never article text or images (docs/topics.md).'
updates: Continuous; items roll over within hours to days.
ingestion:
  history: None beyond the feed window; accumulates from the first landing.
  incremental: Every landed copy loaded (accumulating Bronze); Silver deduplicates by canonical URL, then outlet + title.
  identifiers: canonical URL; guid where given
modelling:
  notes: Attention signal for the topics layer (O32), not statistics; kept 400 days in Silver.
  overlap: GDELT (CD-030) counts the same coverage; never add the two.
research:
  priority: review-next
  evidence: documented
  connection: tested
  blockers:
  - Feed terms are the publisher's general terms; public display of headlines waits for the owner's review after the internal period (O32).
  references:
  - https://www.money.pl/rss/rss.xml
  - https://www.money.pl/rss/
