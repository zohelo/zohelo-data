id: PLS-012
name: API Statystyki NFZ – Świadczenia
short_name: 'NFZ statistics: services'
provider: Narodowy Fundusz Zdrowia (NFZ)
source_system: nfz_services
status: built
family: B
kpi: true
geography: Poland; provider/clinical group tables
provider_type: national-public
domains: [healthcare utilization, hospitalizations, diagnoses, procedures]
entities: [patient-aggregate, hospitalization-aggregate, health service, diagnosis, procedure]
granularity: Published statistical table keyed by table ID, with sex, age, admission/discharge, product, ICD-9 and ICD-10
  breakdowns.
coverage: Available-year list/table catalogue; exact first year must be enumerated after approval.
access:
  endpoint: https://api.nfz.gov.pl/app-stat-api-jgp/
  kind: api
  interfaces: [REST API, JSON, XML, Swagger]
  auth: Public API; no key described in opened documentation.
  cost: free
  limits: 10 requests/second per IP (terms v1.1, section III).
licence:
  status: open-conditional
  notes: 'Terms: API regulations (Regulamin) of "API Statystyki NFZ - Świadczenia" v1.1, https://api.nfz.gov.pl/app-stat-api-jgp/terms
    (section II): users must state the source by giving the address https://api.nfz.gov.pl/; the user may not modify the
    data ("Niedozwolone jest modyfikowanie danych przez Usługobiorcę"); no use for software that breaks the law or third-party
    rights, misleads users or acts maliciously; no overloading (10 requests/second per IP); NFZ may block users for breaches
    and may change the API and its terms. No licence name and no clause on commercial reuse (footer: Copyright © Narodowy
    Fundusz Zdrowia, Open Data logo linking to dane.gov.pl); public display of the published values is allowed with attribution.
    Show values as published; any figure we derive (rates, sums, shares) is labelled as a zohelo calculation. Disclaimer:
    use is at the user''s own risk, NFZ is not liable for lost profits. Attribution: "Źródło: Narodowy Fundusz Zdrowia,
    API Statystyki NFZ – Świadczenia (https://api.nfz.gov.pl/)" / "Source: National Health Fund (NFZ), NFZ Statistics API
    – Services (https://api.nfz.gov.pl/)".'
updates: Table releases; schedule and revision policy unknown.
ingestion:
  history: Enumerate table index and available years, then snapshot complete chosen tables.
  incremental: Poll index-of-tables; reload changed table IDs/checksums.
  identifiers: Table ID + dimension member; clinical codes include NFZ products, ICD-9 and ICD-10.
modelling:
  notes: Keep published aggregates only; distinguish patients, hospitalizations and settlement units; suppression/status
    metadata must survive.
  overlap: Overlaps NFZ reports and GUS health statistics; administrative claims perspective differs.
research:
  priority: review-first
  evidence: tested
  connection: tested
  blockers:
  - 'Reading of the no-modification clause for derived figures (rates, sums): decide before publishing derived values; published
    values are shown unchanged'
  - 'Built for basic-data only (Poland and NFZ branches, 2009-2024, #2929): the other table types and the hospital-type
    splits are not loaded'
  references:
  - https://api.nfz.gov.pl/app-stat-api-jgp/
  - https://api.nfz.gov.pl/app-stat-api-jgp/terms
