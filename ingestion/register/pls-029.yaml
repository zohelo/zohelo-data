id: PLS-029
name: Registered unemployment and labour-office vacancy statistics
short_name: MRPiPS registered unemployment
provider: Ministerstwo Rodziny, Pracy i Polityki Społecznej / Public Employment Services
source_system: mrpips_unemployment
status: built
family: B
kpi: true
geography: Poland, voivodeship and powiat, table-dependent
provider_type: national-public
domains: [registered unemployment, job vacancies, employment services]
entities: [unemployed-person aggregate, vacancy aggregate, territorial unit, occupation]
granularity: Monthly aggregate by labour-office geography/category; occupation tables and vacancies are publication-dependent.
coverage: Monthly ZIPs since 2001 on the portal; built from January 2019 (one asset page per year); rate and stock for Poland, voivodeships and powiats.
access:
  endpoint: https://psz.praca.gov.pl/rynek-pracy/statystyki-i-analizy/bezrobocie-rejestrowane
  kind: bulk_file
  interfaces: [HTML, XLSX, PDF]
  auth: Public statistics pages/files.
  cost: free
  limits: None stated; one request at a time, 2 s apart.
licence:
  status: open-conditional
  notes: 'Terms: footer of the Publiczne Służby Zatrudnienia portal https://psz.praca.gov.pl/: "Wszystkie treści
    publikowane w serwisie są udostępniane na licencji Creative Commons Uznanie Autorstwa 3.0 Polska, o ile nie
    jest to stwierdzone inaczej" (CC BY 3.0 PL, https://creativecommons.org/licenses/by/3.0/pl/), which allows
    commercial reuse and modification with attribution; a file marked with other terms keeps them. Attribution:
    "Źródło: MRPiPS / Publiczne Służby Zatrudnienia, <table title> (<month>), CC BY 3.0 PL" / "Source: Ministry of
    Family, Labour and Social Policy / Public Employment Services, <table title> (<month>), CC BY 3.0 PL".'
updates: Monthly preliminary/final releases and annual summaries.
ingestion:
  history: Monthly 'statystyki strukturalne' ZIPs from January 2019 (entity stat_YYYY_MM), found from the listing page, its year categories and the yearly asset pages.
  incremental: Missing months, plus the newest two months re-downloaded on each weekly run; a changed ZIP lands as a new version (Last-Modified, SHA-256).
  identifiers: Reference month + territorial labour office/TERYT + category/occupation code.
modelling:
  notes: Stocks at month end differ from monthly inflows/outflows and vacancies; registered unemployment differs
    from LFS unemployment.
  overlap: GUS publishes registered unemployment too; align release source and avoid duplicate totals.
research:
  priority: review-first
  evidence: documented
  connection: tested
  blockers:
  - Vacancy and occupation tables (half-yearly XLSX) not built yet
  references:
  - https://psz.praca.gov.pl/
  - https://barometrzawodow.pl/
