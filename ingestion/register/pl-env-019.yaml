id: PL-ENV-019
name: PSE Reports API v2 and market/system reports
short_name: PSE reports
provider: Polskie Sieci Elektroenergetyczne (PSE)
source_system: pse_reports
status: built
family: G
kpi: true
geography: Poland
provider_type: national-public
domains: [electricity, power system, balancing market]
entities: [market interval, system interval, generation unit aggregate]
granularity: 15-minute values per report (entity) and business day, with local and UTC timestamps and the publication time.
coverage: 'API v2 from business day 2024-06-14: rce-pln returns 96 rows for 2024-06-14 and none for 2024-06-13. Older reports
  are not in this API.'
access:
  endpoint: https://api.raporty.pse.pl/api/
  kind: api
  interfaces: [REST-API, OData-style JSON, HTML]
  auth: Public, no key.
  cost: Free.
  limits: 'None published; the responses carry no rate-limit headers. Pages of 100 rows continued through nextLink ($after
    cursor); $top, $skip and $count answer 400. robots.txt: none on api.raporty.pse.pl (404); raporty.pse.pl disallows its
    own /api/ path, not used. The old API v1 was announced to close at the end of 2025.'
licence:
  status: unresolved
  notes: 'Terms: none found. The PSE announcement https://www.pse.pl/-/najwazniejsze-dane-o-pracy-systemu-elektroenergetycznego-i-rynku-bilansujacego-w-nowej-odslonie
    (read 12 Nov 2026) offers "możliwość pobierania danych liczbowych czy wykorzystania API według potrzeb użytkownika"
    but states no licence, attribution wording, or rule on commercial reuse and modification; the pse.pl front page links
    only a cookie policy and https://www.pse.pl/nota-prawna answers 404 (Dev probe 45790352597, 26 Nov 2026);
    raporty.pse.pl is a single-page app whose page and script bundle name no terms or licence (Dev probe 45790863668).
    The source stays internal until PSE terms are found. Attribution if used: "Źródło: PSE S.A., raporty.pse.pl".'
updates: 'Daily and intraday: each row has publication_ts; day-ahead values such as RCE are published the day before, operational
  values after the day.'
ingestion:
  history: 'API tested from a GitHub runner (Dev probe run 43203166665 (job 131131537831, branch test/src-cg-probe, 12 Nov
    2026)): GET https://api.raporty.pse.pl/api/<entity>?$filter=business_date eq ''<YYYY-MM-DD>'' returns JSON {value: [...]};
    rce-pln (balancing energy price, PLN/MWh: business_date, dtime, dtime_utc, period, rce_pln, publication_ts) 96 rows
    and about 25 KB a day; his-wlk-cal (demand, wi = wind, pv = photovoltaics, generating-unit groups jg*) 96 rows and about
    49 KB a day; no nextLink at this size. Full load = one request per entity and day from 2024-06-14: 882 days to 12 Nov
    2026, so about 1,800 requests and 65 MB for the two entities, half an hour at one request a second. Dev probes
    45790352597 and 45790863668 (test/2870-pse-probe, 26 Nov 2026): no entity catalogue (/api/ and /api/$metadata answer
    404); a date-range filter (business_date ge ... and le ...) works but pages by 100 rows (nextLink), so a month costs
    as many requests as its days; a DST day (92 or 100 rows) fits one page without nextLink; a repeated request returns
    identical bytes; his-wlk-cal has one row (its last period) for 2024-06-13, left out.'
  incremental: 'Entity = report x business day, version = max publication_ts_utc; weekly run lands the missing days up to
    yesterday (Warsaw) and asks the newest 7 days again; unchanged bytes are not written (snapshot, changed_since_last).
    About 35,000 rows a year per report: small source, refresh full (D32 + #2870).'
  identifiers: Report/dataset ID, business_date, dtime_utc, publication_ts.
modelling:
  notes: 'Preserve Europe/Warsaw local time with the UTC column (DST days have 92 or 100 periods), settlement interval and
    publication time. Grain: 15 minutes, Poland only (geography PL), PLN/MWh and MW. Built (#2870): Silver at 15 minutes;
    Gold build_pse_reports (fact_daily) holds daily means of complete days of the market energy price RCE (PLN/MWh) and
    of demand, wind and photovoltaic generation (MW), draft KPIs in environment.energy; shares of demand not built.'
  overlap: No KPI of kpi.csv is published here yet. ENTSO-E Transparency and Eurostat/Ember carry the EU comparison for
    load and generation; URE price indicators (PL-ENV-020) are quarterly averages of a different market.
research:
  priority: review-first
  evidence: tested
  connection: tested
  blockers:
  - 'PSE reuse terms not found: internal only until the owner or PSE confirms them.'
  - History before 2024-06-14 (old reports) has no route in API v2.
  references:
  - https://api.raporty.pse.pl/
  - https://www.pse.pl/-/najwazniejsze-dane-o-pracy-systemu-elektroenergetycznego-i-rynku-bilansujacego-w-nowej-odslonie
