ingestion:
  history: 'Download every edition: XLSX tables 2019-2025 (about 0.3 MB each) and PDF 2000-2018 (0.3-5.8 MB each, about
    70 MB all PDFs); keep the original files and the posting date.'
  incremental: Poll the page once a month from October; new edition = new /downloadFile id; version by checksum.
  identifiers: Edition + table + category + geography + reference year.
modelling:
  notes: Separate establishment stocks, beds, personnel headcounts/FTE and cases.
