id: PLS-035
name: Turystyka – annual accommodation-establishment tables
short_name: GUS tourism tables
provider: Główny Urząd Statystyczny (GUS / Statistics Poland)
source_system: gus_tourism
status: built
family: B
kpi: true
geography: Poland and voivodeships/powiats, table-dependent
provider_type: national-public
domains: [tourism, accommodation, occupancy]
entities:
- tourist accommodation establishment aggregate
- guest aggregate
- overnight-stay aggregate
- territorial unit
