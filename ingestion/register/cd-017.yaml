id: CD-017
name: YouTube Data API v3
short_name: YouTube Data API
provider: YouTube / Google
status: reviewing
family: J
kpi: false
geography: worldwide
provider_type: commercial
domains: [online-video, social-media]
entities: [channel, video, playlist, comment, user-authorized-account]
granularity: Resource metadata and current statistics; private/account actions require owner OAuth.
coverage: Search and resource APIs expose current discoverable content, not a complete historical snapshot service.
access:
  endpoint: https://developers.google.com/youtube/v3/getting-started
  kind: api
  interfaces: [API]
  auth: Google project/API key; OAuth and user consent for private or mutating operations.
  cost: free
  limits: Quota units apply per project; avoid hard-coding current allowance.
licence:
  status: restricted
  notes: 'Terms: https://developers.google.com/youtube/terms/api-services-terms-of-service and
    https://developers.google.com/youtube/terms/developer-policies (both read by the runner 27 Nov 2026, HTTP 200):
    "If you disagree with any aspect of the Agreement, you do not have our permission to, and you must not, access or
    use any of the YouTube API Services"; the developer policies require API clients to "bring significant additional
    value to the YouTube ecosystem" and say "Don''t store user data indefinitely, and provide a clear, straightforward
    process for them to delete data in your possession". No permission to republish API data is stated. Not reusable
    for public display: stays internal.'
updates: Live resource state; stored non-authorized data generally must be refreshed or deleted within policy windows.
ingestion:
  history: 'PROPOSAL: no warehouse onboarding until retention and derived-metric design passes policy review.'
  incremental: 'PROPOSAL: refresh authorized/current metadata and process deletion requests; no archive claim.'
  identifiers: Channel/video/playlist IDs; owner authorization does not confer rights to other creators' content.
modelling:
  notes: Model API snapshots with observed_at; suppress prohibited derived metrics.
  overlap: May overlap creator dashboards and web search; API policy remains controlling.
research:
  priority: conditional
  evidence: tested
  connection: tested
  blockers:
  - 'Owner question (account and terms): the YouTube Data API needs a Google Cloud project with an API key that the
    owner creates (the runner''s unauthenticated call https://www.googleapis.com/youtube/v3/videos?part=id&id=...
    answered HTTP 403), and its terms limit storage and require deletion processes. Create the project and key and
    accept the YouTube API Services Terms for zohelo, or park CD-017? Recommendation: park. The eight social-platform
    APIs CD-017 to CD-024 can be answered in one reply (''park CD-017 to CD-024''); none offers official statistics
    for Poland, and each needs an account, an application or a paid plan.'
  - 'Re-review 27 Nov 2026 (Task #2914): the parking reason was a terms restriction, which is an owner question, so
    the entry is `reviewing`. Dev probe run 45919690568 (job 140247203923, branch test/src-parked2-probe, script
    dev/src_parked2_probe.py, 27 Nov 2026): the terms of service, developer policies, the policies guide, required
    minimum functionality and the Data API getting-started page HTTP 200 (quoted in licence.notes); the API call
    without key HTTP 403 (expected: key required); robots.txt of developers.google.com and www.googleapis.com allowed
    the reads.'
  - 'Earlier parking reason: YouTube API Services terms restrict storage, refresh, derived metrics and aggregation; no
    audiovisual download; no routine bulk ingestion'
  references:
  - https://developers.google.com/youtube/terms/api-services-terms-of-service
  - https://developers.google.com/youtube/terms/developer-policies
  - https://developers.google.com/youtube/v3/getting-started
