id: CD-024
name: TikTok Commercial Content API
short_name: TikTok Commercial Content API
provider: TikTok
status: reviewing
family: J
kpi: false
geography: multicountry-Europe
provider_type: commercial
domains: [digital-advertising, social-media]
entities: [advertisement, advertiser, targeting, creative]
granularity: Commercial-content/ad records with advertiser, creative, targeting and impression information where available.
