id: PL-ENV-008
name: 'Public Data API: synoptic, hydrological, meteorological and warning feeds'
short_name: IMGW public data API
provider: Instytut Meteorologii i Gospodarki Wodnej–PIB (IMGW-PIB)
source_system: imgw_api
status: built
family: G
kpi: true
geography: Poland
provider_type: national-public
domains: [weather, hydrology, warnings]
entities: [station, observation, warning]
granularity: Current station observations and warnings; JSON, XML, CSV and HTML representations vary by endpoint.
coverage: Live/current feed; retention and backfill depth are not documented on the API information page.
access:
  endpoint: https://danepubliczne.imgw.pl/apiinfo
  kind: api
  interfaces: [REST API, JSON, XML, CSV, HTML]
  auth: Public without documented key.
  cost: Generally free under stated reuse conditions.
  limits: None published on the API page.
licence:
  status: unresolved
  notes: 'Terms: IMGW-PIB "Regulamin udostępniania danych" on https://danepubliczne.imgw.pl/apiinfo (read 13 Nov 2026 from
    a GitHub runner, Dev probe 43336937240); it covers the data offered through https://danepubliczne.imgw.pl/ (API
    and file archive alike, §1). §1: "Każdemu przysługuje prawo do ponownego wykorzystania informacji sektora
    publicznego". §5: "Korzystający może używać nieodpłatnie udostępnionych danych do celów prywatnych, a w przypadku
    danych o wysokiej wartości w każdym celu" (free use for private purposes, for high-value data for any purpose);
    use for business activity ("cel działalności gospodarczej", including publication on websites with advertising,
    §2) needs an agreement under §3 unless the data are high-value data (Regulation (EU) 2023/138). Attribution (§5):
    "Źródłem pochodzenia danych jest Instytut Meteorologii i Gospodarki Wodnej – Państwowy Instytut Badawczy";
    processed data also "Dane Instytutu Meteorologii i Gospodarki Wodnej – Państwowego Instytutu Badawczego zostały
    przetworzone". The page does not say which of its datasets are high-value data, so reuse beyond private purposes
    is not established from the page: unresolved (internal) until the owner reads it (#2959).'
updates: Observations/warnings refresh operationally; endpoint-specific cadence unknown.
ingestion:
  history: 'Current-state endpoints only (the API has no history): https://danepubliczne.imgw.pl/api/data/synop (hourly
    synoptic, JSON; also /format/xml|csv|html), /api/data/hydro/, /api/data/meteo/, /api/data/warningsmeteo, /api/data/warningshydro,
    product list /api/data/product. History comes from PL-ENV-009.'
  incremental: Poll hourly and keep each response as a snapshot (the synop response is about 14 KB; checked 11 Nov 2026).
  identifiers: Station ID, parameter, observation timestamp and warning identifier.
modelling:
  notes: Preserve quality flags; normalize time with Europe/Warsaw/UTC offset and DST evidence.
  overlap: Live API overlaps the file archive near present but is not a historical bulk substitute.
research:
  priority: review-first
  evidence: tested
  connection: tested
  blockers:
  - 'Owner: may IMGW synoptic observations (archive files and API) be treated as high-value datasets under Regulation
    (EU) 2023/138, so that §5 of the IMGW Regulamin allows their reuse for any purpose with the attribution sentence
    (licence then open-conditional), or should zohelo ask IMGW (biznes@imgw.pl)?'
  - Confirm endpoint schemas, retention, timestamps, quotas and attribution wording.
  references:
  - https://danepubliczne.imgw.pl/apiinfo
