id: GL-023
name: ILOSTAT
short_name: ILOSTAT
provider: International Labour Organization
source_system: ilostat
status: built
family: A
kpi: true
geography: worldwide
provider_type: international-public
domains: [labour, employment, earnings, social-protection]
entities: [country, person-aggregate]
granularity: Indicator/ref-area/sex/classification/status/frequency/time at full statistical grain.
coverage: Worldwide; start and availability vary by indicator and national reporting/ILO estimates.
access:
  endpoint: https://rplumber.ilo.org/data/indicator/?id=UNE_DEAP_SEX_AGE_RT_A&format=.csv.gz
  kind: bulk_file
  interfaces: [HTML, bulk-files, SDMX tools]
  auth: public
  cost: free
  limits: No numeric quota published; one request per indicator file and run. Bulk files per indicator and
    frequency are listed at https://rplumber.ilo.org/files/website/bulk/indicator.html (UNE_DEAP_SEX_AGE_RT_A
    1.9 MB gzip, 317,000 rows; Dev probe 43087048719, 11 Nov 2026). The SDMX API (sdmx.ilo.org) also works.
licence:
  status: open-conditional
  notes: 'Terms: CC BY 4.0 for ILOSTAT databases and datasets with their metadata published on or after 3 May 2023,
    ILO Rights and permissions https://www.ilo.org/node/9321 (earlier releases carry no Creative Commons licence automatically;
    ILO-only microdata excluded): reproduce, distribute and adapt for any purpose; do not use the ILO emblem; no endorsement.
    Attribution: "Source: ILO, ILOSTAT, <dataset>, https://ilostat.ilo.org/data/".'
updates: National submissions and modeled estimates follow series-specific releases and can revise history.
ingestion:
  history: Snapshot bulk files, dictionaries, notes and classifications.
  incremental: Reload revised series/periods after release comparison; no CDC.
  identifiers: ILO indicator + ref area + source + classification/disaggregation + time.
modelling:
  notes: Separate observed and modeled estimates; retain status, source and breaks. Rates and totals are not interchangeable.
  overlap: Overlaps WDI, OECD, Eurostat and SDG series; ILO estimate versus national value is a meaningful distinction.
research:
  priority: review-first
  evidence: documented
  connection: tested
  blockers:
  - 'Load only releases published on or after 3 May 2023 (CC BY 4.0 cut-off)'
  - 'Separate modeled and reported series'
  references:
  - https://ilostat.ilo.org/
  - https://ilostat.ilo.org/resources/sdmx-tools/
  - https://www.ilo.org/node/9321
