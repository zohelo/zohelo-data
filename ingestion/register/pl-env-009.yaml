id: PL-ENV-009
name: Public observational file archive
short_name: IMGW observation archive
provider: IMGW-PIB
source_system: imgw_archive
status: built
family: G
kpi: true
geography: Poland
provider_type: national-public
domains: [weather, hydrology]
entities: [station, observation file]
granularity: Packaged meteorological and hydrological observations arranged in daily, monthly and longer-period directories.
coverage: Dated directory archive exists; earliest year and gaps vary by series and require inventory.
access:
  endpoint: https://danepubliczne.imgw.pl/data/dane_pomiarowo_obserwacyjne/
  kind: bulk_file
  interfaces: [bulk-files, ZIP, directory-index]
  auth: Public file download.
  cost: Generally free under IMGW reuse rules.
  limits: Unknown; no bulk-download rate policy was confirmed.
licence:
  status: unresolved
  notes: 'Terms: IMGW-PIB "Regulamin udostępniania danych" on https://danepubliczne.imgw.pl/apiinfo (read 13 Nov 2026 from
    a GitHub runner, Dev probe 43336937240); it covers the data offered through https://danepubliczne.imgw.pl/ (API
    and file archive alike, §1). §1: "Każdemu przysługuje prawo do ponownego wykorzystania informacji sektora
    publicznego". §5: "Korzystający może używać nieodpłatnie udostępnionych danych do celów prywatnych, a w przypadku
    danych o wysokiej wartości w każdym celu" (free use for private purposes, for high-value data for any purpose);
    use for business activity ("cel działalności gospodarczej", including publication on websites with advertising,
    §2) needs an agreement under §3 unless the data are high-value data (Regulation (EU) 2023/138). Attribution (§5):
    "Źródłem pochodzenia danych jest Instytut Meteorologii i Gospodarki Wodnej – Państwowy Instytut Badawczy";
    processed data also "Dane Instytutu Meteorologii i Gospodarki Wodnej – Państwowego Instytutu Badawczego zostały
    przetworzone". The page does not say which of its datasets are high-value data, so reuse beyond private purposes
    is not established from the page: unresolved (internal) until the owner reads it (#2959).'
updates: Files appear in period-based directories; publication lag and revisions are series-specific.
ingestion:
  history: 'Directory listing with dane_aktynometryczne/, dane_hydrologiczne/ and dane_meteorologiczne/ (zipped per year/period;
    also reachable as products through the API); size per directory to be listed in the dev trial (estimate: low GB in total).'
  incremental: Re-list the directories monthly; new or replaced ZIP = new version by checksum.
  identifiers: Station list/version, period, file path and publication timestamp.
modelling:
  notes: Separate observation time from file release; retain missing/quality codes.
  overlap: Use for backfill; reconcile overlap with live API by station/parameter/time and revision rules.
research:
  priority: review-first
  evidence: tested
  connection: tested
  blockers:
  - 'Owner: may IMGW synoptic observations (archive files and API) be treated as high-value datasets under Regulation
    (EU) 2023/138, so that §5 of the IMGW Regulamin allows their reuse for any purpose with the attribution sentence
    (licence then open-conditional), or should zohelo ask IMGW (biznes@imgw.pl)?'
  - Establish per-series years, format dictionaries and revision policy.
  references:
  - https://danepubliczne.imgw.pl/apiinfo
  - https://danepubliczne.imgw.pl/data/dane_pomiarowo_obserwacyjne/dane_hydrologiczne/
