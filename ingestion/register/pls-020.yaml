id: PLS-020
name: Rejestr Podmiotów Wykonujących Działalność Leczniczą (RPWDL)
short_name: RPWDL healthcare providers
provider: Minister Zdrowia / Centrum e-Zdrowia
source_system: rpwdl
status: built
family: E
kpi: false
geography: Poland
provider_type: national-public
domains: [healthcare facilities, provider register]
entities: [healthcare entity, medical practice, organizational unit, service location]
granularity: Public register entry for healthcare entity/practice and its units/locations; public fields only.
coverage: Current register; historical/change access not documented on opened landing page.
access:
  endpoint: https://rpwdl2.ezdrowie.gov.pl/
  kind: bulk_file
  interfaces: [HTML search, file download]
  auth: Public (no login) for the search and the download section.
  cost: free
  limits: None stated; downloads are generated in the application ("Pliki do pobrania" section, one register type per file).
licence:
  status: unresolved
  notes: 'Terms: no reuse licence found. The RPWDL 2.0 user guide for anonymous users (https://ezdrowie.gov.pl/pobierz/rpwdl-2-0-instrukcja-dla-uzytkownikow-niezalogowanych,
    section 2.3 "Pliki do pobrania") says: "Dowiesz się, jak pobrać dane gromadzone w RPWDL 2.0 w postaci plików." (how
    to download the data held in RPWDL 2.0 as files); the guide states no licence. Register content is public by the Medical
    Activity Act, but no attribution text is given: licence stays unresolved (internal only); exclude personal and contact
    data.'
updates: Operational register, changed every working day; the public files are regenerated by the application (no
  validator, no change history offered).
ingestion:
  history: 'Download the register files from "Pliki do pobrania" (register type: healthcare entities, individual and group
    medical practices, nursing practices) and keep each file as received; no history of changes is offered, so keep one
    snapshot per run.'
  incremental: Full snapshot per run; diff in Silver by register key.
  identifiers: Register-book number and entry identifiers; REGON may link legal entity, but practices/units and locations
    require hierarchical keys.
modelling:
  notes: Separate legal entity, establishment, organizational unit and address; apply privacy field allowlist.
  overlap: Overlaps NFZ providers/contracts but registration does not imply an NFZ contract.
research:
  priority: conditional
  evidence: documented
  connection: tested
  blockers:
  - 'Licence unresolved: public register, no attribution or reuse text found'
  - 'Resolved (#2958): the download buttons call a public GET endpoint (/api/rpwdl-public-resource/ledgers-zip/initial,
    CSV in ZIP, one file per register type and ledger state, no login); scripted downloads work (Dev probes 43322217479
    to 43339211206)'
  - 'Define public-field allowlist and history policy (personal data). Open, owner question on #3117: may person-level
    records (sole-trader providers, individual practices) ever be loaded, and may Landing and the Archive keep the ZIPs
    with wspolnicy.csv (names, licence numbers) for newest + 30 days. Until then #2958 loads counts only: no names, NIP,
    REGON, book numbers, ledger or practice ids, addresses or contacts; seat and correspondence TERYT cut to the
    voivodeship; wspolnicy.csv and adresy_swiadczen.csv not read; one snapshot per weekly run, latest-only in Bronze'
  references:
  - https://rpwdl.ezdrowie.gov.pl/
