id: PLG-025
name: Senate legislative process, sittings, votes and members
short_name: Senate data
provider: Chancellery of the Senate
source_system: senat
status: reviewing
family: F
kpi: false
geography: Poland
provider_type: national-public
domains: [parliament, legislation]
entities: [senator, committee, bill, vote]
granularity: Term, sitting/day, vote, print, senator and legislative-stage records.
coverage: Current and archived terms; completeness varies.
access:
  endpoint: https://www.senat.gov.pl/prace/proces-legislacyjny-w-senacie/
  kind: web
  interfaces: [HTML]
  auth: 'public browsing; no API or feed. Export: vote results per term as XML on dane.gov.pl (dataset 4648, CC0 1.0,
    resource 2592577 = https://www.senat.gov.pl/gfx/senat/glosowania_wyniki/senat_kadencja_11.xml, modified 8 Sep 2026,
    Dev trial 45757645915), under /gfx/, which robots.txt disallows for every agent: not read (owner question on #482)'
  cost: free
  limits: 'None published. robots.txt, read in full by the probe: "User-agent: * Disallow: /gfx/ Disallow: /pdf/ Allow:
    /*.pdf$ Allow: /*.doc$ Allow: /*.xls$ Allow: /*.rtf$" and "User-agent: Fasterfox Disallow: /". The pages of this route
    are allowed for every agent.'
licence:
  status: open-conditional
  notes: 'Terms: https://www.senat.gov.pl/ponowne-wykorzystywanie-informacji-sektora-publicznego/ (read in full by Dev probe
    43326678967, 12 Nov 2026), section I: "Ponowne wykorzystywanie informacji sektora publicznego udostępnionej na stronach
    internetowych www.senat.gov.pl oraz www.senat.edu.pl jest bezpłatne, ale wymaga: - poinformowania o źródle jej pozyskania
    oraz o przetworzeniu informacji ponownie wykorzystywanej; - w przypadku informacji mającej cechy utworu [...] poinformowania
    o nazwisku, imieniu lub pseudonimie twórcy". Attribution: "Źródło: Kancelaria Senatu, www.senat.gov.pl; dane przetworzone
    przez zohelo". Modification allowed with the notice of processing; commercial reuse not addressed (recorded as not
    allowed, licence.csv senat_psi_reuse). Photos marked PAP are excluded (none are read).'
updates: Event-driven around sittings and legislative work.
ingestion:
  history: 'Web route, server-rendered HTML read with plain requests (no browser session): votes per sitting day at /prace/posiedzenia/przebieg,<sitting>,<day>,glosowania.html
    with a print page per vote (/prace/posiedzenia/glosowanie-drukuj,<vote id>.html); senators at /sklad/senatorowie/senator,<id>,<term>,<slug>.html
    (102 links for term 11). The home page, the sittings page and the legislative-process page link no API, open-data page,
    XML, JSON, CSV or RSS. Request pattern: one connection, one request per second, term 11 only, never /gfx/ or /pdf/.
    Built under decision D43 (#482): sittings list (7 pages), one votes page per sitting day, one print page per vote (the
    day page has no totals), senators list; entity = one page, version = download time. Size: docs/sources/senat.md.'
  incremental: New sitting days only (the sittings page lists them); one request per second; senator pages once per month.
  identifiers: Term, sitting number, day, vote id; senator id.
modelling:
  notes: 'kpi false. Smallest Gold selection: votes per sitting and senator attendance for term 11, Poland only, no regional
    grain. Low value next to the Sejm API (PLG-024). Effort M.'
  overlap: Same bill appears across Sejm, Senate and ELI stages.
research:
  priority: review-next
  evidence: documented
  connection: tested
  blockers:
  - 'Owner question: www.senat.gov.pl is behind Cloudflare, which sometimes answers GitHub runners with its bot check ("Just
    a moment...", HTTP 403, server cloudflare) already on /robots.txt, and the only bulk export (the CC0 vote results XML
    of dane.gov.pl dataset 4648) is under /gfx/, which robots.txt disallows; we work around neither. Should zohelo write
    to the Chancellery of the Senate (Kancelaria Senatu) asking it to let the user agent "zohelo-data/1.0 (+https://github.com/zohelo/zohelo-data;
    public statistics platform)" through its bot check for a weekly read and to allow the download of senat_kadencja_11.xml?'
  - 'Runs from GitHub runners, same user agent, one request at a time: Dev probe 43326678967 (12 Nov) 200; Dev trial 43813034164
    (16 Nov) HTTP 403 on /robots.txt; Dev probe 45746035725 (26 Nov 02:59 UTC) 200 on /robots.txt (unchanged) and /prace/posiedzenia/
    (96,275 bytes, 88 sitting-day links); Dev trial 45757645915 (26 Nov 04:50 UTC) HTTP 403 on /robots.txt, server cloudflare,
    page "Just a moment..." (5,618 bytes): stopped, not retried, nothing landed, scratch removed (objects_left 0). The same
    trial read the dane.gov.pl metadata: dataset 4648 "Głosowania Senatu" (Kancelaria Senatu, CC0 1.0, update frequency
    daily), resources 2592577 (term XI) and 2592581 (term X), XML, modified 8 Sep 2026, both linking /gfx/senat/glosowania_wyniki/.
    The code (Landing, Bronze, Silver, Gold) is kept without a schedule (#482); the schedule comes with the answer.'
  - 'Route decided: polite crawl of public pages that robots.txt allows, following the orchestrator verdict on PR #2878
    under the owner rule of 12 Nov 2026 (issue #2873); recorded as decision D43 in docs/decisions.md by the build pull
    request (#482), which the owner may overrule.'
  - 'Dev probe run 43282997907 (job 131408942570, branch test/src-dfh-probe, 12 Nov 2026): www.senat.gov.pl answered 200
    on the home, sittings, votes and senators pages; bip.senat.gov.pl was not readable. Dev probe run 43288930412 (job 131429683337,
    branch test/src-dfh-probe, script dev/src_dfh_fix_probe.py, 12 Nov 2026): robots.txt read in full; the re-use page answered
    200.'
  references:
  - https://www.senat.gov.pl/prace/posiedzenia/
  - https://www.senat.gov.pl/sklad/senatorowie/
  - https://www.senat.gov.pl/ponowne-wykorzystywanie-informacji-sektora-publicznego/
