  priority: review-next
  evidence: tested
  connection: tested
  blockers:
  - 'Owner question: PAP''s free feed https://www.pap.pl/rss.xml still answers automated clients with an Incapsula bot-protection
    page (HTTP 200, 172 bytes "Not found."), and so does https://www.pap.pl/regulamin, so neither the feed nor PAP''s terms
    can be read without getting around bot protection, which is never done. Do you want us to write to PAP asking for an
    allowed way to read the feed (a syndication or partner route, or an exception for one request every 3 hours), or leave
    PAP out of the news feeds?'
  - 'Re-review 26 Nov 2026 (Task #2917): Dev probe run 45826667517 (job 139932480070, branch test/src-parked-probe, script dev/src_parked5_probe.py, 26 Nov 2026): robots.txt of www.pap.pl answered (it disallows search, node and paging paths,
    not /rss.xml); the feed and the terms page returned the bot-protection page; nothing else on the host was asked. GDELT
    (CD-030, loaded) records pap.pl article links among its sources but not PAP''s feed, so PAP is not contained in it.'
  references:
  - https://www.pap.pl/rss.xml
  - https://www.pap.pl/
