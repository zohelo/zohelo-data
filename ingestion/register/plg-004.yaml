id: PLG-004
name: Monetary aggregates
short_name: NBP monetary aggregates
provider: Narodowy Bank Polski (NBP)
status: reviewing
family: C
kpi: true
geography: Poland
provider_type: national-public
domains: [money, banking]
entities: [country, financial institution sector]
granularity: Aggregate/counterpart by month and published classification.
coverage: Monthly from December 1996 (statement on the M3 page); M3 is the basic money-supply category since March 2002.
access:
  endpoint: https://nbp.pl/en/statistic-and-financial-reporting/monetary-and-financial-statistics/m3-and-counterparts/
  kind: bulk_file
  interfaces: [HTML, XLSX, PDF]
  auth: public download
  cost: free
  limits: None published.
licence:
  status: unresolved
  notes: 'Terms: Terms of Use of the Narodowy Bank Polski Website, https://static.nbp.pl/dokumenty/regulaminy/regulamin_nbppl_en.pdf
    (read 12 Nov 2026): saving files, copying pages in full or in part and printouts are allowed "for personal use" (§1(6));
    "In the event of using materials derived from the NBP internet page, the user is required to state their source along
    with a link to the website www.nbp.pl" (§1(8)); "Information and materials are for informational purposes only" (§4(1)).
    Commercial reuse, redistribution and modification are not addressed. Attribution: "Źródło: NBP, www.nbp.pl" / "Source:
    Narodowy Bank Polski, www.nbp.pl". Unresolved under the owner decision of 14 Oct 2026 (NBP data stays internal until
    NBP confirms reuse terms; Task data/src-plg-001/review/ask-nbp, whose e-mail should name the monetary statistics too).'
updates: 'Monthly. NBP release calendar (https://nbp.pl/en/statistic-and-financial-reporting/calendar/): broad money M3
  and its counterparts about the 22nd-24th for the previous month, reserve money and counterparts about the 5th-7th; earlier
  months are revised in the same workbook.'
ingestion:
  history: 'Bulk: one workbook per table behind the "Download >>" link of each table page (M3 and counterparts, reserve
    money and counterparts, balance sheet of NBP in the monetary approach), each with the whole monthly history. NBP statistics
    files sit under https://static.nbp.pl/dane/ with stable names (as bop_m.xlsx of PLG-002); the folder https://static.nbp.pl/dane/monetarno-finansowa/
    is confirmed by the methodology PDFs (DIC-M3.pdf), the workbook names are unverified: the links are not in the static
    HTML (Dev probe run 43203166665 (job 131131537831, branch test/src-cg-probe, 12 Nov 2026) found 0 file links on the
    three pages). On 16 Nov 2026 every nbp.pl page, /wp-json/wp/v2/pages and the sitemaps answered the runner with a 5,996-byte
    bot-protection page (Dev probe run 43831903004, job 133178972022, branch test/src-r13-probe), so the 12 Nov result
    was most probably that page too; static.nbp.pl answered (robots.txt 404, no rules), and the folder holds the methodology
    PDFs DKI-M3.pdf, DKI-Miary.pdf, DKI-nbp.pdf and DKI-nal-zob.pdf (web search, 16 Nov 2026). File names are not guessed.
    Size not measured.'
  incremental: 'Entity = workbook, version = Last-Modified of the file; re-download after the monthly release and replace
    the entity (snapshot, changed_since_last). Small source: refresh full. Fits the fixed-URL bulk_file pattern next to
    nbp_bop (suggested source_system nbp_monetary, shared with PLG-005).'
  identifiers: period + aggregate/component + sector + unit
modelling:
  notes: 'Do not sum parent aggregates with components; distinguish stocks, transactions and growth. Grain: item x month,
    Poland only (geography PL), PLN million. Smallest Gold selection: M3, M1 and cash in circulation outside MFIs (monthly
    stocks) as new KPIs in finance.money_banking, with M3 annual growth as a metric.'
  overlap: No KPI of kpi.csv is published here yet. ECB BSI (GL-016) and Eurostat give the euro-area and EU comparison for
    M3; keep NBP as its own series (O31).
research:
  priority: review-first
  evidence: documented
  connection: not-tested
  blockers:
  - 'Owner question: nbp.pl now answers GitHub runners with a bot-protection page ("Pardon Our Interruption", 5,996
    bytes, on every page, the WordPress content API and the sitemaps; Dev probe run 43831903004, 16 Nov 2026), which
    we never work around, while the workbooks themselves sit on static.nbp.pl, which answers runners (nbp_bop and nbp_interest_rates
    load from it). Will you open https://nbp.pl/statystyka-i-sprawozdawczosc/statystyka-monetarna-i-finansowa/ in your
    browser and paste into issue #2997 the address behind each "Pobierz" (download) link of the pages "Podaż pieniądza
    M3 i czynniki jego kreacji", "Pieniądz rezerwowy i czynniki jego kreacji", "Bilans NBP (ujęcie monetarne)", "Należności
    i zobowiązania MIF / banków", "Skonsolidowany bilans MIF" and "Zagregowany bilans pozostałych MIF", or should the
    NBP e-mail of PLG-001 also ask NBP for these file addresses?'
  - Confirm NBP reuse terms (owner, with PLG-001); until then internal only.
  references:
  - https://nbp.pl/en/statistic-and-financial-reporting/monetary-and-financial-statistics/
  - https://nbp.pl/en/statistic-and-financial-reporting/monetary-and-financial-statistics/m3-and-counterparts/
  - https://nbp.pl/en/statistic-and-financial-reporting/calendar/
  - https://static.nbp.pl/dokumenty/regulaminy/regulamin_nbppl_en.pdf
