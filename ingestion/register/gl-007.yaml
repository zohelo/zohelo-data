ingestion:
  history: Archive complete named releases with metadata and vintage.
  incremental: Reload a named release or affected period after publication; no CDC.
  identifiers: Use published economy and indicator IDs; preserve survey/round/vintage where applicable.
modelling:
  notes: Model observations at stated grain; retain uncertainty, status, unit, source and methodology fields.
