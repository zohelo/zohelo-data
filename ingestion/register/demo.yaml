- id: DM-009
  name: zohelo synthetic SME accounting ledger (Xero-shaped, Polish identifiers)
  short_name: Synthetic SME ledger
  provider: zohelo (generated)
  status: approved
  family: K
  kpi: false
  geography: Poland (fictional companies with NIP, TERYT and PKD codes)
  provider_type: community-academic
  domains: [accounting, accounts receivable, accounts payable, cash, VAT]
  entities: [contact, invoice, bill, invoice line, payment, bank transaction, manual journal, account]
  granularity: Objects shaped like the Xero Accounting API (Contacts, Invoices ACCREC/ACCPAY with line items, Payments,
    BankTransactions, ManualJournals, Accounts) for a few fictional Polish SMEs, generated with a fixed seed; Polish
    chart of accounts and VAT rates (23/8/5/0 %).
  coverage: Generated; rolling 36 months ending in the current month.
  access:
    endpoint: generated in this repository by the source's Landing code (fixed seed, deterministic)
    kind: bulk_file
    interfaces: [JSON]
    auth: public
    cost: free
    limits: None; Landing writes the generated JSON files like downloaded ones (receipt, SHA-256).
  licence:
    status: open
    notes: 'Terms: generated by zohelo, copyright Radoslaw Utkala; no third-party data. Attribution: "Synthetic data generated by
      zohelo". The field names follow the public Xero Accounting API documentation
      (https://developer.xero.com/documentation/api/accounting/overview); no Xero data is used. The real Xero Demo
      Company would need the owner''s Xero developer account (owner decision, not planned).'
  updates: Regenerated monthly so the latest month is always current.
  ingestion:
    history: Snapshot per generation month.
    incremental: None; each month regenerates the whole ledger.
    identifiers: Company NIP + object type + generated id.
  modelling:
    notes: The SME accounting model of the desk - P&L and balance sheet from journals, AR/AP ageing, cash flow, VAT; the
      Xero-to-Power BI story for small clients.
    overlap: None.
  research:
    priority: review-next
    evidence: none
    connection: not-tested
    blockers:
    - The generator is written in the declaration Task (seeded, deterministic, documented distributions).
    references:
    - https://developer.xero.com/documentation/api/accounting/overview
