licence:
  status: restricted
  notes: 'Terms: https://gpwbenchmark.pl/korzystanie_stawek_referencyjnych and
    https://gpwbenchmark.pl/stosowanie_stawek_referencyjnych (read by the runner 26 Nov 2026): use of benchmark and
    non-benchmark data is offered through agreements ("Umowa na korzystanie z danych niebędących danymi wskaźników
    referencyjnych", "Umowa o stosowanie" with annexes); GPW fee schedule from 1 Jan 2027: distribution licence for "I
