    Voivodeship Monument Conservators). Updated quarterly. Addresses may identify private property; avoid
    owner/person fields. Attribution: "Źródło: Narodowy Instytut Dziedzictwa, Ewidencja zabytków nieruchomych,
    dane.gov.pl (<date>), CC BY 4.0" / "Source: National Heritage Institute (NID), register of immovable
    monuments, dane.gov.pl (<date>), CC BY 4.0".'
