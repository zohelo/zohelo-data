id: PLS-009
name: Portal Statystyczny ZUS
short_name: ZUS statistical portal
provider: Zakład Ubezpieczeń Społecznych (ZUS)
source_system: zus_psz
current: true
status: built
family: B
kpi: true
geography: Poland and voivodeships, table-dependent
provider_type: national-public
domains: [social insurance, pensions, benefits, sickness absence, contributors]
entities: [person-aggregate, contribution payer-aggregate, voivodeship]
granularity: Published aggregate workbook/table by topic, month/period and breakdown; no individual insurance
  records.
coverage: Archives vary by topic; current examples include monthly tables.
access:
  endpoint: https://psz.zus.pl/
  kind: bulk_file
  interfaces: [HTML, XLS, XLSX, PDF]
  auth: Public downloads without login.
  cost: free
  limits: No API; automated-download limits unknown.
licence:
  status: unresolved
  notes: 'Terms not stated for psz.zus.pl (review of #2846). ZUS re-use terms
    https://www.zus.pl/web/biuletyn-informacji-publicznej/obsluga-klienta/ogolne-zasady-zalatwiania-spraw/ponowne-wykorzystywanie-informacji-sektora-publicznego
    grant re-use only of information "udostępnionych na stronie podmiotowej Biuletynu Informacji Publicznej Zakładu
    Ubezpieczeń Społecznych i w centralnym repozytorium informacji publicznej www.danepubliczne.gov.pl" or passed on
    request (conditions: source, dates of creation and retrieval, whole or part, processing disclosed); ZUS disclaims
    information obtained otherwise. psz.zus.pl is neither BIP nor dane.gov.pl and shows no terms of its own. Route to
    publishing: the same tables on dane.gov.pl (land them from there), or written confirmation from ZUS that psz.zus.pl
    falls under these terms (owner question). Until then the source stays internal (licence gate).'
updates: Portal says it is systematically supplied with current data; topic cadence varies, including monthly
  series.
ingestion:
  history: Backfill selected topic archives, preserving original files and publication dates.
  incremental: Poll topic archive pages and version replaced files by checksum.
  identifiers: Topic/table + reference month/period + geography/category; link province to TERYT and keep ZUS contribution-title
    codes.
modelling:
  notes: Separate stocks at period end from flows during period; store persons, accounts and payers as different
    measures.
  overlap: May overlap GUS/BDL labour and social-protection aggregates, but ZUS administrative population and
    timing differ.
research:
  priority: review-first
  evidence: documented
  connection: tested
  blockers:
  - 'Route found (Dev probes 43091539492, 43162355678 on test/src-w2pl-probe): psz.zus.pl category pages (e.g. /kategorie/emerytury/stan-na-grudzien) link one XLSX per topic table and year under /documents/493365/<folder>/<name>.xlsx/<uuid>, 2011 onwards (.xls before 2014), about 25 topic families. A build needs a chosen family list (pensions in December by voivodeship and benefit type first, for the KPI zus_pension_avg).'
  - 'Built (#2461): curated families landed by folder id (ingestion/to_landing/zus_psz FAMILIES): pensioners_dec
    9888915 and pension_amount_dec 9888921 (December, Poland, 2018-), insured_pension 532853, insured_sickness_voiv
    532793, payers_voiv 533093, absence_voiv 6744574 (quarterly, current year only on the portal), insured_health
    1159389 (monthly, 2012-) and foreign_insured 3456951 (monthly, 2020-). Not built: .xls years (before 2014/2018),
    the 2012-2022 insured-by-age summary file, new awards, disability and survivors pensions, benefits, medical
    certification, rehabilitation and family programmes. No voivodeship pension table after 2011.'
  references:
  - https://psz.zus.pl/
  - https://psz.zus.pl/kategorie/ubezpieczeni/ubezpieczenia-emerytalne-i-rentowe
  - https://www.zus.pl/web/biuletyn-informacji-publicznej/obsluga-klienta/ogolne-zasady-zalatwiania-spraw/ponowne-wykorzystywanie-informacji-sektora-publicznego
