  cost: free
  limits: API quotas unknown.
licence:
  status: open-conditional
  notes: 'Terms: https://eteryt.stat.gov.pl/eTeryt/rejestr_teryt/udostepnianie_danych/formy_i_zasady_udostepniania/formy_i_zasady_udostepniania.aspx
    ("Rejestr terytorialny TERYT jest jawny", data "udostępniane są bezpłatnie wszystkim użytkownikom"; re-use under art.
    18 of the Open Data Act of 11 Aug 2021, Dz.U. 2023 poz. 1524, with art. 49a of the Public Statistics Act; no named
    licence and no required wording on the page). Republication: allowed. Attribution: "Źródło: GUS, TERYT".'
updates: Full and update files are published; cadence and retention need verification.
ingestion:
  history: Load earliest available full snapshot, then all official change files in order.
  incremental: Use change files when continuous and periodically reconcile to a full snapshot.
  identifiers: TERC uses WOJ+POW+GMI+RODZ; SIMC identifies locality; ULIC identifies street name and needs locality/address
    scope.
modelling:
  notes: Slowly changing territory/locality/street dimensions with valid-from/to; labels are not keys.
  overlap: Key backbone for BDL and registers; NUTS stays separate and versioned.
