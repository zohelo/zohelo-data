id: PLG-010
name: Local-government budget reports (sprawozdania budżetowe JST)
short_name: MF local-government budgets
provider: Ministry of Finance
source_system: mf_jst_budgets
status: built
family: D
kpi: true
geography: Poland
provider_type: national-public
domains: [local government finance, budget]
entities: [municipality, county, city with county rights, voivodeship]
granularity: Individual reporting-unit lines plus aggregates and forecasts.
coverage: Annual sections 2018–2026 and archive to 2001.
access:
  endpoint: https://www.gov.pl/web/finanse/sprawozdania-budzetowe
  kind: bulk_file
  interfaces: [XLSX, DBF, HTML]
  auth: public download
  cost: free
  limits: None stated; one request at a time, 2 s apart.
licence:
  status: open-conditional
  notes: 'Terms: gov.pl copyright page https://www.gov.pl/web/gov/prawa-autorskie (terms of use
    https://www.gov.pl/web/gov/warunki-korzystania): text content of gov.pl is CC BY-SA 4.0
    (https://creativecommons.org/licenses/by-sa/4.0/), which allows commercial reuse and modification with
    attribution and share-alike; use of official materials (materiały urzędowe) published on gov.pl needs no
    consent; third-party works need their owners'' consent; audiovisual material is CC BY-NC-ND 4.0 (not used).
    The XLSX/PDF attachments carry no licence of their own; an attachment marked with other terms keeps them.
    Attribution: "Źródło: Ministerstwo Finansów, Sprawozdania budżetowe jednostek samorządu terytorialnego
    (<period>)" / "Source: Ministry of Finance, local-government budget reports (<period>)".'
updates: Monthly, quarterly or annual by report form; corrections may replace submissions.
ingestion:
  history: 'PROPOSAL: load the published JST databases by report form and year, using 2018–2026 sections plus
    the separate archive to 2001.'
  incremental: 'PROPOSAL: replace affected report-period partitions when corrected files appear; do not infer
    row changes from page metadata.'
  identifiers: TERYT/REGON where present + JST type + form + class + period
modelling:
  notes: Keep revenue, expenditure, commitments and receivables separate; totals overlap.
  overlap: MF submissions may underlie GUS/BDL indicators.
research:
  priority: review-first
  evidence: catalogue-only
  connection: tested
  blockers:
  - 'Per-unit report databases (Rb27S, Rb28S, RbNDS, RbN, RbZ ZIPs, 2001-2026, TERYT per unit) not built yet; summaries built from 2022 Q1.'
  references:
  - https://www.gov.pl/web/finanse/sprawozdania-budzetowe
  - https://www.gov.pl/web/gov/prawa-autorskie
