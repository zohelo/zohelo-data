id: GL-015
name: BIS Data Portal
short_name: BIS Data Portal
provider: Bank for International Settlements
source_system: bis
status: built
family: C
kpi: true
geography: worldwide
provider_type: international-public
domains: [banking, credit, debt, derivatives, payments, prices, exchange-rates]
entities: [country, banking-system, sector]
granularity: Topic cube; may include reporting country, counterparty, sector, instrument, currency and period.
coverage: Reporting central banks/national authorities; coverage/history differ by topic. Russia reporting stopped
  after 28 Feb 2022.
access:
  endpoint: https://stats.bis.org/api/v1/data/WS_CBPOL/M./all?format=sdmx-csv
  kind: api
  interfaces: [HTML, SDMX REST API, CSV bulk, SDMX bulk]
  auth: public
  cost: free
  limits: No numeric quota published; one request per selection and run. Six selections (WS_CBPOL and WS_EER
    monthly, WS_SPP, WS_TC, WS_CREDIT_GAP, WS_DSR whole) are 371,000 observations, 64 MB (Dev probe
    43087048719, 11 Nov 2026). The csv_flat bulk zips decorate codes with labels and split series attributes
    into separate rows, so the API's SDMX-CSV is used.
licence:
  status: open-conditional
  notes: 'Terms: https://www.bis.org/about/legal/permitted-use-statistics — use of BIS statistics is unrestricted
    provided the BIS is cited as the source and their inclusion causes no additional charge to subscribers or
    other users; no other use is permissible; translations must state they are not official BIS translations;
    no warranty of accuracy and no investment advice (disclaimer to show); the APIs may not be modified or
    redistributed. Attribution: "Source: BIS statistics (Bank for International Settlements)".'
updates: Topic release dates vary; bulk files are dated and history may revise.
ingestion:
  history: Load full topic packages with structures and release date.
  incremental: Replace topic package or changed periods after each release.
  identifiers: BIS dataflow + full key; preserve residence/consolidated basis and counterparties.
modelling:
  notes: Separate facts by topic/grain; positions, flows, rates and indexes are non-additive across many dimensions.
  overlap: Overlaps IMF, ECB and national central banks; BIS harmonization/consolidation basis makes values non-substitutable.
research:
  priority: review-first
  evidence: documented
  connection: tested
  blockers:
  - Commercial packaging must satisfy no-additional-charge condition
  - Review topic-specific confidentiality/coverage flags
  references: ['https://data.bis.org/', 'https://data.bis.org/bulkdownload', 'https://data.bis.org/help/legal']
