id: CD-030
name: GDELT 2.0 Event Database and Global Knowledge Graph
short_name: GDELT
provider: GDELT Project
source_system: gdelt
current: true
status: silver
family: J
kpi: false
geography: worldwide
provider_type: community-academic
domains: [news-events, media-monitoring]
entities: [event, location, organization, person-mention, source-document]
granularity: 'Onboarded scope (topics, O32): DOC 2.0 API daily timelines per topic query (matching articles,
  all monitored articles, average tone). Event and GKG exports are a later scope.'
coverage: DOC API rolling window of about 3 months; history accumulates from the first landing (10 Nov 2026).
access:
  endpoint: https://api.gdeltproject.org/api/v2/doc/doc?query={query}&mode=timelinevolraw|timelinetone&format=json&timespan={span}
  kind: api
  interfaces: [bulk-files, API, BigQuery, CSV]
  auth: Public download/query routes.
  cost: free
  limits: 'DOC API: at most one request every 5 seconds (HTTP 429 with that message); shared GitHub runner addresses
    get 429 at first, 200 after back-off (Dev probes 42784542844, 42784946888).'
licence:
  status: open-conditional
  notes: 'GDELT terms (https://www.gdeltproject.org/about.html#termsofuse): the datasets are available for
    unlimited and unrestricted use for any academic, commercial or governmental purpose, with a citation of the
    GDELT Project and a link to its website. Only counts and tone are kept, never article URLs or text.'
updates: The DOC API updates every 15 minutes; a day's counts settle after the day ends.
ingestion:
  history: 3 months on the first landing per query.
  incremental: Daily 2-week window per query and mode; every copy loaded (accumulating Bronze), newest value per day in Silver.
  identifiers: topic query + mode + day
modelling:
  notes: Model coded assertions, not verified real-world events; the volume is used as a normalised share of all
    monitored articles (value / norm), never summed with headline counts.
  overlap: Overlaps the news feeds (TP-0xx); do not sum mentions as unique events.
research:
  priority: review-next
  evidence: documented
  connection: tested
  blockers:
  - Validate Poland/Polish coverage per query (gold.topic_quality).
  references:
  - https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/
  - https://www.gdeltproject.org/about.html#termsofuse
