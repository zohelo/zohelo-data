id: EX-002
name: e-Wyszukiwarka industrial-property search
short_name: UPRP e-Wyszukiwarka
provider: Patent Office of the Republic of Poland (UPRP)
status: reviewing
family: E
kpi: false
geography: Poland
provider_type: national-public
domains: [innovation, intellectual-property]
entities: [patent, trademark, industrial-design, applicant]
granularity: 'One record per published application or exclusive right (inventions, utility models, trademarks,
  industrial designs), from the UPRP domain systems and the BUP and WUP publications.'
coverage: 'UPRP describes the search as covering "opublikowanych zgłoszeń i udzielonych praw wyłącznych na wszystkie
  przedmioty własności przemysłowej" (no record was read). The bulletins that publish the same records are on
  uprp.gov.pl as PDF: BUP 1973 to 2026, WUP 1924 to 2026.'
access:
  endpoint: https://uprp.gov.pl/pl/uslugi-online/e-wyszukiwarka
  kind: web
  interfaces: [web-search-JavaScript-app, API, PDF]
  auth: 'Public search in a browser. UPRP''s web service api.uprp.gov.pl has no public documentation or terms;
    whether it needs an account or a key is not stated anywhere read. The bulletin PDF files need nothing.'
  cost: free
  limits: 'None documented. https://ewyszukiwarka.pue.uprp.gov.pl and https://api.uprp.gov.pl answer a GitHub runner
    with an Imperva/Incapsula challenge page (Dev probe run 43287937228); bot protection is never worked around. The
    bulletin files on uprp.gov.pl are plain downloads.'
licence:
  status: unresolved
  notes: 'Terms:
    https://uprp.gov.pl/pl/warunki-korzystania-z-portalu-informacyjnego-urzedu-patentowego-rp-i-platformy-uslug-elektronicznych-urzedu-patentowego-rp
    ("Data publikacji: 12.09.2023 r. wersja 3.0."; they cover uprp.gov.pl and "ich subdomen *.uprp.gov.pl", so the
    search application and the bulletin files too; read in full on 12 Nov 2026). They do not address reuse: no
    attribution sentence, commercial reuse not stated, modification not stated, bulk or automated reading not
    mentioned. Relevant wording: "Użytkownik korzysta z zasobów PI i PUEUP na własną odpowiedzialność." and
    "Użytkownik obowiązany jest do zachowania poufności pozyskanych danych, w szczególności w sytuacji pozyskania
    danych bez tytułu prawnego." Unit data beyond the search go by request: "Wnioski są rozpatrywane zgodnie z
    przepisami Ustawy o dostępie do informacji publicznej"
    (https://uprp.gov.pl/pl/o-urzedzie/statystyki/zasady-udostepniania-danych-statystycznych). Records name
    applicants, right holders and inventors (personal data of natural persons). No licence is claimed; whatever is
    built stays internal. No owner decision exists on these terms.'
updates: 'Weekly: the bulletins appear on Mondays (BUP trademarks no. 45/2026: Last-Modified Mon, 9 Nov 2026; no.
  44: 2 Nov 2026; no. 43: 26 Oct 2026). No feed or change list.'
ingestion:
  history: 'Three routes were looked at. (1) UPRP''s own web service: its 2024 report to WIPO says the office "has
    used webservice available on https://api.uprp.gov.pl/", that "only link to this webservice is published on
    https://dane.gov.pl/pl", that there is an "API endpoint serving bibliographic data for given numbers and dates
    of BUP and WUP publications" and that "At the end of 2023, the EPO switched to retrieve the data using the
    provided API" (https://confluence.wipo.int/confluence/spaces/ATR/pages/1640995272/CWS+ATR+PI+2024+PL, desk
    fetch, 12 Nov 2026). The host is behind the bot protection, so this route needs UPRP to give access: the owner
    question. (2) Tested fallback, the bulletins: https://uprp.gov.pl/pl/publikacje/biuletyn-i-wiadomosci-uprp
    (5,159,339 bytes of HTML) links 3,287 PDF files: BUP trademarks 506 files (2017 to 2026), BUP inventions and
    utility models 390 (2017 to 2026), BUP before the split 1,119 (1973 to 2016), WUP 1,237 (1924 to 2026), other
    35. The newest three answered HEAD 200 with Last-Modified (3.7 to 7.5 MB each); bup45_2026.pdf (2,778,880 bytes,
    23 page objects) and wup45_2026.pdf (5,968,277 bytes, 124 page objects) have text layers. Total size not
    measured; record layout not analysed; old years may be scans. Dev probe run 43295075918 (job 131451094958) and
    Dev probe run 43299743376 (job 131467412298), branch test/src-fix-probe, 12 Nov 2026. (3) Official republishers:
    EPO (Espacenet shows the Polish documents: "The data are currently published on ESPACENET"; the bulk-data page
    of epo.org answered 200 and lists DOCDB and INPADOC, their terms were not captured; Open Patent Services is
    EX-004, parked on its licence and needing an account); EUIPO TMview and DesignView receive UPRP data (DesignView
    since November 2022, TMview since September 2024:
    https://confluence.wipo.int/confluence/spaces/ATR/pages/1640995286/CWS+ATR+TM+2024+PL), but www.tmdn.org closed
    the connection on robots.txt from the runner, so nothing was requested there; WIPO databases were not probed;
    dane.gov.pl timed out from the runner (75 s).'
  incremental: 'For the bulletin route: entity = one bulletin issue (series, year, number), version = Last-Modified;
    issues are never replaced, so new files only (delta), read from the listing page once a week.'
  identifiers: 'Application number, right number, BUP/WUP series, number and date, classification symbol; applicants
    would need REGON or another official identifier, never a name match.'
modelling:
  notes: 'kpi false. Gold use: an entity table of industrial-property rights keyed by application number (right
    type, filing and publication dates, classification, bulletin issue), for legal persons only; names of natural
    persons (inventors, individual applicants) are not stored. Smallest valuable selection: issues from 2017 on (the
    two current BUP series and WUP). Counts of applications and grants belong to EX-001, not here. Effort L on the
    bulletin route (PDF text extraction, no PDF reader in the pipeline); M if UPRP gives API access.'
  overlap: 'EPO Open Patent Services (EX-004, parked) and WIPO hold related records of Polish applications; patent
    families differ from individual publications. Aggregates: EX-001 and GUS BDL P3005. No other loaded source holds
    these unit records.'
research:
  priority: conditional
  evidence: tested
  connection: tested
  blockers:
  - 'Owner: will you send this request to UPRP (Centrum.Kontaktowe@uprp.gov.pl)? "Szanowni Państwo, w raporcie dla
    WIPO (CWS ATR 2024) Urząd opisuje usługę sieciową https://api.uprp.gov.pl/ z danymi bibliograficznymi publikacji
    BUP i WUP, z której korzystają m.in. EPO i WIPO. Proszę o: (1) dostęp do tej usługi wraz z dokumentacją albo
    cykliczny plik z danymi bibliograficznymi opublikowanych zgłoszeń i udzielonych praw (numer i data zgłoszenia
    lub prawa, tytuł, numer i data BUP/WUP, symbol klasyfikacji, nazwa i kraj zgłaszającego lub uprawnionego); (2)
    warunki ponownego wykorzystywania tych danych w serwisie zohelo.com." If your answer is no, or UPRP refuses or
    does not reply, tell us and EX-002 is approved on the tested bulletin route (ingestion.history, route 2), built
    without names of natural persons.'
  - 'Not worked around: the Incapsula challenge on ewyszukiwarka.pue.uprp.gov.pl, pue.uprp.gov.pl,
    ebazawiedzy.pue.uprp.gov.pl and api.uprp.gov.pl (Dev probe run 43287937228, job 131426191655, branch
    test/src-ex-probe, 12 Nov 2026).'
  - 'Not verified: the record layout and the total size of the bulletins, whether the oldest are scans, the EPO
    bulk-data terms, what dane.gov.pl links for UPRP.'
  references:
