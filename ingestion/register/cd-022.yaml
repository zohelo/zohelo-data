  blockers:
  - 'Owner question (account and agreement): the Reddit Data API needs a registered app with OAuth credentials
    (oauth.reddit.com is disallowed to the probe by robots.txt), and commercial use needs a separate agreement with
    Reddit. Register an app and ask Reddit for a commercial agreement, or park CD-022? Recommendation: park. The eight
    social-platform APIs CD-017 to CD-024 can be answered in one reply (''park CD-017 to CD-024''); none offers
    official statistics for Poland, and each needs an account, an application or a paid plan.'
  - 'Re-review 27 Nov 2026 (Task #2914): the parking reason was a terms and agreement restriction, an owner question,
