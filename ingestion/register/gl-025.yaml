updates: WHO can modify or discontinue datasets or access methods; schedules are dataset-specific.
ingestion:
  history: Archive dataset, metadata, citation and terms/version.
  incremental: Refresh by named dataset release; retain raw versions.
  identifiers: Dataset ID + complete published key; use metadata geography codes.
modelling:
  notes: Retain source, method, uncertainty, unit and status; standardized rates and modelled estimates are non-additive.
  overlap: Potential successor/parallel surface to GHO; compare IDs and definitions before choosing canonical
    rows.
research:
