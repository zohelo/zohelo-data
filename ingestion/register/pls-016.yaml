  blockers:
  - 'Owner question: Centrum e-Zdrowia publishes "e-zdrowie w liczbach" (e-prescriptions by voivodeship, sex, age and payment
    since 2020, and the infectious-disease report) only as public Power BI reports, with no file, API or dane.gov.pl dataset,
    and its portal reads "© 2026 Centrum e-Zdrowia. Wszystkie prawa zastrzeżone." The data reach the public page only through
    the requests the published report itself makes to the Power BI service (the same kind of "page''s own request" route
    as D40 and D41, which needs a D row per source). Which do you want: (a) a web-route D row for PLS-016 that reads those
    report requests politely (one report at a time, monthly, aggregates only, internal while the licence is unresolved),
    (b) a re-use request to CeZ under the Open Data Act for the monthly tables behind the reports with their reuse terms,
    or (c) leave the source out?'
  - 'Dev probe run 45813307617 (job 139886485577, branch test/src-parked-probe, script dev/src_parked_probe.py, 26 Nov 2026):
    both ezdrowie.gov.pl pages answered (text 9,137 and 4,749 characters); the e-recepty page links the report https://app.powerbi.com/view?r=…
    and no download; dane.gov.pl institution search "e-Zdrowia" gave no CeZ dataset. The report''s own query requests were
    not read or probed: a web route needs a D row per source (playbook stage 1), so it is offered to the owner as option
    (a). The "all rights reserved" footer alone is not why the entry waits (it also stands on approved internal entries,
    e.g. PLS-030); the missing decided route is.'
  references:
  - https://ezdrowie.gov.pl/portal/home/badania-i-dane
  - https://ezdrowie.gov.pl/portal/artykul/e-zdrowie-w-liczbach-e-recepty
