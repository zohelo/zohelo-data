    za podaniem źródła." (use of the data is possible with the source named; probe 43345651745). Aggregate
    statistics only; personal beneficiary data stay out of scope. Attribution: "Źródło: ARiMR, <report title>
    (<date>)" / "Source: Agency for Restructuring and Modernisation of Agriculture (ARiMR), <report title> (<date>)".'
updates: Campaign/programme-dependent; frequent operational updates for some schemes.
ingestion:
  history: Curate aggregate statistics only after identifying stable named report families.
  incremental: Poll programme statistics pages and retain reporting cutoff dates.
  identifiers: Programme/intervention + campaign/year + geography + measure + status/cutoff date.
modelling:
  notes: Applications, approved beneficiaries and paid amounts are different lifecycle facts; cumulative updates
    must not be summed.
  overlap: Can overlap EU CAP transparency and GUS farm statistics; administrative support population differs
    from all farms.
research:
  priority: conditional
  evidence: documented
  connection: tested
  blockers:
  - 'Curated selection only (Dev probes 43343134150, 43345651745): the index page links 13 scheme pages whose attachments are all PDF (no XLSX/CSV; api.dane.gov.pl timed out from the runner). Built: the monthly "Płatności bezpośrednie" report (newest and every year-end report), applications, decisions and amounts paid by campaign and voivodeship, cumulative as of the report date (newest report wins; open campaigns provisional). Not modelled: PS WPR 2023-2027 intervention reports, national aid, RDP 2014-2020 / 2007-2013 measures, KPO, fisheries and market-mechanism pages.'
  - No beneficiary-level data: only voivodeship aggregates reach Bronze; the report footers (names of the ARiMR staff responsible) stay in the Landing file.
