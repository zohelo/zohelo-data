  - 'Contained in: PLG-026 `eli_pl` (built; Silver `eli_pl_acts`, Gold entity table `legal_acts`,
    docs/sources/eli_pl.md). ISAP is the web front of the Sejm''s legal-act database; the ELI API serves the same
    records with the same addresses: ISAP''s example act WDU20070500331 is
    https://api.sejm.gov.pl/eli/acts/DU/2007/331 (address "WDU20070500331", Dz.U. 2007 nr 50 poz. 331), and `eli_pl`
    loads every journal year of Dziennik Ustaw (from 1918, 76 acts) and Monitor Polski (Dz.U. 2007: 1,887 acts; M.P.
    2007: 1,092). Dev probe run 45919690568 (job 140247203923, branch test/src-parked2-probe, script
    dev/src_parked2_probe.py, 27 Nov 2026). ISAP''s robots.txt disallows every other agent, so it is not a route in
    any case. The act texts (PDF/HTML) are left out of `eli_pl` by choice and are served by the same API.'
  - 'Re-review 27 Nov 2026 (Task #2914): the earlier reason "superseded by PLG-026" is restated in the `Contained in:`
    form.'
