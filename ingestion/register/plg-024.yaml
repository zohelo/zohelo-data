id: PLG-024
name: Sejm API
short_name: Sejm API
provider: Chancellery of the Sejm
source_system: sejm
status: built
family: F
kpi: false
geography: Poland
provider_type: national-public
domains: [parliament, legislation, elections]
entities: [member of parliament, committee, bill, vote, question]
