- id: PL-ENV-006
  name: Krajowa Integracja Ewidencji Gruntów i Budynków (KI EGiB) aggregate WFS
  short_name: GUGiK KI EGiB
  provider: GUGiK with county cadastral authorities
  status: parked
  family: G
  kpi: false
  geography: Poland
  provider_type: national-public
  domains: [cadastre, parcels, buildings]
  entities: [parcel, building, cadastral unit]
  granularity: Parcel/building geometries and attributes supplied by participating county WFS services.
  coverage: 2025 service aggregates 385 county WFS sources daily; coverage is only what each county supplies.
  access:
    endpoint: https://mapy.geoportal.gov.pl/wss/service/PZGIK/EGIB/WFS/UslugaZbiorcza
    kind: api
    interfaces: [WFS, WMS, GeoParquet, GPKG, HTML]
    auth: Public aggregate query/view services; underlying official cadastral extracts may follow separate rules.
    cost: Public service free; authoritative extracts may be charged by counties.
    limits: WFS returns 1,000 features per request by default (CountDefault in the capabilities); no other quota published.
  licence:
    status: unresolved
    notes: 'Terms: the EGiB page https://www.geoportal.gov.pl/pl/dane/ewidencja-gruntow-i-budynkow-egib/ (read 12 Nov 2026,
      also from a GitHub runner) states no licence and no free-reuse sentence for the aggregated data (unlike the PRG and
      BDOT10k pages); the WFS capabilities say Fees "none" and AccessConstraints "none". Legal basis named: Rozporządzenie
      Ministra Rozwoju, Pracy i Technologii z dnia 27 lipca 2021 r. w sprawie ewidencji gruntów i budynków. Commercial reuse
      and modification are not addressed, so the source stays internal. Attribution if used: "Źródło: GUGiK, Krajowa Integracja
      Ewidencji Gruntów" with the download date.'
  updates: '"Usługa ta pobiera w cyklu codziennym dane z powiatowych usług pobierania WFS EGiB" (daily pull from the county
    services); county registers change continuously.'
  ingestion:
    history: 'Two routes. (1) Bulk: the geoportal module "Pobierz dane" ("Dane do pobrania" > "Dane powiatowe") gives parcels
      and buildings for the country, a voivodeship or a county as GeoParquet or GPKG; the file URLs are produced inside the
      map application and were not found in HTML. (2) WFS 2.0 with the feature types ms:dzialki and ms:budynki, 1,000 features
      per page (capabilities 200, 17,245 bytes from a GitHub runner, Dev probe run 43203166665 (job 131131537831, branch test/src-cg-probe,
      12 Nov 2026)). Object counts and bytes not measured; the country has tens of millions of parcels (estimate).'
    incremental: 'PROPOSAL: source-specific snapshots by county; no trustworthy national change feed.'
    identifiers: Parcel identifier, building identifier, TERYT/cadastral unit and source county.
  modelling:
    notes: 'Keep the provider county and the completeness status. Aggregate service is not a legal extract. No Gold use today:
      parcel and building geometry feeds no KPI and no shared dimension (building and dwelling counts come from GUS BDL);
      a count per county through WFS resultType=hits would be the smallest selection if ever wanted.'
    overlap: Overlaps BDOT10k buildings and county cadastral systems; do not treat as identical.
  research:
    priority: review-first
    evidence: tested
    connection: tested
    blockers:
    - 'Parked: no Gold use (parcel and building geometry feeds no KPI or dimension) and a full national copy is far above
      the free storage tier, which is an owner decision; reuse terms are not stated on the EGiB page.'
    - Bulk GeoParquet/GPKG file URLs of the "Pobierz dane" module are not published in HTML.
    - Coverage is only what each of the 385 county services supplies.
    references:
    - https://www.geoportal.gov.pl/pl/dane/ewidencja-gruntow-i-budynkow-egib/
    - https://mapy.geoportal.gov.pl/wss/service/PZGIK/EGIB/WFS/UslugaZbiorcza
    - https://integracja.gugik.gov.pl/cgi-bin/KrajowaIntegracjaEwidencjiGruntow
    - https://uldk.gugik.gov.pl/opis.html
