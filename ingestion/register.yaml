# Source register: every candidate data source, researched with the same fields.
# One entry per source; `status` says how far it has come (registered → reviewing → approved → built →
# landing → bronze → silver → gold → semantic → published → done; parked = stopped);
# `family`, `short_name` and `kpi` follow .github/backlog/assets/register-fields.md; `source_system` links an onboarded source to ingestion/sources/<source_system>.yaml.
# Seeded 14 Oct 2026 from the September 2026 source research (182 sources) plus one onboarded
# source not in that research (EX-005); `access.kind` of onboarded sources follows their declaration; maintained by hand
# and by the refinement sessions. Backlog: each entry is a work package under
# "Ingestion → Landing" in GitHub, titled "<name> (<provider>) [<id>]".
sources:
- id: GL-001
  name: Eurostat Database and dissemination APIs
  short_name: Eurostat
  provider: Eurostat
  source_system: eurostat
  status: silver
  family: A
  kpi: true
  geography: multicountry-Europe
  provider_type: international-public
  domains: [economy, population, labour, trade, health, education, environment]
  entities: [country, region, person-aggregate, enterprise-aggregate]
  granularity: Dataset cube, often country/year, with sex, age, unit, activity and NUTS region.
  coverage: EU/EEA, candidates and partners; start varies. Only the latest version is held.
  access:
    endpoint: https://ec.europa.eu/eurostat/web/user-guides/data-browser/api-data-access/api-introduction
    kind: bulk_file
    interfaces: [HTML, REST API, SDMX 2.1, SDMX 3.0, JSON-stat, TSV]
    auth: public
    cost: free
    limits: Unknown; no explicit numeric quota found in reviewed documentation.
  licence:
    status: open-conditional
    notes: 'Terms: https://ec.europa.eu/eurostat/web/main/help/copyright-notice (Commission Decision 2011/833/EU;
      CC BY 4.0 for EU-owned content). Attribution: "Source: Eurostat" plus the dataset code. Commercial and
      non-commercial reuse and modification are allowed; modifications must be indicated. Exceptions (non-commercial
      reuse only): data identified as belonging to sources other than Eurostat; publications co-owned by other
      organisations; data for countries other than EU, EFTA and official acceding/candidate countries (remove before
      commercial reuse); Swiss and Liechtenstein trade data from 1995 and Austrian CN8 trade data (Comext, DS-*, out of
      scope); third-party material such as photos, and logos and trademarks, are not covered. Disclaimer: modified or
      translated content must carry a disclaimer that Eurostat is not responsible for the changes (page wording for
      translations: "The translation is the sole responsibility of the author or authors of the translation.").'
  updates: Portal checks for data/structure changes twice daily; frequency varies; prior versions are not retained.
  ingestion:
    history: Snapshot dataflows and structures; preserve received-at and raw hash.
    incremental: Re-read structures and replace affected periods/dataflows; no CDC claim.
    identifiers: ESTAT dataflow/version + full SDMX key; map geo to ISO/NUTS by explicit codelists.
  modelling:
    notes: Observation fact at full cube grain; units, status flags and seasonal adjustment are dimensions. Aggregates
      and rates are non-additive.
    overlap: Often republishes national and domain-agency inputs; keep source/flags and do not deduplicate by label.
  research:
    priority: review-first
    evidence: documented
    connection: not-tested
    blockers: []
    references:
    - https://ec.europa.eu/eurostat/web/user-guides/data-browser/api-data-access/api-introduction
    - https://ec.europa.eu/eurostat/web/main/help/copyright-notice
- id: GL-002
  name: Comext international trade in goods database
  short_name: Eurostat Comext
  provider: Eurostat
  status: parked
  family: A
  kpi: true
  geography: multicountry-Europe
  provider_type: international-public
  domains: [trade, goods, production]
  entities: [country, country-pair, commodity]
  granularity: Reporter/partner/product/flow/period/unit cube; detailed commodity grain varies by table and confidentiality.
  coverage: Recent and historical EU Member State trade plus some non-EU statistics; table-specific.
  access:
    endpoint: https://ec.europa.eu/eurostat/web/user-guides/data-browser/api-data-access/api-introduction
    kind: api
    interfaces: [HTML, REST API, SDMX 2.1, SDMX 3.0, TSV]
    auth: public
    cost: free
    limits: Unknown; no explicit numeric quota found in reviewed documentation.
  licence:
    status: open-conditional
    notes: 'Terms: CC BY 4.0, https://ec.europa.eu/eurostat/help/copyright-notice (re-use for commercial or
      non-commercial purposes if the source is acknowledged and changes are indicated; modified or translated
      content must state the changes and carry a disclaimer of Eurostat non-responsibility). Comext exceptions:
      Swiss- and Liechtenstein-declared trade since 1995 and Austrian-declared CN8 data may not be sold; data
      for countries outside the EU, EFTA and candidate countries may not be reused commercially. Attribution:
      "Source: Eurostat (Comext)".'
  updates: Detailed trade is compiled monthly; revisions and confidential/suppressed cells require flags.
  ingestion:
    history: Partition full extracts by dataset and period; archive codelists and raw vintages.
    incremental: Reload recent periods and any changed older partitions after structure checks.
    identifiers: Eurostat DS code + reporter/partner/flow/CN-HS code/period; classification edition is essential.
  modelling:
    notes: Bilateral flow fact. Never sum overlapping product levels, EU aggregates, or mirrored reporter/partner
      views.
    overlap: Overlaps UN Comtrade, WTO and UNCTAD; values can differ by valuation, partner attribution, revisions
      and confidentiality.
  research:
    priority: review-first
    evidence: documented
    connection: not-tested
    blockers:
    - 'Out of scope: AGENTS.md excludes Eurostat Comext (DS-*) from the Eurostat authorization; reopen only on an owner decision.'
    - 'Commercial display: drop the excepted reporters and declarations first'
    - 'Plan commodity-classification bridges'
    references:
    - https://ec.europa.eu/eurostat/web/user-guides/data-browser/api-data-access/api-introduction
    - https://ec.europa.eu/eurostat/data/database
    - https://ec.europa.eu/eurostat/web/main/help/copyright-notice
- id: GL-003
  name: OECD Data Explorer and SDMX API
  short_name: OECD Data Explorer
  provider: OECD
  source_system: oecd
  current: true
  status: silver
  family: A
  kpi: true
  geography: worldwide
  provider_type: international-public
  domains: [economy, tax, trade, labour, health, education, environment, regional]
  entities: [country, region, person-aggregate, enterprise-aggregate]
  granularity: Dataflow observation at complete SDMX dimensional key; geographic coverage differs sharply by dataset.
  coverage: 'OECD members plus accession, partner and other economies depending on dataflow; history is dataset-specific.
    CLI (DSD_STES@DF_CLI 4.1): 57 areas incl. OECD, G7, G20, EA20, EU; Poland only BCICP/CCICP (business and
    consumer confidence) from 1997-07/2001-05 to 2026-10; the amplitude-adjusted CLI (LI) only for 22 areas (G20
    economies, G7, G20, A5M, G4E, NAFTA), not for Poland, EU, EA20 or OECD.'
  access:
    endpoint: https://sdmx.oecd.org/public/rest/data/OECD.SDD.STES,DSD_STES@DF_CLI,/all?format=csvfile
    kind: api
    interfaces: [HTML, SDMX REST API, CSV]
    auth: public; registration encouraged but not required by terms page
    cost: free
    limits: Rate limiting is documented without a numeric threshold; one request per selection and run. The CLI
      selection (all areas, full history) is one 21 MB response (Dev probe 42776278659, 10 Nov 2026).
  licence:
    status: open-conditional
    notes: 'Terms: OECD Terms and Conditions (updated 15 Mar 2024),
      https://www.oecd.org/en/about/terms-conditions.html, section on Data: users may extract, download, copy,
      adapt, print, distribute, share and embed Data for any purpose, commercial use and modification included,
      subject to restrictions stated for a dataset and to third-party rights (the OECD does not warrant it owns
      all Data). Attribution: "OECD (<year>), <dataset name>, OECD Data Explorer, <DOI or URL> (accessed on
      <date>)" or the citation given with the dataset.'
  updates: Series schedules vary. New dataflow versions may make non-backward-compatible structural changes.
  ingestion:
    history: Snapshot selected dataflows, structures, codelists and attributes by version.
    incremental: Query recent periods only after structure comparison; replace changed observations.
    identifiers: Agency + dataset + version + SDMX key; map REF_AREA only after inspecting codelist.
  modelling:
    notes: Full-grain fact; retain unit, adjustment, measure and status. OECD aggregates and indexes are non-additive.
    overlap: May ingest Eurostat, national or other agencies; lineage distinguishes same-looking indicators.
  research:
    priority: review-first
    evidence: documented
    connection: tested
    blockers:
    - 'Dataset-level rights scan (third-party restrictions in dataset metadata) for every dataflow added after CLI'
    - 'Coverage matrix beyond OECD membership'
    - 'Handle versioned structure breaks'
    references:
    - https://www.oecd.org/en/data/insights/data-explainers/2024/09/api.html
    - https://www.oecd.org/en/about/terms-conditions.html
- id: GL-004
  name: Programme for International Student Assessment (PISA) databases
  short_name: OECD PISA
  provider: OECD
  source_system: world_bank_edstats
  status: built
  family: A
  kpi: true
  geography: worldwide
  provider_type: international-public
  domains: [education, skills, survey]
  entities: [student, school, country]
  granularity: 'Built: country mean score per subject (reading, mathematics, science) and sex per assessment year, as
    published by the OECD and republished by the World Bank EdStats. The OECD databases themselves are anonymised
    student, school-principal and parent response files (not used).'
  coverage: 'Built: cycles 2000-2018, up to 85 economies (World Bank EdStats, lastupdated 2024-06-25). The OECD has published
    2022; 2025 results are due in December 2026 (owner question below).'
  access:
    endpoint: https://api.worldbank.org/v2/country/all/indicator/LO.PISA.MAT?source=12&format=json
    kind: api
    interfaces: [World Bank API v2 (EdStats, source 12), bulk-files, HTML, PISA Data Explorer, PDF]
    auth: public downloads; some tools may have separate access
    cost: free
    limits: Unknown; no explicit numeric quota found in reviewed documentation.
  licence:
    status: open-conditional
    notes: 'Terms: OECD Terms and Conditions (updated 15 Mar 2024),
      https://www.oecd.org/en/about/terms-conditions.html: PISA Data falls under the Data terms (extract, copy,
      adapt, distribute and embed for any purpose, commercial use and modification included, subject to dataset
      and third-party restrictions); other PISA content (reports, instruments) is CC BY-NC-SA 3.0 IGO and needs
      the OECD disclaimer when adapted or translated. Attribution: "OECD (<year>), PISA <cycle> Database, <DOI
      or URL> (accessed on <date>)" or the citation given with the file. Route terms (the data loaded): World Bank Data
      Catalog, Education Statistics, https://datacatalog.worldbank.org/search/dataset/0038480/education-statistics
      (read 12 Nov 2026): "This dataset is licensed under Creative Commons Attribution 4.0", classified Public; no
      separate terms for the PISA indicators. Attribution used (licence.csv cc_by_4_0_world_bank_edstats): "Source:
      OECD PISA, as published in The World Bank, Education Statistics".'
  updates: Released by assessment cycle; corrections or later files are not documented as a stable revision feed.
  ingestion:
    history: Archive each cycle, codebooks, questionnaires and technical report.
    incremental: Treat each released/corrected cycle file as replacement; no row-level CDC.
    identifiers: Cycle + country code + school/student IDs; IDs are survey-specific, not persons across cycles.
  modelling:
    notes: Use survey weights, replicate weights and plausible values. Simple means or row counts are statistically
      invalid.
    overlap: Country indicators overlap OECD Explorer and UNESCO/World Bank education series but measure different
      constructs.
  research:
    priority: specialist
    evidence: documented
    connection: tested
    blockers:
    - 'Needs owner (PISA 2022 gap): the route is the World Bank Education Statistics republication of the OECD country
      means (API source 12, LO.PISA.REA/MAT/SCI and .FE/.MA, CC BY 4.0, Data Catalog 0038480; source lastupdated
      2024-06-25), which holds the assessment years 2000-2018 only (Dev probe 43290232665). PISA 2022 means are
      published by the OECD only on www.oecd.org (report StatLink workbooks, PISA Data Explorer), which answers HTTP
      403 to GitHub runners (Dev probe 43275098288, not worked around); the OECD Data Explorer SDMX API has no PISA
      dataflow (Dev probe 43273970310). Question: may we load the PISA 2022 (and later 2025) country means once by a
      manual download of the OECD results StatLink workbooks (a web export, needs your decision), or ask the OECD in
      writing for a machine route?'
    - 'Means are the OECD-published estimates (survey weights and plausible values applied by the OECD); the
      microdata are not used'
    references:
    - https://www.oecd.org/en/about/programmes/pisa/pisa-data.html
    - https://www.oecd.org/en/about/terms-conditions.html
