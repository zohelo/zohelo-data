      air quality index 1500 per minute; station and sensor lists with their own limits (page lists "limit 2 i 1500 żądań
      na minutę"): confirm per endpoint in the dev trial.'
  licence:
    status: open-conditional
    notes: 'Terms: Regulamin of the portal https://powietrze.gios.gov.pl/pjp/content/terms_of_service (read 12 Nov 2026),
      which the API page binds API users to ("Korzystając z API akceptują Państwo wszystkie warunki zawarte w Regulaminie
      portalu."). Licence, section 3: "Wykorzystywanie opublikowanych danych jest możliwe w oparciu o Licencję Creative Commons
      BY 4.0 – Uznanie autorstwa." Use is free of charge, and the materials may be "ponownie wykorzystywane w całości lub w
      istotnej części" (section 2). Conditions, section 4: the re-user "zobowiązany jest w sposób czytelny i wyraźny wskazać
      źródło pozyskania informacji" and the time the information was produced, and whether it is used in full or in part.
      Modification, section 5: allowed with a notice ("użytkownik zobowiązany jest do zamieszczenia stosownej informacji o
