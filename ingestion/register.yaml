      data. Grain: one polygon per deposit or mining area with mineral type and status; CRS not checked, no TERYT code (assign
      voivodeship and gmina by a spatial join to PRG). Smallest Gold selection: the documented-deposits layer as an entity
      table with mineral, status and TERC, and from it the number of documented deposits and of active mining areas per voivodeship.'
