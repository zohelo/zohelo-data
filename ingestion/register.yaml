    notes: 'Terms: CC BY 3.0 IGO (http://creativecommons.org/licenses/by/3.0/igo/); WPP 2024 data are "made available under a Creative Commons license CC BY 3.0 IGO" (https://environmentdashboard.org/sources/un-wpp-2024, quoting the producer): copy, redistribute and adapt, also commercially, with attribution; no UN emblem or implied endorsement. Attribution: "United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects 2024, Online Edition. CC BY 3.0 IGO."'
  updates: Revision-based releases recalculate historical estimates and projection variants.
  ingestion:
    history: 'Complete files of the current revision (WPP 2024); Bronze keeps the latest copy only (bronze_latest_only),
      Archive the newest + 90 days. Earlier revisions are not kept as vintages: a new revision replaces the files
      (new URLs in the declaration).'
    incremental: Monthly check; a file is landed only when its SHA-256 changed, and Silver/Gold rebuild in full.
    identifiers: Location code + year + age + sex + variant + measure.
  modelling:
    notes: Population stocks, births/deaths/migration flows and rates differ; variants must remain explicit.
    overlap: Overlaps WDI, UNdata and national population series; WPP estimates are modeled harmonized vintages.
  research:
    priority: review-first
    evidence: documented
    connection: tested
    blockers:
    - 'Confirm the licence statement on population.un.org/wpp: Dev probe 43098349843 (11 Nov 2026) found no licence text
      on population.un.org/wpp (a JavaScript application; /terms-of-use 404), on the Data Portal about pages or on
      un.org/development/desa/pd/node/4327 (links to the general UN Terms of Use only). Until a UN page states the
      licence, source.csv uses licence `unresolved`. The licence gate of gold.publish (#2824, O37) drops `unresolved`
      sources from v1 and v2; in addition WPP is kept out of the published layer by its seeds: no kpi_measure row for the published KPI population, and every
      kpi_v2_map row of un_wpp is needs-block (review of #2761). The Gold measures and draft KPIs stay internal.'
    - 'Revision archive: the next revision (WPP 2026) has new file URLs; the declaration changes with it'
    references:
    - https://population.un.org/wpp/
    - https://data.un.org/Handlers/ExplorerHandler.ashx?t=sources
    - https://environmentdashboard.org/sources/un-wpp-2024
    - https://www.un.org/development/desa/pd/node/4327
