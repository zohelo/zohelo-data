    priority: review-first
    evidence: documented
    connection: tested
    blockers:
    - 'Route found (Dev probes 43091539492, 43162355678 on test/src-w2pl-probe): psz.zus.pl category pages (e.g. /kategorie/emerytury/stan-na-grudzien) link one XLSX per topic table and year under /documents/493365/<folder>/<name>.xlsx/<uuid>, 2011 onwards (.xls before 2014), about 25 topic families. A build needs a chosen family list (pensions in December by voivodeship and benefit type first, for the KPI zus_pension_avg).'
    - 'Built (#2461): curated families landed by folder id (ingestion/to_landing/zus_psz FAMILIES): pensioners_dec
      9888915 and pension_amount_dec 9888921 (December, Poland, 2018-), insured_pension 532853, insured_sickness_voiv
      532793, payers_voiv 533093, absence_voiv 6744574 (quarterly, current year only on the portal), insured_health
