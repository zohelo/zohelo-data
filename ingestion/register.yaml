      cykliczny plik z danymi bibliograficznymi opublikowanych zgłoszeń i udzielonych praw (numer i data zgłoszenia
      lub prawa, tytuł, numer i data BUP/WUP, symbol klasyfikacji, nazwa i kraj zgłaszającego lub uprawnionego); (2)
      warunki ponownego wykorzystywania tych danych w serwisie zohelo.com." If your answer is no, or UPRP refuses or
      does not reply, tell us and EX-002 is approved on the tested bulletin route (ingestion.history, route 2), built
