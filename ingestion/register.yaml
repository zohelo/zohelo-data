    notes: 'Terms: SEC.gov privacy and security policy, section "Website Dissemination", https://www.sec.gov/privacy (read
      12 Nov 2026): "Information presented on sec.gov is considered public information and may be copied or further distributed",
      without the permission of the SEC; "Please consider appropriate citation to the SEC as the source." No licence is named;
      commercial reuse and modification are not restricted by the policy (copying and further distribution of public information
      without permission). Conditions: no SEC seal, logos or artwork, and the EDGAR names and the SEC name are trademarks
      that may not be used in a trade name, trademark or domain. Filer attachments can contain third-party rights and personal
      data: ingest the structured JSON, preserve provenance. Attribution: "Source: U.S. Securities and Exchange Commission,
      EDGAR".'
  updates: API JSON updates in real time; bulk ZIPs update nightly; indexes are daily/quarterly.
  ingestion:
    history: 'Bulk: nightly ZIPs of the JSON APIs (recompiled about 3:00 a.m. ET): companyfacts.zip (XBRL Company Facts and
      Frames data) and submissions.zip (filing histories) under https://www.sec.gov/Archives/edgar/; per-entity JSON at https://data.sec.gov/submissions/CIK##########.json
      and /api/xbrl/companyfacts/. Size: low GB zipped (estimate).'
    incremental: Re-download the nightly ZIPs; the JSON APIs update during the day as filings are disseminated.
    identifiers: CIK, accession number, form, filing date; facts keyed by taxonomy/concept/unit/period/frame.
  modelling:
    notes: Keep raw filings immutable; facts require dimensional context and restatement handling.
    overlap: Upstream of FMP, Marketstack and many vendors; vendor facts must retain derivation lineage.
  research:
    priority: review-first
    evidence: tested
    connection: tested
    blockers:
    - Re-read the SEC Developer FAQ for the exact fair-access limit and User-Agent rule before the declaration
    - 'Filing attachments can hold third-party rights and personal data: ingest the structured JSON, not documents'
    references:
    - https://www.sec.gov/search-filings/edgar-application-programming-interfaces
    - https://www.sec.gov/about/developer-resources
    - https://www.sec.gov/privacy
