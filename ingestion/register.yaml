  provider_type: national-public
  domains: [students, teachers, graduates, special education, preschool, languages]
  entities: [student-aggregate, teacher-aggregate, graduate-aggregate, territorial unit, school type, governing body]
  granularity: One workbook per topic and reference date (30 September); rows are counts by voivodeship, school type, pupil
    category, age or grade, sex or governing body; no pupil- or school-level records.
  coverage: 'Closed archive: data as of 30 September 2010 to 30 September 2018 (school years 2010/2011 to 2018/2019, from
    the file names); the teachers workbooks carry a 2006-2018 series. Nothing later is published on cie.gov.pl.'
  access:
    endpoint: https://cie.gov.pl/archiwalne-dane-statystyczne/
    kind: bulk_file
    interfaces: [HTML, XLS, XLSX]
    auth: Public downloads.
    cost: free
    limits: None published. robots.txt of cie.gov.pl disallows only /cms/wp-admin/ (Dev probe run 43289510189, job 131431691639,
      branch test/src-plgs-probe, 12 Nov 2026). A full load is 7 pages and 94 files.
  licence:
    status: unresolved
    notes: 'Terms: none stated. The site the files are read from, https://cie.gov.pl/ (home page and its only legal link
      "Status prawny", https://cie.gov.pl/o-nas?sekcja=status, read from a GitHub runner on 12 Nov 2026; the archive index
      and the six topic pages, desk fetch the same day), carries only "© Centrum Informatyczne Edukacji, 2026" and no licence,
      re-use or attribution wording. Commercial reuse: not stated. Modification: not stated. Disclaimer: none. Attribution
      sentence: none given by the provider; if CIE later allows reuse, propose "Źródło: Centrum Informatyczne Edukacji,
      System Informacji Oświatowej, stan na 30 września <rok>". The CC BY-SA 4.0 footer of gov.pl covers gov.pl text, not
      these files, and is not applied. Internal use only until CIE states terms (owner question in PR for #1711).'
  updates: 'None expected: the archive is closed. All 94 files answer Last-Modified 8 August 2024 (Dev probe run 43289510189,
    job 131431691639, branch test/src-plgs-probe, 12 Nov 2026), under /content/uploads/2020/09/. The Ministry''s page on
    SIO data names dane.gov.pl and GUS BDL as the channels for current compilations (https://www.gov.pl/web/edukacja/system-informacji-oswiatowej-zasady-udostepniania-danych,
    desk fetch).'
  ingestion:
    history: 'Bulk: the index page links six topic pages (written with a double slash, https://cie.gov.pl//ads-uczniowie/;
      /ads-uczniowie/ 32 files, /ads-wychowanie-przedszkolne/ 11, /ads-uczniowie-ze-specjalnymi-potrzebami-edukacyjnymi/
      18, /ads-jezyki-obce-i-jezyki-mniejszosci-narodowych/ 18, /ads-absolwenci/ 9, /ads-nauczyciele/ 6), whose plain HTML
      links 94 workbooks under https://cie.gov.pl/content/uploads/2020/09/: 64 .xls and 30 .xlsx, 10,216,033 bytes in total
      by HEAD, largest 940,544 bytes, all 200 from a GitHub runner (Dev probe run 43289510189, job 131431691639, branch
      test/src-plgs-probe, 12 Nov 2026). The files send Last-Modified (ETag seen on the two .xls files that were fetched).
      The earlier blocker (no file links) looked only at the index page.'
    incremental: 'Entity = workbook (file name), version = Last-Modified; one backfill, then a yearly re-read of the seven
      pages (link count, names, Last-Modified). Small source: refresh full; unchanged bytes skipped by SHA-256.'
    identifiers: Reference date (30 September of the year) + topic + voivodeship id ("Id WojGUS", two digits) + school type
      id ("Id TypJedn", five digits) + pupil category; no RSPO number (no school-level rows).
  modelling:
    notes: 'Frequency: annual only (school year, reference date 30 September); no second frequency. Shape, read from three
      2018/2019 XLSX workbooks (one sheet each, first rows only): tidy tables, e.g. "Id WojGUS ¦ Województwo ¦ Id TypJedn
      ¦ Typ jednostki ¦ Kategoria uczniów ¦ Publiczność ¦ Organ prowadzący ¦ Liczba szkół/placówek" with the row "02 ¦ DOLNOŚLĄSKIE
      ¦ 00001 ¦ Przedszkole ¦ Dzieci lub młodzież ¦ publiczna ¦ JST ¦ 459"; graduates as "Absolwenci" and "Absolwenci -
      dziewczęta"; pupils by age with one column per age. Missing values: no suppression sign seen; an age that does not
      occur in a school type is an empty cell (row "02 ¦ WOJ. DOLNOŚLĄSKIE ¦ 00003 ¦ Szkoła podstawowa ¦ Dzieci lub młodzież"
      has empty columns for ages 2 to 4) and must stay empty, while a stated 0 is a value ("0 ¦ 0" for one music-school
      row). Voivodeship names differ between files ("DOLNOŚLĄSKIE", "WOJ. DOLNOŚLĄSKIE"): join on the id. Duplicates: the
      six teachers workbooks each repeat the series from 2006 (2006-2013 ... 2006-2018): keep the newest (NauczEtatyOsoby2006-2018v5_Woj2018v5.xls);
      teachers are given as persons and as full-time posts, one measure_key each. School types change with the 2017 reform
      (gimnazjum phase-out). The 64 .xls files are the old binary format (magic d0cf11e0), which ingestion/common/xlsx_cells.py
      does not read and for which requirements.txt has no reader; their layout was not opened. Smallest Gold selection:
      schools and pupils by school type and voivodeship (Poland as the sum) and graduates, from the XLSX years 2016-2018
      first; teachers (persons, posts) and the years 2010-2015 once an .xls reader is chosen. Effort M.'
    overlap: 'No kpi.csv KPI is published from this source; the education KPIs there (adult_learning, tertiary_attainment,
      neet_rate, basic_digital_skills) are Eurostat survey measures, not school counts. GUS BDL (PLS-001, in Silver) carries
      school and pupil counts and is the live series after 2018: BDL takes precedence where both exist. PLS-021 RSPO is
      the school register, not aggregates.'
  research:
    priority: review-next
    evidence: tested
    connection: tested
    blockers:
    - 'Licence unresolved: cie.gov.pl states no reuse terms, so the source stays internal until CIE states them.'
    - 'Build task, not a review blocker: 64 of the 94 files are .xls (old binary format) and the pipeline has no reader
      for them yet; the 30 .xlsx files (2016-2018) load with the shared decoder.'
    - Closed archive (last data 30 September 2018); later SIO compilations on dane.gov.pl were not opened (the fetch tool
      was refused; dane.gov.pl is PLG-030).
    references:
    - https://cie.gov.pl/archiwalne-dane-statystyczne/
    - https://cie.gov.pl//ads-uczniowie/
    - https://cie.gov.pl//ads-wychowanie-przedszkolne/
    - https://cie.gov.pl//ads-uczniowie-ze-specjalnymi-potrzebami-edukacyjnymi/
    - https://cie.gov.pl//ads-jezyki-obce-i-jezyki-mniejszosci-narodowych/
    - https://cie.gov.pl//ads-absolwenci/
    - https://cie.gov.pl//ads-nauczyciele/
    - https://cie.gov.pl/o-nas?sekcja=status
    - https://www.gov.pl/web/edukacja/system-informacji-oswiatowej-zasady-udostepniania-danych
