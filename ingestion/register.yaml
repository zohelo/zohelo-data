    interfaces: [REST API, JSON, bulk-files]
    auth: Public read; a user agent with contact information is required.
    cost: free
    limits: 'REST API rate limit far above our use (one request per article and day, 0.2 s apart). The hourly
      pageview dumps are the bulk route but are about 100 GB a year for a few dozen articles.'
  licence:
    status: open
    notes: 'Pageview statistics are published as CC0 1.0 (Wikimedia Analytics datasets; Terms of Use
      https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use). Article text (CC BY-SA) is never fetched.'
  updates: Daily; views of day d are available on d+1. Past days are not revised.
  ingestion:
    history: 455 days on the first landing per article.
    incremental: Daily 14-day window per article; every copy loaded (accumulating Bronze), newest value per day in Silver.
    identifiers: project + article title + day
  modelling:
    notes: Attention signal for the topics layer; views are summed over a topic's articles in silver.topic_attention.
    overlap: None.
  research:
    priority: review-next
    evidence: documented
    connection: tested
    blockers:
    - Article titles are checked by the run (404 = renamed article, a warning).
    references:
    - https://doc.wikimedia.org/generated-data-platform/aqs/analytics-api/reference/page-views.html
    - https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use
    - https://meta.wikimedia.org/wiki/User-Agent_policy
