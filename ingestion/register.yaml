  ingestion:
    history: 'GAZ-SYSTEM: the public tables (calorific value, total imbalance, planned works, point lists) are in https://swi.gaz-system.pl/mir/,
      a JavaScript application (736-byte shell from a GitHub runner, Dev probe run 43203166665 (job 131131537831, branch test/src-cg-probe,
      12 Nov 2026)), which the pipeline does not support; no file downloads were found on the transparency page. ENTSOG API:
      GET https://transparency.entsog.eu/api/v1/operationaldatas?operatorKey=PL-TSO-0002&indicator=Physical Flow&periodType=day&from=<date>&to=<date>
      returns JSON (meta + operationaldatas: pointKey, pointLabel, directionKey, unit kWh/d, value, flowStatus, periodFrom/periodTo)
      and answered 200 for 1-2 November 2026; the same request for January 2016 and October 2013 answered 404, so the history
      depth is unknown. Size not measured.'
    incremental: 'PROPOSAL after the owner''s answer: entity = indicator x month, daily request of the last days with a re-read
      of the last 30 days for confirmed values.'
    identifiers: ENTSOG pointKey + directionKey + indicator + periodFrom; operatorKey PL-TSO-0002; EIC code.
  modelling:
    notes: 'Separate capacity, nomination, allocation, flow, quality and outage facts; gas-day conventions matter. Grain:
      point x direction x gas day, kWh/d. Smallest Gold selection: daily physical flow into Poland by entry group (LNG terminal
      Świnoujście, Baltic Pipe, interconnectors) and the total as new KPIs in environment.energy; other EU operators come
      from the same API.'
    overlap: No KPI of kpi.csv is published here yet. Eurostat monthly gas balances carry the official EU comparison; ENTSOG
      holds the same points for every EU operator.
  research:
    priority: review-next
    evidence: tested
    connection: tested
    blockers:
    - 'Owner: the ENTSOG Transparency Platform terms (8 Feb 2016, Art. 4.7) say "ENTSOG does not permit automatic extraction
      of data or other usage that reduces the performance of the Website" while ENTSOG publishes a public API; may we load
      GAZ-SYSTEM''s daily physical flows through that API once a day (a few requests), or do you want to ask ENTSOG in writing
      first?'
    - GAZ-SYSTEM's own public tables are JavaScript-only (not supported); history depth in the ENTSOG API is unknown (2016
      and 2013 answered 404).
    references:
    - https://www.gaz-system.pl/en/for-customers/market-information/data-transparency.html
    - https://swi.gaz-system.pl/mir/
    - https://transparency.entsog.eu/
    - https://transparency.entsog.eu/pdf/Terms_and_Conditions_of_Use.pdf
    - https://www.entsog.eu/privacy-policy-and-terms-use
