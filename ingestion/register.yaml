- id: PL-ENV-034
  name: internet.gov.pl broadband coverage database and UKE market aggregates
  short_name: internet.gov.pl broadband
  provider: Ministerstwo Cyfryzacji / Instytut Łączności–PIB; UKE for market reports
  status: approved
  family: B
  kpi: true
  geography: Poland
  provider_type: national-public
  domains: [broadband, telecommunications, digital infrastructure]
  entities: [address point, operator, technology, planned investment, market aggregate]
  granularity: 'Quarterly report "Polska w zasięgu stacjonarnego dostępu do internetu" (data of internet.gov.pl, SIDUSIS):
    counts of address points and of coverages (zasięgi) by bandwidth class, medium and service type, for Poland (national
    PDF, with address-point counts per voivodeship) and for each voivodeship, powiat and gmina (16 voivodeship PDFs). Address-level
    coverage is shown only per address on the internet.gov.pl map. UKE: one national market report a year (PDF).'
  coverage: Quarterly snapshots from 30 June 2024 (first edition published 15 July 2024) to 30 September 2026 (published 15
    October 2026). UKE market report for 2025 published 30 June 2026.
  access:
    endpoint: https://www.gov.pl/web/cyfryzacja/ponad-8-mln-punktow-adresowych-w-zasiegu-internetu-stacjonarnego
    kind: bulk_file
    interfaces: [PDF attachments on gov.pl release pages, internet.gov.pl map and per-address search, UKE annual PDF]
    auth: 'Public, no login for the report files. internet.gov.pl: public per-address search only; data export and full API
      documentation are for logged-in entities ("Dokumentacja dla użytkowników niezalogowanych została ograniczona do poziomu
      zapytań publicznych", https://internet.gov.pl/media/public/docs/instrukcja.pdf, read 12 Nov 2026); no account is asked
      for.'
    cost: Free.
    limits: 'None published. robots.txt: www.gov.pl "User-Agent: *" "Allow: /"; internet.gov.pl has none (HTTP 404); www.uke.gov.pl
      allows PDF files ("Allow: /*.pdf$") (Dev probe run 43288071987 (job 131426672054, branch test/src-env-probe, 12 Nov
      2026)). There is no bulk download of the address-level database: internet.gov.pl FAQ "Nie ma takiej możliwości. Można
      sprawdzać informacje o zasięgach dla poszczególnych punktów adresowych." (https://internet.gov.pl/media/public/docs/faq.pdf,
      read 12 Nov 2026); a load through per-address queries (millions of address points) is not polite and is not proposed.'
  licence:
    status: unresolved
    notes: 'Terms: the report PDFs are served from www.gov.pl and carry no licence of their own. gov.pl copyright page https://www.gov.pl/web/gov/prawa-autorskie
      (Dev probe run 43288071987 (job 131426672054, branch test/src-env-probe, 12 Nov 2026)): "Korzystanie przez użytkowników
      z materiałów urzędowych opublikowanych w serwisie Gov.pl nie wymaga zgody Ministra Cyfryzacji. W serwisie zamieszczane
      są także utwory, co do których prawa autorskie przysługują osobom trzecim. Ich wykorzystanie przez internautów wymaga
      zgody właścicieli tych materiałów." and (also on the terms page https://www.gov.pl/web/gov/warunki-korzystania and in
      the footer of the release pages) "Treści tekstowe publikowane w serwisie (z wyłączeniem treści audiowizualnych), są
      udostępniane na licencji typu Creative Commons: uznanie autorstwa - na tych samych warunkach 4.0 (CC BY-SA 4.0)." Neither
      page names attached files, commercial reuse or modification of them: commercial reuse not stated, modification not stated,
      no attribution sentence given, so the status is unresolved and the source stays internal (the same reading as the other
      gov.pl attachment sources reviewed on 12 Nov 2026; whether a ministry report is a "materiał urzędowy" is the owner''s
      legal reading). internet.gov.pl: no terms of use found (FAQ and user manual state none). uke.gov.pl: no terms page;
      the report page shows only "© 2026 Urząd Komunikacji Elektronicznej". Attribution if used: "Źródło: Ministerstwo Cyfryzacji,
      Polska w zasięgu stacjonarnego dostępu do internetu, stan na <data>, dane internet.gov.pl".'
  updates: 'Quarterly ("Raport będzie publikowany cyklicznie w odstępach kwartalnych", first release page, 15 July 2024);
    reference dates 31 March, 30 June, 30 September and 31 December; published about two weeks after the quarter (15 July
    2024, 15 October 2024, 17 April 2025, 17 July 2025, 15 July 2026, 15 October 2026). Each edition is a new release page
    with new attachment addresses. UKE market report: yearly, end of June.'
  ingestion:
    history: 'Route: each edition is one release page on gov.pl/web/cyfryzacja with 17 PDF attachments (https://www.gov.pl/attachment/<uuid>):
      one national file and 16 voivodeship files. Tested from a GitHub runner, Dev probe run 43288071987 (job 131426672054,
      branch test/src-env-probe, 12 Nov 2026): the Q3 2026 page (published 15.10.2026) 200 with 17 attachments, 256,481,891
      bytes in total, national file Polska_Q3_2026.pdf 1,439,176 bytes (Last-Modified 15 Oct 2026), largest file 31,432,467
      bytes; the Q2 2026 page (15.07.2026) 200 with 17 attachments, 257,630,344 bytes, national file 1,439,123 bytes. Earlier
      editions are smaller (provider''s page figures: Q1 2025 about 58 MB, Q2 2024 about 94 MB). The national PDF (about 15
      pages; the fetch tool read its tables as text) holds the Poland tables and the address-point counts per voivodeship;
      bandwidth by voivodeship, powiat and gmina is only in the voivodeship PDFs (one of them runs to more than 400 pages).
      First build: the national PDF of every edition (about 1.4 MB each, ten editions about 15 MB); the voivodeship files
      (about 255 MB per edition, 1 to 2.5 GB for all editions, an estimate) only after the storage cost is accepted. Release
      pages are not listed on one stable page: the ministry''s news list https://www.gov.pl/web/cyfryzacja/wiadomosci answered
      200 but its first page did not link the reports, so the release pages are a seed list in the source declaration, one
      row per quarter (six release pages were read: Q2 2024, Q3 2024, Q1 2025, Q2 2025, Q2 2026 and Q3 2026; those of Q4 2024,
      Q3 2025, Q4 2025 and Q1 2026 still have to be found). PDF text-layer extraction of the tables is not tested. internet.gov.pl
      itself gives no machine route: its statistics page https://internet.gov.pl/stats/ is a JavaScript application (268 characters
      of text from the runner, no data address in its scripts; Dev probe run 43295514703 (job 131452664788, same branch, second
      pass)). UKE: the annual report is one PDF (30,398,464 bytes, 200 from the runner) with no data file; not part of the
      first build.'
    incremental: 'Entity = edition (reference quarter) x report file; version = the reference date printed in the report (the
      attachment''s Last-Modified as a check). Each quarter adds a new set; an already loaded edition is fetched again only
      when its bytes change (snapshot, changed_since_last). Whether earlier editions are ever revised is not known. Refresh
      full (small source). Schedule: monthly check around the 20th, new seed row in January, April, July and October.'
    identifiers: 'Reference quarter; TERC code in the section headers of the voivodeship PDFs ("TERC: 16" voivodeship, "TERC:
      1601" powiat, "TERC: 1601011" gmina); voivodeship name in the national tables; bandwidth class in Mb/s; medium; service
      type. No address-point identifiers are published.'
  modelling:
    notes: 'Grain: reference quarter x territorial unit x bandwidth class (Mb/s), counts of address points and of coverages.
      Frequency: quarterly only (stock at the reference date; no annual series). Bandwidth classes are exclusive rows that
      add up to the unit total ("SUMA"); the printed shares ("Udział %") are shares of the address points in coverage, not
      of all address points; "at least 100 Mb/s" is the sum of the classes from 100 upwards. Zero is printed as "0 0,00%";
      no suppression, missing or provisional marker was seen. The same unit and quarter appear once per edition; editions
      do not repeat earlier quarters. Units: address points (count), coverages (count), per cent. Smallest Gold selection,
      from the national PDF only: for Poland, address points within fixed-broadband coverage, within at least 100 Mb/s and
      within at least 1 Gb/s (count and share of all address points); for the 16 voivodeships, address points within coverage
      and their share, quarterly; new KPIs in a digital-infrastructure domain. Bandwidth by voivodeship follows when the voivodeship
      PDFs are loaded. UKE aggregates (subscriptions, households) are a different grain: do not sum or mix.'
    overlap: No KPI of kpi.csv covers broadband or internet access (checked 12 Nov 2026), so no published KPI changes. Eurostat's
      digital-economy tables (isoc) carry household internet access for the EU comparison; they measure households, not address
      points.
  research:
    priority: review-first
    evidence: tested
    connection: tested
    blockers:
    - 'Licence unresolved: gov.pl states that official materials need no consent and licenses its text content as CC BY-SA
      4.0, but says nothing on attached files, commercial reuse or modification; internal only until the owner''s reading.'
    - Release pages have no stable index (seed list per quarter; four editions still to be found); PDF table extraction not
      tested; the voivodeship PDFs are about 255 MB per edition.
    - 'A full download of the address-level data is only announced (FAQ: "W przyszłości planujemy rozwiązanie legislacyjne,
      umożliwiające kompleksowe pobieranie danych"); re-check when it exists.'
    references:
    - https://www.gov.pl/web/cyfryzacja/ponad-8-mln-punktow-adresowych-w-zasiegu-internetu-stacjonarnego
    - https://www.gov.pl/web/cyfryzacja/coraz-wiecej-punktow-adresowych-w-zasiegu-szybkiego-internetu-stacjonarnego
    - https://www.gov.pl/web/cyfryzacja/polska-w-zasiegu--pierwszy-raport-z-danymi-z-internetgovpl
    - https://www.gov.pl/attachment/b5fbb888-d29f-4c4d-9b0c-0b4b20e66f5d
