      contributors" with the ODbL link; share-alike applies to derived databases, produced works and third-party layers need
      separate analysis. Geofabrik extracts carry the same ODbL.'
  updates: Weekly planet, minute/hour/day diffs; community edits may revert or delete objects.
  ingestion:
    history: 'Poland extract poland-latest.osm.pbf from Geofabrik (https://download.geofabrik.de/europe/poland.html): 2.0
      GB, refreshed daily (data up to 2026-11-10T21:21:39Z at the check), per-voivodeship extracts 80-180 MB; the official
      full planet file is the alternative route (https://planet.openstreetmap.org/, about 80 GB, not measured).'
    incremental: 'PROPOSAL: apply replication sequence diffs idempotently; periodic checksum/reseed.'
    identifiers: OSM type+ID+version; spatial links are probabilistic unless tagged identifiers exist.
  modelling:
    notes: Bitemporal feature/tag model; geometry and semantics change independently.
    overlap: May underlie geocoders and map products; avoid duplicate-derived counting.
  research:
    priority: review-first
    evidence: tested
    connection: tested
    blockers:
    - ODbL attribution/share-alike design
    - Select extract boundary
    - Handle deletions/redactions
    references:
    - https://wiki.openstreetmap.org/wiki/Planet.osm
    - https://www.openstreetmap.org/copyright
