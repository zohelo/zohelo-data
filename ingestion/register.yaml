  geography: worldwide
  provider_type: community-academic
  domains: [global-development, health, environment, economics]
  entities: [country, region, indicator]
  granularity: Indicator-geography-time observations with chart metadata and upstream source attribution.
  coverage: Dataset-specific; many series are long-run, but coverage follows each chart and upstream provider.
  access:
    endpoint: https://owid-docs.readthedocs.io/projects/etl/api/chart-api/
    kind: api
    interfaces:
    - API
    - CSV
    - JSON
    - ZIP
    auth: Public, no key.
    cost: free
    limits: None documented. CSV and ZIP can answer 403 "Data is non-redistributable" for some charts (chart API documentation).
      ourworldindata.org robots.txt (47 characters) does not forbid /grapher/.
  licence:
    status: dataset-specific
    notes: 'Terms: https://ourworldindata.org/faqs (desk reading and runner, 12 Nov 2026): "Most of the data on Our World
      in Data comes from third-party providers (such as the WHO, UN, and World Bank) and is subject to the license terms of
      those providers."; "Data produced by us falls under our permissive CC BY license; you have permission to use, reproduce,
      and distribute it, provided that you cite us."; "we ask you to always respect their license terms and cite them appropriately".
      Site footer: "Our charts, articles, and data are licensed under CC BY, unless stated otherwise." Commercial reuse and
      modification: allowed for data produced by OWID (CC BY); for third-party data they follow the upstream provider, chart
      by chart. Attribution sentence: the chart''s citationShort from <slug>.metadata.json, for example "Global Carbon Budget
      (2026); Population based on various sources (2024) – with major processing by Our World in Data". The chart metadata.json
      has no licence field (checked on seven charts); the origin licence is in the indicator metadata (origins[].license,
      desk reading of archived copies). Rule for the build: a chart is publishable only when every origin licence allows reuse
      and modification; otherwise it stays internal. The three charts selected below are third-party data (Global Carbon Budget,
      V-Dem, Maddison Project) whose origin licences are not read yet, so the build gives them an unresolved licence key until
      origins[].license is recorded per chart (examples read: Corruption Perceptions Index, origin CC BY-ND 4.0; World Happiness
      Report, own data-sharing policy).'
  updates: 'Per chart: lastUpdated and nextUpdate in the metadata (for example consumption-based CO2 lastUpdated 2026-11-10,
    nextUpdate 2027-11-10). Whole series are revised in place.'
  ingestion:
    history: 'Fixed URLs per chart, tested: https://ourworldindata.org/grapher/<slug>.csv?csvType=full&useColumnShortNames=true
      and https://ourworldindata.org/grapher/<slug>.metadata.json. Tested charts with Poland rows: consumption-co2-per-capita
      (139,293 bytes, 4,780 rows, Poland 1990-2024), electoral-democracy-index (1,115,453 bytes, 34,228 rows, Poland 1789-2025),
      gdp-per-capita-maddison-project-database (567,429 bytes, 21,586 rows, Poland 1400-2022), life-expectancy (605,252 bytes,
      21,565 rows, Poland 1931-2023), human-development-index, happiness-cantril-ladder, ti-corruption-perception-index. Two
      old slugs redirect (electoral-democracy, gdp-per-capita-maddison): use the final ones.'
    incremental: Snapshot per chart; version = lastUpdated of the metadata (the CSV Last-Modified is the request time). Re-read
      monthly and keep each version.
    identifiers: Chart slug, column short name, entity code (ISO 3166-1 alpha-3, POL; OWID's own codes for regions), year.
  modelling:
    notes: 'kpi true. Smallest Gold selection, Poland and all countries, annual, three charts whose data the platform has
      from no direct source: consumption-co2-per-capita (Global Carbon Budget), electoral-democracy-index (V-Dem) and gdp-per-capita-maddison-project-database
      (long-run GDP per person, international-$ in 2011 prices). Not selected: human-development-index (UNDP HDR is loaded
      directly, GL-028), life-expectancy (overlaps the draft KPI life_expectancy from official sources), happiness and corruption
      charts (origin licences do not allow free reuse). No voivodeship data. Frequency A only. Missing values: a missing year
      is a missing row or an empty cell (the Maddison file has an annotations column that is empty in 21,558 rows; the V-Dem
      file has 4,113 empty cells, its owid_region column included): never a zero. Duplicates: none within a file (entity,
      year); revisions replace the series, lastUpdated tells versions apart. Overlap with published KPIs: gdp_per_capita is
      published in national currency; the Maddison series has another unit and gets its own measure key. Size: about 1.8 MB
      for the three charts (measured). Effort S.'
    overlap: Republishes WHO, UN, World Bank, UNDP and research datasets; take a series from OWID only when the upstream is
      not loaded directly.
  research:
    priority: review-next
    evidence: tested
    connection: tested
    blockers:
    - 'Dev probe run 43291903826 (job 131440022642, branch test/src-cd-probe, 12 Nov 2026): the FAQ page, seven chart CSV
      files and seven metadata.json files answered 200; every CSV has rows for POL.'
    - 'Before publication: read origins[].license of each selected chart from the indicator metadata on a runner (the session
      read archived copies only) and record it per chart; until then the three charts are internal.'
    - 'Not verified: the live host of the indicator metadata, the origin licences of the Global Carbon Budget, V-Dem and Maddison
      charts, the catalog API (marked as under active development).'
    references:
    - https://ourworldindata.org/faqs
    - https://owid-docs.readthedocs.io/projects/etl/api/chart-api/
    - https://owid-docs.readthedocs.io/projects/etl/architecture/metadata/reference/
