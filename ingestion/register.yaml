  coverage: From 1995; annual and short-period series, variable-dependent.
  access:
    endpoint: https://api.stat.gov.pl/Home/BdlApi
    kind: web
    interfaces: [REST API, JSON, XML]
    auth: Anonymous public API; optional registration provides higher quotas and an X-ClientId key.
    cost: free
    limits: 'Anonymous: 5/s, 100/15m, 1,000/12h, 10,000/7d; registered: 10/s, 500/15m, 5,000/12h, 50,000/7d.'
