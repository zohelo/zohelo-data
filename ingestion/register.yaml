      provided API" (https://confluence.wipo.int/confluence/spaces/ATR/pages/1640995272/CWS+ATR+PI+2024+PL, desk
      fetch, 12 Nov 2026). The host is behind the bot protection, so this route needs UPRP to give access: the owner
      question. (2) Tested fallback, the bulletins: https://uprp.gov.pl/pl/publikacje/biuletyn-i-wiadomosci-uprp
      (5,159,339 bytes of HTML) links 3,287 PDF files: BUP trademarks 506 files (2017 to 2026), BUP inventions and
      utility models 390 (2017 to 2026), BUP before the split 1,119 (1973 to 2016), WUP 1,237 (1924 to 2026), other
      35. The newest three answered HEAD 200 with Last-Modified (3.7 to 7.5 MB each); bup45_2026.pdf (2,778,880 bytes,
      23 page objects) and wup45_2026.pdf (5,968,277 bytes, 124 page objects) have text layers. Total size not
      measured; record layout not analysed; old years may be scans. Dev probe run 43295075918 (job 131451094958) and
      Dev probe run 43299743376 (job 131467412298), branch test/src-fix-probe, 12 Nov 2026. (3) Official republishers:
      EPO (Espacenet shows the Polish documents: "The data are currently published on ESPACENET"; the bulk-data page
      of epo.org answered 200 and lists DOCDB and INPADOC, their terms were not captured; Open Patent Services is
      EX-004, parked on its licence and needing an account); EUIPO TMview and DesignView receive UPRP data (DesignView
      since November 2022, TMview since September 2024:
      https://confluence.wipo.int/confluence/spaces/ATR/pages/1640995286/CWS+ATR+TM+2024+PL), but www.tmdn.org closed
      the connection on robots.txt from the runner, so nothing was requested there; WIPO databases were not probed;
      dane.gov.pl timed out from the runner (75 s).'
    incremental: 'For the bulletin route: entity = one bulletin issue (series, year, number), version = Last-Modified;
      issues are never replaced, so new files only (delta), read from the listing page once a week.'
    identifiers: 'Application number, right number, BUP/WUP series, number and date, classification symbol; applicants
      would need REGON or another official identifier, never a name match.'
  modelling:
    notes: 'kpi false. Gold use: an entity table of industrial-property rights keyed by application number (right
      type, filing and publication dates, classification, bulletin issue), for legal persons only; names of natural
      persons (inventors, individual applicants) are not stored. Smallest valuable selection: issues from 2017 on (the
      two current BUP series and WUP). Counts of applications and grants belong to EX-001, not here. Effort L on the
      bulletin route (PDF text extraction, no PDF reader in the pipeline); M if UPRP gives API access.'
    overlap: 'EPO Open Patent Services (EX-004, parked) and WIPO hold related records of Polish applications; patent
