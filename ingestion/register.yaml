    history: 'API: WFS https://cbdgmapa.pgi.gov.pl/arcgis/services/midas/MapServer/WFSServer?service=WFS&request=GetCapabilities
      answered 200 (16,446 bytes) from a GitHub runner with six feature types: documented deposits, mining areas, mining terrains
      and three archival layers (Dev probe run 43203166665 (job 131131537831, branch test/src-cg-probe, 12 Nov 2026)); a GetFeature
      full load was not run. Sizes from the download manager''s catalogue: deposits 7.01 MB, mining areas 1.77 MB, mining
      terrains 1.72 MB, removed deposits 0.95 MB zipped SHP, so a full load is a few requests per layer. The same data as
      SHP ZIP sit in https://dm.pgi.gov.pl/, delivered by e-mail link only.'
    incremental: 'Entity = feature type, version = download date (the WFS gives none); monthly full snapshot per layer (changed_since_last
      by SHA-256). Small source: refresh full.'
    identifiers: MIDAS deposit number, mining-area/land ID, concession number where published.
  modelling:
    notes: 'Separate deposit, mining area and mining terrain; preserve legal status and effective dates. kpi false: reference
      data. Grain: one polygon per deposit or mining area with mineral type and status; CRS not checked, no TERYT code (assign
      voivodeship and gmina by a spatial join to PRG). Smallest Gold selection: the documented-deposits layer as an entity
      table with mineral, status and TERC, and from it the number of documented deposits and of active mining areas per voivodeship.'
    overlap: Overlaps concession registers and the yearly balance of mineral resources (resources and extraction in tonnes
      are in the balance and GUS BDL, not here).
  research:
    priority: review-first
    evidence: tested
    connection: tested
    blockers:
    - GetFeature for a full layer (output formats, paging, CRS) was not run; test in the Landing trial, one request at a time.
    - MIDAS rules page (zrodla-danych.html) and attribute dictionary not opened.
    references:
    - https://www.pgi.gov.pl/midas.html
    - https://midas-app.pgi.gov.pl/
    - https://www.pgi.gov.pl/midas/dane-przestrzenne.html
