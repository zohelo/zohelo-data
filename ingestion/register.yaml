  short_name: UNIDO INDSTAT
  provider: United Nations Industrial Development Organization
  status: parked
  family: A
  kpi: true
  geography: worldwide
  provider_type: international-public
  domains: [manufacturing, industry, employment, production]
  entities: [country, industry, enterprise-aggregate]
  granularity: Country/ISIC industry/year/indicator; product access and industry detail vary.
  coverage: Multicountry industrial statistics; editions, history and geography depend on product.
  access:
    endpoint: https://stat.unido.org/
    kind: bulk_file
    interfaces: [HTML, download files]
    auth: mixed; some UNIDO statistical products require account/subscription
    cost: mixed
    limits: Unknown; no explicit numeric quota found in reviewed documentation.
  licence:
    status: restricted
    notes: 'Terms: UNIDO Statistics Portal Terms and Conditions https://stat.unido.org/content/legal/Terms%20and%20Conditions: all material is UNIDO intellectual property; data may be used in publications with credit to UNIDO, but "secondary data dissemination" rights are granted only to users that have licensed a database with this option. Public display of INDSTAT data on zohelo.com or bi.zohelo.com is therefore not allowed without such a licence. Data provided "as is" and "as available", no warranty. Attribution: "Source: UNIDO, <database> (<edition>), https://stat.unido.org/."'
  updates: Annual editions and national revisions; no public CDC or common schedule established.
  ingestion:
    history: Only ingest licensed named edition, metadata and ISIC version.
    incremental: Replace licensed edition or revised country-industry periods.
    identifiers: UNIDO product + country + ISIC revision/code + indicator + year.
  modelling:
    notes: Value added, output, establishments and employment use different units; ISIC revisions need bridges.
    overlap: Overlaps national statistics, WDI manufacturing aggregates and UNdata legacy INDSTAT mirror.
  research:
    priority: conditional
    evidence: catalogue-only
    connection: not-tested
    blockers:
    - 'Parked: licence restricted (UNIDO terms grant secondary data dissemination only with a licensed database; public display needs that paid licence)'
    - 'Public display needs a UNIDO database licence with the secondary-dissemination option (price unknown)'
    - 'Obtain ISIC concordances'
    references:
    - https://stat.unido.org/
    - https://data.un.org/Handlers/ExplorerHandler.ashx?t=sources
    - https://stat.unido.org/content/legal/Terms%20and%20Conditions
