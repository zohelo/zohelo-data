    kind: bulk_file
    interfaces: [HTML, XLS, XLSX, PDF]
    auth: Public downloads without login.
    cost: free
    limits: No API; automated-download limits unknown.
  licence:
    status: unresolved
    notes: 'Terms not stated for psz.zus.pl (review of #2846). ZUS re-use terms
      https://www.zus.pl/web/biuletyn-informacji-publicznej/obsluga-klienta/ogolne-zasady-zalatwiania-spraw/ponowne-wykorzystywanie-informacji-sektora-publicznego
      grant re-use only of information "udostępnionych na stronie podmiotowej Biuletynu Informacji Publicznej Zakładu
      Ubezpieczeń Społecznych i w centralnym repozytorium informacji publicznej www.danepubliczne.gov.pl" or passed on
      request (conditions: source, dates of creation and retrieval, whole or part, processing disclosed); ZUS disclaims
      information obtained otherwise. psz.zus.pl is neither BIP nor dane.gov.pl and shows no terms of its own. Route to
      publishing: the same tables on dane.gov.pl (land them from there), or written confirmation from ZUS that psz.zus.pl
      falls under these terms (owner question). Until then the source stays internal (licence gate).'
