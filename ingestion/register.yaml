- id: GL-036
  name: Climate Data Store (CDS)
  short_name: Copernicus Climate Data Store
  provider: Copernicus Climate Change Service / ECMWF
  status: reviewing
  family: G
  kpi: true
  geography: worldwide
  provider_type: international-public
  domains: [climate, weather, reanalysis, projections]
  entities: [grid-cell, station, country-derived]
  granularity: Dataset grid/level/variable/time/member; often hourly and gridded.
  coverage: Earth past, present and projections; ERA5 pressure-level time series is documented from 1940-present; other datasets
    differ.
  access:
    endpoint: https://cds.climate.copernicus.eu/api
    kind: api
    interfaces: [HTML, API, GRIB, NetCDF, cloud workspace]
    auth: registration, personal access token, and manual acceptance of each dataset's terms on its page
    cost: free
    limits: 'No numeric quota on the how-to page. ECMWF forum (2019, may be outdated): "For ERA5 monthly data on the CDS,
      a request is limited to 10,000 fields"; requests are queued and limits are adjusted with system load.'
  licence:
    status: open-conditional
    notes: 'Terms: CC BY 4.0 https://creativecommons.org/licenses/by/4.0/ for Copernicus Products in the Climate Data Store
      since 2 July 2025 (ECMWF announcement https://forum.ecmwf.int/t/cc-by-licence-to-replace-licence-to-use-copernicus-products-on-02-july-2025/13464,
      replacing the Licence to Use Copernicus Products): reuse, modification and commercial use allowed with attribution and
      indication of changes; non-Copernicus datasets in the CDS keep their own licence, shown on each dataset page and accepted
      per dataset with the personal token. Disclaimer to show: neither the European Commission nor ECMWF is responsible for
      any use made of the information. Attribution: "Generated using Copernicus Climate Change Service information <year>"
      ("Contains modified Copernicus Climate Change Service information <year>" when modified), plus the dataset''s citation
      from its References section.'
  updates: 'Per dataset. ERA5-Land monthly averaged data: "Monthly with a delay of 2-3 months relatively to the actual date";
    the catalogue showed data to 2026-10-01 on 12 Nov 2026.'
  ingestion:
    history: 'API only, no anonymous bulk: the catalogue is public (https://cds.climate.copernicus.eu/api/catalogue/v1/collections/reanalysis-era5-land-monthly-means
      answered 200 with licence CC-BY-4.0 and extent 1950-01-01 to 2026-10-01 from a GitHub runner, Dev probe run 43203166665
      (job 131131537831, branch test/src-cg-probe, 12 Nov 2026)), but a retrieval needs the personal token and the accepted
      dataset terms. Smallest load: ERA5-Land monthly averaged 2 m temperature and total precipitation, 1950 to present, cut
      to the area of Poland and the EU (0.1 degree grid, GRIB); about 920 months x 2 variables = 1,840 fields, inside one
      or two requests; size not measured.'
    incremental: Entity = dataset x variable, version = the catalogue's updated date; request the new months monthly and re-request
      the last three (the newest months are preliminary). Chunk by dataset/variable/time with a manifest and the licence text.
    identifiers: Dataset short name + variable + level + grid coordinates + valid/reference time + ensemble member.
  modelling:
    notes: 'Gridded fields need CRS, grid and version; a country value needs reproducible area weighting over PRG/NUTS polygons,
      which the pipeline does not have yet (GRIB decoding plus spatial averaging: effort L). Smallest Gold selection: mean
      air temperature and precipitation total per month for Poland, the voivodeships and EU countries, with the anomaly against
      1991-2020 as a metric, as new KPIs in environment.climate.'
    overlap: No KPI of kpi.csv is published here yet. IMGW station archives (PL-ENV-009) are the national observations; Eurostat
      heating and cooling degree days derive from the same reanalysis; raw reanalysis is not an official country observation.
  research:
    priority: specialist
    evidence: documented
    connection: tested
    blockers:
    - 'Owner: will you create a free ECMWF account for the Climate Data Store, accept the CC-BY licence on the dataset page
      "ERA5-Land monthly averaged data from 1950 to present", and add the personal access token as the organisation secret
      SOURCE_CDS_API_TOKEN?'
    - Current request limits are not published on the pages read; measure in the Dev trial.
    - GRIB decoding and area weighting to countries and voivodeships are not in the pipeline (design before Landing).
    references:
    - https://cds.climate.copernicus.eu/
    - https://cds.climate.copernicus.eu/how-to-api
    - https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land-monthly-means?tab=overview
    - https://www.ecmwf.int/en/terms-use
    - https://forum.ecmwf.int/t/cc-by-licence-to-replace-licence-to-use-copernicus-products-on-02-july-2025/13464
    - https://forum.ecmwf.int/t/cdsapi-limitations-and-restrictions/1639
