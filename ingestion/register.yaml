- id: PLG-034
  name: Government Legislative Process portal (RPL), including consultations
  short_name: RCL legislative process (RPL)
  provider: Government Legislation Centre (RCL)
  status: parked
  family: F
  kpi: false
  geography: Poland
  provider_type: national-public
  domains: [legislation, public consultation]
  entities: [draft legal act, legislative stage, ministry, consultation submission]
  granularity: Project (draft act) by type, title, creation date, applicant, work-list number and status, with staged documents.
  coverage: Current, adopted and archived drafts; RCL's accessibility statement dates the site from 1 January 2012 (desk
    fetch); the first project year was not read.
  access:
    endpoint: https://legislacja.rcl.gov.pl/
    kind: web
    interfaces: [HTML search, PDF, DOCX]
    auth: public browsing; registration only to follow a project
    cost: free
    limits: 'None published. robots.txt could not be read: the host timed out from a GitHub runner, and the desk fetch tool
      was refused on the list, project and help pages with a robots.txt disallow for its agent.'
  licence:
    status: open-conditional
    notes: 'Terms: RCL''s re-use page https://bip.rcl.gov.pl/rcl/ponowne-wykorzystywanie/3122,Warunki-ponownego-wykorzystywania-informacji-publicznej.html
      (read from a GitHub runner, 12 Nov 2026; dated 16 June 2016, changed 2 January 2019, by the desk fetch). It says,
      citing the re-use act of 25 February 2016 (Dz. U. poz. 352): "każdy ma prawo do złożenia wniosku o ponowne wykorzystywanie
      informacji sektora publicznego w celach komercyjnych lub niekomercyjnych innych niż pierwotny publiczny cel, dla którego
      informacja została wytworzona", then: "każdemu przysługuje prawo do ponownego wykorzystywania informacji sektora publicznego:
      udostępnionych w systemie teleinformatycznym" and "rządowe projekty aktów prawnych oraz dokumenty z nimi powiązane
      udostępniane są na stronie podmiotowej Rządowego Centrum Legislacji, w serwisie Rządowy Proces Legislacyjny". Conditions
      quoted: "obowiązku każdorazowego informowania o źródle pozyskanych danych oraz czasie wytworzenia żądanego zbioru
      przez podmiot zobowiązany, obowiązku informowania o przetworzeniu informacji ponownie wykorzystywanej"; works and
      databases also need their author named. Commercial reuse: yes (commercial purposes are named for requests, and the
      right to reuse what is made available online is not limited by purpose). Modification: yes, when the processing is
      stated. Free of charge ("udostępniane w celu ich ponownego wykorzystywania bezpłatnie"). Disclaimer: "Rządowe Centrum
      Legislacji nie ponosi odpowiedzialności za: rezultaty przetworzenia udostępnionych lub przekazanych informacji sektora
      publicznego, dalsze udostępnianie lub przekazywanie przetworzonych informacji sektora publicznego przez podmioty ponownie
      je wykorzystujące." The page gives no attribution sentence; proposed: "Źródło: Rządowe Centrum Legislacji, serwis
      Rządowy Proces Legislacyjny (legislacja.rcl.gov.pl), stan na <data>; dane przetworzone". Limits: the terms are on
      RCL''s BIP, not on the RPL site, whose own footer could not be read (host timeout); attachments sent by third parties
      in consultations are their authors'' works and name people, so only project metadata would be covered.'
  updates: 'Event-driven: documents are added as a draft moves through agreement, consultation and later stages; no feed.'
  ingestion:
    history: 'No route from the pipeline: legislacja.rcl.gov.pl and legislacja.gov.pl timed out from a GitHub runner on
      robots.txt, so the home page, the lists and a project page were not requested (Dev probe run 43289510189, job 131431691639,
      branch test/src-plgs-probe, 12 Nov 2026); bip.rcl.gov.pl answered 200 in the same run. The desk search found no API,
      RSS or Atom feed, bulk file or dane.gov.pl dataset; list addresses seen in search results have the form /lista?typeId=<n>&pSize=<n>&pNumber=<n>
      and projects /projekt/<id> (not opened).'
    incremental: None proposed while parked.
    identifiers: RPL project id (/projekt/<id>) + stage id (/katalog/<id>) + the applicant's work-list number
  modelling:
    notes: 'kpi false. Possible later use, metadata only: government drafts started per month by applicant and type, share
      adopted, days from first stage to adoption (event dates, monthly and annual as separate measure_keys). Value is low
      next to the Sejm API and ELI.'
    overlap: PLG-024 Sejm API (approved) covers bills from the Sejm print on and PLG-026 ELI (approved) the published acts;
      RPL alone covers the government stage, ministers' regulations and drafts that are dropped. No kpi.csv KPI overlaps.
  research:
    priority: review-next
    evidence: tested
    connection: tested
    blockers:
    - 'Parked: the host does not answer GitHub runners (timeout on robots.txt of legislacja.rcl.gov.pl and legislacja.gov.pl,
      Dev probe run 43289510189, job 131431691639, branch test/src-plgs-probe, 12 Nov 2026) and there is no API, feed or
      bulk file; the only route would be reading HTML list and project pages (a web route, which needs an owner decision),
      and the desk fetch tool was refused on those pages by robots.txt.'
    - Un-park only if RCL publishes a feed, file or API, or the host becomes reachable and the owner allows a web route.
    - 'Consultation attachments name commenters: metadata only, never the documents.'
    references:
    - https://legislacja.rcl.gov.pl/
    - https://bip.rcl.gov.pl/rcl/ponowne-wykorzystywanie/3122,Warunki-ponownego-wykorzystywania-informacji-publicznej.html
    - https://bip.rcl.gov.pl/rcl/dostepnosc/deklaracje-dostepnosci/23028,Deklaracja-dostepnosci-strony-Rzadowego-Procesu-Legislacyjnego.html
