      and about 25 KB a day; his-wlk-cal (demand, wi = wind, pv = photovoltaics, generating-unit groups jg*) 96 rows and about
      49 KB a day; no nextLink at this size. Full load = one request per entity and day from 2024-06-14: 882 days to 12 Nov
      2026, so about 1,800 requests and 65 MB for the two entities, half an hour at one request a second. The entity catalogue
      was not read (https://api.raporty.pse.pl/api/ answers 404); date-range filters and paging were not tested.'
