      9888915 and pension_amount_dec 9888921 (December, Poland, 2018-), insured_pension 532853, insured_sickness_voiv
      532793, payers_voiv 533093, absence_voiv 6744574 (quarterly, current year only on the portal), insured_health
      1159389 (monthly, 2012-) and foreign_insured 3456951 (monthly, 2020-). Not built: .xls years (before 2014/2018),
      the 2012-2022 insured-by-age summary file, new awards, disability and survivors pensions, benefits, medical
