- id: GL-036
  name: Climate Data Store (CDS)
  short_name: Copernicus Climate Data Store
  provider: Copernicus Climate Change Service / ECMWF
  status: reviewing
  family: G
  kpi: true
  geography: worldwide
  provider_type: international-public
  domains: [climate, weather, reanalysis, projections]
  entities: [grid-cell, station, country-derived]
  granularity: Dataset grid/level/variable/time/member; often hourly and gridded.
  coverage: Earth past, present and projections; ERA5 pressure-level time series is documented from 1940-present; other datasets
    differ.
  access:
    endpoint: https://cds.climate.copernicus.eu/api
    kind: api
    interfaces: [HTML, API, GRIB, NetCDF, cloud workspace]
    auth: registration, personal access token, and manual acceptance of each dataset's terms on its page
    cost: free
    limits: 'No numeric quota on the how-to page. ECMWF forum (2019, may be outdated): "For ERA5 monthly data on the CDS,
      a request is limited to 10,000 fields"; requests are queued and limits are adjusted with system load.'
  licence:
    status: open-conditional
    notes: 'Terms: CC BY 4.0 https://creativecommons.org/licenses/by/4.0/ for Copernicus Products in the Climate Data Store
      since 2 July 2025 (ECMWF announcement https://forum.ecmwf.int/t/cc-by-licence-to-replace-licence-to-use-copernicus-products-on-02-july-2025/13464,
      replacing the Licence to Use Copernicus Products): reuse, modification and commercial use allowed with attribution and
      indication of changes; non-Copernicus datasets in the CDS keep their own licence, shown on each dataset page and accepted
      per dataset with the personal token. Disclaimer to show: neither the European Commission nor ECMWF is responsible for
      any use made of the information. Attribution: "Generated using Copernicus Climate Change Service information <year>"
      ("Contains modified Copernicus Climate Change Service information <year>" when modified), plus the dataset''s citation
      from its References section.'
  updates: 'Per dataset. ERA5-Land monthly averaged data: "Monthly with a delay of 2-3 months relatively to the actual date";
    the catalogue showed data to 2026-10-01 on 12 Nov 2026.'
  ingestion:
    history: 'API only, no anonymous bulk: the catalogue is public (https://cds.climate.copernicus.eu/api/catalogue/v1/collections/reanalysis-era5-land-monthly-means
      answered 200 with licence CC-BY-4.0 and extent 1950-01-01 to 2026-10-01 from a GitHub runner, Dev probe run 43203166665
      (job 131131537831, branch test/src-cg-probe, 12 Nov 2026)), but a retrieval needs the personal token and the accepted
      dataset terms. Smallest load: ERA5-Land monthly averaged 2 m temperature and total precipitation, 1950 to present, cut
      to the area of Poland and the EU (0.1 degree grid, GRIB); about 920 months x 2 variables = 1,840 fields, inside one
      or two requests; size not measured.'
    incremental: Entity = dataset x variable, version = the catalogue's updated date; request the new months monthly and re-request
      the last three (the newest months are preliminary). Chunk by dataset/variable/time with a manifest and the licence text.
    identifiers: Dataset short name + variable + level + grid coordinates + valid/reference time + ensemble member.
  modelling:
    notes: 'Gridded fields need CRS, grid and version; a country value needs reproducible area weighting over PRG/NUTS polygons,
      which the pipeline does not have yet (GRIB decoding plus spatial averaging: effort L). Smallest Gold selection: mean
      air temperature and precipitation total per month for Poland, the voivodeships and EU countries, with the anomaly against
      1991-2020 as a metric, as new KPIs in environment.climate.'
    overlap: No KPI of kpi.csv is published here yet. IMGW station archives (PL-ENV-009) are the national observations; Eurostat
      heating and cooling degree days derive from the same reanalysis; raw reanalysis is not an official country observation.
  research:
    priority: specialist
    evidence: documented
    connection: tested
    blockers:
    - 'Owner: will you create a free ECMWF account for the Climate Data Store, accept the CC-BY licence on the dataset page
      "ERA5-Land monthly averaged data from 1950 to present", and add the personal access token as the organisation secret
      SOURCE_CDS_API_TOKEN?'
    - Current request limits are not published on the pages read; measure in the Dev trial.
    - GRIB decoding and area weighting to countries and voivodeships are not in the pipeline (design before Landing).
    references:
    - https://cds.climate.copernicus.eu/
    - https://cds.climate.copernicus.eu/how-to-api
    - https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land-monthly-means?tab=overview
    - https://www.ecmwf.int/en/terms-use
    - https://forum.ecmwf.int/t/cc-by-licence-to-replace-licence-to-use-copernicus-products-on-02-july-2025/13464
    - https://forum.ecmwf.int/t/cdsapi-limitations-and-restrictions/1639
- id: GL-037
  name: EEA Datahub
  short_name: EEA Datahub
  provider: European Environment Agency
  source_system: eea
  status: built
  family: G
  kpi: true
  geography: multicountry-Europe
  provider_type: international-public
  domains: [environment, climate, pollution, biodiversity, water]
  entities: [country, monitoring-site, facility, region]
  granularity: Dataset-specific; country aggregates, sites, facilities and geospatial features all occur.
  coverage: EEA network across 38 European countries; dataset histories vary.
  access:
    endpoint: https://www.eea.europa.eu/en/datahub
    kind: bulk_file
    interfaces: [HTML, download files, CSV, SQLite, Microsoft Access, catalogue API, Discodata SQL API, geospatial services]
    auth: public
    cost: free
    limits: None published. Discodata (https://discodata.eea.europa.eu/sql?query=...&p=<page>&nrOfHits=<rows>) returns JSON
      pages, 100 rows by default, no stated maximum.
  licence:
    status: open-conditional
    notes: 'Terms: EEA legal notice https://www.eea.europa.eu/en/legal-notice (read 12 Nov 2026): EEA material is published
      under CC BY 4.0 and "may be re-used without prior permission, free of charge, for commercial or non-commercial purposes
      ... provided that the EEA is always acknowledged as the original source of the material", in each copy and without distorting
      the original meaning; modification (adaptation) is allowed. "The above-mentioned permissions do not apply to content
      supplied by third parties"; "The re-use of certain data may be subject to different conditions", marked on the item.
      The EEA data policy (https://www.eea.europa.eu/en/datahub/eea-data-policy) adds: "Unless indicated otherwise, dataset
      will be distributed under open standard license ODC-by license or similar" and "EEA data are provided ''as is'' to users
      without warranty of any kind". The catalogue record of the greenhouse gas inventory states "License CC-BY 4.0 ... Copyright
      holder: European Environment Agency (EEA)" and "No limitations to public access" (record of the April 2024 version).
      Disclaimer: the EEA accepts no responsibility or liability; the information does not necessarily reflect the official
      opinion of the EEA. Attribution: "Source: European Environment Agency (EEA), <dataset title>, <download date>."'
  updates: 'Per dataset. Greenhouse gas inventory (GovReg): yearly cycle with several versions a year (2026: ver. 1.0 17 April,
    2.0 4 September, 2.1 2 October 2026).'
  ingestion:
    history: 'Bulk per dataset version. First dataset: "GovReg: National emissions reported to the UNFCCC and to the EU under
      the Governance Regulation" (series https://www.eea.europa.eu/en/datahub/datahubitem-view/3b7fe76c-524a-439a-bfd2-a6e4046302a2,
      1985-2024, formats CSV, SQLite and Access, "Direct download"). Every version is its own catalogue record (2026 ver.
      2.1: f6a252a6-1bde-43a8-9e6a-f58146fd691e), so the file URL changes per release; the stable entry is the series record,
      read as JSON from https://sdi.eea.europa.eu/catalogue/srv/api/records/<id> (200, 43,925 bytes from a GitHub runner,
      Dev probe run 43203166665 (job 131131537831, branch test/src-cg-probe, 12 Nov 2026)). The 2024 version documents the
      pattern: direct download https://sdi.eea.europa.eu/data/<version record id> and WebDAV folder https://sdi.eea.europa.eu/webdav/datastore/public/<dataset
      folder>. The download of the 2026 version was not tested (the series id itself answers 400 on /data/); size not measured.'
    incremental: Entity = dataset, version = the version record id and publication date; poll the series record monthly and
      land the newest version (snapshot, changed_since_last); corrected versions replace the entity.
    identifiers: 'EEA dataset ID + published feature/observation key; for the inventory: country code + sector (CRF) + pollutant
      + year.'
  modelling:
    notes: 'Do not combine facility emissions, site measurements and country indicators in one fact; retain units and QA flags.
      Greenhouse gas inventory: grain country x CRF sector x gas x year, ISO 3166-1 alpha-2 country codes plus EU aggregates,
      kt CO2 equivalent, annual from 1985/1990. Smallest Gold selection: total emissions with and without LULUCF and the main
      sectors (energy, transport, industry, agriculture, waste) for Poland and all EU countries: a second source of the existing
      KPI ghg_emissions (O31). Next datasets when wanted: Waterbase (water quality, stands in for PL-ENV-011), Natura 2000
      and nationally designated areas (stand in for PL-ENV-017), air quality statistics.'
    overlap: Publishes ghg_emissions (kpi.csv), which Eurostat and FAOSTAT also publish; overlaps Copernicus, national agencies
      and EU reporting portals; identify the authoritative dataset owner.
  research:
    priority: review-first
    evidence: documented
    connection: tested
    blockers:
    - Dataset-level rights scan for every further dataset (item-specific and third-party conditions override CC BY).
    references:
    - https://www.eea.europa.eu/en/datahub
    - https://www.eea.europa.eu/en/legal-notice
    - https://www.eea.europa.eu/en/datahub/eea-data-policy
    - https://www.eea.europa.eu/en/datahub/datahubitem-view/3b7fe76c-524a-439a-bfd2-a6e4046302a2
    - https://sdi.eea.europa.eu/catalogue/srv/api/records/6331f651-8863-4656-a911-669f2a332a1e
    - https://discodata.eea.europa.eu/Help.html
