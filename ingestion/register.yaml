    status: unresolved
    notes: 'Terms: none found. The PSE announcement https://www.pse.pl/-/najwazniejsze-dane-o-pracy-systemu-elektroenergetycznego-i-rynku-bilansujacego-w-nowej-odslonie
      (read 12 Nov 2026) offers "możliwość pobierania danych liczbowych czy wykorzystania API według potrzeb użytkownika"
      but states no licence, attribution wording, or rule on commercial reuse and modification; the pse.pl front page links
