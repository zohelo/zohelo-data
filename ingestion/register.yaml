    incremental: Entity = national SHP package, version = Last-Modified; snapshot, changed_since_last. The file is rebuilt
      often (Last-Modified on the probe day) and is 0.56 GB, so load monthly and keep only the newest version in the Archive.
      Add it as an entity of the existing gugik_prg source rather than a new source.
    identifiers: PRG address identifier + TERYT (TERC, SIMC, ULIC) + house number.
  modelling:
    notes: 'Addresses are not legal parcel identifiers or current residents. kpi false: reference data. Smallest Gold selection:
      the number of address points per gmina (TERC), joined by code to dim_geography as an attribute or an entity-snapshot
      count (like the GLEIF and VAT white list counts); individual points stay in Silver.'
    overlap: Overlaps TERYT streets and localities (PLS-007) and the PRG boundaries already onboarded (gugik_prg); EGiB buildings
      (PL-ENV-006) are a different register.
  research:
    priority: conditional
    evidence: tested
    connection: tested
    blockers:
    - Attribute list and row count of the SHP package were not opened; check on the real file before Bronze (0.56 GB zipped,
      bounded memory).
    references:
    - https://www.geoportal.gov.pl/pl/dane/panstwowy-rejestr-granic-prg/
    - https://opendata.geoportal.gov.pl/prg/adresy/PunktyAdresowe/POLSKA.zip
    - https://opendata.geoportal.gov.pl/prg/adresy/PRG-punkty_adresowe.zip
    - https://www.gov.pl/web/gugik/nowy-adres-uslug-dotyczacych-numeracji-porzadkowej
