- id: PL-ENV-014
  name: 'Central Geological Database: boreholes (CBDG Otwory)'
  short_name: PIG-PIB boreholes
  provider: Państwowy Instytut Geologiczny–PIB (PIG-PIB)
  status: parked
  family: G
  kpi: false
  geography: Poland
  provider_type: national-public
  domains: [geology, boreholes]
  entities: [borehole, geological record]
  granularity: Individual boreholes and associated thematic attributes.
  coverage: Records from the late nineteenth century to present; completeness varies by source and period.
  access:
    endpoint: https://dm.pgi.gov.pl/
    kind: bulk_file
    interfaces: [map, WMS, ArcGIS REST, bulk-files, SHP, HTML]
    auth: Bulk files through the CBDG download manager, which sends the links to an e-mail address the user gives; map services
      public.
    cost: Free.
    limits: None published.
  licence:
    status: open-conditional
    notes: 'Terms: PIG-PIB rules for re-use of public sector information https://www.pgi.gov.pl/rejestry-i-bazy-danych-geologicznych/zasady-korzystania-z-isp.html
      (read 12 Nov 2026; under the Open Data Act of 2021): information is provided for re-use "co do zasady, bezpłatnie";
      the user must give "źródle, czasie wytworzenia i pozyskania informacji publicznej", say when the information was processed
      and whether all or part was used, and pass the terms on to recipients; using the information counts as accepting the
      offer. The rules set no separate limit on commercial use (a request only states whether the purpose is commercial);
      modification is allowed when disclosed. PIG-PIB accepts no liability for use, interpretation or processing. Limit named
      on the borehole page: "Dostęp do niektórych informacji, takich jak np. pomiary geofizczne wymaga uzyskania zgody." Attribution:
      "Źródło: Państwowy Instytut Geologiczny - PIB, Centralna Baza Danych Geologicznych" with the date of the file and the
      download date.'
  updates: The download manager lists a dated package cbdg_otwory_2026_11_12.zip, so the borehole package is rebuilt about
    daily.
  ingestion:
    history: 'Bulk: https://dm.pgi.gov.pl/ lists 93 ZIP packages, among them cbdg_otwory_<date>.zip (boreholes, 30.71 MB);
      the manager does not show file URLs, it sends the links by e-mail (Dev probe run 43203166665 (job 131131537831, branch
      test/src-cg-probe, 12 Nov 2026)). Map services: https://cbdgmapa.pgi.gov.pl/arcgis/rest/services lists cbdg_otwory (200
      from a runner); whether it offers WFS or a query endpoint for a full load was not tested. http://uslugi_gis.pgi.gov.pl
      answered 503.'
    incremental: 'PROPOSAL: full dated snapshot and diff by borehole ID; no public change feed is documented.'
    identifiers: CBDG borehole identifier/name plus coordinates and theme.
  modelling:
    notes: 'Do not treat missing downhole measurements as absent observations; restricted details may be omitted. kpi false
      and no Gold use today: single boreholes feed no KPI and no shared dimension.'
    overlap: Overlaps MIDAS (PL-ENV-015), hydrogeological and geophysical subsystems by location but not definition.
  research:
    priority: review-next
    evidence: tested
    connection: tested
    blockers:
    - 'Parked: no Gold use (single boreholes feed no KPI or dimension), and the bulk package is delivered only as links sent
      to an e-mail address, which needs an owner contact address.'
    - 'If wanted later: test the cbdg_otwory map service for a full load, or the owner requests the package link by e-mail.'
    references:
    - https://baza.pgi.gov.pl/podsystemy/otwory
    - https://dm.pgi.gov.pl/
    - https://www.pgi.gov.pl/dane-geologiczne/geologiczne-bazy-danych.html
