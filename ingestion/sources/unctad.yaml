source_system: unctad
description: UNCTAD Data Hub (UNCTADstat) — bulk CSV file (7z) per selected table

# Extraction strategy (docs/landing.md). Bulk feature: every Data Hub table has a "Download bulk"
# file, one 7z archive holding the whole table as CSV, at a stable URL per report code
# (https://unctadstat-api.unctad.org/bulkdownload/<code>/<code with _>; Dev probes #2397). The server
# sends no Last-Modified, so version = download time and a file is written only when its SHA-256
# changed. Entity = one table; restart unit = one table. Selection (#2397): the tables where UNCTAD
# is the primary compiler (FDI, trade in goods and services, digital services, commodity prices,
# maritime); GDP, population, CPI and exchange rates are left to WDI, WPP, ECB and NBP, and the
# large creative-economy and bilateral-services tables (335 MB and 86 MB compressed) are out until a
# model needs them. CC BY 3.0 IGO (register GL-021). Proven by the Dev trial (#2399); every table is one CSV in
# the same shape (Dev probes 43084525257, 43084992517): time field, code/label pairs, measures with footnote and
# missing-value columns.
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - entity: US_FdiFlowsStock   # FDI inflows and outflows, stocks
        url: https://unctadstat-api.unctad.org/bulkdownload/US.FdiFlowsStock/US_FdiFlowsStock
        format: 7z
        version: last_modified
      - entity: US_TradeMerchTotal   # merchandise trade, total
        url: https://unctadstat-api.unctad.org/bulkdownload/US.TradeMerchTotal/US_TradeMerchTotal
        format: 7z
        version: last_modified
      - entity: US_TradeServCatTotal   # services trade by category
        url: https://unctadstat-api.unctad.org/bulkdownload/US.TradeServCatTotal/US_TradeServCatTotal
        format: 7z
        version: last_modified
      - entity: US_DigitallyDeliverableServices   # digitally deliverable services trade
        url: https://unctadstat-api.unctad.org/bulkdownload/US.DigitallyDeliverableServices/US_DigitallyDeliverableServices
        format: 7z
        version: last_modified
      - entity: US_CommodityPrice_M   # free market commodity prices, monthly
        url: https://unctadstat-api.unctad.org/bulkdownload/US.CommodityPrice_M/US_CommodityPrice_M
        format: 7z
        version: last_modified
      - entity: US_PLSCI   # port liner shipping connectivity index
        url: https://unctadstat-api.unctad.org/bulkdownload/US.PLSCI/US_PLSCI
        format: 7z
        version: last_modified
      - entity: US_MerchantFleet   # merchant fleet
        url: https://unctadstat-api.unctad.org/bulkdownload/US.MerchantFleet/US_MerchantFleet
        format: 7z
        version: last_modified
      - entity: US_SeaborneTrade   # seaborne trade
        url: https://unctadstat-api.unctad.org/bulkdownload/US.SeaborneTrade/US_SeaborneTrade
        format: 7z
        version: last_modified
      - entity: US_PortCalls   # port calls and time in port
        url: https://unctadstat-api.unctad.org/bulkdownload/US.PortCalls/US_PortCalls
        format: 7z
        version: last_modified
  initial: bulk
  production: snapshot                  # each archive is the complete table
  incremental_policy: changed_since_last  # SHA-256 (no Last-Modified from the server)
  schedule: # UTC; tables are revised a few times a year (commodity prices monthly); weekly check (Tuesday 05:55), unchanged bytes skipped
    - {cron: "55 5 * * 2", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/unctad/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.unctad_rows, bronze.unctad_rejected_files]
silver: [silver.unctad_fdi_flows_stock, silver.unctad_merchandise_trade, silver.unctad_services_trade,
         silver.unctad_digital_services_trade, silver.unctad_commodity_prices, silver.unctad_liner_shipping_connectivity,
         silver.unctad_merchant_fleet, silver.unctad_seaborne_trade, silver.unctad_port_calls]
gold: [gold.build_unctad, gold.metrics_exports_goods, gold.metrics_exports_services]

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded versions
# Refresh policy for all layers (D32): nine tables, 1.24 million rows in all. Each archive is the whole table with no
# changed-since, so a new version replaces every row and the tables are rebuilt in full when their bytes change (a few
# times a year). The largest, services by category (807,733 rows, ~38,000 more a year), is near the #822 1M
# full-rebuild threshold: its ceiling 1,200,000 carries the exception #2777; the other eight are below 125,000 rows.
refresh: {mode: full, decided: "D32 + #2757, #2777"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
