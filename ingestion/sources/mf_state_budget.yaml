source_system: mf_state_budget
description: Ministry of Finance monthly state budget execution (XLSX)

# Extraction strategy (docs/landing.md). Bulk feature: the Ministry of Finance's monthly state
# budget execution report (sprawozdanie operatywne, XLSX about 3.5 MB; 0.5 MB up to 2021), linked
# from the per-year gov.pl page "sprawozdania-miesieczne-<year>" in xlsx/pdf pairs, newest first
# (gov.pl terms, register PLG-007). Each release is a new https://www.gov.pl/attachment/<uuid>, so
# the link is found on the page at run time (url_from, pick first = the newest xlsx; Dev probes
# 43084312730, 43085156243: pages 2018–2026 list xlsx files, 2010–2017 pages list none).
# Each report's table 1 repeats every month of its year so far (cumulative from January), so the
# newest report of each year holds the whole year: one entity per year (years: budget_execution_2018
# … _<current year>; bulk_file expand_years), and the current year's entity is optional until its
# page lists a report. The newest report of a year is replaced in Bronze by the next (latest-only per
# entity); the December report (I–XII, published in June of the next year) closes the year, so only the
# current and the previous year are downloaded again (years.open: 2); older years land once.
# Version = Last-Modified; written only when the SHA-256 changed.
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - entity: budget_execution
        years: {from: 2018, open: 2}   # the current and the previous year are checked; older years are closed
        url_from:
          page: https://www.gov.pl/web/finanse/sprawozdania-miesieczne-{year}
          pattern: /attachment/
          pick: first   # 1st link = newest xlsx (…Sprawozdanie_operatywne_za_<months>_<year>.xlsx), 2nd = its PDF
        format: raw
        version: last_modified     # the response's Last-Modified; download time when absent
  initial: bulk
  production: snapshot                  # each report is cumulative year to date
  incremental_policy: changed_since_last  # Last-Modified / SHA-256
  schedule: # UTC; release: the monthly report appears about three weeks after the month; one file per year, unchanged bytes skipped; weekday check
    - {cron: "35 13 * * 1-5", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/mf_state_budget/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.mf_state_budget_cells, bronze.mf_state_budget_rejected_files]
silver: [silver.budget_execution]
gold: [gold.build_public_finance]

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded versions
# Refresh policy for all layers (D32): small workbooks (under 200,000 cells), rebuilt in full.
refresh: {mode: full, decided: "D32 + #2766"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
