source_system: mf_state_budget
description: Ministry of Finance monthly state budget execution (XLSX)

# Extraction strategy (docs/landing.md). Bulk feature: the Ministry of Finance's monthly state
# budget execution report (year to date, cumulative), linked from the per-year gov.pl page
# "sprawozdania-miesieczne-<year>" in xlsx/pdf pairs, newest first (gov.pl terms, register PLG-007).
# Each release is a new https://www.gov.pl/attachment/<uuid>, so the link is found on the page at
# run time (url_from, pick first = the newest xlsx). The page name changes each January (a later
# Task handles the rollover).
# Version = Last-Modified; written only when the SHA-256 changed. A schedule (stage 4) comes
# after the Dev trial.
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - entity: budget_execution_monthly
        url_from:
          page: https://www.gov.pl/web/finanse/sprawozdania-miesieczne-2026
          pattern: /attachment/
          pick: first   # Dev trial #2342: 1st link = newest xlsx (Sprawozdanie_operatywne_za_<months>_<year>.xlsx), 2nd = its PDF
        format: raw
        version: last_modified     # the response's Last-Modified; download time when absent
  initial: bulk
  production: snapshot                  # each report is cumulative year to date
  incremental_policy: changed_since_last  # Last-Modified / SHA-256
  schedule: []

landing: 01_landing/mf_state_budget/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: []
silver: []
gold: []

refresh: {mode: full}

activities: [landing.inspect, landing.extract, landing.verify]
