source_system: zus_yearbook
description: ZUS Rocznik Statystyczny Ubezpieczeń Społecznych (social insurance statistical yearbook) — one PDF per edition

# Extraction strategy (docs/landing.md). Bulk feature: ZUS publishes each yearbook edition (three
# reference years, PL) as one PDF on its yearbook page; there is no XLSX or other machine-readable
# version (Dev probe #2464: 12 files on the page's two list pages, 11 Polish editions from 1946–1985
# to 2021–2023 plus one English 2018–2020 translation, which is left out). Every file has a fixed
# document URL with Last-Modified, so each edition is one bulk file: entity = one edition, restart
# unit = one edition, version = Last-Modified, written only when the SHA-256 changed (about 88 MB in
# all). A new edition (every three years) is a new entry here. Editions 1999–2002 and 2003–2005
# cover the non-agricultural system only. ZUS re-use terms: free re-use with the source and dates
# given (register PLS-010). Tables are read from the PDF at Bronze (stage 5); a schedule (stage 4)
# comes after the Dev trial.
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - entity: rocznik_2021_2023   # 7.4 MB
        url: https://www.zus.pl/documents/10182/167642/0600_25+Rocznik+statystyczny+2021_2023.pdf/dbae306d-f987-0359-ed4d-80a4bca948bf
