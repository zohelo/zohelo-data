source_system: gus_dbw
description: GUS Dziedzinowe Bazy Wiedzy (DBW) indicators from the website bulk files (dbw.stat.gov.pl)

# Extraction strategy (docs/landing.md): source bulk feature. The DBW website publishes every
# indicator × cross-section × presentation × periodicity as one ZIP (one semicolon CSV) with its
# last-update date in the indicator listing (api_app/getAggregatesById); no account, no VPN.
extraction:
  initial: bulk                          # every bulk file of every indicator
  production: snapshot                   # every file is a complete version of its entity
  incremental_policy: changed_since_last # listing "last update" vs Landing version
  # UTC; daily 04:40 (05:40 Warsaw in winter). The initial load is done (25 Oct 2026); a run
  # renews each indicator's listing and lands only files whose last-update date is newer.
  schedule: # UTC; release: no fixed calendar, indicators change on GUS publication dates; one run a week (O46, weekly until production use; was daily),
    # Tuesday 05:40 Warsaw (winter), 06:40 (summer)
    - {cron: "40 4 * * 2", run: "full dataflow: landing → bronze → silver → gold → portal"}
  # Indicators the website cannot serve, skipped with a reason (counted as indicators_excluded),
  # so a known failure does not fail every run; any other failing indicator still fails the run
  # and alerts. Remove an entry to try the indicator again.
  excluded:
    - {id: 814, reason: "getAggregatesById keeps failing after retries on every daily run (runs 40108597301, 40270885956, 40451693942)", issue: "#923"}

landing: 01_landing/gus_dbw/
# Landing → Archive as Eurostat: Bronze-loaded files are moved (copy, verify, delete).
# Retention: newest version of every entity plus anything ingested in the last 90 days.
# 01_landing/gus_dbw/native/ and _control/ hold the old pipeline's files, kept (owner, 21 Oct).
archive_policy:
  move: true
  without_bronze: []
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
# Observations: one file per bulk file in Bronze and in Silver, replaced whole (design #875).
bronze: [bronze.dbw_observations, bronze.dbw_dictionary_items, bronze.dbw_rejected_files]
silver: [silver.dbw_observations]
# Gold: the curated KPI blocks are in the shared models of warehouse/warehouse.yaml (build_dbw, fact_*).
# Full coverage (O43, D35, docs/gold-coverage.md): every loaded block by rule, one file per block and table,
# written by gold.observations (warehouse/observations.py, build stage warehouse/entity/gold_gus_dbw_build.sql),
# not by dbt.
gold: [gold.gus_dbw_observations, gold.gus_dbw_series, gold.gus_dbw_measures, gold.gus_dbw_geography,
       gold.observations_rejected, gold.build_dbw, gold.src_dbw, gold.src_dbw_dictionary]
full_rebuild:   # model: {rows: ceiling} (owner policy #822)
  poc_src_dbw: {rows: 1000000}
  poc_src_dbw_dictionary: {rows: 200000}
  poc_build_dbw: {rows: 700000}  # 465,438 (Dev trial 43292078190)
legacy_tables: [bronze.dbw_dictionaries, bronze.dbw_indicators, bronze.dbw_metadata, silver.dbw_dictionaries, silver.dbw_indicators, silver.dbw_metadata, gold.dim_dbw_dictionary, gold.dim_dbw_indicator, gold.dim_dbw_metadata, gold.fact_dbw_observations]

# Refresh policy for all layers (design #875): a new file version replaces that file's entity
# in Bronze, Silver and Gold; nothing else is rewritten.
refresh: {mode: incremental, unit: file, decided: "#875"}

# gold.observations (owner decisions O36, O43; D35; #1185): the platform's weekly run keeps Gold current with
# the blocks that changed; the first load is started by hand (Pipeline run "gold: observations" of gus_dbw with
# filter * or block ids) and continued by every later run, each within its time budget, smallest blocks first.
activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune, gold.observations]
