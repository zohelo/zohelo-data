source_system: uokik_decisions
description: "Database of decisions of the President of UOKiK (decyzje.uokik.gov.pl), index of the view WWW-wszystkie: one row per decision — number, date, department, subject-area category; concentration decisions (DKK) among them"

# Extraction strategy (docs/landing.md). Register PLG-020 (decisions) and PLG-021 (concentration decisions): one
# extraction for both. No bulk file or export: the Lotus Domino database https://decyzje.uokik.gov.pl/bp/dec_prez.nsf
# answers its view WWW-wszystkie as JSON (?ReadViewEntries&OutputFormat=JSON&start=<position>&count=<n>), categorised
# by subject area, then year, then one entry per decision whose cell is an HTML fragment starting "Numer decyzji:".
# Only this host is read (robots.txt HTTP 404); uokik.gov.pl, whose robots.txt names AI crawlers, is never requested,
# and no decision PDF is downloaded. One request at a time, 1 s apart, timeouts 30 s / 180 s, at most 3 tries; a
# timeout or refusal stops the run and is reported. Each category lands as one reduced JSON document (index fields
# only: @unid, @noteid, category, year, decision number, date, department; never the parties, which can be natural
# persons), written only when its SHA-256 changed. Code: ingestion/to_landing/uokik_decisions/. Restart unit: the
# category.
extraction:
  initial: api
  production: snapshot                    # each category document is the category's complete index
  incremental_policy: changed_since_last  # every category is read on every run; written only when the SHA-256 changed
  schedule: # UTC; decisions are added to the database at irregular times, a few a week. Weekly until production use
    # (O46): Wednesday 16:40; the whole index is read on every run, so a skipped week loses nothing
    - {cron: "40 16 * * 3", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/uokik_decisions/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.uokik_decisions_index, bronze.uokik_decisions_rejected_files]
silver: [silver.uokik_decisions]
gold: [gold.uokik_decision, gold.build_uokik_decisions]
# Row ceilings (owner policy #822): about 1.5 x the rows of the Dev trial cited in the PR.
full_rebuild:
  uokik_decisions: {rows: 30000}
  uokik_decision: {rows: 30000}
  poc_build_uokik_decisions: {rows: 1000}

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded copies of a category
# Refresh policy for all layers (D32): small (the whole index is a few thousand decisions, a few new ones a week, no
# changed-since filter): every run reads the index, a changed category replaces its copy, Silver and Gold are rebuilt
# in full.
refresh: {mode: full, decided: "D32 + #3061"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
