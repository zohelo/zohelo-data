source_system: nbp
description: "Narodowy Bank Polski — exchange rate tables A/B/C and gold prices (NBP Web API)"

# Extraction strategy (docs/landing.md). NBP offers no machine bulk file for these feeds:
# the yearly CSV/XLS archives on nbp.pl are human exports. The Web API is the documented
# machine route and serves the full history (tables from 2002-01-02, gold from
# 2013-01-02) in 356 requests of at most 93 days. Entity = table × calendar quarter.
extraction:
  initial: api                          # tested route: 356 quarter requests, one at a time
  production: snapshot                  # each file is the complete quarter as published
  incremental_policy: changed_since_last  # open quarters re-fetched; unchanged bytes skipped
  schedule:                             # UTC; weekdays 13:30 Warsaw (summer), after table A/C
    - {cron: "30 11 * * 1-5", run: "landing → bronze (all steps)"}

landing: 01_landing/nbp/
# Landing → Archive: Bronze-loaded files are moved; JSON is stored zstd-compressed.
# Retention: newest version of every quarter plus 90 days (open quarters change daily).
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.nbp_observations, bronze.nbp_rejected_files]
# Legacy tables from retired code, replaced by bronze.nbp_observations and future models:
# bronze.nbp_exchange_rates_table_a/b/c, bronze.nbp_gold_prices, silver.nbp_*, gold.dim_*/fact_fx_quotes/fact_gold_prices
silver: []
gold: []

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
