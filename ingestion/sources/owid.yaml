source_system: owid
description: "Our World in Data chart data API (register CD-031): three charts of third-party data — consumption-based CO2 per capita (Global Carbon Budget), electoral democracy index (V-Dem), GDP per capita (Maddison Project Database)"

# Extraction strategy (docs/landing.md). Bulk feature: every Our World in Data chart serves its full data as
# one CSV and its metadata as one JSON at fixed URLs (chart API, https://owid-docs.readthedocs.io/projects/etl/api/
# chart-api/): https://ourworldindata.org/grapher/<slug>.csv?csvType=full&useColumnShortNames=true and
# <slug>.metadata.json. Only the three charts the register entry selects are declared (register CD-031
# modelling.notes); the other charts it names are left out (HDI and life expectancy are loaded from their
# producers, the happiness and corruption charts' origin licences do not allow free reuse). Landing keeps the exact
# bytes of each file; a copy is written only when its SHA-256 changed. The CSV's Last-Modified is the request time
# and metadata.json carries the day of the request (dateDownloaded), so version = download time; the source's own
# version is the column's lastUpdated in metadata.json (Silver owid_charts). A CSV may answer 403 "Data is
# non-redistributable" (chart API documentation): bulk_file treats a 4xx as a permanent failure and the run fails;
# such a chart is not taken another way. Whole series are revised in place, so each run replaces them.
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - entity: consumption_co2_per_capita            # Global Carbon Budget, tonnes per person
        url: https://ourworldindata.org/grapher/consumption-co2-per-capita.csv?csvType=full&useColumnShortNames=true
        format: raw
        version: ingested
      - entity: consumption_co2_per_capita_metadata
        url: https://ourworldindata.org/grapher/consumption-co2-per-capita.metadata.json
        format: json
        version: ingested
      - entity: electoral_democracy_index              # V-Dem, index 0 to 1
        url: https://ourworldindata.org/grapher/electoral-democracy-index.csv?csvType=full&useColumnShortNames=true
        format: raw
        version: ingested
      - entity: electoral_democracy_index_metadata
        url: https://ourworldindata.org/grapher/electoral-democracy-index.metadata.json
        format: json
        version: ingested
      - entity: gdp_per_capita_maddison                # Maddison Project Database, international-$ in 2011 prices
        url: https://ourworldindata.org/grapher/gdp-per-capita-maddison-project-database.csv?csvType=full&useColumnShortNames=true
        format: raw
        version: ingested
      - entity: gdp_per_capita_maddison_metadata
        url: https://ourworldindata.org/grapher/gdp-per-capita-maddison-project-database.metadata.json
        format: json
        version: ingested
  initial: bulk
  production: snapshot                    # each file is the chart's complete series
  incremental_policy: changed_since_last  # SHA-256 of the bytes
  schedule: # UTC; release: each chart once a year (Global Carbon Budget in November, V-Dem in March, Maddison irregular), revised in place; monthly check (14th, 05:40), as the register asks
    - {cron: "40 5 14 * *", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/owid/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 400}   # keep the previous version of each chart a year (revisions in place)
  prune: report
bronze: [bronze.owid_values, bronze.owid_charts, bronze.owid_rejected_files]
silver: [silver.owid_observations, silver.owid_charts]
gold: [gold.build_owid, gold.metrics_co2_consumption_per_capita, gold.metrics_electoral_democracy_index, gold.metrics_gdp_per_capita_long_run]
full_rebuild:   # model: {rows: ceiling} (owner policy #822)
  owid_observations: {rows: 90000}  # measured in the Dev trial, see the PR
  owid_charts: {rows: 20}
  poc_build_owid: {rows: 90000}
  poc_metrics_co2_consumption_per_capita: {rows: 10000}
  poc_metrics_electoral_democracy_index: {rows: 50000}
  poc_metrics_gdp_per_capita_long_run: {rows: 30000}

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded versions
# Refresh policy for all layers (D32): six files of about 1.8 MB in total (about 60,000 values), each replaced whole
# when the chart is revised, no changed-since filter; small, rebuilt in full.
refresh: {mode: full, decided: "D32 + #2982"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
