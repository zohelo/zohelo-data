source_system: gus_bdl
description: "GUS Local Data Bank (BDL) — subgroup exports (website) and API refreshes"

# Extraction strategy (docs/landing.md), owner decision 13 Oct 2026:
# entity = subgroup (P####), version = its lastUpdate (BDL API /subjects/{id}).
# No bulk feature; bulk workaround = the website's subgroup export ("CSV – tablica
# relacyjna" ZIP), one browser, one route, no IP rotation. Changed subgroups are refreshed
# whole through the API (key GUS_BDL_API_KEY), so every version is a complete snapshot
# and the newest version per subgroup wins, whichever channel it came from.
extraction:
  initial: web_export                   # September 2026 exports + missing subgroups
  production: snapshot                  # one complete subgroup per version (parts: __part-<n>)
  incremental_policy: changed_since_last  # subgroup lastUpdate vs Landing version
  schedule: null

landing: 01_landing/gus_bdl/
# Landing → Archive: Bronze-loaded files are moved. Retention: newest version of every
# subgroup plus 90 days; prune: report only until a report has been reviewed.
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.bdl_subgroup_observations, bronze.bdl_rejected_files, bronze.bdl_metadata_variables,
         bronze.bdl_metadata_units, bronze.bdl_metadata_rejected_files]
silver: [silver.bdl_observations, silver.bdl_variables, silver.bdl_units]
gold: []
# Tables of retired code still in the catalog, replaced by the tables above (globs allowed).
legacy_tables: [bronze.bdl_observations, bronze.bdl_variables, bronze.bdl_subjects, bronze.bdl_units,
                bronze.bdl_years, bronze.bdl_dictionary_entries, silver.bdl_dictionary_entries,
                silver.bdl_observation_revisions, silver.bdl_subjects, gold.dim_bdl_*, gold.fact_bdl_observations,
                gold.mart_bdl_coverage]

bronze_latest_only: true   # policy #822/#845 (Silver rule, ingestion/common/latest.keep_bdl)
activities: [landing.inspect, landing.extract, bronze.load, bronze.verify]   # landing.extract = API metadata (variables, units); website extraction and API data refresh follow
