source_system: gus_bdl
description: "GUS Local Data Bank (BDL) — subgroup exports (website) and API refreshes"

# Extraction strategy (docs/landing.md), owner decision 13 Oct 2026:
# entity = subgroup (P####), version = its lastUpdate (BDL API /subjects/{id}).
# No bulk feature; bulk workaround = the website's subgroup export ("CSV – tablica
# relacyjna" ZIP), one browser, one route, no IP rotation. Changed subgroups are refreshed
# whole through the API (key GUS_BDL_API_KEY), so every version is a complete snapshot
# and the newest version per subgroup wins, whichever channel it came from.
extraction:
  initial: web_export                   # September 2026 exports + missing subgroups
  production: snapshot                  # one complete subgroup per version (parts: __part-<n>)
  incremental_policy: changed_since_last  # subgroup lastUpdate vs Landing version
  schedule: null

landing: 01_landing/gus_bdl/
bronze: [bronze.bdl_subgroup_observations, bronze.bdl_rejected_files, bronze.bdl_observations, bronze.bdl_variables, bronze.bdl_subjects, bronze.bdl_units, bronze.bdl_years, bronze.bdl_dictionary_entries]
silver: [silver.bdl_dictionary_entries, silver.bdl_observation_revisions, silver.bdl_observations, silver.bdl_subjects, silver.bdl_units, silver.bdl_variables]
gold: [gold.dim_bdl_period, gold.dim_bdl_subject, gold.dim_bdl_unit, gold.dim_bdl_variable, gold.fact_bdl_observations, gold.mart_bdl_coverage]

activities: [landing.inspect, bronze.load]   # website extraction and API refresh follow
