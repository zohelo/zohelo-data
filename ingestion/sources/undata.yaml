      - entity: syb_325           # Expenditure on health
        url_from: {page: "https://data.un.org/Default.aspx", pattern: "/CSV/SYB[0-9]+_325_[0-9]+_[^/]*\\.csv"}
        format: raw
        version: last_modified
      - entity: syb_327           # International Migrants and Refugees
        url_from: {page: "https://data.un.org/Default.aspx", pattern: "/CSV/SYB[0-9]+_327_[0-9]+_[^/]*\\.csv"}
        format: raw
        version: last_modified
      - entity: syb_328           # Intentional homicides and other crimes
        url_from: {page: "https://data.un.org/Default.aspx", pattern: "/CSV/SYB[0-9]+_328_[0-9]+_[^/]*\\.csv"}
        format: raw
        version: last_modified
      - entity: syb_329           # Labour Force and Unemployment
        url_from: {page: "https://data.un.org/Default.aspx", pattern: "/CSV/SYB[0-9]+_329_[0-9]+_[^/]*\\.csv"}
        format: raw
        version: last_modified
  initial: bulk
  production: snapshot                  # each file is the complete table of one edition
  incremental_policy: changed_since_last  # Last-Modified / SHA-256
  schedule: # UTC; release: one Statistical Yearbook edition a year (November) with occasional table updates; monthly check (5th, 07:10)
    - {cron: "10 7 5 * *", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/undata/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.undata_syb_values, bronze.undata_rejected_files]
silver: [silver.undata_syb_values]
gold: [gold.build_undata]
full_rebuild:   # model: {rows: ceiling} (owner policy #822)
  poc_build_undata: {rows: 1600}  # 1,059: 28 areas, 6 series, the years the Yearbook prints (Dev trial 43290214779); 1.5 x

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded versions
# Refresh policy for all layers (D32): about thirty small whole-table snapshots, rebuilt in full.
refresh: {mode: full, decided: "D32 + #2784"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
