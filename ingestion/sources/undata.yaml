source_system: undata
description: "UNdata (UN Statistics Division) — UN Statistical Yearbook tables (CSV)"

# Extraction strategy (docs/landing.md). UNdata's legacy data-mart download handlers now return the "UN System
# Data Commons" page (Dev probe 43086552621), so the maintained UNdata product is used: the UN Statistical
# Yearbook (SYB) tables, one CSV per table linked from https://data.un.org/Default.aspx
# (_Docs/SYB/CSV/SYB68_<table>_202511_<title>.csv, a few MB each). The file names change with each edition, so
# each entity finds its link on that page (bulk_file url_from, pattern by table number); version = the server's
# Last-Modified when the download carries one (the Dev trial 43163356932's did not, so the download time was
# used); a copy is written only when the SHA-256 changed. Each table cites its source agency (UN
# Population Division, IMF, ILO …) per row. The UNdata SDMX service (data.un.org/ws/rest) carries other flows
# (NA_MAIN is Eurostat's, 1.2 M rows; country data without Poland) and is not used. Terms: UNdata conditions
# of use (register GL-017). Five tables have extra columns (system of trade, national currency, …: SYB 123, 130,
# 176, 317, 330) and are left out until their layout is modelled; the 27 declared tables share one layout.
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - entity: syb_1           # Population, Surface Area and Density
        url_from: {page: "https://data.un.org/Default.aspx", pattern: "/CSV/SYB[0-9]+_1_[0-9]+_[^/]*\\.csv"}
        format: raw
        version: last_modified
      - entity: syb_12           # Agricultural Index
        url_from: {page: "https://data.un.org/Default.aspx", pattern: "/CSV/SYB[0-9]+_12_[0-9]+_[^/]*\\.csv"}
        format: raw
        version: last_modified
      - entity: syb_125           # Balance of Payments
