source_system: gios_air_quality
description: "GIOŚ Portal Jakości Powietrza API v1 — stations, sensors and hourly air-quality measurements (provisional), one pass a day"

# Extraction strategy (docs/landing.md, docs/sources/gios_air_quality.md). Register PL-ENV-010. Bulk feature checked
# first: the archive page https://powietrze.gios.gov.pl/pjp/archives lists yearly ZIP files of verified measurements
# ("Wyniki pomiarów z <year> roku", /pjp/archives/downloadFile/<id>; the job log of Dev probe 43322192937 shows 2022 to
# 2025, ids 564, 582, 644); no file was downloaded, so format and size are unverified, and they hold verified values,
# a different series from the provisional API values. Not loaded in this build (left out, follow-up #3119). Current
# data: the API v1 (https://api.gios.gov.pl/pjp-api/v1/rest/; the old /pjp-api/rest/ services were withdrawn on 30 Jun
# 2025), tested from Actions (Dev probes 43320759991, 43322192937, 43343164588): station list in one page of 500 (288
# stations), sensors per station (1,875), hourly values per sensor from the last full hour to the third day back. One
# pass = 1 + 288 + 1,875 requests, one at a time, 1 s apart, about 50 minutes (stated limit 1,500 a minute; 31 s
# between pages of the station list, limited to 2 a minute; the Regulamin: API downloads "nie częściej niż dwa razy na
# godzinę"). Manual sensors (806) answer 400 and are recorded, not loaded. Own extractor
# ingestion/to_landing/gios_air_quality/.
extraction:
  initial: api
  production: snapshot                  # each pass is a complete copy of the API's three-day window
  incremental_policy: changed_since_last  # station and sensor lists by SHA-256; one measurement pass per UTC day
  schedule: # UTC; hourly values, the API keeps three days: the daily Landing pass stays (each pass is its own
    # entity, so every pass is loaded later), 02:40 UTC (03:40 CET / 04:40 CEST) when the previous local
    # day is complete; Bronze, Silver once a week (O46, weekly until production use; was the daily full run)
    - {cron: "40 2 * * *", run: "landing: extract"}
    - {cron: "10 3 * * 6", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/gios_air_quality/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}   # every pass is its own entity (one version), so every pass is kept
  prune: report
bronze: [bronze.gios_air_stations, bronze.gios_air_sensors, bronze.gios_air_measurements, bronze.gios_air_quality_rejected_files]
silver: [silver.gios_air_stations, silver.gios_air_sensors, silver.gios_air_hourly]
gold: [gold.build_gios_air_quality]
full_rebuild:   # model: {rows: ceiling} (owner policy #822)
  gios_air_stations: {rows: 450}  # 288 operating stations (Dev probes 43322192937, 43343164588)
  gios_air_sensors: {rows: 2850}  # 1,875 sensors of the 288 stations (Dev probe 43343164588)
  # 17 areas × 5 pollutants = 85 rows a day, growing with every pass (the trial holds a few days): the ceiling is
  # 1.5 × one year (31,025 rows), so the warning comes after about 18 months and the build fails after three years,
  # well before 1 M rows (D28); by then the block is made incremental.
  poc_build_gios_air_quality: {rows: 47000}

bronze_latest_only: true   # policy #822/#845: superseded station and sensor lists are removed; a pass has one version
# Refresh policy for all layers (D32): hourly values grow by about 26,000 rows a day, so Silver measurements are an
# entity table with one file per measurement day (ingestion/to_bronze/gios_air_quality/entities.py); Bronze adds one
# file per pass; the station and sensor lists are small and rebuilt in full (dbt).
refresh: {mode: incremental, unit: "pass (Bronze), measurement day (Silver)", decided: "D32 + #2960"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
