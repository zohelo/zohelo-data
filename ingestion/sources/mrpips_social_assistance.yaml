source_system: mrpips_social_assistance
description: "MRPiPS — social assistance statistics, annual MRPiPS-03 report (benefits granted, families and persons by voivodeship)"

# Extraction strategy (docs/landing.md). Register PLS-031. Bulk feature: gov.pl publishes, per year, a page
# "Statystyka za rok <year>" (https://www.gov.pl/web/rodzina/statystyki-pomocy-spolecznej, years 1999-2025) with the
# MRPiPS-03, -05 and -06 reports as old Excel (.xls) attachments (Dev probes 43269548145, 43270285788, 43288193321 on
# test/w3-gus-probe). Only MRPiPS-03 is landed (sections DZIAŁ 1A-4 with a sheet per section by voivodeship and one
# for Poland); a "korekta" attachment replaces the original. Entity = one year (mrpips03_<year>), version = download
# time (no Last-Modified); landed attachment URLs are not downloaded again (ingestion/to_landing/mrpips_social_assistance/).
# Restart unit: one file. Bronze reads .xls with xlrd (requirements.txt).
extraction:
  initial: bulk
  production: snapshot                  # each report is the year as published; a correction replaces it
  incremental_policy: changed_since_last  # new attachment URL
  schedule: # UTC; the year's report appears in the spring of the following year; monthly check
    - {cron: "35 6 6 * *", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/mrpips_social_assistance/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.mrpips_social_assistance_cells, bronze.mrpips_social_assistance_rejected_files]
silver: [silver.mrpips_social_assistance_tables]
gold: [gold.build_mrpips_social_assistance]

bronze_latest_only: true   # policy #822/#845
# Refresh policy for all layers (D32): one workbook of a few thousand cells a year; small, rebuilt in full.
refresh: {mode: full, decided: "D32 + #2481"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
