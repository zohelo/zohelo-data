source_system: world_bank_findex
description: World Bank Global Findex Database — country-level indicators (CSV)

# Extraction strategy (docs/landing.md). Bulk feature: the country-level Global Findex database is
# one CSV file per edition, linked from the publication's stable "download data" page; the file URL
# changes per edition (GlobalFindexDatabase<year>.csv), so it is found on that page (url_from).
# Only the country-level indicators are CC BY 4.0 (register GL-009); the individual-level microdata
# (Research Data License, no redistribution) is out of scope. Version = Last-Modified; written only
# when the SHA-256 changed. Editions come every three to four years.
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - entity: findex_country
        url_from:
          page: https://www.worldbank.org/en/publication/globalfindex/download-data
          pattern: 'GlobalFindexDatabase[0-9]{4}\.csv$'
          pick: first
        format: raw
        version: last_modified     # the response's Last-Modified; download time when absent
  initial: bulk
  production: snapshot                  # each file is the complete edition (with earlier waves)
  incremental_policy: changed_since_last  # Last-Modified / SHA-256
  schedule: # UTC; release: a new edition every three to four years (2025 edition, file of 22 Jun 2026); weekly check (Thursday 02:20), unchanged bytes are skipped
    - {cron: "20 2 * * 4", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/world_bank_findex/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.findex_observations, bronze.findex_rejected_files]
silver: [silver.findex_observations]
gold: []

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded versions
# Refresh policy for all layers (D32, small source: full in every layer): one CSV of ~18 MB; rebuilt in full when a new edition lands.
refresh: {mode: full, decided: "D32 + #2736"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
