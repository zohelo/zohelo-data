source_system: dane_gov_pl
description: "dane.gov.pl open-data catalogue (Chancellery of the Prime Minister) as harvested by data.europa.eu: dataset and distribution metadata"

# Extraction strategy (docs/landing.md, docs/sources/dane_gov_pl.md). Register PLG-030, #3263. dane.gov.pl itself
# (dane.gov.pl, api.dane.gov.pl) does not accept a TCP connection from GitHub runners (Dev runs 43282997907,
# 43288930412, 43831903004); the official EU republisher data.europa.eu harvests its catalogue as `dane-gov-pl` and
# serves it through the public search API (no key, no published limit). No bulk file: every page of the catalogue is
# read, one request at a time with a pause, and each dataset record is reduced before Landing to an allowlist of
# catalogue fields (ingestion/to_landing/dane_gov_pl/); descriptions and the publisher's contact are dropped in memory.
# Entity = the catalogue (one JSON-lines file sorted by dataset id), version = download time (the API gives no version
# of the harvest); an unchanged catalogue (same SHA-256) is not landed again. Distributions are metadata only: their
# files (api.dane.gov.pl) are never downloaded. PROBE_PLACEHOLDER
extraction:
  initial: api
  production: snapshot                    # each file is the complete current catalogue
  incremental_policy: changed_since_last  # SHA-256 of the reduced records; the API has no changed-since filter
  schedule: # UTC; data.europa.eu harvests dane.gov.pl on its own, unpublished schedule (harvest lag measured in the
    # trial, docs/sources/dane_gov_pl.md); one run a week, Wednesday 15:25 (O46), in Silver for the Sunday platform build
    - {cron: "25 15 * * 3", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/dane_gov_pl/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.dane_gov_pl_datasets, bronze.dane_gov_pl_distributions, bronze.dane_gov_pl_rejected_files]
silver: [silver.dane_gov_pl_datasets, silver.dane_gov_pl_distributions]
gold: [gold.open_data_datasets_pl, gold.open_data_distributions_pl, gold.build_dane_gov_pl, gold.metrics_open_data_datasets_modified, gold.metrics_open_data_distributions_modified]
full_rebuild:   # model: {rows: ceiling} (owner policy #822); CEILINGS_PLACEHOLDER
  dane_gov_pl_datasets: {rows: 15000}
  dane_gov_pl_distributions: {rows: 90000}
  open_data_datasets_pl: {rows: 15000}
  open_data_distributions_pl: {rows: 90000}
  poc_build_dane_gov_pl: {rows: 60000}
  poc_metrics_open_data_datasets_modified: {rows: 300}
  poc_metrics_open_data_distributions_modified: {rows: 300}

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded versions
# Refresh policy for all layers (D32): one catalogue of about 10,000 datasets, read whole in about 100 requests, no
# changed-since filter; a changed catalogue replaces the file, Silver and Gold are rebuilt in full.
refresh: {mode: full, decided: "D32 + #3263"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
