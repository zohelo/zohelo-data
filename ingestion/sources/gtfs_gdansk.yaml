source_system: gtfs_gdansk
description: "ZTM Gdańsk static GTFS timetable (TRISTAR open data): stops, routes and scheduled trips per service day"

# Extraction strategy (docs/landing.md). Register PL-ENV-029, city GTFS family with gtfs_poznan, gtfs_krakow and
# gtfs_wroclaw (shared code ingestion/common/gtfs.py, docs/sources/gtfs_gdansk.md). Bulk feature: one fixed download
# URL of the CKAN dataset "tristar" (robots.txt: Crawl-delay 10, /api/ disallowed, so the CKAN API is never called).
# The feed covers the next 14 days and the source keeps no archive, so every changed download is kept: entity =
# feed + validity window (gtfs_<first>_<last> service date), version = Last-Modified; an unchanged file is skipped
# by its SHA-256. Restart unit: one download. GTFS-Realtime is out of scope.
extraction:
  kind: bulk_file   # declares the feed URL; the landing activities are ingestion/to_landing/gtfs_gdansk/ (window entities)
  bulk_file:
    files:
      - entity: gtfs
        url: https://ckan.multimediagdansk.pl/dataset/c24aa637-3619-4dc2-a171-a23eec8f2172/resource/30e783e4-2bec-4a7d-bb22-ee3e3b26ca96/download/gtfsgoogle.zip
        format: zip
        version: last_modified
  initial: bulk
  production: snapshot                  # each file is the whole timetable of its window
  incremental_policy: changed_since_last  # SHA-256 of the download
  schedule: # UTC; the file is rebuilt every night (Last-Modified about 02:00) and covers 14 days: a weekly copy (register) leaves a 7-day overlap, so one failed run loses no service day; every copy is new bytes (about 25 MB in the Archive), so not more often
    - {cron: "15 3 * * 1", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/gtfs_gdansk/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}   # every window is its own entity: its newest copy is kept
  prune: report
bronze: [bronze.gtfs_gdansk_records, bronze.gtfs_gdansk_rejected_files]
silver: [silver.gtfs_gdansk_stops, silver.gtfs_gdansk_routes, silver.gtfs_gdansk_service_days]
gold: [gold.build_gtfs_gdansk, gold.transit_stops_gtfs_gdansk, gold.transit_routes_gtfs_gdansk]
full_rebuild:   # model: {rows: ceiling} (owner policy #822); TRIAL counts filled from the Dev trial
  gtfs_gdansk_stops: {rows: 2500}
  gtfs_gdansk_routes: {rows: 150}
  gtfs_gdansk_service_days: {rows: 3000}
  poc_build_gtfs_gdansk: {rows: 4000}
  transit_stops_gtfs_gdansk: {rows: 2500}
  transit_routes_gtfs_gdansk: {rows: 150}

bronze_latest_only: true   # policy #822/#845: per window entity; earlier windows stay, they are other entities
# Refresh policy for all layers (D32): one ZIP of about 25 MB a week; Bronze keeps one file per window (about
# 200,000 rows, stop_times as one row per trip) and Silver is rebuilt in full from them.
refresh: {mode: full, decided: "D32 + #2977"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
