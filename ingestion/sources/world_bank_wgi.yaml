source_system: world_bank_wgi
description: World Bank Worldwide Governance Indicators — DataBank bulk CSV archive (data + metadata)

# Extraction strategy (docs/landing.md). Bulk feature: the WGI CSV ZIP on DataBank's stable bulk
# download URL (the same route as WDI_CSV; CC BY 4.0, register GL-008). Version = Last-Modified;
# written only when the SHA-256 changed. WGI is revised once a year; a schedule (stage 4) comes
# after the Dev trial (#2381).
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - entity: WGI_CSV
        url: https://databank.worldbank.org/data/download/WGI_CSV.zip
        format: zip
        version: last_modified     # the response's Last-Modified; download time when absent
  initial: bulk
  production: snapshot                  # each archive is the complete database
  incremental_policy: changed_since_last  # Last-Modified / SHA-256
  schedule: []

landing: 01_landing/world_bank_wgi/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: []
silver: []
gold: []

refresh: {mode: full}

activities: [landing.inspect, landing.extract, landing.verify]
