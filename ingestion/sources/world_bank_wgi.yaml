source_system: world_bank_wgi
description: World Bank Worldwide Governance Indicators — DataBank bulk CSV archive (data + metadata)

# Extraction strategy (docs/landing.md). Bulk feature: the WGI CSV ZIP on DataBank's stable bulk
# download URL (the same route as WDI_CSV; CC BY 4.0, register GL-008). Version = Last-Modified;
# written only when the SHA-256 changed. WGI is revised once a year.
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - entity: WGI_CSV
        url: https://databank.worldbank.org/data/download/WGI_CSV.zip
        format: zip
        version: last_modified     # the response's Last-Modified; download time when absent
  initial: bulk
  production: snapshot                  # each archive is the complete database
  incremental_policy: changed_since_last  # Last-Modified / SHA-256
  schedule: # UTC; release: WGI is revised once a year (last: 25 Sep 2026); weekly check (Thursday 01:20), unchanged bytes are skipped
    - {cron: "20 1 * * 4", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/world_bank_wgi/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.wgi_observations, bronze.wgi_metadata, bronze.wgi_rejected_files]
silver: [silver.wgi_observations, silver.wgi_indicators]
gold: []

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded versions
# Refresh policy for all layers (owner decision #875): one archive of ~3 MB (~150,000 observations); rebuilt in full when a new archive lands.
refresh: {mode: full, decided: "#875"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
