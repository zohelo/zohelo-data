source_system: barometr_zawodow
description: "Barometr Zawodów (MRPiPS, coordinated by WUP Kraków) — annual expert forecast of occupational shortage and surplus: national report and national poster PDFs"

# Extraction strategy (docs/landing.md). Register PLS-030 (Epic #454). No bulk file, API or table download: the
# portal's tables and maps load their data by script (register research). Each forecast year has a fixed national
# publication page, https://barometrzawodow.pl/modul/publikacje?publication=national&year=<year> (robots.txt allows
# all), linking the national report "raport_ogolnopolski_<year>.pdf" (48-80 pages, 3.0-10.8 MB) and the national
# poster "BAROMETR_ZAWODOW_ogolnopolski_<year>.pdf" (1-2 pages, 0.13-0.27 MB); the directory /forecast-card-zip/
# answers 403, so files are read only by the page's own links. Dev probe 45896169831 (26 Nov 2026,
# test/454-barometr-zawodow): the pages for 2016-2026 link both files, the page for 2027 none yet. Entity = file kind
# and forecast year (raport_<year>, plakat_<year>), version = Last-Modified, written only when the SHA-256 changed.
# Restart unit: one file. The two newest years are downloaded again (open: 2, a corrected file lands as a new
# version), older years only while missing; the next year's page is read as optional (the edition for year N is
# published in December or January of N-1/N; ingestion/to_landing/barometr_zawodow/). One request at a time, 3 s
# apart. What is read: the poster pages (Polska from the national poster, the 16 voivodeships from the posters
# printed in the report), each occupation with its forecast category (ingestion/to_bronze/barometr_zawodow/).
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - {entity: raport, years: {from: 2016, open: 2}, url_from: {page: "https://barometrzawodow.pl/modul/publikacje?publication=national&year={year}", pattern: "/forecast-card-zip/{year}/report_pl/raport_ogolnopolski_{year}\\.pdf$"}, format: raw}
      - {entity: plakat, years: {from: 2016, open: 2}, url_from: {page: "https://barometrzawodow.pl/modul/publikacje?publication=national&year={year}", pattern: "/forecast-card-zip/{year}/poster_pl/BAROMETR_ZAWODOW_ogolnopolski_{year}\\.pdf$"}, format: raw}
  initial: bulk
  production: snapshot                    # each file is its forecast year's edition as published
  incremental_policy: changed_since_last  # SHA-256 of the two newest years' files; missing years
  # UTC; one edition a year, published in December or January (the 2026 edition: survey in Q3/Q4 2025). Monthly on
  # the 13th, 05:50 (O46: at most one run a week past Landing; a free slot), so a new edition is in Silver within a
  # month of its publication.
  schedule:
    - {cron: "50 5 13 * *", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/barometr_zawodow/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.barometr_zawodow_occupations, bronze.barometr_zawodow_rejected_files]
silver: [silver.barometr_zawodow_forecasts]
gold: [gold.build_barometr_zawodow]
full_rebuild:   # model: {rows: ceiling} (owner policy #822)
  barometr_zawodow_forecasts: {rows: 60000}  # measured in the Dev trial
  poc_build_barometr_zawodow: {rows: 1000}  # measured in the Dev trial
  poc_metrics_occupations_deficit_forecast: {rows: 300}  # measured in the Dev trial

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded versions of a file
# Refresh policy for all layers (D32): 22 PDFs (about 70 MB), one edition a year, some 35,000 Bronze rows; small,
# rebuilt in full.
refresh: {mode: full, decided: "D32 + #454"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
