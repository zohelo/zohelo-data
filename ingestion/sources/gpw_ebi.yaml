source_system: gpw_ebi
description: "GPW report list, EBI rows (reports of NewConnect and Catalyst issuers): one row per report — time, category, number, issuer with ISIN, report id, link"

# Extraction strategy (docs/landing.md). No bulk feature, API or feed for EBI reports (https://www.gpw.pl/ebi answers
# 403 to automated clients and is not used). Route (decision D38): the public list https://www.gpw.pl/espi-ebi-reports
# through the page's own "Show more" request (the form posted to https://www.gpw.pl/ajaxindex.php, only "EBI"
# ticked, 15 rows a request, newest first; robots.txt allows it), one request at a time 5 s apart, the platform's
# User-Agent, bounded retries; a 4xx stops the run. Never a report page or attachment. ESPI rows of the same list
# are CD-006 (knf_espi) and are not asked for. Each day with reports lands as one reduced JSON document (time,
# category, number, issuer, ISIN, report id, link; no title: titles can name natural persons; no prices); written
# only when its SHA-256 changed. Code: ingestion/to_landing/gpw_ebi/ on ingestion/common/report_lists.py. Proven
# from Actions by the Dev probes 43321077523 and 43326025983 (list back to 2011 and earlier, about 10 EBI reports a
# month in 2026) and the Dev trial cited in the PR. History kept: 1 January of the previous year onwards.
extraction:
  initial: web
  production: delta                       # one document per day of publication; days accumulate
  incremental_policy: changed_since_last  # each run reads from the newest held day (or 3 days back); SHA-256
  schedule: # UTC; EBI reports arrive on working days until late evening (Warsaw); daily at 04:55
    - {cron: "55 4 * * *", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/gpw_ebi/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 30}
  prune: report
bronze: [bronze.gpw_ebi_reports, bronze.gpw_ebi_rejected_files]
silver: [silver.gpw_ebi_reports]
gold: [gold.build_gpw_ebi, gold.filing_gpw_ebi]
# Row ceilings (owner policy #822; above: a warning, above twice: the build fails), 1.5 × Dev trial 43831909084, which
# read the production history (1 January 2025 to 10 November 2026): 407 reports, 51 build rows (21 complete months).
# Growth about 250 reports and 30 build rows a year: raise the ceilings when the build warns.
full_rebuild:
  gpw_ebi_reports: {rows: 620}
  filing_gpw_ebi: {rows: 620}     # one row per Silver report
  poc_build_gpw_ebi: {rows: 80}

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded copies of a day
# Refresh policy for all layers (D32): small (a few hundred reports a year); Landing reads only the newest days,
# Bronze appends a changed day, Silver and Gold are rebuilt in full.
refresh: {mode: full, decided: "D32 + #1488"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
