source_system: nfz_services
description: "NFZ statistics API, services (API Statystyki NFZ – Świadczenia, JGP): benefit dictionaries of the five catalogs and, per benefit and year, the basic-data table for Poland and the 16 NFZ regional branches"

# Extraction strategy (docs/landing.md). Register PLS-012. Bulk feature: none (the API and the statystyki.nfz.gov.pl
# site serve one table per request). Route: the API https://api.nfz.gov.pl/app-stat-api-jgp/ (version 1.1), tested
# for a full load by the read-only Dev probes 43305368183, 43311426786 and 43312094156: 1,347 benefits (catalogs
# 1a 883, 1b 134, 1c 273, 1d 43, 1w 14), years 2009-2024, one basic-data ("general-data") table per benefit and
# year, plus part-year tables where a benefit changed within a year. robots.txt: 404 (none); terms: 10 requests per
# second per IP (we make one request at a time with a 0.7 s pause). Own extractor ingestion/to_landing/nfz_services/.
# Scope decided for #2929: entity = one benefit (catalog + dictionary entry) = its index answer and every page of
# each basic-data table for Poland (branch=false) and by NFZ branch (branch=true), landed as one ZIP of the exact
# answers; and the dictionary of each catalog (benefits_<catalog>). Not loaded: the hospital-type splits and the
# other table types (sex, age, admission and discharge type, healthcare services, product categories, histograms,
# ICD-9, ICD-10). Version: the API gives no update date (meta.date-modified is the request time), so a copy is
# written only when the digest of its answers' data members differs from the newest copy; version = download time.
# Initial load: about 1,347 index requests + 2 × ~11,000 benefit-years ≈ 23,500 requests at about 1.2 s each
# ≈ 8 hours, so two to three weekly runs (330-minute budget each; missing benefits first, resumable).
extraction:
  initial: api
  production: snapshot                  # each ZIP is the complete set of answers of one benefit
  incremental_policy: changed_since_last  # data digest per benefit; canary + weekly quarter of the benefits asked
  schedule: # UTC; release: NFZ adds a year of JGP statistics about once a year (2024 is the newest year on
    # 12 Nov 2026), date not announced; weekly check (Sunday 02:40): 56 dictionary pages, 6 canary indexes and a
    # quarter of the other benefits' indexes (~400 requests); a changed canary index means a release and every
    # benefit is asked in that run
    - {cron: "40 2 * * 0", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/nfz_services/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.nfz_services_benefits, bronze.nfz_services_basic_data, bronze.nfz_services_rejected_files]
silver: [silver.nfz_services_benefits, silver.nfz_services_basic_data]
gold: [gold.build_nfz_services]
full_rebuild:   # model: {rows: ceiling} (owner policy #822)
  nfz_services_benefits: {rows: 2100}  # 1,347 dictionary entries (Dev probe 43311426786)
  nfz_services_basic_data: {rows: 300000}  # placeholder until the trial
  poc_build_nfz_services: {rows: 60000}  # placeholder until the trial

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded versions
# Refresh policy for all layers (D32 + #2929): about 1,350 small ZIPs (one per benefit) and under 200,000 Silver
# rows; a changed benefit replaces its one Bronze file, and Silver and the Gold build stage are rebuilt in full
# from Bronze (a few seconds of DuckDB). Landing alone is incremental (changed benefits only).
refresh: {mode: full, decided: "D32 + #2929"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
