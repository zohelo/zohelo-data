source_system: world_bank_wdi
description: World Bank World Development Indicators — bulk CSV archive (data + metadata)

# Extraction strategy (docs/landing.md). Bulk feature: the WDI CSV ZIP on the publisher's
# stable URL (~270 MB, CC BY 4.0). Version = Last-Modified; written only when the SHA-256
# changed. The legacy Landing objects (one content-addressed bulk ZIP + 3,518 API
# responses) stay until the new Bronze is verified, then retire with the legacy tables.
extraction:
  initial: bulk
  production: snapshot                  # each archive is the complete database
  incremental_policy: changed_since_last  # Last-Modified / SHA-256
  schedule:                             # UTC; weekly check, unchanged bytes are skipped
    - {cron: "20 3 * * 2", run: "landing → bronze (all steps)"}

landing: 01_landing/world_bank_wdi/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.wdi_bulk_observations, bronze.wdi_bulk_metadata, bronze.wdi_rejected_files]
# Legacy tables from retired code: bronze.wdi_data/country/series/country_series/footnote/series_time,
# silver.wdi_*, gold.*wdi* — replaced by the tables above and the models built on them.
silver: []
gold: []

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
