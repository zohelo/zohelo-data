source_system: world_bank_wdi
description: World Bank World Development Indicators — bulk CSV archive (data + metadata)

# Extraction strategy (docs/landing.md). Bulk feature: the WDI CSV ZIP on the publisher's
# stable URL (~270 MB, CC BY 4.0). Version = Last-Modified; written only when the SHA-256
# changed. The legacy Landing objects (one content-addressed bulk ZIP + 3,518 API
# responses) stay until the new Bronze is verified, then retire with the legacy tables.
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - entity: WDI_CSV
        url: https://databank.worldbank.org/data/download/WDI_CSV.zip
        format: zip
        version: last_modified     # the response's Last-Modified; download time when absent
  initial: bulk
  production: snapshot                  # each archive is the complete database
  incremental_policy: changed_since_last  # Last-Modified / SHA-256
  schedule: # UTC; release: WDI is updated a few times a year on no fixed date; weekly check (Tuesday 03:20), unchanged bytes are skipped
    - {cron: "20 3 * * 2", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/world_bank_wdi/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: delete   # report reviewed 2026-10-28, run https://github.com/zohelo/zohelo-data/actions/runs/40446148186/job/122000035035
bronze: [bronze.wdi_bulk_observations, bronze.wdi_bulk_metadata, bronze.wdi_rejected_files]
silver: [silver.wdi_observations, silver.wdi_countries, silver.wdi_indicators]
# Gold: the curated KPI selection is in the shared models of warehouse/warehouse.yaml (build_wdi, fact_annual).
# Full coverage (O43, D35, docs/gold-coverage.md): every indicator and economy by rule, written by
# gold.observations (warehouse/observations.py), not by dbt; the block is the Silver table wdi_observations.
gold: [gold.world_bank_wdi_observations, gold.world_bank_wdi_series, gold.world_bank_wdi_measures,
       gold.world_bank_wdi_geography, gold.observations_rejected]
# Tables of retired code still in the catalog, replaced by the tables above (globs allowed).
legacy_tables: [bronze.wdi_data, bronze.wdi_country, bronze.wdi_series, bronze.wdi_country_series,
                bronze.wdi_footnote, bronze.wdi_series_time, gold.*wdi*]

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded versions
# Refresh policy for all layers (owner decision #875): one archive file, ~9M rows, rebuilt in full
# in under a minute when a new archive lands (weekly).
refresh: {mode: full, decided: "#875"}

# gold.observations (owner decisions O36, O43; D35; #2998): the last step of the full dataflow keeps the
# per-block Gold tables current with the Silver tables dbt rebuilt; the first load is started by hand
# (Pipeline run "gold: observations" with filter *) and continued by every later run.
activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune,
             gold.observations]
