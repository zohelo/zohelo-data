source_system: kprm_work_list
description: "Work list of the Council of Ministers (Wykaz prac legislacyjnych i programowych Rady Ministrów, gov.pl/web/premier): government drafts, CSV"

# Extraction strategy (docs/landing.md). Register PLG-034 (#491). Bulk feature: the Chancellery of the Prime Minister
# (KPRM) publishes the whole work list of the Council of Ministers as one CSV ("Pobierz dane do pliku csv") on the
# stable page https://www.gov.pl/web/premier/wplip-rm; the link (https://www.gov.pl/register-file/Rejestr_<n>.csv) is
# read from the page at run time (url_from), because the register does not say it is stable. robots.txt of www.gov.pl:
# "User-Agent: * Allow: /". One file, about 11 MB (UTF-8, no BOM since mid-November 2026, ';' separated, 19 columns,
# one row per draft since 21 December 2023); the server sends no Last-Modified or ETag, so version = download time and
# an unchanged file (same SHA-256) is skipped. Restart unit: the file. Not used: the RPL hosts legislacja.rcl.gov.pl and legislacja.gov.pl
# (timeouts from GitHub runners, robots.txt unread), the Prime Minister's own list (Rejestr_20874196.csv) and the
# archive of earlier terms (HTML pages without a file). Dev trial 45757552453 (26 Nov 2026): 11,503,160 bytes, 1,551 drafts
# published 2023-12-21 to 2026-11-24, second Landing and Bronze passes wrote nothing.
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - entity: work_list
        url_from:
          page: https://www.gov.pl/web/premier/wplip-rm
          pattern: /register-file/Rejestr_[0-9]+\.csv$
        format: raw
        version: last_modified     # none sent: download time
  initial: bulk
  production: snapshot                  # each file is the complete work list
  incremental_policy: changed_since_last  # SHA-256
  schedule: # UTC; rows are added and changed any weekday as drafts enter the list or change status (the Council of
    # Ministers usually sits on Tuesdays); one run a week, Friday 19:20, after the week's entries (O46, weekly until
    # production use; the file holds the whole list, so a skipped week loses nothing)
    - {cron: "20 19 * * 5", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/kprm_work_list/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.kprm_work_list_drafts, bronze.kprm_work_list_rejected_files]
silver: [silver.kprm_work_list_drafts]
gold: [gold.government_drafts, gold.build_kprm_work_list, gold.metrics_government_drafts_published]
# Ceilings about 1.5 x the rows of Dev trial 45757552453; the list grows by about 600 drafts a year, so Silver and the
# entity table reach theirs in about 18 months (spring 2028): measure again then and raise them (D32: still small).
full_rebuild:   # model: {rows: ceiling} (owner policy #822)
  kprm_work_list_drafts: {rows: 2400}  # 1,551 measured
  government_drafts: {rows: 2400}  # 1,551 measured
  poc_build_kprm_work_list: {rows: 1450}  # 944 measured (8 measures, 36 months, 4 years)
  poc_metrics_government_drafts_published: {rows: 55}  # 36 measured (Dec 2023 to Nov 2026, Poland)

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded versions
# Refresh policy for all layers (D32): one file of about 1,500 drafts (a few hundred new ones a year), no changed-since
# filter; a new copy replaces the file and Silver and Gold are rebuilt in full.
refresh: {mode: full, decided: "D32 + #2972"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
