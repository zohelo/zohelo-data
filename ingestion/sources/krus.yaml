source_system: krus
description: KRUS basic benefit statistics — the XLSX series of pensions and benefits paid, quarterly since 2020 (gov.pl)

# Extraction strategy (docs/landing.md). Bulk feature: KRUS publishes its basic beneficiary
# statistics as one XLSX (about 20 kB) on a stable gov.pl page; the attachment URL changes with each
# update, so the link is found on the page (url_from; Dev probes #2468: one attachment, XLSX). The
# file is a rolling series, not one quarter (Dev trial #2468: sheet `Świadczenia`, A1:U62, quarterly
# columns from I quarter 2020 plus yearly totals; average monthly beneficiaries and average monthly
# benefit in PLN by benefit type). Entity = the file. The server sent no Last-Modified in the trial,
# so the version is the download time and a file is written only when its SHA-256 changed; each
# version is the whole series to date (snapshot). Restart unit: the file.
# `prune` stays `report`: if KRUS shortens the window, older versions hold quarters the newest file
# drops. The quarterly statistical information PDFs (51 tables) have no stable listing page and are
# not declared. gov.pl terms: official materials free to use (register PLS-011). A schedule
# (stage 4) comes after the Dev trial.
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - entity: swiadczenia_kwartalne
        url_from:
          page: https://www.gov.pl/web/krus/podstawowe-dane-statystyczne-z-zakresu-swiadczeniobiorcow
          pattern: /attachment/[0-9a-f-]{36}$
          pick: first
        format: raw                # XLSX, kept as exact bytes
        version: last_modified
  initial: bulk
  production: snapshot                  # each file is the whole series since 2020
  incremental_policy: changed_since_last  # SHA-256 (no Last-Modified from the server)
  schedule: []

landing: 01_landing/krus/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report   # older versions may hold quarters a later file drops
bronze: []
silver: []
gold: []

refresh: {mode: full}

activities: [landing.inspect, landing.extract, landing.verify]
