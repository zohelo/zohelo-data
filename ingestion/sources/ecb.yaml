source_system: ecb
description: ECB Data Portal — selected dataflows as SDMX CSV (exchange rates, key rates, €STR, HICP, long-term rates, monetary aggregates)

# Extraction strategy (docs/landing.md). The ECB Data Portal has no bulk archive per dataflow; its
# SDMX REST API returns a whole selection in one response, so each entity is one fixed API query
# (format=csvdata, every series of the selection, full history) landed through the shared
# bulk_file pattern: one request per entity and run, written only when the SHA-256 changed.
# Re-use under the ECB statistics usage policy (register GL-016): free, also commercial, with
# "Source: ECB statistics", statistics not modified. The first four queries are proven from Actions by
# the Dev trial (#2393); HICP, IRS and BSI by the Dev probes 43084514363 and 43085490807 (11 Nov 2026). The
# ICP dataflow was discontinued on 4 Feb 2026 (last period 2025-12) and replaced by HICP (COICOP 2018); the
# frozen ICP selection stays as the history of the old method.
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - entity: exr_daily        # euro foreign exchange reference rates, every currency, daily
        url: "https://data-api.ecb.europa.eu/service/data/EXR/D..EUR.SP00.A?format=csvdata"
        format: raw
        version: last_modified     # the response's Last-Modified; download time when absent
      - entity: fm_key_rates     # key ECB interest rates (MRO, deposit facility, marginal lending)
        url: "https://data-api.ecb.europa.eu/service/data/FM/B.U2.EUR.4F.KR..LEV?format=csvdata"
        format: raw
        version: last_modified
      - entity: est_estr         # euro short-term rate (€STR), volume-weighted trimmed mean
        url: "https://data-api.ecb.europa.eu/service/data/EST/B.EU000A2X2A25.WT?format=csvdata"
        format: raw
        version: last_modified
      - entity: icp_annual_rate  # HICP all items, annual rate of change, every area, monthly
        url: "https://data-api.ecb.europa.eu/service/data/ICP/M..N.000000.4.ANR?format=csvdata"
        format: raw
        version: last_modified
      - entity: hicp_annual_rate  # HICP (COICOP 2018) total, annual rate of change, every area, monthly
        url: "https://data-api.ecb.europa.eu/service/data/HICP/M..N.000000.4D0.ANR?format=csvdata"
        format: raw
        version: last_modified
      - entity: irs_long_term    # long-term interest rates for convergence purposes (10-year bonds), EU members
        url: "https://data-api.ecb.europa.eu/service/data/IRS/M..L.L40.CI.0000..N.Z?format=csvdata"
        format: raw
        version: last_modified
      - entity: bsi_monetary_aggregates  # euro area M1, M2, M3: stocks, index, annual growth rate (s.a.)
        url: "https://data-api.ecb.europa.eu/service/data/BSI/M.U2.Y.V.M10+M20+M30.X.1+I.U2.2300.Z01.E+A?format=csvdata"
        format: raw
        version: last_modified
  initial: bulk
  production: snapshot                  # each response is the complete history of its selection
  incremental_policy: changed_since_last  # Last-Modified / SHA-256
  schedule: # UTC; EXR daily, HICP/IRS/BSI monthly, key rates at Council meetings; weekly (Thursday 05:40), unchanged bytes skipped
    - {cron: "40 5 * * 4", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/ecb/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.ecb_observations, bronze.ecb_rejected_files]
silver: [silver.ecb_observations]
gold: []

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded versions
# Refresh policy for all layers (D32): seven selections, about 300,000 rows in all; rebuilt in full.
refresh: {mode: full, decided: "D32 + #2744"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
