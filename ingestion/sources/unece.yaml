source_system: unece
description: "UNECE Statistical Database — economic statistics (PXWeb tables: national accounts, labour, prices, industry, trade)"

# Extraction strategy (docs/landing.md). No bulk feature: the UNECE Statistical Database (PXWeb 2015) does not
# serve its PX files (404/403) and its PXWeb API v1 (https://w3.unece.org/PXWeb2015/api/v1/en/STAT) answers
# data only to POST queries, so a small extractor (ingestion/to_landing/unece/) replaces the bulk_file pattern:
# entity = one table of the economic statistics folder 20-ME (discovered from the API's folder listing),
# queried whole as JSON-stat 2.0 (a table above the API cell limit, HTTP 403, per value of its first variable as
# entities <table>_p<n>); version = the table's "updated" time; unchanged bytes are not written again. The API
# answers bursts with 429, so one request at a time with a 4 s pause. Terms: UNECE Statistical Database
# copyright notice (register GL-038). Proven from Actions by the Dev probes 43093129692 and 43094350928.
extraction:
  initial: api
  production: snapshot                  # each file is the complete table
  incremental_policy: changed_since_last  # table updated time / SHA-256
  schedule: # UTC; release: tables are revised irregularly (the API stamps every table daily); weekly check (Monday 04:50), unchanged bytes skipped
    - {cron: "50 4 * * 1", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/unece/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.unece_observations, bronze.unece_codes, bronze.unece_rejected_files]
silver: [silver.unece_observations]
gold: []

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded versions
# Refresh policy for all layers (D32): about forty small whole-table snapshots, rebuilt in full.
refresh: {mode: full, decided: "D32 + #TASK"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
