source_system: gus_culture
description: "GUS — Kultura i dziedzictwo narodowe (culture and national heritage), annual publication tables"

# Extraction strategy (docs/landing.md). Register PLS-027. Bulk feature: stat.gov.pl publishes the annual publication 'Kultura i dziedzictwo narodowe w <year> r.' (2025 edition published in autumn 2026): one XLSX workbook (2025: 128 tables) or a ZIP of 12 chapter workbooks (2021-2024). The
# series page links the newest edition; each edition page links the other editions and its tables file
# ("Tablice w formacie XLSX"). Entity = one edition (the reference year), version = download time (no
# Last-Modified), written only when the SHA-256 changed; the newest edition is downloaded again on every run, older
# landed editions are not (ingestion/common/gus_publications.py, ingestion/to_landing/gus_culture/). Restart unit: one
# edition. Dev probes 43269548145, 43270285788, 43270655323, 43271452794 on test/w3-gus-probe.
extraction:
  initial: bulk
  production: snapshot                  # each edition file as published; a correction replaces it
  incremental_policy: changed_since_last  # new editions; SHA-256 of the newest edition
  schedule: # UTC; annual edition (autumn); monthly check
    - {cron: "20 6 6 * *", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/gus_culture/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.gus_culture_cells, bronze.gus_culture_rejected_files]
silver: [silver.gus_culture_tables]
gold: [gold.build_gus_culture]

bronze_latest_only: true   # policy #822/#845
# Refresh policy for all layers (D32): a handful of edition files, one new a year, a few hundred thousand cells;
# small, rebuilt in full.
refresh: {mode: full, decided: "D32 + #2474"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
