source_system: mf_public_debt
description: Ministry of Finance public finance sector debt (XLSX, quarterly)

# Extraction strategy (docs/landing.md). Bulk feature: the Ministry of Finance's public finance
# sector debt workbook, linked from the stable page "Zadłużenie sektora finansów publicznych" on
# gov.pl (gov.pl terms, register PLG-009). Each release is a new https://www.gov.pl/attachment/<uuid>,
# so the link is found on the page at run time (url_from). Version = Last-Modified; written only
# when the SHA-256 changed. Quarterly series; a schedule (stage 4) comes after the Dev trial.
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - entity: public_debt
        url_from:
          page: https://www.gov.pl/web/finanse/zadluzenie-sektora-finansow-publicznych
          pattern: /attachment/
        format: raw
        version: last_modified     # the response's Last-Modified; download time when absent
  initial: bulk
  production: snapshot                  # each workbook holds the complete series
  incremental_policy: changed_since_last  # Last-Modified / SHA-256
  schedule: []

landing: 01_landing/mf_public_debt/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: []
silver: []
gold: []

refresh: {mode: full}

activities: [landing.inspect, landing.extract, landing.verify]
