source_system: mf_public_debt
description: Ministry of Finance public finance sector debt (XLSX, quarterly)

# Extraction strategy (docs/landing.md). Bulk feature: the Ministry of Finance's public finance
# sector debt workbook, linked from the stable page "Szeregi czasowe" on gov.pl after the Treasury
# debt workbook (gov.pl terms, register PLG-009). Each release is a new https://www.gov.pl/attachment/<uuid>,
# so the link is found on the page at run time (url_from). Version = Last-Modified; written only
# when the SHA-256 changed. Quarterly series; Dev probes 43084312730, 43085156243 (11 Nov 2026) reached www.gov.pl from Actions.
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - entity: public_debt
        url_from:
          page: https://www.gov.pl/web/finanse/szeregiczasowe
          pattern: /attachment/
          pick: last    # Dev trial #2347: 2nd link = Dlug_publiczny_<q>.xlsx (1st is PLG-008)
        format: raw
        version: last_modified     # the response's Last-Modified; download time when absent
  initial: bulk
  production: snapshot                  # each workbook holds the complete series
  incremental_policy: changed_since_last  # Last-Modified / SHA-256
  schedule: # UTC; release: quarterly, about three months after the quarter; weekly check
    - {cron: "55 13 * * 3", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/mf_public_debt/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.mf_public_debt_cells, bronze.mf_public_debt_rejected_files]
silver: [silver.public_debt]
gold: []

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded versions
# Refresh policy for all layers (owner decision #875): one small workbook, rebuilt in full.
refresh: {mode: full, decided: "#875"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
