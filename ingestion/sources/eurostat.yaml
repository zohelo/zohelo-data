source_system: eurostat
description: Eurostat data distributions from the bulk download (Files API); Comext excluded

# Extraction strategy (docs/landing.md): source bulk feature → bulk workaround → API.
extraction:
  initial: bulk                         # official bulk download, one gzip TSV per dataset
  production: snapshot                  # every file is a complete dataset version
  incremental_policy: changed_since_last  # inventory "last data change" vs Landing
  # UTC; datasets changed since the last run. Eurostat publishes twice a day, 11:00 and 23:00 Brussels.
  schedule: # UTC; one run a week (O46, weekly until production use; was 10:30 and 22:30 daily), Friday 10:30,
    # after Thursday's late release, so a run catches every dataset changed during the week
    - {cron: "30 10 * * 5", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/eurostat/
# Landing → Archive (docs/landing.md): Bronze-loaded files are moved (copy, verify, delete);
# metadata is moved as well (structure messages load into bronze.eurostat_structure_items;
# ESMS reference metadata and inventory TSVs have no Bronze table). Uncompressed formats are stored
# zstd-compressed. Retention: newest version of every entity plus anything ingested in the
# last 90 days. prune: report → only reports; switch to delete after reviewing a report.
archive_policy:
  move: true
  without_bronze: [metadata]
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
# Observations: one file per dataset in Bronze and in Silver, replaced whole (design #875).
bronze: [bronze.eurostat_observations, bronze.eurostat_rejected_files,
         bronze.eurostat_structure_items, bronze.eurostat_structure_rejected_files]
silver: [silver.eurostat_observations, silver.eurostat_dataflows, silver.eurostat_codes, silver.eurostat_dimensions]
# Gold: the curated KPI selection is in the shared models of warehouse/warehouse.yaml (build_eurostat, fact_*).
# Full coverage (O43, D35, docs/gold-coverage.md): every loaded dataset by rule, one file per dataset and
# table, written by gold.observations (warehouse/observations.py), not by dbt. observations_rejected is the
# rejections table of every per-block source.
gold: [gold.eurostat_observations, gold.eurostat_series, gold.eurostat_measures, gold.eurostat_geography,
       gold.observations_rejected, gold.build_eurostat, gold.src_eurostat]
full_rebuild:   # model: {rows: ceiling} (owner policy #822)
  eurostat_codes: {rows: 1000000}  # 294,750 (20 Oct, Dev run 39374769989)
  eurostat_dataflows: {rows: 30000}  # 8,146 (20 Oct, Dev run 39374769989)
  eurostat_dimensions: {rows: 200000}  # 54,101 (20 Oct, Dev run 39374769989)
  poc_src_eurostat: {rows: 760000}  # 505,620 (Dev trial 43292078190)
  poc_build_eurostat: {rows: 800000}

# Refresh policy for all layers (owner decision #875): a new dataset version replaces that
# dataset in Bronze, Silver and Gold; nothing else is rewritten.
refresh: {mode: incremental, unit: dataset, decided: "#875"}

# Activities the Pipeline may run (owner authorization). gold.observations (owner decisions O36, O43; D35):
# the last step of the full dataflow keeps Gold current with the datasets that changed; the first load is
# started by hand (Pipeline run "gold: observations" with filter * or dataset codes) and continued by
# every later run, each within its time budget, in the order Polish regions, countries and aggregates, rest.
activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune,
             gold.observations]
