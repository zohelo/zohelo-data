source_system: eurostat
description: Eurostat data distributions from the bulk download (Files API); Comext excluded

# Extraction strategy (docs/landing.md): source bulk feature → bulk workaround → API.
extraction:
  initial: bulk                         # official bulk download, one gzip TSV per dataset
  production: snapshot                  # every file is a complete dataset version
  incremental_policy: changed_since_last  # inventory "last data change" vs Landing
  schedule:                             # UTC; daily: datasets changed since the last run
    - {cron: "15 4 * * *", run: "landing → bronze (all steps)"}

landing: 01_landing/eurostat/
# Landing → Archive (docs/landing.md): Bronze-loaded files are moved (copy, verify, delete);
# metadata is moved as well (structure messages load into bronze.eurostat_structure_items;
# ESMS reference metadata and inventory TSVs have no Bronze table). Uncompressed formats are stored
# zstd-compressed. Retention: newest version of every entity plus anything ingested in the
# last 90 days. prune: report → only reports; switch to delete after reviewing a report.
archive_policy:
  move: true
  without_bronze: [metadata]
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
# Observations: one file per dataset in Bronze and in Silver, replaced whole (design #875).
bronze: [bronze.eurostat_observations, bronze.eurostat_rejected_files,
         bronze.eurostat_structure_items, bronze.eurostat_structure_rejected_files]
silver: [silver.eurostat_observations, silver.eurostat_dataflows, silver.eurostat_codes, silver.eurostat_dimensions]
gold: []                              # Eurostat in Gold: shared models in warehouse/warehouse.yaml

# Refresh policy for all layers (owner decision #875): a new dataset version replaces that
# dataset in Bronze, Silver and Gold; nothing else is rewritten.
refresh: {mode: incremental, unit: dataset, decided: "#875"}

# Activities the Pipeline may run (owner authorization).
activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
