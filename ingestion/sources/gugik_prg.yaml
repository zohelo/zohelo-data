source_system: gugik_prg
description: "GUGiK PRG — national register of boundaries: administrative units and cadastral units (shapefiles)"

# Extraction strategy (docs/landing.md). Bulk feature: one national ZIP of shapefiles on
# opendata.geoportal.gov.pl (~377 MB, ~7 min). No validators from the server, so every run
# downloads and writes only when the SHA-256 changed. Free for any purpose (GUGiK).
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - entity: jednostki_administracyjne
        url: https://opendata.geoportal.gov.pl/prg/granice/00_jednostki_administracyjne.zip
        format: zip
        version: ingested          # the server sends no validators
  initial: bulk
  production: snapshot                  # the package is the complete register state
  incremental_policy: changed_since_last  # by SHA-256 of the download
  schedule:                             # UTC; monthly (state 1 January + corrections)
    - {cron: "40 2 3 * *", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/gugik_prg/
# ZIP kept as exact bytes (.bin). Yearly changes: newest version + 90 days.
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.prg_boundaries, bronze.prg_rejected_files]
silver: [silver.prg_units]
gold: []                              # areas on gold.dim_geography (warehouse/warehouse.yaml)
# Tables of retired code still in the catalog, replaced by the tables above (globs allowed).
legacy_tables: [bronze.prg_country, bronze.prg_voivodeships, bronze.prg_counties, bronze.prg_municipalities,
                bronze.prg_surface_areas, silver.prg_*, gold.dim_prg_*, gold.fact_prg_surface_areas]

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded versions
# Refresh policy for all layers (owner decision #875): small, rebuilt in full (monthly).
refresh: {mode: full, decided: "#875"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
