source_system: nfz_pharmacy_refunds
description: NFZ statistics API, pharmacy refunds (app-stat-api-ra v1.0) — monthly totals for Poland and the 16 voivodeships, without ATC filter and per ATC main group

# Extraction strategy (docs/landing.md). Bulk feature: none; NFZ publishes these statistics only through the API
# api.nfz.gov.pl/app-stat-api-ra (register PLS-013; Dev probes 43305368183, PROBE_RUN). Tested for a full load: no
# key, 10 requests/second per IP (terms, section III), at most 25 rows a page. Scope (lead's decision for #2930):
# /monthly-provisions for 17 areas (Poland unfiltered + province=01..16) x 15 ATC selections (none + the 14 main
# groups of /atc, by name) = 255 entities of 4 pages (96 months, 2017-01 to 2024-12), about 1,020 requests one at a
# time, 1 s apart. Not loaded: package-level /provisions, the gender, age, 75+, announcement splits, the product
# and substance dictionaries (docs/sources/nfz_pharmacy_refunds.md). aggregationType: AGGREGATION_NOTE.
# Entity = one area x ATC selection, all its pages (parts); version = end-date of /available-periods, so a run
# whose version is held makes one request. Own extractor ingestion/to_landing/nfz_pharmacy_refunds/ (the ICP
# extractor's fetch and write).
extraction:
  initial: api
  production: snapshot                    # each download is the whole selection, every month
  incremental_policy: changed_since_last  # /available-periods end-date; rows compared by data_sha256
  schedule: # UTC; release: SCHEDULE_NOTE; monthly check on the 9th, 05:35: one request when the end-date is unchanged
    - {cron: "35 5 9 * *", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/nfz_pharmacy_refunds/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.nfz_ra_monthly_provisions, bronze.nfz_pharmacy_refunds_rejected_files]
silver: [silver.nfz_ra_monthly_provisions]
gold: [gold.build_nfz_pharmacy_refunds]
full_rebuild:   # model: {rows: ceiling} (owner policy #822)
  nfz_ra_monthly_provisions: {rows: 38000}  # estimate 25,500 (255 x ~100 months); measured: TRIAL
  poc_build_nfz_pharmacy_refunds: {rows: 184000}  # estimate 122,400 (x 5 measures); measured: TRIAL

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded versions
# Refresh policy for all layers (D32): 255 selections of about 100 rows (about 25,000 rows, 120,000 observations),
# replaced whole when the source's end-date moves; the API has no changed-since filter; rebuilt in full.
refresh: {mode: full, decided: "D32 + #2930"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
