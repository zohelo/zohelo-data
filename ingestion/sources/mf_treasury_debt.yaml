source_system: mf_treasury_debt
description: Ministry of Finance State Treasury debt time series (XLSX)

# Extraction strategy (docs/landing.md). Bulk feature: the Ministry of Finance's State Treasury
# debt time-series workbook, linked from the stable page "Szeregi czasowe" on gov.pl (gov.pl
# terms, register PLG-008). Each release is a new https://www.gov.pl/attachment/<uuid>, so the
# link is found on the page at run time (url_from). Version = Last-Modified; written only when
# the SHA-256 changed. Monthly series; Dev probes 43084312730, 43085156243 (11 Nov 2026) reached www.gov.pl from Actions.
extraction:
  kind: bulk_file
  bulk_file:
    files:
      - entity: treasury_debt_series
        url_from:
          page: https://www.gov.pl/web/finanse/szeregiczasowe
          pattern: /attachment/
          pick: first   # Dev trial #2345: 1st link = Zadluzenie_Skarbu_Panstwa.xlsx, 2nd = Dlug_publiczny_<q>.xlsx
        format: raw
        version: last_modified     # the response's Last-Modified; download time when absent
  initial: bulk
  production: snapshot                  # each workbook holds the complete series
  incremental_policy: changed_since_last  # Last-Modified / SHA-256
  schedule: # UTC; release: monthly, about six weeks after the month end; one small file, weekday check
    - {cron: "45 13 * * 1-5", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/mf_treasury_debt/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.mf_treasury_debt_cells, bronze.mf_treasury_debt_rejected_files]
silver: [silver.treasury_debt]
gold: [gold.build_public_finance]

bronze_latest_only: true   # policy #822/#845: a Bronze load removes superseded versions
# Refresh policy for all layers (owner decision #875): one small workbook, rebuilt in full.
refresh: {mode: full, decided: "#875"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
