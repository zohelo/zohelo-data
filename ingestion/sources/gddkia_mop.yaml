source_system: gddkia_mop
description: "GDDKiA — existing rest areas (MOP) and parkings on national roads, monthly table \"Tabela MOP istniejące\""

# Extraction strategy (docs/landing.md). Register PL-ENV-023, Task #2995. Bulk feature: the page
# https://www.gov.pl/web/gddkia/wykaz-parkingow-i-mop links one XLSX attachment "Tabela MOP - <month> <year> r."
# (September 2026 edition: 89,285 bytes, one sheet "Arkusz1"; columns Lp., Oddział, Województwo, Zarządca,
# Miejscowość, rest-area name, current and target category). Attachment uuids change per edition, so the page is the
# entry (ingestion/to_landing/gddkia_mop/). Entity = one edition (mop_<yyyy>_<mm>, the month of the link text),
# version = Last-Modified, a new attachment URL lands only when its bytes differ. Restart unit: one file. Dev probes
# 43282997907 and 43288930412 (12 Nov 2026: page and workbook read from a runner). Left out of this source (register
# entry): the road-programme status PDF (no PDF text reader yet) and the road-obstruction feed on archiwum.gddkia.gov.pl
# (live operational feed, not reachable from runners).
extraction:
  initial: bulk
  production: snapshot                  # each edition is the table as published for its month
  incremental_policy: changed_since_last  # new attachment URL with different bytes
  schedule: # UTC; a monthly edition published in the following month (September 2026: Last-Modified 26 Oct); a weekly check (Thursday), at most one run a week (O46)
    - {cron: "35 10 * * 4", run: "full dataflow: landing → bronze → silver → gold → portal"}

landing: 01_landing/gddkia_mop/
archive_policy:
  move: true
  retention: {keep_latest: 1, keep_days: 90}
  prune: report
bronze: [bronze.gddkia_mop_cells, bronze.gddkia_mop_rejected_files]
silver: [silver.gddkia_mop_rest_areas]
gold: [gold.build_gddkia_mop, gold.gddkia_mop_rest_area]
full_rebuild:   # model: {rows: ceiling} (owner policy #822); measured in the PR's Dev trial
  gddkia_mop_rest_areas: {rows: 20000}
  gddkia_mop_rest_area: {rows: 2000}
  poc_build_gddkia_mop: {rows: 5000}

bronze_latest_only: true   # policy #822/#845: one copy per edition (a corrected edition replaces its month)
# Refresh policy for all layers (D32): one workbook of about 90 kB a month, editions kept side by side; small, rebuilt
# in full.
refresh: {mode: full, decided: "D32 + #2995"}

activities: [landing.inspect, landing.extract, landing.verify, bronze.load, bronze.verify, landing.archive, archive.prune]
